<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🎮 Spelplatform</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,Arial,sans-serif;background:#11152b;color:#fff;overflow:hidden}
body{background:radial-gradient(ellipse at 10% 0,#ff72c655,transparent 45%),radial-gradient(ellipse at 90% 100%,#36e0c255,transparent 50%),#11152b}
.hidden{display:none!important}
#home{height:100%;overflow:auto;padding:14px;max-width:900px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(22px,5vw,34px)}
.pts{background:#ffffff18;border:1px solid #ffffff30;border-radius:30px;padding:8px 16px;font-weight:900;font-size:18px;color:#ffd86b}
h2{font-size:13px;margin:18px 0 8px;color:#b9c7ff;letter-spacing:1px}
.big{width:100%;border:2px solid #ffd86b;border-radius:20px;padding:18px;background:linear-gradient(135deg,#ff73c633,#7b8dff33);color:#fff;text-align:left;cursor:pointer;margin-top:14px;display:flex;gap:14px;align-items:center}
.big b{font-size:46px}.big div{font-size:13px;color:#e2e6ff;line-height:1.4}.big strong{display:block;font-size:20px;color:#fff}
.big.no{opacity:.55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:1px solid #ffffff30;border-radius:16px;padding:14px 8px;background:#ffffff12;color:#fff;text-align:center;cursor:pointer;font-size:13px;font-weight:800}
.card b{display:block;font-size:34px;margin-bottom:4px}
.card small{display:block;color:#b9c7ff;font-weight:600;margin-top:3px}
#play{position:fixed;inset:0;display:flex;flex-direction:column;background:#11152b}
#bar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#0008;font-weight:800;font-size:14px}
#bar button{border:0;border-radius:10px;padding:8px 14px;background:#7c5cff;color:#fff;font-weight:800}
#frame{flex:1;border:0;width:100%;background:#fff}
#toast{position:fixed;left:50%;top:50px;transform:translateX(-50%);background:#27a76f;padding:8px 16px;border-radius:12px;font-weight:800;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:9;text-align:center}
#toast.show{opacity:1}
.reset{margin:20px 0;font-size:11px;color:#8890b8;text-align:center}.reset a{color:#ff8dce;cursor:pointer}
</style>
</head>
<body>
<div id="home">
 <header><h1>🎮 SPELPLATFORM</h1><div class="pts">⭐ <span id="pts">0</span> punten</div></header>
 <button class="big" id="bigBtn" onclick="openBig()"><b>🏙️</b><div><strong>DREAM CITY · het grote spel</strong>Bouw je eigen stad met je ⭐ punten. Gebouwen verdienen elke seconde nieuwe punten, ook als je weg bent. Parken boosten, fabrieken verdienen veel. Bouw een 🏰 kasteel!<br>Stad: <span id="bestf">0</span> gebouwen · +<span id="cinc">0</span>/s</div></button>
 <h2>🎮 MINISPELLEN · altijd speelbaar · verdien punten door te spelen</h2>
 <div class="grid" id="mini"></div>
 <div class="reset"><a onclick="resetAll()">punten resetten</a></div>
</div>
<div id="play" class="hidden">
 <div id="bar"><button onclick="closeGame()">← Terug</button><span id="gname"></span><span>⭐ <span id="livepts">0</span></span></div>
 <iframe id="frame" title="spel"></iframe>
</div>
<div id="toast"></div>

ize+1.5,     size-3,     size-3   );    context.globalAlpha=1; }  function draw(){    ctx.clearRect(     0,0,300,600   );    ctx.fillStyle=\"#e7faff\";    ctx.fillRect(     0,0,300,600   );    ctx.strokeStyle=\"#a5dfed\";    ctx.lineWidth=1;    for(     let x=0;     x<=COLS;     x++   ){      ctx.beginPath();      ctx.moveTo(       x*SIZE,       0     );      ctx.lineTo(       x*SIZE,       600     );      ctx.stroke();   }    for(     let y=0;     y<=ROWS;     y++   ){      ctx.beginPath();      ctx.moveTo(       0,       y*SIZE     );      ctx.lineTo(       300,       y*SIZE     );      ctx.stroke();   }    if(!grid)     return;    for(     let y=0;     y<ROWS;     y++   ){      for(       let x=0;       x<COLS;       x++     ){        if(grid[y][x]){          drawCell(           ctx,           x,           y,           COLORS[grid[y][x]],           SIZE         );       }     }   }    if(piece){      let ghostY=piece.y;      while(       !collides(         {           ...piece,           y:ghostY         },         0,         1       )     ){        ghostY++;     }      piece.shape.forEach(       (row,y)=>{          row.forEach(           (v,x)=>{              if(               v&&               ghostY+y>=0             ){                drawCell(                 ctx,                 piece.x+x,                 ghostY+y,                 COLORS[piece.type],                 SIZE,                 .22               );             }           }         );       }     );      piece.shape.forEach(       (row,y)=>{          row.forEach(           (v,x)=>{              if(               v&&               piece.y+y>=0             ){                drawCell(                 ctx,                 piece.x+x,                 piece.y+y,                 COLORS[piece.type],                 SIZE               );             }           }         );       }     );   } }  function drawNext(){    nctx.clearRect(     0,0,150,90   );    nctx.fillStyle=\"#dff7ff\";    nctx.fillRect(     0,0,150,90   );    if(!nextType)     return;    const shape=     SHAPES[nextType];    const s=20;    const ox=     (150-shape[0].length*s)/2;    const oy=     (90-shape.length*s)/2;    shape.forEach(     (row,y)=>{        row.forEach(         (v,x)=>{            if(!v)             return;            nctx.fillStyle=             COLORS[nextType];            nctx.fillRect(             ox+x*s+1,             oy+y*s+1,             s-3,             s-3           );            nctx.fillStyle=             \"#ffffff60\";            nctx.fillRect(             ox+x*s+3,             oy+y*s+3,             s-7,             3           );         }       );     }   ); }  function loop(time=0){    const delta=     time-lastTime;    lastTime=time;    if(     running&&     !paused&&     !over   ){      dropCounter+=delta;      if(       dropCounter>       dropInterval     ){        move(0,1);        dropCounter=0;     }   }    requestAnimationFrame(loop); }  function action(a){    if(a===\"left\")     move(-1,0);    if(a===\"right\")     move(1,0);    if(a===\"down\"){      if(move(0,1)){        score++;        stats();     }   }    if(a===\"rotate\")     rotate();    if(a===\"drop\")     hardDrop(); }  document.addEventListener(   \"keydown\",   e=>{      if([       \"ArrowLeft\",       \"ArrowRight\",       \"ArrowDown\",       \"ArrowUp\",       \" \"     ].includes(e.key)){        e.preventDefault();     }      if(e.key===\"ArrowLeft\")       action(\"left\");      else if(e.key===\"ArrowRight\")       action(\"right\");      else if(e.key===\"ArrowDown\")       action(\"down\");      else if(       e.key===\"ArrowUp\"||       e.key===\"x\"||       e.key===\"X\"     ){        action(\"rotate\");      }else if(e.key===\" \"){        hardDrop();      }else if(       e.key===\"p\"||       e.key===\"P\"     ){        togglePause();     }   } );  document .querySelectorAll(\"[data-a]\") .forEach(button=>{    button.addEventListener(     \"pointerdown\",     e=>{        e.preventDefault();        action(         button.dataset.a       );     }   ); });  $(\"startBtn\").addEventListener(   \"click\",   ()=>{      if(paused){        paused=false;        $(\"pauseBtn\").textContent=         \"Ⅱ Pauze\";        $(\"overlay\").classList.add(         \"hidden\"       );      }else{        reset();     }   } );  $(\"pauseBtn\").addEventListener(   \"click\",   togglePause );  $(\"restartBtn\").addEventListener(   \"click\",   ()=>{      $(\"overlayTitle\").textContent=       \"Klaar?\";      $(\"overlayText\").textContent=       \"Draai de blokjes, maak volle rijen en haal een topscore!\";      $(\"startBtn\").textContent=       \"▶ START SPEL\";      reset();   } );  $(\"soundBtn\").addEventListener(   \"click\",   ()=>{      soundOn=!soundOn;      $(\"soundBtn\").textContent=       soundOn       ?\"🔊 Geluid\"       :\"🔇 Stil\";      if(soundOn)       beep();   } );  grid=newGrid(); piece=null;  draw(); drawNext();  requestAnimationFrame(loop);  })(); <\/script>  <\/body> <\/html>", "reaction": "<!DOCTYPE html> \n<html lang=\"nl\"> \n<head><script>try{localStorage.getItem(\"x\")}catch(e){var _m={};Object.defineProperty(window,\"localStorage\",{value:{getItem:function(k){return k in _m?_m[k]:null},setItem:function(k,v){_m[k]=String(v)},removeItem:function(k){delete _m[k]}}})}<\/script> \n<meta charset=\"UTF-8\"> \n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\"> \n \n<title>REACTION RUSH 🌿<\/title> \n \n<style> \n*{ \n    box-sizing:border-box; \n    -webkit-tap-highlight-color:transparent; \n    user-select:none; \n} \n \nhtml,body{ \n    margin:0; \n    width:100%; \n    height:100%; \n    overflow:hidden; \n    font-family:Arial,Helvetica,sans-serif; \n} \n \nbody{ \n    background: \n        radial-gradient(circle at 12% 15%,#9bd0a8 0%,transparent 28%), \n        radial-gradient(circle at 88% 85%,#245b36 0%,transparent 34%), \n        linear-gradient(135deg,#e8f6eb,#bddfc5,#4b875a); \n    color:#183d25; \n} \n \n.app{ \n    width:100%; \n    height:100%; \n    display:flex; \n    justify-content:center; \n    align-items:center; \n    padding:12px; \n} \n \n.game{ \n    width:min(1100px,100%); \n    height:min(780px,100%); \n    background:#eef9f1; \n    border:3px solid #70a87b; \n    border-radius:28px; \n    overflow:hidden; \n    box-shadow:0 22px 65px rgba(20,72,37,.28); \n    display:flex; \n    flex-direction:column; \n    position:relative; \n} \n \n/* HEADER */ \n \n.header{ \n    min-height:78px; \n    padding:12px 20px; \n    background:linear-gradient(135deg,#225b35,#468959); \n    color:#fff; \n    display:flex; \n    align-items:center; \n    justify-content:space-between; \n    gap:12px; \n} \n \n.logo{ \n    font-size:clamp(21px,4vw,34px); \n    font-weight:1000; \n    letter-spacing:1px; \n} \n \n.logo span{ \n    color:#c4eacb; \n} \n \n.header-stats{ \n    display:flex; \n    gap:7px; \n} \n \n.stat{ \n    min-width:72px; \n    padding:7px 10px; \n    border-radius:13px; \n    background:rgba(240,255,243,.13); \n    border:2px solid rgba(240,255,243,.18); \n    text-align:center; \n} \n \n.stat small{ \n    display:block; \n    font-size:9px; \n    opacity:.8; \n} \n \n.stat strong{ \n    display:block; \n    font-size:18px; \n} \n \n/* SCHERMEN */ \n \n.screen{ \n    flex:1; \n    min-height:0; \n    display:flex; \n    flex-direction:column; \n} \n \n.hidden{ \n    display:none!important; \n} \n \n/* HOME */ \n \n#startScreen{ \n    justify-content:center; \n    align-items:center; \n    text-align:center; \n    padding:25px; \n} \n \n.start-icon{ \n    font-size:70px; \n    margin-bottom:4px; \n} \n \n.start-title{ \n    margin:0; \n    color:#245e37; \n    font-size:clamp(38px,7vw,65px); \n    font-weight:1000; \n} \n \n.start-text{ \n    max-width:650px; \n    margin:12px auto 20px; \n    color:#4c7157; \n    line-height:1.5; \n    font-size:17px; \n} \n \n.features{ \n    display:flex; \n    justify-content:center; \n    gap:9px; \n    flex-wrap:wrap; \n    margin-bottom:19px; \n} \n \n.feature{ \n    background:#dcefe1; \n    border:2px solid #76ad82; \n    color:#2f6942; \n    padding:8px 12px; \n    border-radius:12px; \n    font-size:13px; \n    font-weight:800; \n} \n \n.difficulty{ \n    display:flex; \n    justify-content:center; \n    gap:9px; \n    flex-wrap:wrap; \n    margin-bottom:20px; \n} \n \n.diff-btn{ \n    border:2px solid #72a97d; \n    background:#dcefe0; \n    color:#2d6740; \n    padding:10px 17px; \n    border-radius:13px; \n    font-weight:900; \n    cursor:pointer; \n    transition:.15s; \n} \n \n.diff-btn:hover{ \n    transform:translateY(-2px); \n} \n \n.diff-btn.active{ \n    background:#397b4d; \n    color:#fff; \n    transform:translateY(-2px); \n} \n \n.main-btn{ \n    border:0; \n    background:linear-gradient(135deg,#2a6a40,#549a67); \n    color:#fff; \n    padding:16px 40px; \n    border-radius:17px; \n    font-size:20px; \n    font-weight:1000; \n    cursor:pointer; \n    box-shadow:0 8px 22px rgba(39,101,57,.22); \n    transition:.15s; \n} \n \n.main-btn:hover{ \n    transform:translateY(-2px); \n} \n \n.main-btn:active{ \n    transform:scale(.97); \n} \n \n/* GAME */ \n \n#gameScreen{ \n    padding:14px; \n    gap:10px; \n} \n \n.game-top{ \n    display:grid; \n    grid-template-columns:auto 1fr auto; \n    align-items:center; \n    gap:12px; \n} \n \n.round-box{ \n    color:#2f6841; \n    font-weight:1000; \n    white-space:nowrap; \n} \n \n.level-box{ \n    text-align:center; \n    color:#3d7550; \n    font-size:14px; \n    font-weight:900; \n} \n \n.level-box span{ \n    color:#235e36; \n    font-size:18px; \n} \n \n.timer{ \n    height:11px; \n    background:#c9e4cf; \n    border-radius:20px; \n    overflow:hidden; \n} \n \n.timer-fill{ \n    width:100%; \n    height:100%; \n    background:linear-gradient(90deg,#2c6d40,#74b783); \n} \n \n.game-actions{ \n    display:flex; \n    gap:7px; \n} \n \n.action-btn{ \n    border:2px solid #72a77d; \n    background:#dcefe0; \n    color:#2c6740; \n    border-radius:12px; \n    padding:8px 11px; \n    font-size:13px; \n    font-weight:900; \n    cursor:pointer; \n} \n \n.instruction{ \n    text-align:center; \n    color:#245e37; \n    font-size:clamp(19px,3vw,28px); \n    font-weight:1000; \n    margin:1px 0; \n} \n \n.combo{ \n    text-align:center; \n    min-height:24px; \n    font-weight:1000; \n    color:#3f8753; \n    font-size:18px; \n} \n \n.combo.hot{ \n    color:#245e37; \n    animation:pulse .45s infinite alternate; \n} \n \n@keyframes pulse{ \n    from{transform:scale(1)} \n    to{transform:scale(1.06)} \n} \n \n/* GRID */ \n \n.grid{ \n    flex:1; \n    min-height:0; \n    display:grid; \n    grid-template-columns:repeat(3,1fr); \n    grid-template-rows:repeat(3,1fr); \n    gap:10px; \n    padding:3px; \n} \n \n.tile{ \n    border:0; \n    border-radius:17px; \n    background:#9dcea8; \n    box-shadow: \n        inset 0 -5px 0 rgba(23,80,40,.12), \n        0 5px 12px rgba(23,80,40,.10); \n    cursor:pointer; \n    transition:transform .09s,background .09s; \n} \n \n.tile:active{ \n    transform:scale(.94); \n} \n \n.tile.target{ \n    background:#347b4a; \n    box-shadow: \n        0 0 0 4px rgba(83,155,98,.25), \n        0 0 28px rgba(52,123,74,.38); \n    animation:targetPulse .8s infinite alternate; \n} \n \n@keyframes targetPulse{ \n    from{filter:brightness(1)} \n    to{filter:brightness(1.12)} \n} \n \n.tile.wrong{ \n    background:#275f3a; \n    animation:shake .2s; \n} \n \n@keyframes shake{ \n    0%,100%{transform:translateX(0)} \n    25%{transform:translateX(-7px)} \n    75%{transform:translateX(7px)} \n} \n \n/* PAUZE */ \n \n.pause-overlay{ \n    position:absolute; \n    inset:0; \n    background:rgba(20,72,37,.62); \n    display:flex; \n    align-items:center; \n    justify-content:center; \n    z-index:20; \n    backdrop-filter:blur(4px); \n} \n \n.pause-card{ \n    background:#eef9f1; \n    border:3px solid #71a97c; \n    border-radius:23px; \n    padding:28px; \n    width:min(360px,90%); \n    text-align:center; \n    box-shadow:0 20px 50px rgba(0,0,0,.2); \n} \n \n.pause-card h2{ \n    color:#245e37; \n    margin:0 0 8px; \n    font-size:34px; \n} \n \n.pause-card p{ \n    color:#55745e; \n    margin:0 0 20px; \n} \n \n/* RESULTAAT */ \n \n#resultScreen{ \n    justify-content:center; \n    align-items:center; \n    text-align:center; \n    padding:22px; \n} \n \n.result-icon{ \n    font-size:68px; \n} \n \n.result-title{ \n    color:#245e37; \n    font-size:clamp(38px,7vw,60px); \n    margin:3px 0; \n    font-weight:1000; \n} \n \n.result-score{ \n    color:#397b4d; \n    font-size:56px; \n    font-weight:1000; \n} \n \n.result-label{ \n    color:#55745d; \n    margin-top:-4px; \n    font-size:16px; \n} \n \n.result-stats{ \n    display:flex; \n    justify-content:center; \n    gap:9px; \n    flex-wrap:wrap; \n    margin:18px 0 23px; \n} \n \n.result-stat{ \n    background:#dcefe1; \n    border:2px solid #76ad82; \n    border-radius:14px; \n    padding:10px 14px; \n    min-width:120px; \n} \n \n.result-stat span{ \n    display:block; \n    color:#66806d; \n    font-size:11px; \n} \n \n.result-stat strong{ \n    display:block; \n    color:#2c6740; \n    font-size:20px; \n    margin-top:2px; \n} \n \n.result-buttons{ \n    display:flex; \n    flex-direction:column; \n    align-items:center; \n    gap:10px; \n} \n \n.home-btn{ \n    border:2px solid #5f9d6d; \n    background:#dcefe0; \n    color:#2d6740; \n    padding:13px 31px; \n    border-radius:15px; \n    font-size:17px; \n    font-weight:1000; \n    cursor:pointer; \n} \n \n.home-btn:hover{ \n    background:#cae5cf; \n} \n \n/* EFFECT */ \n \n.feedback{ \n    position:absolute; \n    inset:0; \n    pointer-events:none; \n    opacity:0; \n    z-index:10; \n} \n \n.feedback.good{ \n    animation:good .28s; \n} \n \n.feedback.bad{ \n    animation:bad .28s; \n} \n \n@keyframes good{ \n    0%{background:rgba(105,220,132,0)} \n    35%{background:rgba(105,220,132,.18)} \n    100%{background:rgba(105,220,132,0)} \n} \n \n@keyframes bad{ \n    0%{background:rgba(33,92,51,0)} \n    35%{background:rgba(33,92,51,.18)} \n    100%{background:rgba(33,92,51,0)} \n} \n \n/* MOBIEL */ \n \n@media(max-width:650px){ \n \n    .app{ \n        padding:6px; \n    } \n \n    .game{ \n        border-radius:20px; \n    } \n \n    .header{ \n        min-height:63px; \n        padding:8px 11px; \n    } \n \n    .logo{ \n        font-size:20px; \n    } \n \n    .stat{ \n        min-width:49px; \n        padding:5px 6px; \n    } \n \n    .stat strong{ \n        font-size:15px; \n    } \n \n    .stat small{ \n        font-size:7px; \n    } \n \n    #startScreen{ \n        padding:17px; \n    } \n \n    .start-icon{ \n        font-size:52px; \n    } \n \n    .start-text{ \n        font-size:14px; \n        margin:8px auto 14px; \n    } \n \n    .features{ \n        gap:6px; \n        margin-bottom:13px; \n    } \n \n    .feature{ \n        padding:6px 9px; \n        font-size:11px; \n    } \n \n    .difficulty{ \n        margin-bottom:14px; \n        gap:6px; \n    } \n \n    .diff-btn{ \n        padding:8px 11px; \n        font-size:12px; \n    } \n \n    .main-btn{ \n        padding:13px 28px; \n        font-size:17px; \n    } \n \n    #gameScreen{ \n        padding:8px; \n        gap:6px; \n    } \n \n    .game-top{ \n        grid-template-columns:auto 1fr auto; \n        gap:7px; \n    } \n \n    .round-box{ \n        font-size:12px; \n    } \n \n    .level-box{ \n        font-size:10px; \n    } \n \n    .level-box span{ \n        font-size:14px; \n    } \n \n    .action-btn{ \n        padding:6px 8px; \n        font-size:10px; \n    } \n \n    .instruction{ \n        font-size:18px; \n    } \n \n    .combo{ \n        font-size:15px; \n    } \n \n    .grid{ \n        gap:6px; \n    } \n \n    .tile{ \n        border-radius:11px; \n    } \n \n    .result-icon{ \n        font-size:53px; \n    } \n \n    .result-title{ \n        font-size:42px; \n    } \n \n    .result-score{ \n        font-size:46px; \n    } \n \n    .result-stats{ \n        margin:12px 0 17px; \n    } \n \n    .result-stat{ \n        padding:8px 11px; \n        min-width:100px; \n    } \n} \n<\/style> \n<\/head> \n \n<body> \n \n<div class=\"app\"> \n \n<div class=\"game\"> \n \n<\u0021-- HEADER --> \n \n<div class=\"header\"> \n \n<div class=\"logo\"> \nREACTION <span>RUSH 🌿<\/span> \n<\/div> \n \n<div class=\"header-stats\"> \n \n<div class=\"stat\"> \n<small>SCORE<\/small> \n<strong id=\"score\">0<\/strong> \n<\/div> \n \n<div class=\"stat\"> \n<small>RECORD<\/small> \n<strong id=\"best\">0<\/strong> \n<\/div> \n \n<div class=\"stat\"> \n<small>LEVENS<\/small> \n<strong id=\"lives\">3<\/strong> \n<\/div> \n \n<\/div> \n \n<\/div> \n \n \n<\u0021-- HOME --> \n \n<div id=\"startScreen\" class=\"screen\"> \n \n<div class=\"start-icon\">⚡<\/div> \n \n<h1 class=\"start-title\"> \nREACTION RUSH \n<\/h1> \n \n<p class=\"start-text\"> \nKlik zo snel mogelijk op het \n<b>donkergroene vakje<\/b>. \nVerdien combo's, stijg in levels en probeer je record te verbreken! \n<\/p> \n \n<div class=\"features\"> \n<div class=\"feature\">⚡ SNELHEID<\/div> \n<div class=\"feature\">🔥 COMBO<\/div> \n<div class=\"feature\">🏆 RECORD<\/div> \n<div class=\"feature\">❤️ LEVENS<\/div> \n<\/div> \n \n<\u0021-- MOEILIJKHEID --> \n \n<div class=\"difficulty\"> \n \n<button class=\"diff-btn active\" data-speed=\"2200\"> \n🐢 TRAAG \n<\/button> \n \n<button class=\"diff-btn\" data-speed=\"1400\"> \n🌿 NORMAAL \n<\/button> \n \n<button class=\"diff-btn\" data-speed=\"750\"> \n⚡ SNEL \n<\/button> \n \n<\/div> \n \n<button class=\"main-btn\" id=\"startBtn\"> \nSTART GAME 🚀 \n<\/button> \n \n<\/div> \n \n \n<\u0021-- GAME --> \n \n<div id=\"gameScreen\" class=\"screen hidden\"> \n \n<div class=\"game-top\"> \n \n<div class=\"round-box\"> \nRONDE <span id=\"round\">1<\/span>/30 \n<\/div> \n \n<div class=\"timer\"> \n<div class=\"timer-fill\" id=\"timerFill\"><\/div> \n<\/div> \n \n<div class=\"game-actions\"> \n \n<button class=\"action-btn\" id=\"pauseBtn\"> \n⏸️ PAUZE \n<\/button> \n \n<button class=\"action-btn\" id=\"gameHomeBtn\"> \n🏠 HOME \n<\/button> \n \n<\/div> \n \n<\/div> \n \n<div class=\"level-box\"> \nLEVEL <span id=\"level\">1<\/span> \n<\/div> \n \n<div class=\"instruction\" id=\"instruction\"> \nKLIK HET DONKERGROENE VAKJE! \n<\/div> \n \n<div class=\"combo\" id=\"combo\"> \nCOMBO x0 \n<\/div> \n \n<div class=\"grid\"> \n \n<button class=\"tile\"><\/button> \n<button class=\"tile\"><\/button> \n<button class=\"tile\"><\/button> \n<button class=\"tile\"><\/button> \n<button class=\"tile\"><\/button> \n<button class=\"tile\"><\/button> \n<button class=\"tile\"><\/button> \n<button class=\"tile\"><\/button> \n<button class=\"tile\"><\/button> \n \n<\/div> \n \n<\/div> \n \n \n<\u0021-- RESULTAAT --> \n \n<div id=\"resultScreen\" class=\"screen hidden\"> \n \n<div class=\"result-icon\" id=\"resultIcon\"> \n🏆 \n<\/div> \n \n<h1 class=\"result-title\" id=\"resultTitle\"> \nKLAAR! \n<\/h1> \n \n<div class=\"result-score\" id=\"finalScore\"> \n0 \n<\/div> \n \n<div class=\"result-label\"> \npunten \n<\/div> \n \n<div class=\"result-stats\"> \n \n<div class=\"result-stat\"> \n<span>SNELSTE REACTIE<\/span> \n<strong id=\"fastest\">-<\/strong> \n<\/div> \n \n<div class=\"result-stat\"> \n<span>HOOGSTE COMBO<\/span> \n<strong id=\"bestCombo\">0<\/strong> \n<\/div> \n \n<div class=\"result-stat\"> \n<span>LEVEL<\/span> \n<strong id=\"finalLevel\">1<\/strong> \n<\/div> \n \n<\/div> \n \n<div class=\"result-buttons\"> \n \n<button class=\"main-btn\" id=\"againBtn\"> \n🔄 OPNIEUW SPELEN \n<\/button> \n \n<button class=\"home-btn\" id=\"homeBtn\"> \n🏠 TERUG NAAR HOME \n<\/button> \n \n<\/div> \n \n<\/div> \n \n \n<\u0021-- PAUZE --> \n \n<div id=\"pauseOverlay\" class=\"pause-overlay hidden\"> \n \n<div class=\"pause-card\"> \n \n<h2>PAUZE ⏸️<\/h2> \n \n<p> \nNeem even een kleine pauze.<br> \nJe spel staat stil. \n<\/p> \n \n<button class=\"main-btn\" id=\"resumeBtn\"> \n▶ VERDER SPELEN \n<\/button> \n \n<\/div> \n \n<\/div> \n \n<div class=\"feedback\" id=\"feedback\"><\/div> \n \n<\/div> \n \n<\/div> \n \n \n<script> \n \nconst startScreen = \ndocument.getElementById(\"startScreen\"); \n \nconst gameScreen = \ndocument.getElementById(\"gameScreen\"); \n \nconst resultScreen = \ndocument.getElementById(\"resultScreen\"); \n \nconst pauseOverlay = \ndocument.getElementById(\"pauseOverlay\"); \n \nconst startBtn = \ndocument.getElementById(\"startBtn\"); \n \nconst againBtn = \ndocument.getElementById(\"againBtn\"); \n \nconst homeBtn = \ndocument.getElementById(\"homeBtn\"); \n \nconst gameHomeBtn = \ndocument.getElementById(\"gameHomeBtn\"); \n \nconst pauseBtn = \ndocument.getElementById(\"pauseBtn\"); \n \nconst resumeBtn = \ndocument.getElementById(\"resumeBtn\"); \n \nconst tiles = \ndocument.querySelectorAll(\".tile\"); \n \nconst scoreEl = \ndocument.getElementById(\"score\"); \n \nconst bestEl = \ndocument.getElementById(\"best\"); \n \nconst livesEl = \ndocument.getElementById(\"lives\"); \n \nconst roundEl = \ndocument.getElementById(\"round\"); \n \nconst levelEl = \ndocument.getElementById(\"level\"); \n \nconst comboEl = \ndocument.getElementById(\"combo\"); \n \nconst instructionEl = \ndocument.getElementById(\"instruction\"); \n \nconst timerFill = \ndocument.getElementById(\"timerFill\"); \n \nconst finalScoreEl = \ndocument.getElementById(\"finalScore\"); \n \nconst fastestEl = \ndocument.getElementById(\"fastest\"); \n \nconst bestComboEl = \ndocument.getElementById(\"bestCombo\"); \n \nconst finalLevelEl = \ndocument.getElementById(\"finalLevel\"); \n \nconst resultTitle = \ndocument.getElementById(\"resultTitle\"); \n \nconst resultIcon = \ndocument.getElementById(\"resultIcon\"); \n \nconst feedback = \ndocument.getElementById(\"feedback\"); \n \n \n/* SPELVARIABELEN */ \n \nlet score = 0; \nlet round = 1; \nlet level = 1; \n \nlet lives = 3; \n \nlet combo = 0; \nlet bestCombo = 0; \n \nlet best = \nNumber(localStorage.getItem(\"reactionRushBest\")) || 0; \n \nlet fastest = Infinity; \n \nlet target = -1; \n \nlet startTime = 0; \n \nlet timer = null; \nlet nextRoundTimeout = null; \n \nlet difficultySpeed = 2200; \nlet roundTime = 2200; \n \nlet gameRunning = false; \nlet paused = false; \n \n \nbestEl.textContent = best; \n \n \n/* MOEILIJKHEID */ \n \ndocument.querySelectorAll(\".diff-btn\") \n.forEach(button => { \n \n    button.addEventListener(\"click\",() => { \n \n        document \n        .querySelectorAll(\".diff-btn\") \n        .forEach(btn => { \n \n            btn.classList.remove(\"active\"); \n \n        }); \n \n        button.classList.add(\"active\"); \n \n        difficultySpeed = \n        Number(button.dataset.speed); \n \n    }); \n \n}); \n \n \n/* START */ \n \nstartBtn.addEventListener( \n\"click\", \nstartGame \n); \n \nagainBtn.addEventListener( \n\"click\", \nstartGame \n); \n \n \n/* START GAME */ \n \nfunction startGame(){ \n \n    clearAllTimers(); \n \n    score = 0; \n    round = 1; \n    level = 1; \n \n    lives = 3; \n \n    combo = 0; \n    bestCombo = 0; \n \n    fastest = Infinity; \n \n    /* BELANGRIJK: \n       gekozen moeilijkheid wordt gebruikt */ \n \n    roundTime = difficultySpeed; \n \n    gameRunning = true; \n    paused = false; \n \n    scoreEl.textContent = \"0\"; \n    livesEl.textContent = \"3\"; \n \n    roundEl.textContent = \"1\"; \n    levelEl.textContent = \"1\"; \n \n    comboEl.textContent = \"COMBO x0\"; \n    comboEl.classList.remove(\"hot\"); \n \n    timerFill.style.width = \"100%\"; \n \n    pauseOverlay.classList.add(\"hidden\"); \n \n    startScreen.classList.add(\"hidden\"); \n    resultScreen.classList.add(\"hidden\"); \n    gameScreen.classList.remove(\"hidden\"); \n \n    instructionEl.textContent = \n    \"KLIK HET DONKERGROENE VAKJE!\"; \n \n    nextRound(); \n \n} \n \n \n/* VOLGENDE RONDE */ \n \nfunction nextRound(){ \n \n    if(!gameRunning || paused) \n    return; \n \n    if(round > 30){ \n \n        endGame(true); \n \n        return; \n \n    } \n \n    updateLevel(); \n \n    roundEl.textContent = round; \n \n    tiles.forEach(tile => { \n \n        tile.classList.remove( \n            \"target\", \n            \"wrong\" \n        ); \n \n    }); \n \n \n    target = \n    Math.floor( \n        Math.random() * tiles.length \n    ); \n \n \n    tiles[target] \n    .classList \n    .add(\"target\"); \n \n \n    startTime = \n    performance.now(); \n \n \n    runTimer(); \n \n} \n \n \n/* TIMER */ \n \nfunction runTimer(){ \n \n    clearInterval(timer); \n \n    const timeLimit = \n    roundTime; \n \n    const timerStart = \n    performance.now(); \n \n    timerFill.style.width = \n    \"100%\"; \n \n \n    timer = \n    setInterval(() => { \n \n        if(!gameRunning || paused) \n        return; \n \n \n        const elapsed = \n        performance.now() - \n        timerStart; \n \n \n        const percentage = \n        Math.max( \n            0, \n            100 - \n            (elapsed / timeLimit) * 100 \n        ); \n \n \n        timerFill.style.width = \n        percentage + \"%\"; \n \n \n        if(elapsed >= timeLimit){ \n \n            clearInterval(timer); \n \n            loseLife(); \n \n        } \n \n    },16); \n \n} \n \n \n/* LEVEN VERLIES */ \n \nfunction loseLife(){ \n \n    if(!gameRunning) \n    return; \n \n \n    tiles.forEach(tile => { \n \n        tile.classList.remove(\"target\"); \n \n    }); \n \n \n    flash(false); \n \n    lives--; \n \n    livesEl.textContent = \n    lives; \n \n \n    combo = 0; \n \n    updateCombo(); \n \n \n    if(lives <= 0){ \n \n        endGame(false); \n \n        return; \n \n    } \n \n \n    instructionEl.textContent = \n    \"TE LAAT! ⚠️\"; \n \n \n    round++; \n \n    makeFaster(); \n \n \n    nextRoundTimeout = \n    setTimeout(() => { \n \n        instructionEl.textContent = \n        \"KLIK HET DONKERGROENE VAKJE!\"; \n \n        nextRound(); \n \n    },320); \n \n} \n \n \n/* KLIKKEN */ \n \ntiles.forEach((tile,index) => { \n \n    tile.addEventListener(\"click\",() => { \n \n        if(!gameRunning || paused) \n        return; \n \n \n        /* VERKEERD */ \n \n        if(index !== target){ \n \n            tile.classList.add(\"wrong\");\n\n            lives--;\n            livesEl.textContent = Math.max(0,lives);\n\n            combo = 0;\n            updateCombo();\n            flash(false);\n\n            if(lives <= 0){\n                endGame(false);\n                return;\n            }\n\n            setTimeout(() => {\n                tile.classList.remove(\"wrong\");\n            },220);\n\n            return; \n \n        } \n \n \n        /* GOED */ \n \n        clearInterval(timer); \n \n \n        const reaction = \n        Math.round( \n            performance.now() - \n            startTime \n        ); \n \n \n        if(reaction < fastest){ \n \n            fastest = reaction; \n \n        } \n \n \n        combo++; \n \n \n        if(combo > bestCombo){ \n \n            bestCombo = combo; \n \n        } \n \n \n        let points = \n        Math.max( \n            25, \n            Math.round( \n                120000 / \n                Math.max(reaction,150) \n            ) \n        ); \n \n \n        points = \n        Math.min(points,120); \n \n \n        points += \n        combo * 5; \n \n \n        points += \n        level * 3; \n \n \n        if(reaction <= 400){ \n \n            points += 50; \n \n            instructionEl.textContent = \n            \"PERFECT! ⚡🌿\"; \n \n        } \n        else if(reaction <= 650){ \n \n            points += 25; \n \n            instructionEl.textContent = \n            \"SUPER SNEL! 🔥\"; \n \n        } \n        else{ \n \n            instructionEl.textContent = \n            \"GOED! ✅\"; \n \n        } \n \n \n        score += points; \n \n        scoreEl.textContent = \n        score; \n \n \n        updateCombo(); \n \n        flash(true); \n \n \n        tiles[target] \n        .classList \n        .remove(\"target\"); \n \n \n        round++; \n \n        makeFaster(); \n \n \n        nextRoundTimeout = \n        setTimeout(() => { \n \n            instructionEl.textContent = \n            \"KLIK HET DONKERGROENE VAKJE!\"; \n \n            nextRound(); \n \n        },140); \n \n    }); \n \n}); \n \n \n/* MAAK HET ELKE RONDE IETS SNELLER */ \n \nfunction makeFaster(){ \n \n    /* \n    De gekozen moeilijkheid blijft het beginpunt. \n    Daarna wordt iedere ronde iets sneller. \n    */ \n \n    roundTime = \n    Math.max( \n        380, \n        roundTime * 0.96 \n    ); \n \n} \n \n \n/* COMBO */ \n \nfunction updateCombo(){ \n \n    comboEl.textContent = \n    \"COMBO x\" + combo; \n \n \n    if(combo >= 5){ \n \n        comboEl.classList.add(\"hot\"); \n \n        comboEl.textContent = \n        \"🔥 COMBO x\" + combo; \n \n    } \n    else{ \n \n        comboEl.classList.remove(\"hot\"); \n \n    } \n \n} \n \n \n/* LEVEL */ \n \nfunction updateLevel(){ \n \n    level = \n    Math.min( \n        10, \n        Math.floor( \n            (round - 1) / 3 \n        ) + 1 \n    ); \n \n    levelEl.textContent = \n    level; \n \n} \n \n \n/* PAUZE */ \n \npauseBtn.addEventListener(\"click\",() => { \n \n    if(!gameRunning) \n    return; \n \n    paused = true; \n \n    clearInterval(timer); \n \n    pauseOverlay.classList.remove( \n        \"hidden\" \n    ); \n \n}); \n \n \nresumeBtn.addEventListener(\"click\",() => { \n \n    if(!gameRunning) \n    return; \n \n    paused = false; \n \n    pauseOverlay.classList.add( \n        \"hidden\" \n    ); \n \n    startTime = \n    performance.now(); \n \n    runTimer(); \n \n}); \n \n \n/* HOME */ \n \ngameHomeBtn.addEventListener( \n\"click\", \ngoHome \n); \n \nhomeBtn.addEventListener( \n\"click\", \ngoHome \n); \n \n \nfunction goHome(){ \n \n    clearAllTimers(); \n \n    gameRunning = false; \n    paused = false; \n \n    pauseOverlay.classList.add( \n        \"hidden\" \n    ); \n \n    gameScreen.classList.add( \n        \"hidden\" \n    ); \n \n    resultScreen.classList.add( \n        \"hidden\" \n    ); \n \n    startScreen.classList.remove( \n        \"hidden\" \n    ); \n \n \n    score = 0; \n    round = 1; \n    level = 1; \n \n    lives = 3; \n    combo = 0; \n \n    scoreEl.textContent = \"0\"; \n    livesEl.textContent = \"3\"; \n \n    roundEl.textContent = \"1\"; \n    levelEl.textContent = \"1\"; \n \n    comboEl.textContent = \n    \"COMBO x0\"; \n \n    comboEl.classList.remove(\"hot\"); \n \n    timerFill.style.width = \n    \"100%\"; \n \n \n    tiles.forEach(tile => { \n \n        tile.classList.remove( \n            \"target\", \n            \"wrong\" \n        ); \n \n    }); \n \n} \n \n \n/* EINDE */ \n \nfunction endGame(completed){ \n \n    clearAllTimers(); \n \n    gameRunning = false; \n    paused = false; \n \n \n    tiles.forEach(tile => { \n \n        tile.classList.remove( \n            \"target\", \n            \"wrong\" \n        ); \n \n    }); \n \n \n    finalScoreEl.textContent = \n    score; \n \n \n    fastestEl.textContent = \n    fastest === Infinity \n    ? \"-\" \n    : fastest; \n \n \n    bestComboEl.textContent = \n    bestCombo; \n \n \n    finalLevelEl.textContent = \n    level; \n \n \n    if(score > best){ \n \n        best = score; \n \n        localStorage.setItem( \n            \"reactionRushBest\", \n            best \n        ); \n \n        bestEl.textContent = \n        best; \n \n \n        resultTitle.textContent = \n        \"NIEUW RECORD! 🎉\"; \n \n        resultIcon.textContent = \n        \"🏆\"; \n \n    } \n \n    else if(completed){ \n \n        resultTitle.textContent = \n        \"GEWELDIG! 🌿\"; \n \n        resultIcon.textContent = \n        \"🌟\"; \n \n    } \n \n    else{ \n \n        resultTitle.textContent = \n        \"GAME OVER 💚\"; \n \n        resultIcon.textContent = \n        \"💚\"; \n \n    } \n \n \n    gameScreen.classList.add( \n        \"hidden\" \n    ); \n \n    resultScreen.classList.remove( \n        \"hidden\" \n    ); \n \n} \n \n \n/* EFFECT */ \n \nfunction flash(good){ \n \n    feedback.classList.remove( \n        \"good\", \n        \"bad\" \n    ); \n \n    void feedback.offsetWidth; \n \n    feedback.classList.add( \n        good ? \"good\" : \"bad\" \n    ); \n \n} \n \n \n/* TIMERS STOPPEN */ \n \nfunction clearAllTimers(){ \n \n    clearInterval(timer); \n    clearTimeout(nextRoundTimeout); \n \n    timer = null; \n    nextRoundTimeout = null; \n \n} \n \n \n/* GEEN SCROLL */ \n \ndocument.addEventListener( \n\"touchmove\", \nevent => { \n    event.preventDefault(); \n}, \n{passive:false} \n); \n \n<\/script> \n \n<\/body> \n<\/html>", "color": "<!DOCTYPE html>\n<html lang=\"nl\">\n<head><script>try{localStorage.getItem(\"x\")}catch(e){var _m={};Object.defineProperty(window,\"localStorage\",{value:{getItem:function(k){return k in _m?_m[k]:null},setItem:function(k,v){_m[k]=String(v)},removeItem:function(k){delete _m[k]}}})}<\/script>\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\n      content=\"width=device-width,\n      initial-scale=1.0,\n      maximum-scale=1.0,\n      user-scalable=no\">\n\n<title>COLOR CLASH 💛<\/title>\n\n<style>\n*{\n    box-sizing:border-box;\n    -webkit-tap-highlight-color:transparent;\n    user-select:none;\n}\n\nhtml,body{\n    width:100%;\n    height:100%;\n    margin:0;\n    overflow:hidden;\n    font-family:Arial,Helvetica,sans-serif;\n}\n\nbody{\n    background:\n        radial-gradient(circle at 10% 10%,#fff7bf 0%,transparent 32%),\n        radial-gradient(circle at 90% 90%,#f1bd18 0%,transparent 35%),\n        linear-gradient(135deg,#fffbe1,#ffe681,#f4c52b);\n\n    color:#765800;\n}\n\nbutton{\n    font-family:inherit;\n    cursor:pointer;\n    touch-action:manipulation;\n}\n\nbutton:active{\n    transform:scale(.97);\n}\n\n.hidden{\n    display:none !important;\n}\n\n/* APP */\n\n.app{\n    width:100%;\n    height:100%;\n\n    display:flex;\n    align-items:center;\n    justify-content:center;\n\n    padding:8px;\n}\n\n.game{\n    width:min(1100px,100%);\n    height:min(800px,100%);\n\n    position:relative;\n\n    display:flex;\n    flex-direction:column;\n\n    overflow:hidden;\n\n    background:#fffdf3;\n\n    border:3px solid #d7ae20;\n    border-radius:28px;\n\n    box-shadow:\n        0 22px 65px rgba(120,88,0,.24);\n}\n\n/* HEADER */\n\n.header{\n    min-height:70px;\n\n    padding:10px 17px;\n\n    display:flex;\n    justify-content:space-between;\n    align-items:center;\n\n    gap:10px;\n\n    background:\n        linear-gradient(\n            135deg,\n            #c99d0e,\n            #edc72e\n        );\n\n    color:#fffdf2;\n}\n\n.logo{\n    font-size:clamp(22px,4vw,34px);\n    font-weight:1000;\n}\n\n.logo span{\n    color:#fff4ad;\n}\n\n.header-stats{\n    display:flex;\n    gap:6px;\n}\n\n.stat{\n    min-width:64px;\n\n    padding:5px 8px;\n\n    border-radius:11px;\n\n    background:rgba(255,255,255,.18);\n\n    border:2px solid rgba(255,255,255,.22);\n\n    text-align:center;\n}\n\n.stat small{\n    display:block;\n    font-size:8px;\n    opacity:.88;\n}\n\n.stat strong{\n    display:block;\n    font-size:17px;\n}\n\n\n/* SCREENS */\n\n.screen{\n    flex:1;\n    min-height:0;\n\n    display:flex;\n    flex-direction:column;\n}\n\n\n/* HOME */\n\n#homeScreen{\n    align-items:center;\n    justify-content:center;\n\n    text-align:center;\n\n    padding:18px;\n}\n\n.home-icon{\n    font-size:63px;\n}\n\n.home-title{\n    margin:0;\n\n    color:#9b7600;\n\n    font-size:clamp(40px,7vw,65px);\n\n    font-weight:1000;\n}\n\n.home-text{\n    max-width:680px;\n\n    margin:8px auto 17px;\n\n    color:#88722e;\n\n    line-height:1.45;\n\n    font-size:16px;\n}\n\n.feature-row{\n    display:flex;\n\n    justify-content:center;\n    flex-wrap:wrap;\n\n    gap:7px;\n\n    margin-bottom:18px;\n}\n\n.feature{\n    padding:7px 11px;\n\n    border-radius:11px;\n\n    background:#fff2a9;\n\n    border:2px solid #d8b52c;\n\n    color:#876800;\n\n    font-size:11px;\n\n    font-weight:900;\n}\n\n.mode-grid{\n    width:min(820px,100%);\n\n    display:grid;\n\n    grid-template-columns:repeat(3,1fr);\n\n    gap:10px;\n\n    margin-bottom:15px;\n}\n\n.mode-card{\n    border:3px solid #dfbd36;\n\n    border-radius:17px;\n\n    background:#fff4b9;\n\n    color:#856500;\n\n    padding:13px 8px;\n}\n\n.mode-card.selected{\n    background:#d5a914;\n\n    border-color:#b48800;\n\n    color:#fffdf1;\n\n    box-shadow:\n        0 8px 18px rgba(150,111,0,.2);\n}\n\n.mode-icon{\n    font-size:32px;\n}\n\n.mode-title{\n    font-size:15px;\n    font-weight:1000;\n\n    margin-top:4px;\n}\n\n.mode-info{\n    font-size:10px;\n    opacity:.82;\n\n    margin-top:3px;\n}\n\n.start-main{\n    border:0;\n\n    padding:13px 30px;\n\n    border-radius:15px;\n\n    background:\n        linear-gradient(\n            135deg,\n            #b88e00,\n            #e0b921\n        );\n\n    color:#fffdf0;\n\n    font-size:17px;\n\n    font-weight:1000;\n\n    box-shadow:\n        0 8px 20px\n        rgba(145,108,0,.22);\n}\n\n\n/* SETUP */\n\n#setupScreen{\n    padding:13px;\n    gap:9px;\n}\n\n.setup-title{\n    text-align:center;\n\n    color:#967100;\n\n    font-size:clamp(24px,4vw,34px);\n\n    font-weight:1000;\n}\n\n.setup-text{\n    text-align:center;\n\n    color:#897332;\n\n    font-size:13px;\n}\n\n.setup-card{\n    flex:1;\n    min-height:0;\n\n    display:flex;\n    flex-direction:column;\n\n    align-items:center;\n    justify-content:center;\n\n    gap:13px;\n\n    padding:18px;\n\n    border:2px solid #dcbc3a;\n    border-radius:19px;\n\n    background:#fff7ca;\n}\n\n.setup-icon{\n    font-size:60px;\n}\n\n.difficulty-title{\n    color:#8c6b00;\n\n    font-size:13px;\n\n    font-weight:1000;\n}\n\n.difficulty{\n    display:flex;\n    gap:8px;\n}\n\n.difficulty button{\n    border:2px solid #d8bb43;\n\n    background:#fff0ac;\n\n    color:#806000;\n\n    border-radius:11px;\n\n    padding:9px 15px;\n\n    font-size:11px;\n\n    font-weight:1000;\n}\n\n.difficulty button.active{\n    background:#d5a914;\n\n    color:white;\n\n    border-color:#b68800;\n}\n\n.setup-actions{\n    display:flex;\n\n    justify-content:center;\n\n    gap:8px;\n\n    flex-wrap:wrap;\n}\n\n.back-btn{\n    border:2px solid #d8bb43;\n\n    background:#fff0b4;\n\n    color:#816100;\n\n    border-radius:12px;\n\n    padding:10px 20px;\n\n    font-size:12px;\n\n    font-weight:1000;\n}\n\n\n/* GAME */\n\n#gameScreen{\n    padding:9px;\n    gap:7px;\n}\n\n.game-top{\n    display:grid;\n\n    grid-template-columns:auto 1fr auto auto;\n\n    align-items:center;\n\n    gap:7px;\n}\n\n.round-info{\n    color:#8a6900;\n\n    font-size:11px;\n\n    font-weight:1000;\n}\n\n.center-info{\n    text-align:center;\n\n    color:#9a8845;\n\n    font-size:10px;\n}\n\n.center-info strong{\n    color:#947000;\n\n    font-size:19px;\n}\n\n.game-btn{\n    border:2px solid #d6b83c;\n\n    background:#fff0ae;\n\n    color:#816100;\n\n    border-radius:10px;\n\n    padding:6px 8px;\n\n    font-size:9px;\n\n    font-weight:1000;\n}\n\n\n/* TARGET */\n\n.target-box{\n    width:100%;\n\n    text-align:center;\n\n    padding:12px 10px;\n\n    border-radius:15px;\n\n    background:#fff1a9;\n\n    border:3px solid #d6b12c;\n\n    color:#866400;\n\n    font-size:18px;\n\n    font-weight:1000;\n}\n\n.target-symbol{\n    display:inline-block;\n\n    margin-left:5px;\n\n    font-size:30px;\n\n    color:#8f6a00;\n\n    vertical-align:middle;\n}\n\n.target-box small{\n    display:block;\n\n    margin-top:2px;\n\n    color:#9a8750;\n\n    font-size:9px;\n\n    font-weight:800;\n}\n\n\n/* TIMER */\n\n.timer-wrap{\n    width:100%;\n    height:11px;\n\n    overflow:hidden;\n\n    background:#faedb8;\n\n    border:2px solid #dec145;\n\n    border-radius:20px;\n}\n\n.timer-bar{\n    width:100%;\n    height:100%;\n\n    background:\n        linear-gradient(\n            90deg,\n            #f0c51b,\n            #b98b00\n        );\n\n    transition:width .06s linear;\n}\n\n\n/* CLASH GRID */\n\n.clash-grid{\n    flex:1;\n    min-height:0;\n\n    display:grid;\n\n    grid-template-columns:repeat(3,1fr);\n    grid-template-rows:repeat(2,1fr);\n\n    gap:10px;\n\n    padding:3px;\n}\n\n.clash-btn{\n    position:relative;\n\n    border:4px solid #d7b637;\n\n    border-radius:20px;\n\n    background:\n        linear-gradient(\n            145deg,\n            #fff5bb,\n            #f4d64f\n        );\n\n    color:#876600;\n\n    font-size:clamp(33px,6vw,58px);\n\n    font-weight:1000;\n\n    box-shadow:\n        0 8px 15px rgba(116,87,0,.12);\n\n    transition:\n        transform .12s,\n        border-color .12s,\n        background .12s;\n}\n\n.clash-btn:hover{\n    transform:translateY(-2px);\n}\n\n.clash-btn.correct{\n    background:#ecd02e;\n\n    border-color:#9e7900;\n\n    color:#fffdf0;\n}\n\n.clash-btn.wrong{\n    background:#f4dc77;\n\n    border-color:#bd9300;\n\n    color:#7c5e00;\n}\n\n\n/* BOTTOM */\n\n.bottom{\n    display:flex;\n\n    justify-content:center;\n    align-items:center;\n\n    gap:14px;\n\n    color:#8b7435;\n\n    font-size:10px;\n\n    font-weight:900;\n}\n\n\n/* RESULT */\n\n.overlay{\n    position:absolute;\n\n    inset:0;\n\n    z-index:40;\n\n    display:flex;\n\n    justify-content:center;\n    align-items:center;\n\n    padding:20px;\n\n    background:rgba(93,71,0,.6);\n\n    backdrop-filter:blur(5px);\n}\n\n.overlay-card{\n    width:min(440px,92%);\n\n    padding:25px;\n\n    text-align:center;\n\n    background:#fffdf3;\n\n    border:3px solid #d5b330;\n\n    border-radius:22px;\n\n    box-shadow:\n        0 20px 50px rgba(0,0,0,.2);\n}\n\n.overlay-icon{\n    font-size:60px;\n}\n\n.overlay-title{\n    margin:4px 0;\n\n    color:#967100;\n\n    font-size:36px;\n\n    font-weight:1000;\n}\n\n.overlay-score{\n    color:#b18400;\n\n    font-size:49px;\n\n    font-weight:1000;\n}\n\n.overlay-text{\n    color:#88743d;\n\n    font-size:14px;\n\n    line-height:1.45;\n\n    margin:7px 0 19px;\n}\n\n.overlay-buttons{\n    display:flex;\n\n    flex-direction:column;\n\n    gap:8px;\n\n    align-items:center;\n}\n\n.overlay-home{\n    border:2px solid #d6b73b;\n\n    background:#fff0af;\n\n    color:#806000;\n\n    border-radius:13px;\n\n    padding:11px 26px;\n\n    font-size:13px;\n\n    font-weight:1000;\n}\n\n\n/* PAUSE */\n\n.pause-text{\n    color:#88743d;\n}\n\n\n/* TOAST */\n\n.toast{\n    position:absolute;\n\n    left:50%;\n    bottom:18px;\n\n    z-index:100;\n\n    transform:translate(-50%,20px);\n\n    opacity:0;\n\n    pointer-events:none;\n\n    background:#967100;\n\n    color:white;\n\n    padding:10px 15px;\n\n    border-radius:12px;\n\n    font-size:11px;\n\n    font-weight:900;\n\n    transition:.2s;\n}\n\n.toast.show{\n    opacity:1;\n\n    transform:translate(-50%,0);\n}\n\n\n/* MOBILE */\n\n@media(max-width:700px){\n\n    .app{\n        padding:3px;\n    }\n\n    .game{\n        border-radius:18px;\n    }\n\n    .header{\n        min-height:56px;\n\n        padding:6px 8px;\n    }\n\n    .logo{\n        font-size:18px;\n    }\n\n    .stat{\n        min-width:45px;\n\n        padding:4px;\n    }\n\n    .stat small{\n        font-size:6px;\n    }\n\n    .stat strong{\n        font-size:13px;\n    }\n\n\n    #homeScreen{\n        padding:8px;\n    }\n\n    .home-icon{\n        font-size:45px;\n    }\n\n    .home-title{\n        font-size:38px;\n    }\n\n    .home-text{\n        font-size:12px;\n\n        margin:5px auto 10px;\n    }\n\n    .feature-row{\n        gap:4px;\n\n        margin-bottom:9px;\n    }\n\n    .feature{\n        padding:5px 7px;\n\n        font-size:7px;\n    }\n\n    .mode-grid{\n        gap:4px;\n\n        margin-bottom:10px;\n    }\n\n    .mode-card{\n        padding:8px 3px;\n\n        border-radius:12px;\n    }\n\n    .mode-icon{\n        font-size:23px;\n    }\n\n    .mode-title{\n        font-size:9px;\n    }\n\n    .mode-info{\n        font-size:6px;\n    }\n\n    .start-main{\n        padding:10px 22px;\n\n        font-size:14px;\n    }\n\n\n    #setupScreen{\n        padding:7px;\n\n        gap:5px;\n    }\n\n    .setup-title{\n        font-size:21px;\n    }\n\n    .setup-text{\n        font-size:9px;\n    }\n\n    .setup-card{\n        padding:10px;\n\n        gap:8px;\n    }\n\n    .setup-icon{\n        font-size:45px;\n    }\n\n    .difficulty{\n        gap:4px;\n    }\n\n    .difficulty button{\n        padding:7px 8px;\n\n        font-size:8px;\n    }\n\n\n    #gameScreen{\n        padding:5px;\n\n        gap:4px;\n    }\n\n    .game-top{\n        grid-template-columns:auto 1fr auto auto;\n\n        gap:3px;\n    }\n\n    .round-info{\n        font-size:8px;\n    }\n\n    .center-info{\n        font-size:7px;\n    }\n\n    .center-info strong{\n        font-size:13px;\n    }\n\n    .game-btn{\n        padding:5px;\n\n        font-size:6px;\n    }\n\n\n    .target-box{\n        padding:7px;\n\n        font-size:14px;\n\n        border-radius:11px;\n    }\n\n    .target-symbol{\n        font-size:24px;\n    }\n\n    .target-box small{\n        font-size:7px;\n    }\n\n\n    .timer-wrap{\n        height:9px;\n    }\n\n\n    .clash-grid{\n        gap:5px;\n    }\n\n    .clash-btn{\n        border-width:3px;\n\n        border-radius:12px;\n\n        font-size:34px;\n    }\n\n\n    .bottom{\n        font-size:7px;\n\n        gap:10px;\n    }\n\n\n    .overlay-card{\n        padding:19px;\n    }\n\n    .overlay-icon{\n        font-size:48px;\n    }\n\n    .overlay-title{\n        font-size:30px;\n    }\n\n    .overlay-score{\n        font-size:42px;\n    }\n}\n\n<\/style>\n<\/head>\n\n<body>\n\n<div class=\"app\">\n\n<div class=\"game\">\n\n\n<\u0021-- HEADER -->\n\n<header class=\"header\">\n\n    <div class=\"logo\">\n        COLOR <span>CLASH 💛<\/span>\n    <\/div>\n\n    <div class=\"header-stats\">\n\n        <div class=\"stat\">\n            <small>SCORE<\/small>\n            <strong id=\"headerScore\">0<\/strong>\n        <\/div>\n\n        <div class=\"stat\">\n            <small>BEST<\/small>\n            <strong id=\"bestScore\">0<\/strong>\n        <\/div>\n\n    <\/div>\n\n<\/header>\n\n\n<\u0021-- HOME -->\n\n<section id=\"homeScreen\" class=\"screen\">\n\n    <div class=\"home-icon\">\n        ⚡\n    <\/div>\n\n    <h1 class=\"home-title\">\n        COLOR CLASH\n    <\/h1>\n\n    <p class=\"home-text\">\n        Kijk goed naar het symbool bovenaan en klik zo snel mogelijk\n        op het juiste vak. De tijd wordt steeds sneller!\n    <\/p>\n\n\n    <div class=\"feature-row\">\n\n        <div class=\"feature\">⚡ SNELHEID<\/div>\n        <div class=\"feature\">🎯 REACTIE<\/div>\n        <div class=\"feature\">🔥 COMBO<\/div>\n        <div class=\"feature\">🏆 SCORE<\/div>\n\n    <\/div>\n\n\n    <div class=\"mode-grid\">\n\n        <button\n            class=\"mode-card selected\"\n            data-difficulty=\"easy\"\n        >\n\n            <div class=\"mode-icon\">\n                🌱\n            <\/div>\n\n            <div class=\"mode-title\">\n                MAKKELIJK\n            <\/div>\n\n            <div class=\"mode-info\">\n                Meer tijd\n            <\/div>\n\n        <\/button>\n\n\n        <button\n            class=\"mode-card\"\n            data-difficulty=\"normal\"\n        >\n\n            <div class=\"mode-icon\">\n                ⚡\n            <\/div>\n\n            <div class=\"mode-title\">\n                NORMAAL\n            <\/div>\n\n            <div class=\"mode-info\">\n                Sneller\n            <\/div>\n\n        <\/button>\n\n\n        <button\n            class=\"mode-card\"\n            data-difficulty=\"hard\"\n        >\n\n            <div class=\"mode-icon\">\n                🔥\n            <\/div>\n\n            <div class=\"mode-title\">\n                MOEILIJK\n            <\/div>\n\n            <div class=\"mode-info\">\n                Supersnel\n            <\/div>\n\n        <\/button>\n\n    <\/div>\n\n\n    <button\n        id=\"startBtn\"\n        class=\"start-main\"\n    >\n        START GAME 🚀\n    <\/button>\n\n<\/section>\n\n\n<\u0021-- GAME -->\n\n<section\n    id=\"gameScreen\"\n    class=\"screen hidden\"\n>\n\n    <div class=\"game-top\">\n\n        <div\n            id=\"roundInfo\"\n            class=\"round-info\"\n        >\n            RONDE 1\n        <\/div>\n\n\n        <div class=\"center-info\">\n\n            SCORE:\n            <strong id=\"gameScore\">\n                0\n            <\/strong>\n\n        <\/div>\n\n\n        <button\n            id=\"pauseBtn\"\n            class=\"game-btn\"\n        >\n            ⏸️ PAUZE\n        <\/button>\n\n\n        <button\n            id=\"homeBtn\"\n            class=\"game-btn\"\n        >\n            🏠 HOME\n        <\/button>\n\n    <\/div>\n\n\n    <div class=\"target-box\">\n\n        KLIK OP:\n\n        <span\n            id=\"targetSymbol\"\n            class=\"target-symbol\"\n        >\n            ★\n        <\/span>\n\n        <small>\n            Kies zo snel mogelijk het juiste symbool\n        <\/small>\n\n    <\/div>\n\n\n    <div class=\"timer-wrap\">\n\n        <div\n            id=\"timerBar\"\n            class=\"timer-bar\"\n        ><\/div>\n\n    <\/div>\n\n\n    <div\n        id=\"clashGrid\"\n        class=\"clash-grid\"\n    >\n    <\/div>\n\n\n    <div class=\"bottom\">\n\n        <span>\n            ❤️ LEVENS:\n            <b id=\"lives\">\n                3\n            <\/b>\n        <\/span>\n\n        <span>\n            🔥 COMBO:\n            <b id=\"combo\">\n                0\n            <\/b>\n        <\/span>\n\n        <span>\n            BEST:\n            <b id=\"gameBest\">\n                0\n            <\/b>\n        <\/span>\n\n    <\/div>\n\n<\/section>\n\n\n<\u0021-- RESULT -->\n\n<div\n    id=\"resultOverlay\"\n    class=\"overlay hidden\"\n>\n\n    <div class=\"overlay-card\">\n\n        <div\n            id=\"resultIcon\"\n            class=\"overlay-icon\"\n        >\n            🏆\n        <\/div>\n\n\n        <div\n            id=\"resultTitle\"\n            class=\"overlay-title\"\n        >\n            GAME OVER\n        <\/div>\n\n\n        <div\n            id=\"resultScore\"\n            class=\"overlay-score\"\n        >\n            0\n        <\/div>\n\n\n        <div\n            id=\"resultText\"\n            class=\"overlay-text\"\n        >\n        <\/div>\n\n\n        <div class=\"overlay-buttons\">\n\n            <button\n                id=\"againBtn\"\n                class=\"start-main\"\n            >\n                🔄 OPNIEUW\n            <\/button>\n\n\n            <button\n                id=\"resultHomeBtn\"\n                class=\"overlay-home\"\n            >\n                🏠 TERUG NAAR HOME\n            <\/button>\n\n        <\/div>\n\n    <\/div>\n\n<\/div>\n\n\n<\u0021-- PAUSE -->\n\n<div\n    id=\"pauseOverlay\"\n    class=\"overlay hidden\"\n>\n\n    <div class=\"overlay-card\">\n\n        <div class=\"overlay-icon\">\n            ⏸️\n        <\/div>\n\n        <div class=\"overlay-title\">\n            PAUZE\n        <\/div>\n\n        <div class=\"overlay-text\">\n            Je spel staat tijdelijk stil.\n        <\/div>\n\n        <button\n            id=\"resumeBtn\"\n            class=\"start-main\"\n        >\n            ▶ VERDER\n        <\/button>\n\n    <\/div>\n\n<\/div>\n\n\n<div\n    id=\"toast\"\n    class=\"toast\"\n>\n<\/div>\n\n\n<\/div>\n<\/div>\n\n\n<script>\n\n/* =====================================================\n   ELEMENTEN\n===================================================== */\n\nconst homeScreen =\n    document.getElementById(\"homeScreen\");\n\nconst gameScreen =\n    document.getElementById(\"gameScreen\");\n\nconst startBtn =\n    document.getElementById(\"startBtn\");\n\nconst homeBtn =\n    document.getElementById(\"homeBtn\");\n\nconst pauseBtn =\n    document.getElementById(\"pauseBtn\");\n\nconst resumeBtn =\n    document.getElementById(\"resumeBtn\");\n\nconst againBtn =\n    document.getElementById(\"againBtn\");\n\nconst resultHomeBtn =\n    document.getElementById(\"resultHomeBtn\");\n\nconst resultOverlay =\n    document.getElementById(\"resultOverlay\");\n\nconst pauseOverlay =\n    document.getElementById(\"pauseOverlay\");\n\nconst clashGrid =\n    document.getElementById(\"clashGrid\");\n\nconst targetSymbol =\n    document.getElementById(\"targetSymbol\");\n\nconst timerBar =\n    document.getElementById(\"timerBar\");\n\nconst roundInfo =\n    document.getElementById(\"roundInfo\");\n\nconst gameScore =\n    document.getElementById(\"gameScore\");\n\nconst headerScore =\n    document.getElementById(\"headerScore\");\n\nconst bestScoreEl =\n    document.getElementById(\"bestScore\");\n\nconst gameBest =\n    document.getElementById(\"gameBest\");\n\nconst livesEl =\n    document.getElementById(\"lives\");\n\nconst comboEl =\n    document.getElementById(\"combo\");\n\nconst resultIcon =\n    document.getElementById(\"resultIcon\");\n\nconst resultTitle =\n    document.getElementById(\"resultTitle\");\n\nconst resultScore =\n    document.getElementById(\"resultScore\");\n\nconst resultText =\n    document.getElementById(\"resultText\");\n\nconst toast =\n    document.getElementById(\"toast\");\n\n\n/* =====================================================\n   GAME VARIABELEN\n===================================================== */\n\nlet difficulty = \"easy\";\n\nlet score = 0;\nlet lives = 3;\nlet combo = 0;\n\nlet round = 0;\n\nlet gameRunning = false;\nlet paused = false;\n\nlet timerInterval = null;\n\nlet timeLeft = 0;\nlet maxTime = 0;\n\nlet target = \"\";\n\nlet bestScore =\n    Number(\n        localStorage.getItem(\"colorClashBest\")\n    ) || 0;\n\nbestScoreEl.textContent =\n    bestScore;\n\ngameBest.textContent =\n    bestScore;\n\n\n/* SYMBOLEN */\n\nconst symbols = [\n    \"★\",\n    \"◆\",\n    \"●\",\n    \"▲\",\n    \"■\",\n    \"♥\"\n];\n\n\n/* =====================================================\n   MOEILIJKHEID\n===================================================== */\n\ndocument\n.querySelectorAll(\".mode-card\")\n.forEach(card => {\n\n    card.addEventListener(\"click\", () => {\n\n        document\n        .querySelectorAll(\".mode-card\")\n        .forEach(c =>\n            c.classList.remove(\"selected\")\n        );\n\n        card.classList.add(\"selected\");\n\n        difficulty =\n            card.dataset.difficulty;\n\n    });\n\n});\n\n\n/* =====================================================\n   START\n===================================================== */\n\nstartBtn.addEventListener(\n    \"click\",\n    startGame\n);\n\n\nfunction startGame(){\n\n    clearInterval(timerInterval);\n\n    score = 0;\n    lives = 3;\n    combo = 0;\n    round = 0;\n\n    gameRunning = true;\n    paused = false;\n\n    resultOverlay.classList.add(\n        \"hidden\"\n    );\n\n    pauseOverlay.classList.add(\n        \"hidden\"\n    );\n\n    homeScreen.classList.add(\n        \"hidden\"\n    );\n\n    gameScreen.classList.remove(\n        \"hidden\"\n    );\n\n    updateStats();\n\n    nextRound();\n\n}\n\n\n/* =====================================================\n   NIEUWE RONDE\n===================================================== */\n\nfunction nextRound(){\n\n    if(!gameRunning)\n        return;\n\n    round++;\n\n    roundInfo.textContent =\n        \"RONDE \" + round;\n\n\n    /* Tijd wordt steeds korter */\n\n    if(difficulty === \"easy\"){\n\n        maxTime =\n            Math.max(\n                1100,\n                2200 - round * 45\n            );\n\n    }\n    else if(difficulty === \"normal\"){\n\n        maxTime =\n            Math.max(\n                800,\n                1700 - round * 50\n            );\n\n    }\n    else{\n\n        maxTime =\n            Math.max(\n                600,\n                1300 - round * 45\n            );\n\n    }\n\n\n    timeLeft = maxTime;\n\n\n    target =\n        symbols[\n            Math.floor(\n                Math.random() *\n                symbols.length\n            )\n        ];\n\n\n    targetSymbol.textContent =\n        target;\n\n\n    createClashButtons();\n\n    startTimer();\n\n}\n\n\n/* =====================================================\n   KNOPPEN MAKEN\n===================================================== */\n\nfunction createClashButtons(){\n\n    clashGrid.innerHTML = \"\";\n\n    let shuffled =\n        [...symbols];\n\n\n    shuffle(shuffled);\n\n\n    /* Soms hetzelfde doel nog maar\n       één keer in het speelveld */\n\n    shuffled.forEach(symbol => {\n\n        const button =\n            document.createElement(\"button\");\n\n        button.type = \"button\";\n\n        button.className =\n            \"clash-btn\";\n\n        button.textContent =\n            symbol;\n\n\n        button.addEventListener(\n            \"click\",\n            () => {\n\n                chooseSymbol(\n                    button,\n                    symbol\n                );\n\n            }\n        );\n\n\n        clashGrid.appendChild(\n            button\n        );\n\n    });\n\n}\n\n\n/* =====================================================\n   SYMBOOL KIEZEN\n===================================================== */\n\nfunction chooseSymbol(\n    button,\n    symbol\n){\n\n    if(\n        !gameRunning ||\n        paused\n    )\n        return;\n\n\n    clearInterval(timerInterval);\n\n\n    if(symbol === target){\n\n        button.classList.add(\n            \"correct\"\n        );\n\n\n        combo++;\n\n        score +=\n            50 +\n            combo * 5;\n\n\n        gameMessage(\n            \"GOED! 🔥\"\n        );\n\n\n        updateStats();\n\n\n        setTimeout(\n            nextRound,\n            120\n        );\n\n    }\n    else{\n\n        button.classList.add(\n            \"wrong\"\n        );\n\n\n        lives--;\n\n        combo = 0;\n\n\n        updateStats();\n\n\n        if(lives <= 0){\n\n            finishGame();\n\n            return;\n\n        }\n\n\n        gameMessage(\n            \"FOUT! ❌\"\n        );\n\n\n        /*\n           Bij een fout krijg je een\n           nieuwe ronde, maar verlies je\n           een leven.\n        */\n\n        setTimeout(\n            nextRound,\n            300\n        );\n\n    }\n\n}\n\n\n/* =====================================================\n   TIMER\n===================================================== */\n\nfunction startTimer(){\n\n    clearInterval(timerInterval);\n\n    updateTimer();\n\n\n    timerInterval =\n        setInterval(() => {\n\n            if(\n                paused ||\n                !gameRunning\n            )\n                return;\n\n\n            timeLeft -= 30;\n\n            updateTimer();\n\n\n            if(timeLeft <= 0){\n\n                clearInterval(\n                    timerInterval\n                );\n\n\n                lives--;\n\n                combo = 0;\n\n                updateStats();\n\n\n                if(lives <= 0){\n\n                    finishGame();\n\n                }\n                else{\n\n                    gameMessage(\n                        \"⏰ TE LAAT!\"\n                    );\n\n                    setTimeout(\n                        nextRound,\n                        300\n                    );\n\n                }\n\n            }\n\n        },30);\n\n}\n\n\n/* =====================================================\n   TIMER UPDATE\n===================================================== */\n\nfunction updateTimer(){\n\n    const percent =\n        Math.max(\n            0,\n            Math.min(\n                100,\n                (timeLeft / maxTime) * 100\n            )\n        );\n\n\n    timerBar.style.width =\n        percent + \"%\";\n\n}\n\n\n/* =====================================================\n   STATS\n===================================================== */\n\nfunction updateStats(){\n\n    gameScore.textContent =\n        score;\n\n    headerScore.textContent =\n        score;\n\n    livesEl.textContent =\n        lives;\n\n    comboEl.textContent =\n        combo;\n\n    gameBest.textContent =\n        bestScore;\n\n}\n\n\n/* =====================================================\n   GAME MESSAGE\n===================================================== */\n\nfunction gameMessage(text){\n\n    targetSymbol.animate(\n        [\n            {\n                transform:\"scale(1)\"\n            },\n            {\n                transform:\"scale(1.25)\"\n            },\n            {\n                transform:\"scale(1)\"\n            }\n        ],\n        {\n            duration:180\n        }\n    );\n\n}\n\n\n/* =====================================================\n   EINDE\n===================================================== */\n\nfunction finishGame(){\n\n    clearInterval(timerInterval);\n\n    gameRunning = false;\n\n    pauseOverlay.classList.add(\n        \"hidden\"\n    );\n\n\n    if(score > bestScore){\n\n        bestScore = score;\n\n        localStorage.setItem(\n            \"colorClashBest\",\n            bestScore\n        );\n\n        bestScoreEl.textContent =\n            bestScore;\n\n        gameBest.textContent =\n            bestScore;\n\n        resultIcon.textContent =\n            \"👑\";\n\n        resultTitle.textContent =\n            \"NIEUW RECORD!\";\n\n    }\n    else{\n\n        resultIcon.textContent =\n            \"💛\";\n\n        resultTitle.textContent =\n            \"GAME OVER!\";\n\n    }\n\n\n    resultScore.textContent =\n        score;\n\n\n    resultText.textContent =\n        `Je haalde ${round - 1} rondes met een combo van ${combo}.`;\n\n\n    resultOverlay.classList.remove(\n        \"hidden\"\n    );\n\n}\n\n\n/* =====================================================\n   PAUZE\n===================================================== */\n\npauseBtn.addEventListener(\n    \"click\",\n    () => {\n\n        if(!gameRunning)\n            return;\n\n        paused = true;\n\n        pauseOverlay.classList.remove(\n            \"hidden\"\n        );\n\n    }\n);\n\n\nresumeBtn.addEventListener(\n    \"click\",\n    () => {\n\n        paused = false;\n\n        pauseOverlay.classList.add(\n            \"hidden\"\n        );\n\n    }\n);\n\n\n/* =====================================================\n   OPNIEUW\n===================================================== */\n\nagainBtn.addEventListener(\n    \"click\",\n    startGame\n);\n\n\n/* =====================================================\n   HOME\n===================================================== */\n\nhomeBtn.addEventListener(\n    \"click\",\n    goHome\n);\n\nresultHomeBtn.addEventListener(\n    \"click\",\n    goHome\n);\n\n\nfunction goHome(){\n\n    clearInterval(timerInterval);\n\n    gameRunning = false;\n    paused = false;\n\n    resultOverlay.classList.add(\n        \"hidden\"\n    );\n\n    pauseOverlay.classList.add(\n        \"hidden\"\n    );\n\n    gameScreen.classList.add(\n        \"hidden\"\n    );\n\n    homeScreen.classList.remove(\n        \"hidden\"\n    );\n\n}\n\n\n/* =====================================================\n   SHUFFLE\n===================================================== */\n\nfunction shuffle(array){\n\n    for(\n        let i = array.length - 1;\n        i > 0;\n        i--\n    ){\n\n        const j =\n            Math.floor(\n                Math.random() *\n                (i + 1)\n            );\n\n        [\n            array[i],\n            array[j]\n        ] =\n        [\n            array[j],\n            array[i]\n        ];\n\n    }\n\n}\n\n\n/* =====================================================\n   TOAST\n===================================================== */\n\nlet toastTimer = null;\n\nfunction showToast(message){\n\n    toast.textContent =\n        message;\n\n    toast.classList.add(\n        \"show\"\n    );\n\n    clearTimeout(\n        toastTimer\n    );\n\n    toastTimer =\n        setTimeout(() => {\n\n            toast.classList.remove(\n                \"show\"\n            );\n\n        },1800);\n\n}\n\n\n/* =====================================================\n   GEEN SCROLL\n===================================================== */\n\ndocument.addEventListener(\n    \"touchmove\",\n    e => {\n        e.preventDefault();\n    },\n    {\n        passive:false\n    }\n);\n\n<\/script>\n\n<\/body>\n<\/html>", "memory": "<!DOCTYPE html>\n<html lang=\"nl\">\n<head><script>try{localStorage.getItem(\"x\")}catch(e){var _m={};Object.defineProperty(window,\"localStorage\",{value:{getItem:function(k){return k in _m?_m[k]:null},setItem:function(k,v){_m[k]=String(v)},removeItem:function(k){delete _m[k]}}})}<\/script>\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\n      content=\"width=device-width,\n      initial-scale=1.0,\n      maximum-scale=1.0,\n      user-scalable=no\">\n\n<title>MEMORY MIX 💜<\/title>\n\n<script src=\"https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js\"><\/script>\n\n<style>\n*{\n    box-sizing:border-box;\n    -webkit-tap-highlight-color:transparent;\n    user-select:none;\n}\n\nhtml,body{\n    width:100%;\n    height:100%;\n    margin:0;\n    overflow:hidden;\n    font-family:Arial,Helvetica,sans-serif;\n}\n\nbody{\n    background:\n        radial-gradient(circle at 10% 10%,#ead8ff 0%,transparent 30%),\n        radial-gradient(circle at 90% 90%,#7135a5 0%,transparent 35%),\n        linear-gradient(135deg,#f8f0ff,#ddc1f3,#a76dcc);\n    color:#41215c;\n}\n\nbutton,input{\n    font-family:inherit;\n}\n\nbutton{\n    cursor:pointer;\n    touch-action:manipulation;\n}\n\nbutton:active{\n    transform:scale(.97);\n}\n\n.hidden{\n    display:none !important;\n}\n\n.app{\n    width:100%;\n    height:100%;\n    display:flex;\n    align-items:center;\n    justify-content:center;\n    padding:8px;\n}\n\n.game{\n    width:min(1120px,100%);\n    height:min(800px,100%);\ x;\n    font-size:12px;\n    font-weight:1000;\n}\n\n/* ONLINE */\n\n.online-setup{\n    width:min(600px,100%);\n    padding:12px;\n    border:2px solid #b58ace;\n    border-radius:17px;\n    background:#f0e5f9;\n    margin:auto;\n}\n\n.online-tabs{\n    display:flex;\n    gap:7px;\n    margin-bottom:8px;\n}\n\n.online-tab{\n    flex:1;\n    border:2px solid #b68ccf;\n    background:#eaddf7;\n    color:#65358f;\n    border-radius:11px;\n    padding:9px;\n    font-size:11px;\n    font-weight:1000;\n}\n\n.online-tab.active{\n    background:#733da2;\n    color:white;\n}\n\n.room-box{\n    padding:10px;\n    border-radius:12px;\n    background:#7540a4;\n    color:white;\n    text-align:center;\n    font-weight:1000;\n}\n\n.room-code{\n    display:block;\n    font-size:27px;\n    letter-spacing:5px;\n    margin-top:2px;\n}\n\n.join-row{\n    display:flex;\n    gap:7px;\n}\n\n.join-input{\n    flex:1;\n    min-width:0;\n    border:2px solid #b68ccf;\n    background:white;\n    color:#593276;\n    border-radius:11px;\n    padding:9px;\n    font-size:15px;\n    font-weight:1000;\n    text-transform:uppercase;\n    outline:none;\n}\n\n.join-btn,\n.copy-btn{\n    border:0;\n    border-radius:11px;\n    padding:9px 15px;\n    background:#7540a4;\n    color:white;\n    font-size:11px;\n    font-weight:1000;\n}\n\n.connection-status{\n    min-height:18px;\n    margin-top:7px;\n    text-align:center;\n    color:#765b89;\n    font-size:11px;\n}\n\n/* GAME */\n\n#gameScreen{\n    padding:8px;\n    gap:6px;\n}\n\n.game-top{\n    display:grid;\n    grid-template-columns:auto 1fr auto auto;\n    align-items:center;\n    gap:7px;\n}\n\n.turn-label{\n    color:#663493;\n    font-size:12px;\n    font-weight:1000;\n}\n\n.center-status{\n    text-align:center;\n    color:#7c6290;\n    font-size:10px;\n}\n\n.center-status strong{\n    color:#6c349a;\n    font-size:17px;\n}\n\n.game-btn{\n    border:2px solid #b289cd;\n    background:#eadcf7;\n    color:#66358f;\n    border-radius:10px;\n
