"screen\"\n>\n\n    <div class=\"home-icon\">\n        🧩\n    <\/div>\n\n    <h1 class=\"home-title\">\n        2048 REMIX\n    <\/h1>\n\n    <p class=\"home-text\">\n        Combineer dezelfde getallen, maak steeds grotere tegels\n        en probeer de legendarische 2048 te bereiken!\n    <\/p>\n\n\n    <div class=\"feature-row\">\n\n        <div class=\"feature\">\n            🧩 SAMENVOEGEN\n        <\/div>\n\n        <div class=\"feature\">\n            🧠 STRATEGIE\n        <\/div>\n\n        <div class=\"feature\">\n            🔥 COMBO'S\n        <\/div>\n\n        <div class=\"feature\">\n            🏆 RECORDS\n        <\/div>\n\n    <\/div>\n\n\n    <div class=\"info-card\">\n\n        <b>Hoe speel je?<\/b><br>\n\n        Veeg op je gsm naar links, rechts, boven of beneden.\n        Op de computer kun je de pijltjestoetsen gebruiken.\n        Twee gelijke tegels worden één grotere tegel.\n\n    <\/div>\n\n\n    <button\n        id=\"startBtn\"\n        class=\"start-main\"\n    >\n        START GAME 🚀\n    <\/button>\n\n<\/section>\n\n\n<!-- =====================================================\n     GAME\n===================================================== -->\n\n<section\n    id=\"gameScreen\"\n    class=\"screen hidden\"\n>\n\n    <div class=\"game-top\">\n\n        <div\n            id=\"roundInfo\"\n            class=\"round-info\"\n        >\n            TEGEL 2\n        <\/div>\n\n\n        <div class=\"center-info\">\n\n            SCORE:\n            <strong id=\"gameScore\">\n                0\n            <\/strong>\n\n        <\/div>\n\n\n        <button\n            id=\"undoBtn\"\n            class=\"game-btn\"\n        >\n            ↩ UNDO\n        <\/button>\n\n\n        <button\n            id=\"homeBtn\"\n            class=\"game-btn\"\n        >\n            🏠 HOME\n        <\/button>\n\n    <\/div>\n\n\n    <div class=\"remix-box\">\n\n        <span>\n            🩷 <strong>REMIX MODE<\/strong>\n        <\/span>\n\n        <span>\n            HOOGSTE:\n            <strong id=\"highestTile\">\n                0\n            <\/strong>\n        <\/span>\n\n        <span>\n            ZETTEN:\n            <strong id=\"moves\">\n                0\n            <\/strong>\n        <\/span>\n\n    <\/div>\n\n\n    <div class=\"board-wrap\">\n\n        <div\n            id=\"board\"\n            class=\"board\"\n        >\n        <\/div>\n\n    <\/div>\n\n\n    <div class=\"bottom\">\n\n        <span>\n            🎯 DOEL:\n            <b>2048<\/b>\n        <\/span>\n\n        <span>\n            🏆 BEST:\n            <b id=\"bottomBest\">\n                0\n            <\/b>\n        <\/span>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =====================================================\n     RESULT\n===================================================== -->\n\n<div\n    id=\"resultOverlay\"\n    class=\"overlay hidden\"\n>\n\n    <div class=\"overlay-card\">\n\n        <div\n            id=\"resultIcon\"\n            class=\"overlay-icon\"\n        >\n            🧩\n        <\/div>\n\n\n        <div\n            id=\"resultTitle\"\n            class=\"overlay-title\"\n        >\n            GAME OVER\n        <\/div>\n\n\n        <div\n            id=\"resultScore\"\n            class=\"overlay-score\"\n        >\n            0\n        <\/div>\n\n\n        <div\n            id=\"resultText\"\n            class=\"overlay-text\"\n        >\n        <\/div>\n\n\n        <div class=\"overlay-buttons\">\n\n            <button\n                id=\"againBtn\"\n                class=\"start-main\"\n            >\n                🔄 OPNIEUW\n            <\/button>\n\n\n            <button\n                id=\"resultHomeBtn\"\n                class=\"overlay-home\"\n            >\n                🏠 TERUG NAAR HOME\n            <\/button>\n\n        <\/div>\n\n    <\/div>\n\n<\/div>\n\n\n<!-- =====================================================\n     PAUSE\n===================================================== -->\n\n<div\n    id=\"pauseOverlay\"\n    class=\"overlay hidden\"\n>\n\n    <div class=\"overlay-card pause-card\">\n\n        <div class=\"overlay-icon\">\n            ⏸️\n        <\/div>\n\n        <div class=\"overlay-title\">\n            PAUZE\n        <\/div>\n\n        <div class=\"overlay-text\">\n            Je spel staat tijdelijk stil.\n        <\/div>\n\n        <button\n            id=\"resumeBtn\"\n            class=\"start-main\"\n        >\n            ▶ VERDER\n        <\/button>\n\n    <\/div>\n\n<\/div>\n\n\n<div\n    id=\"toast\"\n    class=\"toast\"\n>\n<\/div>\n\n\n<\/div>\n<\/div>\n\n\n<script>\n\"use strict\";\n\n\n/* =====================================================\n   ELEMENTEN\n===================================================== */\n\nconst homeScreen =\n    document.getElementById(\"homeScreen\");\n\nconst gameScreen =\n    document.getElementById(\"gameScreen\");\n\nconst startBtn =\n    document.getElementById(\"startBtn\");\n\nconst homeBtn =\n    document.getElementById(\"homeBtn\");\n\nconst againBtn =\n    document.getElementById(\"againBtn\");\n\nconst resultHomeBtn =\n    document.getElementById(\"resultHomeBtn\");\n\nconst resultOverlay =\n    document.getElementById(\"resultOverlay\");\n\nconst resultIcon =\n    document.getElementById(\"resultIcon\");\n\nconst resultTitle =\n    document.getElementById(\"resultTitle\");\n\nconst resultScore =\n    document.getElementById(\"resultScore\");\n\nconst resultText =\n    document.getElementById(\"resultText\");\n\nconst pauseOverlay =\n    document.getElementById(\"pauseOverlay\");\n\nconst boardEl =\n    document.getElementById(\"board\");\n\nconst gameScore =\n    document.getElementById(\"gameScore\");\n\nconst headerScore =\n    document.getElementById(\"headerScore\");\n\nconst bestScoreEl =\n    document.getElementById(\"bestScore\");\n\nconst bottomBest =\n    document.getElementById(\"bottomBest\");\n\nconst highestTileEl =\n    document.getElementById(\"highestTile\");\n\nconst movesEl =\n    document.getElementById(\"moves\");\n\nconst roundInfo =\n    document.getElementById(\"roundInfo\");\n\nconst undoBtn =\n    document.getElementById(\"undoBtn\");\n\nconst resumeBtn =\n    document.getElementById(\"resumeBtn\");\n\nconst toast =\n    document.getElementById(\"toast\");\n\n\n/* =====================================================\n   GAME\n===================================================== */\n\nconst SIZE = 4;\n\nlet board = [];\nlet score = 0;\nlet moves = 0;\n\nlet gameRunning = false;\nlet paused = false;\n\nlet highestTile = 0;\n\nlet previousBoard = null;\nlet previousScore = 0;\nlet previousMoves = 0;\n\n\nlet bestScore =\n    Number(\n        localStorage.getItem(\n            \"2048RemixBest\"\n        )\n    ) || 0;\n\n\nbestScoreEl.textContent =\n    bestScore;\n\nbottomBest.textContent =\n    bestScore;\n\n\n/* =====================================================\n   START\n===================================================== */\n\nstartBtn.addEventListener(\n    \"click\",\n    startGame\n);\n\n\nfunction startGame(){\n\n    board =\n        Array(SIZE)\n        .fill(null)\n        .map(() =>\n            Array(SIZE).fill(0)\n        );\n\n\n    score = 0;\n    moves = 0;\n\n    highestTile = 0;\n\n    previousBoard = null;\n    previousScore = 0;\n    previousMoves = 0;\n\n    gameRunning = true;\n    paused = false;\n\n\n    homeScreen.classList.add(\n        \"hidden\"\n    );\n\n    gameScreen.classList.remove(\n        \"hidden\"\n    );\n\n    resultOverlay.classList.add(\n        \"hidden\"\n    );\n\n    pauseOverlay.classList.add(\n        \"hidden\"\n    );\n\n\n    addRandomTile();\n    addRandomTile();\n\n    render();\n\n}\n\n\n/* =====================================================\n   RANDOM TILE\n===================================================== */\n\nfunction addRandomTile(){\n\n    const empty = [];\n\n\n    for(let r = 0; r < SIZE; r++){\n\n        for(let c = 0; c < SIZE; c++){\n\n            if(board[r][c] === 0){\n\n                empty.push({\n                    r:r,\n                    c:c\n                });\n\n            }\n\n        }\n\n    }\n\n\n    if(empty.length === 0)\n        return;\n\n\n    const pos =\n        empty[\n            Math.floor(\n                Math.random() * empty.length\n            )\n        ];\n\n\n    /*\n       Meestal 2.\n       Soms 4.\n    */\n\n    board[pos.r][pos.c] =\n        Math.random() < 0.9\n        ? 2\n        : 4;\n\n}\n\n\n/* =====================================================\n   RENDER\n===================================================== */\n\nfunction render(){\n\n    boardEl.innerHTML = \"\";\n\n\n    highestTile = 0;\n\n\n    for(let r = 0; r < SIZE; r++){\n\n        for(let c = 0; c < SIZE; c++){\n\n            const cell =\n                document.createElement(\n                    \"div\"\n                );\n\n            cell.className =\n                \"cell\";\n\n\n            const value =\n                board[r][c];\n\n\n            if(value > 0){\n\n                highestTile =\n                    Math.max(\n                        highestTile,\n                        value\n                    );\n\n\n                const tile =\n                    document.createElement(\n                        \"div\"\n                    );\n\n\n                tile.className =\n                    \"tile tile-\" + value;\n\n\n                if(\n                    value !== 2 &&\n                    value !== 4 &&\n                    value !== 8 &&\n                    value !== 16 &&\n                    value !== 32 &&\n                    value !== 64 &&\n                    value !== 128 &&\n                    value !== 256 &&\n                    value !== 512 &&\n                    value !== 1024 &&\n                    value !== 2048\n                ){\n\n                    tile.style.background =\n                        \"#7b2723\";\n\n                    tile.style.color =\n                        \"white\";\n\n                }\n\n\n                tile.textContent =\n                    value;\n\n\n                cell.appendChild(\n                    tile\n                );\n\n            }\n\n\n            boardEl.appendChild(\n                cell\n            );\n\n        }\n\n    }\n\n\n    gameScore.textContent =\n        score;\n\n    headerScore.textContent =\n        score;\n\n    highestTileEl.textContent =\n        highestTile;\n\n    movesEl.textContent =\n        moves;\n\n    bottomBest.textContent =\n        bestScore;\n\n\n    roundInfo.textContent =\n        \"HOOGSTE TEGEL: \" +\n        highestTile;\n\n\n    undoBtn.disabled =\n        previousBoard === null;\n\n\n    if(score > bestScore){\n\n        bestScore = score;\n\n        localStorage.setItem(\n            \"2048RemixBest\",\n            bestScore\n        );\n\n        bestScoreEl.textContent =\n            bestScore;\n\n        bottomBest.textContent =\n            bestScore;\n\n    }\n\n}\n\n\n/* =====================================================\n   MOVE\n===================================================== */\n\nfunction move(direction){\n\n    if(\n        !gameRunning ||\n        paused\n    )\n        return;\n\n\n    savePreviousState();\n\n\n    let moved = false;\n\n\n    if(direction === \"left\"){\n\n        for(let r = 0; r < SIZE; r++){\n\n            const result =\n                mergeLine(\n                    board[r]\n                );\n\n\n            board[r] =\n                result.line;\n\n            if(result.moved)\n                moved = true;\n\n            score +=\n                result.score;\n\n        }\n\n    }\n\n\n    if(direction === \"right\"){\n\n        for(let r = 0; r < SIZE; r++){\n\n            const reversed =\n                [...board[r]].reverse();\n\n\n            const result =\n                mergeLine(\n                    reversed\n                );\n\n\n            board[r] =\n                result.line.reverse();\n\n            if(result.moved)\n                moved = true;\n\n            score +=\n                result.score;\n\n        }\n\n    }\n\n\n    if(direction === \"up\"){\n\n        for(let c = 0; c < SIZE; c++){\n\n            const line = [];\n\n            for(let r = 0; r < SIZE; r++){\n\n                line.push(\n                    board[r][c]\n                );\n\n            }\n\n\n            const result =\n                mergeLine(line);\n\n\n            for(let r = 0; r < SIZE; r++){\n\n                board[r][c] =\n                    result.line[r];\n\n            }\n\n\n            if(result.moved)\n                moved = true;\n\n            score +=\n                result.score;\n\n        }\n\n    }\n\n\n    if(direction === \"down\"){\n\n        for(let c = 0; c < SIZE; c++){\n\n            let line = [];\n\n            for(let r = 0; r < SIZE; r++){\n\n                line.push(\n                    board[r][c]\n                );\n\n            }\n\n\n            line =\n                line.reverse();\n\n\n            const result =\n                mergeLine(line);\n\n\n            result.line =\n                result.line.reverse();\n\n\n            for(let r = 0; r < SIZE; r++){\n\n                board[r][c] =\n                    result.line[r];\n\n            }\n\n\n            if(result.moved)\n                moved = true;\n\n            score +=\n                result.score;\n\n        }\n\n    }\n\n\n    if(!moved){\n\n        previousBoard = null;\n\n        previousScore = score;\n        previousMoves = moves;\n\n        render();\n\n\n        if(!canMove()){\n\n            endGame();\n\n        }\n\n        return;\n\n    }\n\n\n    moves++;\n\n    addRandomTile();\n\n    render();\n\n\n    if(\n        highestTile >= 2048\n    ){\n\n        winGame();\n\n        return;\n\n    }\n\n\n    if(!canMove()){\n\n        endGame();\n\n    }\n\n}\n\n\n/* =====================================================\n   MERGE LINE\n===================================================== */\n\nfunction mergeLine(line){\n\n    const filtered =\n        line.filter(\n            value => value !== 0\n        );\n\n\n    let result = [];\n    let gained = 0;\n    let moved = false;\n\n\n    for(\n        let i = 0;\n        i < filtered.length;\n        i++\n    ){\n\n        if(\n            i < filtered.length - 1 &&\n            filtered[i] === filtered[i + 1]\n        ){\n\n            const merged =\n                filtered[i] * 2;\n\n\n            result.push(\n                merged\n            );\n\n\n            gained +=\n                merged;\n\n\n            i++;\n\n            moved = true;\n\n        }\n        else{\n\n            result.push(\n                filtered[i]\n            );\n\n        }\n\n    }\n\n\n    while(\n        result.length < SIZE\n    ){\n\n        result.push(0);\n\n    }\n\n\n    if(\n        JSON.stringify(result) !==\n        JSON.stringify(line)\n    ){\n\n        moved = true;\n\n    }\n\n\n    return {\n        line:result,\n        score:gained,\n        moved:moved\n    };\n\n}\n\n\n/* =====================================================\n   KAN BEWEGEN?\n===================================================== */\n\nfunction canMove(){\n\n    for(let r = 0; r < SIZE; r++){\n\n        for(let c = 0; c < SIZE; c++){\n\n            if(board[r][c] === 0)\n                return true;\n\n\n            if(\n                c < SIZE - 1 &&\n                board[r][c] === board[r][c + 1]\n            ){\n\n                return true;\n\n            }\n\n\n            if(\n                r < SIZE - 1 &&\n                board[r][c] === board[r + 1][c]\n            ){\n\n                return true;\n\n            }\n\n        }\n\n    }\n\n\n    return false;\n\n}\n\n\n/* =====================================================\n   UNDO\n===================================================== */\n\nfunction savePreviousState(){\n\n    previousBoard =\n        board.map(\n            row => [...row]\n        );\n\n    previousScore =\n        score;\n\n    previousMoves =\n        moves;\n\n}\n\n\nundoBtn.addEventListener(\n    \"click\",\n    undoMove\n);\n\n\nfunction undoMove(){\n\n    if(\n        previousBoard === null ||\n        !gameRunning\n    )\n        return;\n\n\n    board =\n        previousBoard.map(\n            row => [...row]\n        );\n\n\n    score =\n        previousScore;\n\n\n    moves =\n        previousMoves;\n\n\n    previousBoard = null;\n\n    render();\n\n    showToast(\n        \"Zet teruggedraaid ↩\"\n    );\n\n}\n\n\n/* =====================================================\n   WIN\n===================================================== */\n\nfunction winGame(){\n\n    gameRunning = false;\n\n    resultIcon.textContent =\n        \"👑\";\n\n    resultTitle.textContent =\n        \"2048 GEHAALD!\";\n\n    resultScore.textContent =\n        score;\n\n    resultText.textContent =\n        `Je bereikte 2048 in ${moves} zetten.`;\n\n    resultOverlay.classList.remove(\n        \"hidden\"\n    );\n\n}\n\n\n/* =====================================================\n   GAME OVER\n===================================================== */\n\nfunction endGame(){\n\n    gameRunning = false;\n\n    resultIcon.textContent =\n        \"💥\";\n\n    resultTitle.textContent =\n        \"GEEN ZETTEN MEER!\";\n\n    resultScore.textContent =\n        score;\n\n    resultText.textContent =\n        `Je hoogste tegel was ${highestTile}.`;\n\n    resultOverlay.classList.remove(\n        \"hidden\"\n    );\n\n}\n\n\n/* =====================================================\n   OPNIEUW\n===================================================== */\n\nagainBtn.addEventListener(\n    \"click\",\n    startGame\n);\n\n\n/* =====================================================\n   HOME\n===================================================== */\n\nhomeBtn.addEventListener(\n    \"click\",\n    goHome\n);\n\n\nresultHomeBtn.addEventListener(\n    \"click\",\n    goHome\n);\n\n\nfunction goHome(){\n\n    gameRunning = false;\n    paused = false;\n\n    resultOverlay.classList.add(\n        \"hidden\"\n    );\n\n    pauseOverlay.classList.add(\n        \"hidden\"\n    );\n\n    gameScreen.classList.add(\n        \"hidden\"\n    );\n\n    homeScreen.classList.remove(\n        \"hidden\"\n    );\n\n}\n\n\n/* =====================================================\n   PAUZE\n===================================================== */\n\nconst pauseButton =\n    document.createElement(\"button\");\n\npauseButton.className =\n    \"game-btn\";\n\npauseButton.textContent =\n    \"⏸️ PAUZE\";\n\npauseButton.addEventListener(\n    \"click\",\n    () => {\n\n        if(!gameRunning)\n            return;\n\n        paused = true;\n\n        pauseOverlay.classList.remove(\n            \"hidden\"\n        );\n\n    }\n);\n\n\n/*\n   Plaats de pauzeknop in het\n   spel automatisch.\n*/\n\nconst gameTop =\n    document.querySelector(\n        \".game-top\"\n    );\n\ngameTop.insertBefore(\n    pauseButton,\n    homeBtn\n);\n\n\nresumeBtn.addEventListener(\n    \"click\",\n    () => {\n\n        paused = false;\n\n        pauseOverlay.classList.add(\n            \"hidden\"\n        );\n\n    }\n);\n\n\n/* =====================================================\n   TOETSENBORD\n===================================================== */\n\ndocument.addEventListener(\n    \"keydown\",\n    event => {\n\n        if(\n            !gameRunning ||\n            paused\n        )\n            return;\n\n\n        const key =\n            event.key;\n\n\n        if(\n            [\n                \"ArrowLeft\",\n                \"ArrowRight\",\n                \"ArrowUp\",\n                \"ArrowDown\"\n            ].includes(key)\n        ){\n\n            event.preventDefault();\n\n        }\n\n\n        if(key === \"ArrowLeft\"){\n            move(\"left\");\n        }\n\n        else if(key === \"ArrowRight\"){\n            move(\"right\");\n        }\n\n        else if(key === \"ArrowUp\"){\n            move(\"up\");\n        }\n\n        else if(key === \"ArrowDown\"){\n            move(\"down\");\n        }\n\n    }\n);\n\n\n/* =====================================================\n   SWIPE\n===================================================== */\n\nlet touchStartX = 0;\nlet touchStartY = 0;\n\nboardEl.addEventListener(\n    \"touchstart\",\n    event => {\n\n        const touch =\n            event.changedTouches[0];\n\n        touchStartX =\n            touch.clientX;\n\n        touchStartY =\n            touch.clientY;\n\n    },\n    {\n        passive:true\n    }\n);\n\n\nboardEl.addEventListener(\n    \"touchend\",\n    event => {\n\n        if(\n            !gameRunning ||\n            paused\n        )\n            return;\n\n\n        const touch =\n            event.changedTouches[0];\n\n\n        const dx =\n            touch.clientX -\n            touchStartX;\n\n\n        const dy =\n            touch.clientY -\n            touchStartY;\n\n\n        const absX =\n            Math.abs(dx);\n\n        const absY =\n            Math.abs(dy);\n\n\n        if(\n            Math.max(absX,absY) < 25\n        )\n            return;\n\n\n        if(absX > absY){\n\n            if(dx > 0){\n                move(\"right\");\n            }\n            else{\n                move(\"left\");\n            }\n\n        }\n        else{\n\n            if(dy > 0){\n                move(\"down\");\n            }\n            else{\n                move(\"up\");\n            }\n\n        }\n\n    },\n    {\n        passive:true\n    }\n);\n\n\n/* =====================================================\n   TOAST\n===================================================== */\n\nlet toastTimer = null;\n\n\nfunction showToast(message){\n\n    toast.textContent =\n        message;\n\n    toast.classList.add(\n        \"show\"\n    );\n\n\n    clearTimeout(\n        toastTimer\n    );\n\n\n    toastTimer =\n        setTimeout(\n            () => {\n\n                toast.classList.remove(\n                    \"show\"\n                );\n\n            },\n            1800\n        );\n\n}\n\n\n/* =====================================================\n   GEEN SCROLL\n===================================================== */\n\ndocument.addEventListener(\n    \"touchmove\",\n    event => {\n\n        if(\n            event.target.closest(\".board\")\n        ){\n\n            return;\n\n        }\n\n        event.preventDefault();\n\n    },\n    {\n        passive:false\n    }\n);\n\n<\/script>\n\n<\/body>\n<\/html>",
"blockdrop": "<!DOCTYPE html> <html lang=\"nl\"> <head><script>try{localStorage.getItem(\"x\")}catch(e){var _m={};Object.defineProperty(window,\"localStorage\",{value:{getItem:function(k){return k in _m?_m[k]:null},setItem:function(k,v){_m[k]=String(v)},removeItem:function(k){delete _m[k]}}})}<\/script> <meta charset=\"UTF-8\"> <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no\"> <title>BLOCK DROP 🧱<\/title>  <style> *{box-sizing:border-box}  html,body{   margin:0;   width:100%;   height:100%;   overflow:hidden; }  body{   background:     radial-gradient(circle at top,#0f132c 0%,#151b40 42%,#202961 100%);   color:#8a77d7;   font-family:Arial,sans-serif;   display:flex;   justify-content:center;   align-items:center;   padding:8px;   overscroll-behavior:none; }  .app{   width:min(850px,100%);   height:100%;   max-height:900px;   display:flex;   flex-direction:column;   justify-content:center;   background:rgba(12,15,36,0.94);   border:2px solid #0f111a;   border-radius:20px;   padding:clamp(7px,1.7vh,16px);   overflow:hidden;   gap:clamp(5px,1vh,10px);   box-shadow:0 12px 40px rgba(50,145,180,.22); }  header{   display:flex;   justify-content:space-between;   align-items:center;   gap:8px;   flex-shrink:0; }  h1{   margin:0;   font-size:clamp(20px,3.5vh,34px);   color:#8470d6; }  h1 span{   color:#4525c4; }  .tag{   font-size:clamp(9px,1.5vh,12px);   background:#111532;   color:#ffffff;   border:1px solid #1e265b;   border-radius:30px;   padding:7px;   font-weight:bold; }  .layout{   display:grid;   grid-template-columns:minmax(0,1fr) 145px;   gap:10px;   align-items:stretch;   justify-content:center;   min-height:0;   flex:1; }  .board-wrap{   position:relative;   min-width:0;   min-height:0;   display:flex;   align-items:center;   justify-content:center;   background:#0e122b;   border:2px solid #301891;   border-radius:12px;   padding:4px;   overflow:hidden;   box-shadow:inset 0 0 25px rgba(75,190,225,.12); }  een topscore!   <\/p>    <button id=\"startBtn\">▶ START SPEL<\/button> <\/div>  <\/div>  <aside class=\"side\">  <div class=\"panel\">   <h2>SCORE<\/h2>   <div class=\"stat\" id=\"score\">0<\/div> <\/div>  <div class=\"panel\">   <h2>RECORD<\/h2>   <div class=\"stat\" id=\"best\">0<\/div> <\/div>  <div class=\"panel\">   <h2>LEVEL<\/h2>   <div class=\"stat\" id=\"level\">1<\/div> <\/div>  <div class=\"panel\">   <h2>RIJEN<\/h2>   <div class=\"stat\" id=\"lines\">0<\/div> <\/div>  <div class=\"panel\">   <h2>VOLGEND<\/h2>   <canvas id=\"next\" width=\"150\" height=\"90\"><\/canvas> <\/div>  <div class=\"buttons\">   <button class=\"secondary\" id=\"pauseBtn\">Ⅱ Pauze<\/button>   <button class=\"secondary\" id=\"restartBtn\">↻ Opnieuw<\/button>   <button class=\"secondary wide\" id=\"soundBtn\">🔊 Geluid<\/button> <\/div>  <\/aside>  <\/section>  <div class=\"controls\">  <button class=\"secondary\" data-a=\"left\">   ◀ <\/button>  <button class=\"secondary\" data-a=\"rotate\">   ⟳ <\/button>  <button class=\"secondary\" data-a=\"right\">   ▶ <\/button>  <button class=\"secondary\" data-a=\"down\">   ▼ <\/button>  <button class=\"drop\" data-a=\"drop\">   ⤓ <\/button>  <\/div>  <p class=\"hint\">   ← → bewegen · ↑ draaien · ↓ sneller · spatie = laten vallen · P = pauze <\/p>  <\/main>  <script> (()=>{  const COLS=10; const ROWS=20; const SIZE=30;  const COLORS={   I:\"#32c9e8\",   O:\"#ffd64a\",   T:\"#a983ef\",   S:\"#55d687\",   Z:\"#ff6d8e\",   J:\"#6092ed\",   L:\"#ffa65b\" };  const SHAPES={    I:[     [1,1,1,1]   ],    O:[     [1,1],     [1,1]   ],    T:[     [0,1,0],     [1,1,1]   ],    S:[     [0,1,1],     [1,1,0]   ],    Z:[     [1,1,0],     [0,1,1]   ],    J:[     [1,0,0],     [1,1,1]   ],    L:[     [0,0,1],     [1,1,1]   ] };  const canvas=document.getElementById(\"board\"); const ctx=canvas.getContext(\"2d\");  const nextCanvas=document.getElementById(\"next\"); const nctx=nextCanvas.getContext(\"2d\");  const $=id=>document.getElementById(id);  let grid .currentTime+duration     );      osc.stop(       audio.currentTime+duration     );    }catch(e){} }  function collides(   p,   dx=0,   dy=0,   shape=p.shape ){    for(     let y=0;     y<shape.length;     y++   ){      for(       let x=0;       x<shape[y].length;       x++     ){        if(!shape[y][x])         continue;        const nx=         p.x+x+dx;        const ny=         p.y+y+dy;        if(         nx<0||         nx>=COLS||         ny>=ROWS       )         return true;        if(         ny>=0&&         grid[ny][nx]       )         return true;     }   }    return false; }  function mergePiece(){    piece.shape.forEach(     (row,y)=>{        row.forEach(         (v,x)=>{            if(             v&&             piece.y+y>=0           ){              grid[               piece.y+y             ][               piece.x+x             ]=piece.type;           }         }       );     }   ); }  function clearRows(){    let cleared=0;    for(     let y=ROWS-1;     y>=0;     y--   ){      if(       grid[y].every(Boolean)     ){        grid.splice(y,1);        grid.unshift(         Array(COLS).fill(null)       );        cleared++;        y++;     }   }    if(cleared){      score+=       ([0,100,300,500,800][cleared]||800)       *level;      lines+=cleared;      level=       Math.floor(lines/10)+1;      dropInterval=       Math.max(         90,         850-(level-1)*65       );      beep(       cleared===4?880:620,       .12     );      stats();   } }  function spawnPiece(){    piece=makePiece(nextType);    nextType=randomType();    drawNext();    if(collides(piece))     endGame(); }  function lockPiece(){    mergePiece();    clearRows();    spawnPiece();    beep(180,.035); }  function move(dx,dy){    if(     !running||     paused||     over   )     return false;    if(     !collides(       piece,       dx,       dy     )   ){      piece.x+=dx;     piece.y+=dy;      draw();      return true;   }    if(dy>0)     lockPiece();    return false; }  function rotate(){ ize+3,     y*size+3,     size-6,     Math.max(       2,       size*.13     )   );    context.strokeStyle=     \"#ffffff70\";    context.strokeRect(     x*size+1.5,     y*size+1.5,     size-3,     size-3   );    context.globalAlpha=1; }  function draw(){    ctx.clearRect(     0,0,300,600   );    ctx.fillStyle=\"#171c3a\";    ctx.fillRect(     0,0,300,600   );    ctx.strokeStyle=\"#2b3266\";    ctx.lineWidth=1;    for(     let x=0;     x<=COLS;     x++   ){      ctx.beginPath();      ctx.moveTo(       x*SIZE,       0     );      ctx.lineTo(       x*SIZE,       600     );      ctx.stroke();   }    for(     let y=0;     y<=ROWS;     y++   ){      ctx.beginPath();      ctx.moveTo(       0,       y*SIZE     );      ctx.lineTo(       300,       y*SIZE     );      ctx.stroke();   }    if(!grid)     return;    for(     let y=0;     y<ROWS;     y++   ){      for(       let x=0;       x<COLS;       x++     ){        if(grid[y][x]){          drawCell(           ctx,           x,           y,           COLORS[grid[y][x]],           SIZE         );       }     }   }    if(piece){      let ghostY=piece.y;      while(       !collides(         {           ...piece,           y:ghostY         },         0,         1       )     ){        ghostY++;     }      piece.shape.forEach(       (row,y)=>{          row.forEach(           (v,x)=>{              if(               v&&               ghostY+y>=0             ){                drawCell(                 ctx,                 piece.x+x,                 ghostY+y,                 COLORS[piece.type],                 SIZE,                 .22               );             }           }         );       }     );      piece.shape.forEach(       (row,y)=>{          row.forEach(           (v,x)=>{              if(               v&&               piece.y+y>=0             ){                drawCell(                 ctx,                 piece.x+x,                 piece.y+y,                 COLORS[piece.type],                 SIZE               );             }           }         );       }     );   } }  function drawNext(){    nctx.clearRect(     0,0,150,90   );    nctx.fillStyle=\"#1b2144\";    nctx.fillRect(     0,0,150,90   );    if(!nextType)     return;    const shape=     SHAPES[nextType];    const s=20;    const ox=     (150-shape[0].length*s)/2;    const oy=     (90-shape.length*s)/2;    shape.forEach(     (row,y)=>{        row.forEach(         (v,x)=>{            if(!v)             return;            nctx.fillStyle=             COLORS[nextType];            nctx.fillRect(             ox+x*s+1,             oy+y*s+1,             s-3,             s-3           );            nctx.fillStyle=             \"#ffffff60\";            nctx.fillRect(             ox+x*s+3,             oy+y*s+3,             s-7,             3           );         }       );     }   ); }  function loop(time=0){    const delta=     time-lastTime;    lastTime=time;    if(     running&&     !paused&&     !over   ){      dropCounter+=delta;      if(       dropCounter>       dropInterval     ){        move(0,1);        dropCounter=0;     }   }    requestAnimationFrame(loop); }  function action(a){    if(a===\"left\")     move(-1,0);    if(a===\"right\")     move(1,0);    if(a===\"down\"){      if(move(0,1)){        score++;        stats();     }   }    if(a===\"rotate\")     rotate();    if(a===\"drop\")     hardDrop(); }  document.addEventListener(   \"keydown\",   e=>{      if([       \"ArrowLeft\",       \"ArrowRight\",       \"ArrowDown\",       \"ArrowUp\",       \" \"     ].includes(e.key)){        e.preventDefault();     }      if(e.key===\"ArrowLeft\")       action(\"left\");      else if(e.key===\"ArrowRight\")       action(\"right\");      else if(e.key===\"ArrowDown\")       action(\"down\");      else if(       e.key===\"ArrowUp\"||       e.key===\"x\"||       e.key===\"X\"     ){        action(\"rotate\");      }else if(e.key===\" \"){        hardDrop();      }else if(       e.key===\"p\"||       e.key===\"P\"     ){        t "reaction": "<!DOCTYPE html> \n<html lang=\"nl\"> \n<head><script>try{localStorage.getItem(\"x\")}catch(e){var _m={};Object.defineProperty(window,\"localStorage\",{value:{getItem:function(k){return k in _m?_m[k]:null},setItem:function(k,v){_m[k]=String(v)},removeItem:function(k){delete _m[k]}}})}<\/script> \n<meta charset=\"UTF-8\"> \n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\"> \n \n<title>REACTION RUSH 🌿<\/title> \n \n<style> \n*{ \n    box-sizing:border-box; \n    -webkit-tap-highlight-color:transparent; \n    user-select:none; \n} \n \nhtml,body{ \n    margin:0; \n    width:100%; \n    height:100%; \n    overflow:hidden; \n    font-family:Arial,Helvetica,sans-serif; \n} \n \nbody{ \n    background: \n        radial-gradient(circle at 12% 15%,#35247b 0%,transparent 28%), \n        radial-gradient(circle at 88% 85%,#9381da 0%,transparent 34%), \n        linear-gradient(135deg,#131730,#272c50,#674dcb); \n    color:#a2aadb; \n} \n \n.app{ \n    width:100%; \n    height:100%; \n    display:flex; \n    justify-content:center; \n    align-items:center; \n    padding:12px; \n} \n \n.game{ \n    width:min(1100px,100%); \n    height:min(780px,100%); \n    background:#0f132c; \n    border:3px solid #4b33ae; \n    border-radius:28px; \n    overflow:hidden; \n    box-shadow:0 22px 65px rgba(20,72,37,.28); \n    display:flex; \n    flex-direction:column; \n    position:relative; \n} \n \n/* HEADER */ \n \n.header{ \n    min-height:78px; \n    padding:12px 20px; \n    background:linear-gradient(135deg,#9482db,#684fcc); \n    color:#0f111a; \n    display:flex; \n    align-items:center; \n    justify-content:space-between; \n    gap:12px; \n} \n \n.logo{ \n    font-size:clamp(21px,4vw,34px); \n    font-weight:1000; \n    letter-spacing:1px; \n} \n \n.logo span{ \n    color:#1c224d; \n} \n \n.header-stats{ \n    display:flex; \n    gap:7px; \n} \n \n.stat{ \n    min-width:72px; \n    padding:7px 10px; \n    border-radius:13px; \n    background:rgba(13,17,40,0.13); \n    border:2px solid rgba(13,17,40,0.18); \n    text-align:center; \n} \n \n.stat small{ \n    display:block; \n    font-size:9px; \n    opacity:.8; \n} \n \n.stat strong{ \n    display:block; \n    font-size:18px; \n} \n \n/* SCHERMEN */ \n \n.screen{ \n    flex:1; \n    min-height:0; \n    display:flex; \n    flex-direction:column; \n} \n \n.hidden{ \n    display:none!important; \n} \n \n/* HOME */ \n \n#startScreen{ \n    justify-content:center; \n    align-items:center; \n    text-align:center; \n    padding:25px; \n} \n \n.start-icon{ \n    font-size:70px; \n    margin-bottom:4px; \n} \n \n.start-title{ \n    margin:0; \n    color:#917fda; \n    font-size:clamp(38px,7vw,65px); \n    font-weight:1000; \n} \n \n.start-text{ \n    max-width:650px; \n    margin:12px auto 20px; \n    color:#725acf; \n    line-height:1.5; \n    font-size:17px; \n} \n \n.features{ \n    display:flex; \n    justify-content:center; \n    gap:9px; \n    flex-wrap:wrap; \n    margin-bottom:19px; \n} \n \n.feature{ \n    background:#1a1e38; \n    border:2px solid #4831a7; \n    color:#8571d6; \n    padding:8px 12px; \n    border-radius:12px; \n    font-size:13px; \n    font-weight:800; \n} \n \n.difficulty{ \n    display:flex; \n    justify-content:center; \n    gap:9px; \n    flex-wrap:wrap; \n    margin-bottom:20px; \n} \n \n.diff-btn{ \n    border:2px solid #4b32ac; \n    background:#1a1e38; \n    color:#8874d7; \n    padding:10px 17px; \n    border-radius:13px; \n    font-weight:900; \n    cursor:pointer; \n    transition:.15s; \n} \n \n.diff-btn:hover{ \n    transform:translateY(-2px); \n} \n \n.diff-btn.active{ \n    background:#7760d1; \n    color:#0f111a; \n    transform:translateY(-2px); \n} \n \n.main-btn{ \n    border:0; \n    background:linear-gradient(135deg,#8874d7,#583cc6); \n    color:#0f111a; \n    padding:16px 40px; \n    border-radius:17px; \n    font-size:20px; \n    font-weight:1000; \n    cursor:pointer; \n    box-shadow:0 8px 22px rgba(39,101,57,.22); \n    transition:.15s; \n} \n \n.main-btn:hover{ \n    transform:translateY(-2px); \n} \n \n.main-btn:active{ \n    transform:scale(.97); \n} \n \n/* GAME */ \n \n#gameScreen{ \n    padding:14px; \n    gap:10px; \n} \n \n.game-top{ \n    display:grid; \n    grid-template-columns:auto 1fr auto; \n    align-items:center; \n    gap:12px; \n} \n \n.round-box{ \n    color:#8672d6; \n    font-weight:1000; \n    white-space:nowrap; \n} \n \n.level-box{ \n    text-align:center; \n    color:#7861d1; \n    font-size:14px; \n    font-weight:900; \n} \n \n.level-box span{ \n    color:#9280da; \n    font-size:18px; \n} \n \n.timer{ \n    height:11px; \n    background:#232846; \n    border-radius:20px; \n    overflow:hidden; \n} \n \n.timer-fill{ \n    width:100%; \n    height:100%; \n    background:linear-gradient(90deg,#8571d6,#462fa2); \n} \n \n.game-actions{ \n    display:flex; \n    gap:7px; \n} \n \n.action-btn{ \n    border:2px solid #4b32ae; \n    background:#1a1e38; \n    color:#8874d7; \n    border-radius:12px; \n    padding:8px 11px; \n    font-size:13px; \n    font-weight:900; \n    cursor:pointer; \n} \n \n.instruction{ \n    text-align:center; \n    color:#917fda; \n    font-size:clamp(19px,3vw,28px); \n    font-weight:1000; \n    margin:1px 0; \n} \n \n.combo{ \n    text-align:center; \n    min-height:24px; \n    font-weight:1000; \n    color:#6d55ce; \n    font-size:18px; \n} \n \n.combo.hot{ \n    color:#917fda; \n    animation:pulse .45s infinite alternate; \n} \n \n@keyframes pulse{ \n    from{transform:scale(1)} \n    to{transform:scale(1.06)} \n} \n \n/* GRID */ \n \n.grid{ \n    flex:1; \n    min-height:0; \n    display:grid; \n    grid-template-columns:repeat(3,1fr); \n    grid-template-rows:repeat(3,1fr); \n    gap:10px; \n    padding:3px; \n} \n \n.tile{ \n    border:0; \n    border-radius:17px; \n    background:#35247b; \n    box-shadow: \n        inset 0 -5px 0 rgba(23,80,40,.12), \n        0 5px 12px rgba(23,80,40,.10); \n    cursor:pointer; \n    transition:transform .09s,background .09s; \n} \n \n.tile:active{ \n    transform:scale(.94); \n} \n \n.tile.target{ \n    background:#72c38b; \n    box-shadow: \n        0 0 0 4px rgba(83,155,98,.25), \n        0 0 28px rgba(52,123,74,.38); \n    animation:targetPulse .8s infinite alternate; \n} \n \n@keyframes targetPulse{ \n    from{filter:brightness(1)} \n    to{filter:brightness(1.12)} \n} \n \n.tile.wrong{ \n    background:#88ce9f; \n    animation:shake .2s; \n} \n \n@keyframes shake{ \n    0%,100%{transform:translateX(0)} \n    25%{transform:translateX(-7px)} \n    75%{transform:translateX(7px)} \n} \n \n/* PAUZE */ \n \n.pause-overlay{ \n    position:absolute; \n    inset:0; \n    background:rgba(157,165,218,0.62); \n    display:flex; \n    align-items:center; \n    justify-content:center; \n    z-index:20; \n    backdrop-filter:blur(4px); \n} \n \n.pause-card{ \n    background:#0f132c; \n    border:3px solid #4b32ad; \n    border-radius:23px; \n    padding:28px; \n    width:min(360px,90%); \n    text-align:center; \n    box-shadow:0 20px 50px rgba(0,0,0,.2); \n} \n \n.pause-card h2{ \n    color:#917fda; \n    margin:0 0 8px; \n    font-size:34px; \n} \n \n.pause-card p{ \n    color:#6b53cd; \n    margin:0 0 20px; \n} \n \n/* RESULTAAT */ \n \n#resultScreen{ \n    justify-content:center; \n    align-items:center; \n    text-align:center; \n    padding:22px; \n} \n \n.result-icon{ \n    font-size:68px; \n} \n \n.result-title{ \n    color:#917fda; \n    font-size:clamp(38px,7vw,60px); \n    margin:3px 0; \n    font-weight:1000; \n} \n \n.result-score{ \n    color:#7760d1; \n    font-size:56px; \n    font-weight:1000; \n} \n \n.result-label{ \n    color:#6b53cd; \n    margin-top:-4px; \n    font-size:16px; \n} \n \n.result-stats{ \n    display:flex; \n    justify-content:center; \n    gap:9px; \n    flex-wrap:wrap; \n    margin:18px 0 23px; \n} \n \n.result-stat{ \n    background:#1a1e38; \n    border:2px solid #4831a7; \n    border-radius:14px; \n    padding:10px 14px; \n    min-width:120px; \n} \n \n.result-stat span{ \n    display:block; \n    color:#666ea3; \n    font-size:11px; \n} \n \n.result-stat strong{ \n    display:block; \n    color:#8874d7; \n    font-size:20px; \n    margin-top:2px; \n} \n \n.result-buttons{ \n    display:flex; \n    flex-direction:column; \n    align-items:center; \n    gap:10px; \n} \n \n.home-btn{ \n    border:2px solid #5338c0; \n    background:#1a1e38; \n    color:#8874d7; \n    padding:13px 31px; \n    border-radius:15px; \n    font-size:17px; \n    font-weight:1000; \n    cursor:pointer; \n} \n \n.home-btn:hover{ \n    background:#222746; \n} \n \n/* EFFECT */ \n \n.feedback{ \n    position:absolute; \n    inset:0; \n    pointer-events:none; \n    opacity:0; \n    z-index:10; \n} \n \n.feedback.good{ \n    animation:good .28s; \n} \n \n.feedback.bad{ \n    animation:bad .28s; \n} \n \n@keyframes good{ \n    0%{background:rgba(59,36,153,0.0)} \n    35%{background:rgba(59,36,153,0.18)} \n    100%{background:rgba(59,36,153,0.0)} \n} \n \n@keyframes bad{ \n    0%{background:rgba(148,130,219,0.0)} \n    35%{background:rgba(148,130,219,0.18)} \n    100%{background:rgba(148,130,219,0.0)} \n} \n \n/* MOBIEL */ \n \n@media(max-width:650px){ \n \n    .app{ \n        padding:6px; \n    } \n \n    .game{ \n        border-radius:20px; \n    } \n \n    .header{ \n        min-height:63px; \n        padding:8px 11px; \n    } \n \n    .logo{ \n        font-size:20px; \n    } \n \n    .stat{ \n        min-width:49px; \n        padding:5px 6px; \n    } \n \n    .stat strong{ \n        font-size:15px; \n    } \n \n    .stat small{ \n        font-size:7px; \n    } \n \n    #startScreen{ \n        padding:17px; \n    } \n \n    .start-icon{ \n        font-size:52px; \n    } \n \n    .start-text{ \n        font-size:14px; \n        margin:8px auto 14px; \n    } \n \n    .features{ \n        gap:6px; \n        margin-bottom:13px; \n    } \n \n    .feature{ \n        padding
