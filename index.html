\/div> \n \n<div id=\"guestWaitingText\" class=\"waiting-text\"> \nJe bent verbonden met speler 1.<br> \nWacht tot speler 1 het spel start. \n<\/div> \n \n<div style=\" \nmargin-top:15px; \ncolor:#d93670; \nfont-size:13px; \nfont-weight:1000;\"> \n🟢 Verbonden \n<\/div> \n \n<\/div> \n \n<\/div> \n \n<\/div> \n<\/section> \n \n \n<\u0021-- THEMA --> \n<section id=\"screen-theme\" class=\"screen\"> \n<div class=\"inner\"> \n \n<div class=\"topbar\"> \n \n<button class=\"back\" onclick=\"previousFromTheme()\"> \n← Terug \n<\/button> \n \n<div class=\"page-title\"> \nKies je thema 🎨 \n<\/div> \n \n<div><\/div> \n \n<\/div> \n \n<div class=\"theme-area\"> \n<div id=\"themeGrid\" class=\"grid\"><\/div> \n<\/div> \n \n<div class=\"bottom\"> \n<button class=\"primary\" onclick=\"continueTheme()\"> \nVerder → \n<\/button> \n<\/div> \n \n<\/div> \n<\/section> \n \n \n<\u0021-- SETTINGS --> \n<section id=\"screen-settings\" class=\"screen\"> \n<div class=\"inner\"> \n \n<div class=\"topbar\"> \n \n<button class=\"back\" onclick=\"previousFromSettings()\"> \n← Terug \n<\/button> \n \n<div class=\"page-title\"> \nInstellingen ⚙️ \n<\/div> \n \n<div><\/div> \n \n<\/div> \n \n<div class=\"center\"> \n \n<div class=\"card\"> \n \n<div class=\"setting\"> \n \n<div class=\"setting-title\">👗 Kleding<\/div> \n \n<div class=\"options\"> \n \n<button id=\"outfit-girls\" class=\"option\" onclick=\"setOutfit('girls')\"> \n👧 Meisjes \n<\/button> \n \n<button id=\"outfit-boys\" class=\"option\" onclick=\"setOutfit('boys')\"> \n👦 Jongens \n<\/button> \n \n<button id=\"outfit-mixed\" class=\"option\" onclick=\"setOutfit('mixed')\"> \n🌈 Gemengd \n<\/button> \n \n<\/div> \n<\/div> \n \n \n<div class=\"setting\"> \n \n<div class=\"setting-title\">🍕 Eten<\/div> \n \n<div class=\"options\"> \n \n<button id=\"food-veg\" class=\"option\" onclick=\"setFood('veg')\"> \n🥦 Vegetarisch \n<\/button> \n \n<button id=\"food-nonveg\" class=\"option\" onclick=\"setFood('nonveg')\"> \n🍖 Niet vegetarisch \n<\/button> \n \n<button id=\"food-mixed\" class=\"option\" onclick=\"setFood('mixed')\"> \n🍽️ Gemengd \n<\/button> \n \n<\/div> \n<\/div> \n \n \n<div class=\"setting\"> \n \n<div class=\"setting-title\">🤖 Computercommentaar<\/div> \n \n<div class=\"options\"> \n \n<button id=\"comment-on\" class=\"option\" onclick=\"setCommentary(true)\"> \n💬 Aan \n<\/button> \n \n<button id=\"comment-off\" class=\"option\" onclick=\"setCommentary(false)\"> \n🔇 Uit \n<\/button> \n \n<\/div> \n<\/div> \n \n<\/div> \n<\/div> \n \n<div class=\"bottom\"> \n \n<button \nid=\"startGameButton\" \nclass=\"primary\" \nonclick=\"startGameFromSettings()\"> \n🚀 Start het spel \n<\/button> \n \n<\/div> \n \n<\/div> \n<\/section> \n \n \n<\u0021-- UITLEG --> \n<section id=\"screen-explanation\" class=\"screen\"> \n<div class=\"inner\"> \n \n<div class=\"topbar\"> \n \n<button class=\"back\" onclick=\"returnHome()\"> \n← Terug \n<\/button> \n \n<div class=\"page-title\"> \nUitleg 📖 \n<\/div> \n \n<div><\/div> \n \n<\/div> \n \n<div class=\"center\"> \n \n<div class=\"card\"> \n \n<div class=\"rule\"> \n<div class=\"rule-icon\">💰<\/div> \n<div> \n<strong>Iedereen begint met €20<\/strong> \n<span>Beide spelers hebben hun eigen budget.<\/span> \n<\/div> \n<\/div> \n \n<div class=\"rule\"> \n<div class=\"rule-icon\">🎁<\/div> \n<div> \n<strong>Er verschijnt één item<\/strong> \n<span>Bijvoorbeeld een gigantische woonkamer.<\/span> \n<\/div> \n<\/div> \n \n<div class=\"rule\"> \n<div class=\"rule-icon\">🔄<\/div> \n<div> \n<strong>Om de beurt bieden<\/strong> \n<span>Speler 1 → speler 2 → speler 1 → speler 2.<\/span> \n<\/div> \n<\/div> \n \n<div class=\"rule\"> \n<div class=\"rule-icon\">📡<\/div> \n<div> \n<strong>Online wordt alles gesynchroniseerd<\/strong> \n<span>Iedere bieding verschijnt op beide schermen.<\/span> \n<\/div> \n<\/div> \n \n<div class=\"rule\"> \n<div class=\"rule-icon\">💸<\/div> \n<div> \n<strong>Alleen de winnaar betaalt<\/strong> \n<span>Het bedrag wordt pas afgetrokken wanneer de veiling eindigt.<\/span> \n<\/div> \n<\/div> \n \n<div class=\"rule\"> \n<div class=\"rule-icon\">🏆<\/div> \n<div> \n<strong>Verzamel je items<\/strong> \n<span>Aan het einde zie je jouw collectie.<\/span> \n<\/div> \n<\/div> \n \n<\/div> \n \n<\/div> \n<\/div> \n<\/section> \n \n \n<\u0021-- GAME --> \n<section id=\"screen-game\" class=\"screen game\"> \n \n<div class=\"game-layout\"> \n \n<div class=\"game-header\"> \n \n<div class=\"money-box\"> \n<div class=\"name\">👤 Speler 1<\/div> \n<div id=\"p1Money\" class=\"money\">€20<\/div> \n<\/div> \n \n<div class=\"round\"> \n<div id=\"gameThemeName\">DROOMHUIS<\/div> \n<div id=\"roundText\">1 / 6<\/div> \n<\/div> \n \n<div class=\"money-box right\"> \n<div class=\"name\">👤 Speler 2<\/div> \n<div id=\"p2Money\" class=\"money\">€20<\/div> \n<\/div> \n \n<\/div> \n \n \n<div class=\"auction\"> \n \n<div class=\"collection-panel\"> \n \n<div class=\"panel-title\"> \nSPELER 1 \n<\/div> \n \n<div id=\"collection1\" class=\"collection\"><\/div> \n \n<\/div> \n \n \n<div class=\"center-auction\"> \n \n<div class=\"item-card\"> \n \n<div id=\"itemIcon\" class=\"item-icon\"> \n🏠 \n<\/div> \n \n<div id=\"category\" class=\"category\"> \nDROOMHUIS \n<\/div> \n \n<div id=\"itemName\" class=\"item-name\"> \nGigantische woonkamer \n<\/div> \n \n<div id=\"bidInfo\" class=\"bid-info\"> \nNog geen bod \n<\/div> \n \n<div id=\"leader\" class=\"leader\"> \nSpeler 1 begint \n<\/div> \n \n<\/div> \n \n<div id=\"comment\" class=\"comment\"><\/div> \n \n<div class=\"bid-row\"> \n \n<input \nid=\"bidInput\" \nclass=\"bid-input\" \ntype=\"number\" \ninputmode=\"numeric\" \nmin=\"1\" \nplaceholder=\"€ bod\"> \n \n<button \nid=\"bidButton\" \nclass=\"bid-button\" \nonclick=\"makeBid()\"> \n💸 Bieden \n<\/button> \n \n<\/div> \n \n<button \nid=\"giveButton\" \nclass=\"give\" \nonclick=\"giveItem()\"> \n🤝 Ik geef het aan jou \n<\/button> \n \n<div id=\"turn\" class=\"turn\"> \nSpeler 1 is aan de beurt \n<\/div> \n \n<\/div> \n \n \n<div class=\"collection-panel\"> \n \n<div class=\"panel-title\"> \nSPELER 2 \n<\/div> \n \n<div id=\"collection2\" class=\"collection\"><\/div> \n \n<\/div> \n \n<\/div> \n \n<\/div> \n<\/section> \n \n \n<\u0021-- RESULT --> \n<section id=\"screen-result\" class=\"screen\"> \n \n<div class=\"inner\"> \n \n<div class=\"center\"> \n \n<div class=\"card result-card\"> \n \n<div class=\"trophy\">🏆<\/div> \n \n<div id=\"resultTitle\" class=\"result-title\"> \nKlaar! \n<\/div> \n \n<div id=\"resultSubtitle\" class=\"result-subtitle\"> \nHet spel is afgelopen. \n<\/div> \n \n<div class=\"result-grid\"> \n \n<div class=\"result-player\"> \n<strong>👤 Speler 1<\/strong> \n<div id=\"result1\"><\/div> \n<\/div> \n \n<div class=\"result-player\"> \n<strong>👤 Speler 2<\/strong> \n<div id=\"result2\"><\/div> \n<\/div> \n \n<\/div> \n \n<button class=\"primary\" onclick=\"restartGame()\"> \n🔄 Opnieuw spelen \n<\/button> \n \n<\/div> \n \n<\/div> \n \n<\/div> \n<\/section> \n \n \n<div id=\"toast\" class=\"toast\"><\/div>\n<span id=\"headerScore\" style=\"display:none\">0<\/span> \n \n<\/div> \n \n \n<script> \n \n/* ========================================================= \nTHEMA'S \n========================================================= */ \n \nconst themes={ \n \nhuis:{ \nname:\"Droomhuis\", \nicon:\"🏠\", \nitems:[ \n[\"🛋️\",\"Gigantische woonkamer\"], \n[\"🍳\",\"Luxe keuken\"], \n[\"🛏️\",\"Droomslaapkamer\"], \n[\"🌳\",\"Gigantische tuin\"], \n[\"🏊\",\"Infinity pool\"], \n[\"🎬\",\"Privébioscoop\"] \n] \n}, \n \neten:{ \nname:\"Perfect eten\", \nicon:\"🍕\", \nitems:[ \n[\"🍕\",\"Grote pizza\"], \n[\"🍔\",\"Mega burger\"], \n[\"🍟\",\"Frietjes\"], \n[\"🍰\",\"Gigantische taart\"], \n[\"🍫\",\"Chocoladefontein\"], \n[\"🥤\",\"Oneindige drankjes\"] \n] \n}, \n \nvakantie:{ \nname:\"Perfecte vakantie\", \nicon:\"✈️\", \nitems:[ \n[\"✈️\",\"Vliegtuig\"], \n[\"🏨\",\"Luxe hotel\"], \n[\"🏖️\",\"Privéstrand\"], \n[\"🚤\",\"Speedboot\"], \n[\"🎢\",\"Pretpark\"], \n[\"🌅\",\"Perfecte zonsondergang\"] \n] \n}, \n ",\"Nieuwe kleding\"], \n[\"🎧\",\"Nieuwe headset\"], \n[\"🍦\",\"IJsje\"], \n[\"💳\",\"Onbeperkt budget\"], \n[\"🏬\",\"Gigantisch winkelcentrum\"] \n] \n}, \n \nhuisdier:{ \nname:\"Perfect huisdier\", \nicon:\"🐶\", \nitems:[ \n[\"🐶\",\"Hond\"], \n[\"🐱\",\"Kat\"], \n[\"🐰\",\"Konijn\"], \n[\"🐹\",\"Hamster\"], \n[\"🐠\",\"Aquarium\"], \n[\"🛏️\",\"Supermand\"] \n] \n}, \n \nverjaardag:{ \nname:\"Perfecte verjaardag\", \nicon:\"🎂\", \nitems:[ \n[\"🎂\",\"Gigantische taart\"], \n[\"🎁\",\"Mega veel cadeaus\"], \n[\"🎈\",\"Ballonnen\"], \n[\"🎉\",\"Groot feest\"], \n[\"🎵\",\"DJ\"], \n[\"🍕\",\"Feestbuffet\"] \n] \n}, \n \nauto:{ \nname:\"Perfecte auto\", \nicon:\"🚗\", \nitems:[ \n[\"🏎️\",\"Supersnelle auto\"], \n[\"🎵\",\"Mega geluidsinstallatie\"], \n[\"🪑\",\"Luxe zetels\"], \n[\"💡\",\"Neonlichten\"], \n[\"🛞\",\"Speciale velgen\"], \n[\"🌟\",\"Panoramadak\"] \n] \n}, \n \ndroomwereld:{ \nname:\"Droomwereld\", \nicon:\"🌈\", \nitems:[ \n[\"🏰\",\"Magisch kasteel\"], \n[\"🐉\",\"Drakenvriend\"], \n[\"🪽\",\"Kunnen vliegen\"], \n[\"✨\",\"Magische krachten\"], \n[\"🌌\",\"Sterrenhemel\"], \n[\"🦄\",\"Eenhoorn\"] \n] \n} \n \n}; \n \n \n/* ========================================================= \nSPELVARIABELEN \n========================================================= */ \n \nlet gameMode=\"computer\"; \nlet selectedTheme=\"huis\"; \n \nlet outfitStyle=\"mixed\"; \nlet foodStyle=\"mixed\"; \nlet commentary=true; \n \nlet items=[]; \nlet itemIndex=0; \n \nlet player1Money=20; \nlet player2Money=20; \n \nlet player1Collection=[]; \nlet player2Collection=[]; \n \nlet currentBid=0; \nlet leader=null; \n \nlet currentTurn=\"player1\"; \nlet startingPlayer=\"player1\"; \n \nlet gameActive=false; \n \nlet peer=null; \nlet connection=null; \n \nlet onlineHost=false; \nlet onlineConnected=false; \n \nlet onlineRoomCode=\"\"; \nlet waitingForOnlineResponse=false; \n \nconst PEER_PREFIX=\"dreamdraft-v5-\"; \n \nlet computerTimer=null; \nlet roundTimer=null; \n \n \n/* ========================================================= \nSCHERM \n========================================================= */ \n \nfunction showScreen(id){ \n \ndocument \n.querySelectorAll(\".screen\") \n.forEach(screen=>{ \nscreen.classList.remove(\"active\"); \n}); \n \nconst screen=document.getElementById(id); \n \nif(screen){ \nscreen.classList.add(\"active\"); \n} \n \n} \n \n \n/* ========================================================= \nHOME \n========================================================= */ \n \nfunction returnHome(){ \n \ndisconnectPeer(); \n \ngameActive=false; \n \nshowScreen(\"screen-start\"); \n \n} \n \n \nfunction restartGame(){ \n \ndisconnectPeer(); \n \nlocation.reload(); \n \n} \n \n \n/* ========================================================= \nMODES \n========================================================= */ \n \nfunction selectMode(mode){ \n \ngameMode=mode; \n \nrenderThemes(); \n \nshowScreen(\"screen-theme\"); \n \n} \n \n \nfunction openOnline(){ \n \ngameMode=\"online\"; \n \ndocument.getElementById(\"hostNextArea\") \n.classList.remove(\"show\"); \n \ndocument.getElementById(\"hostStatus\") \n.textContent=\"Maak een kamer om te beginnen.\"; \n \ndocument.getElementById(\"roomCode\") \n.textContent=\"------\"; \n \ndocument.getElementById(\"joinStatus\") \n.textContent=\"Vul de code van speler 1 in.\"; \n \ndocument.getElementById(\"joinButton\").disabled=false; \n \nshowScreen(\"screen-online\"); \n \n} \n \n \nfunction openExplanation(){ \n \nshowScreen(\"screen-explanation\"); \n \n} \n \n \n/* ========================================================= \nTHEMA \n========================================================= */ \n \nfunction renderThemes(){ \n \nconst grid=document.getElementById(\"themeGrid\"); \n \ngrid.innerHTML=\"\"; \n \nObject.entries(themes).forEach(([key,theme])=>{ \n \nconst button=document.createElement(\"button\"); \n \nbutton.className= \n\"choice\"+ \n(key===selectedTheme ? \" selected\" : \"\"); \n \nbutton.innerHTML=` \n<span class=\"choice-icon\">${theme.icon}<\/span> \n${theme.name} \n`; \n \nbutton.onclick=()=>{ \n \nselectedTheme=key; \n \nrenderThemes(); \n \n}; \n \ngrid.appendChild(button); \n \n}); \n \n} \n \n \nfunction previousFromTheme(){ \n \nif(gameMode===\"online\"){ \nshowScreen(\"screen-online\"); \n}else{ \nshowScreen(\"screen-start\"); \n} \n \n} \n \n \nfunction previousFromSettings(){ \n \nshowScreen(\"screen-theme\"); \n \n} \n \n \n/* ========================================================= \nTHEMA VERDER \n========================================================= */ \n \nfunction continueTheme(){ \n \nif(gameMode===\"online\" && !onlineHost){ \n \nshowToast(\"Wacht tot speler 1 het spel start.\"); \n \nreturn; \n \n} \n \nupdateSettingsUI(); \n \nshowScreen(\"screen-settings\"); \n \n} \n \n \n/* ========================================================= \nSETTINGS \n========================================================= */ \n \nfunction setOutfit(value){ \n \noutfitStyle=value; \n \nupdateSettingsUI(); \n \n} \n \n \nfunction setFood(value){ \n \nfoodStyle=value; \n \nupdateSettingsUI(); \n \n} \n \n \nfunction setCommentary(value){ \n \ncommentary=value; \n \nupdateSettingsUI(); \n \n} \n \n \nfunction updateSettingsUI(){ \n \ndocument \n.querySelectorAll(\".option\") \n.forEach(button=>{ \nbutton.classList.remove(\"selected\"); \n}); \n \ndocument \n.getElementById(\"outfit-\"+outfitStyle) \n?.classList.add(\"selected\"); \n \ndocument \n.getElementById(\"food-\"+foodStyle) \n?.classList.add(\"selected\"); \n \ndocument \n.getElementById( \ncommentary ? \"comment-on\" : \"comment-off\" \n) \n?.classList.add(\"selected\"); \n \n} \n \n \n/* ========================================================= \nONLINE THEMA \n========================================================= */ \n \nfunction hostGoToTheme(){ \n \nif(!onlineHost)return; \n \nif(!onlineConnected){ \n \nshowToast(\"Speler 2 is nog niet verbonden.\"); \n \nreturn; \n \n} \n \nrenderThemes(); \n \nshowScreen(\"screen-theme\"); \n \n} \n \n \n/* ========================================================= \nGAME START \n========================================================= */ \n \nfunction startGameFromSettings(){ \n \nif(gameMode===\"online\"){ \n \nif(!onlineHost){ \n \nshowToast(\"Alleen speler 1 kan het spel starten.\"); \n \nreturn; \n \n} \n \nif(!onlineConnected){ \n \nshowToast(\"Speler 2 is nog niet verbonden.\"); \n \nreturn; \n \n} \n \nstartOnlineGame(); \n \nreturn; \n \n} \n \nstartNormalGame(); \n \n} \n \n \n/* ========================================================= \nNORMAAL SPEL \n========================================================= */ \n \nfunction startNormalGame(){ \n \nplayer1Money=20; \nplayer2Money=20; \n \nplayer1Collection=[]; \nplayer2Collection=[]; \n \nitems=JSON.parse( \nJSON.stringify( \nthemes[selectedTheme].items \n) \n); \n \nitemIndex=0; \n \ncurrentBid=0; \nleader=null; \n \nstartingPlayer=\"player1\"; \ncurrentTurn=\"player1\"; \n \ngameActive=true; \n \nshowScreen(\"screen-game\"); \n \nprepareRound(); \n \n} \n \n \n/* ========================================================= \nRONDE \n========================================================= */ \n \nfunction prepareRound(){ \n \nclearTimeout(computerTimer); \nclearTimeout(roundTimer); \n \nif(itemIndex>=items.length){ \n \nfinishGame(); \n \nreturn; \n \n} \n \ncurrentBid=0; \nleader=null; \n \ncurrentTurn=startingPlayer; \n \nconst item=items[itemIndex]; \n \ndocument.getElementById(\"itemIcon\").textContent=item[0]; \n \ndocument.getElementById(\"itemName\").textContent=item[1]; \n \ndocument.getElementById(\"category\").textContent= \nthemes[selectedTheme].name; \n \ndocument.getElementById(\"gameThemeName\").textContent= \nthemes[selectedTheme].name; \n \ndocument.getElementById(\"roundText\").textContent= \n`${itemIndex+1} / ${items.length}`; \n \ndocument.getElementById(\"bidInput\").value=\"\"; \n \ndocument.getElementById(\"comment\").textContent=\"\"; \n \nwaitingForOnlineResponse=false; \n \nupdateGameUI(); \n \nif( \ngameMode===\"computer\" && \ncurrentTurn===\"player2\" \n){ \n \ncomputerTimer=setTimeout( \ncomputerBid, \n900 \n); \n \n} \n \n} \n \n \n/* ========================================================= \nUI \n========================================================= */ \n \nfunction updateGameUI(){ \n \ndocument.getElementById(\"p1Money\").textContent= \n\"€\"+player1Money; \n \ndocument.getElementById(\"p2Money\").textContent= \n\"€\"+player2Money; \n \nrenderCollection( \n\"collection1\", \nplayer1Collection \n); \n \nrenderCollection( \n\"collection2\", \nplayer2Collection \n); \n \nif(currentBid===0){ \n \ndocument.getElementById(\"bidInfo\").textContent= \n\"Nog geen bod\"; \n \ndocument.getElementById(\"leader\").textContent= \ncurrentTurn===\"player1\" \n? \"👤 Speler 1 begint\" \n: \"👤 Speler 2 begint\"; \n \n}else{ \n \ndocument.getElementById(\"bidInfo\").textContent= \n\"Bod: €\"+currentBid; \n \ndocument.getElementById(\"leader\").textContent= \nleader===\"player1\" \n? `👤 Speler 1 heeft €${currentBid} geboden` \n: `👤 Speler 2 heeft €${currentBid} geboden`; \n \n} \n \nupdateTurnUI(); \n \n} \n \n \n/* ========================================================= \nCOLLECTIE \n========================================================= */ \n \nfunction renderCollection(id,collection){ \n \nconst element=document.getElementById(id); \n \nelement.innerHTML=\"\"; \n \ncollection.forEach(item=>{ \n \nconst div=document.createElement(\"div\"); \n \ndiv.className=\"collection-item\"; \n \ndiv.textContent=item[0]; \n \ndiv.title=item[1]; \n \nelement.appendChild(div); \n \n}); \n \n} \n \n \n/* ========================================================= \nBEURT \n========================================================= */ \n \nfunction updateTurnUI(){ \n \nconst input=document.getElementById(\"bidInput\"); \nconst bid=document.getElementById(\"bidButton\"); \nconst give=document.getElementById(\"giveButton\"); \nconst turn=document.getElementById(\"turn\"); \n \nif(!gameActive){ \n \ninput.disabled=true; \nbid.disabled=true; \ngive.disabled=true; \n \nreturn; \n \n} \n \nif(gameMode===\"computer\"){ \n \nconst myTurn=currentTurn===\"player1\"; \n \ninput.disabled=!myTurn; \nbid.disabled=!myTurn; \ngive.disabled=!myTurn; \n \nturn.textContent= \nmyTurn \n? \"🟢 Jij bent aan de beurt!\" \n: \"🤖 De computer is aan de beurt...\"; \n \nreturn; \n \n} \n \nif(gameMode===\"local\"){ \n \ninput.disabled=false; \nbid.disabled=false; \ngive.disabled=false; \n \nturn.textContent= \ncurrentTurn===\"player1\" \n? \"🟢 Speler 1 is aan de beurt\" \n: \"🟢 Speler 2 is aan de beurt\"; \n \nreturn; \n \n} \n \nif(gameMode===\"online\"){ \n \nconst myTurn= \nonlineHost \n? currentTurn===\"player1\" \n: currentTurn===\"player2\"; \n \nconst locked=waitingForOnlineResponse; \n \ninput.disabled=!myTurn || locked; \nbid.disabled=!myTurn || locked; \ngive.disabled=!myTurn || locked; \n \nif(locked){ \n \nturn.textContent=\"📡 Even wachten...\"; \n \n}else if(myTurn){ \n \nturn.textContent=\"🟢 JIJ BENT AAN DE BEURT!\"; \n \n}else{ \n \nturn.textContent=\"⏳ Wachten op de andere speler...\"; \n \n} \n \n} \n \n} \n \n \n/* ========================================================= \nBIEDEN \n========================================================= */ \n \nfunction makeBid(){ \n \nif(!gameActive)return; \n \nconst input=document.getElementById(\"bidInput\"); \n \nconst amount=Number(input.value); \n \nif(!Number.isFinite(amount)||amount<=0){ \n \nshowToast(\"Vul een geldig bod in.\"); \n \nreturn; \n \n} \n \nif( \ngameMode===\"online\" && \n!onlineHost \n){ \n \nif(currentTurn!==\"player2\"){ \n \nshowToast(\"Je bent nu niet aan de beurt.\"); \n \nreturn; \n \n} \n \nif(amount>player2Money){ \n \nshowToast(\"Je hebt niet genoeg geld.\"); \n \nreturn; \n \n} \n \nif(amount<=currentBid){ \n \nshowToast( \n`Je moet hoger bieden dan €${currentBid}.` \n); \n \nreturn; \n \n} \n \nwaitingForOnlineResponse=true; \n \nupdateTurnUI(); \n \nsendOnline({ \n \ntype:\"PLAYER_ACTION\", \naction:\"BID\", \nplayer:\"player2\", \namount:amount \n \n}); \n \ninput.value=\"\"; \n \nreturn; \n \n} \n \nif( \ngameMode===\"online\" && \nonlineHost && \ncurrentTurn!==\"player1\" \n){ \n \nshowToast(\"Speler 2 is aan de beurt.\"); \n \nreturn; \n \n} \n \nconst money= \ncurrentTurn===\"player1\" \n?player1Money \n:player2Money; \n \nif(amount>money){ \n \nshowToast(\"Je hebt niet genoeg geld.\"); \n \nreturn; \n \n} \n \nif(amount<=currentBid){ \n \nshowToast( \n`Je moet hoger bieden dan €${currentBid}.` \n); \n \nreturn; \n \n} \n \nprocessBid(currentTurn,amount); \n \n} \n \n \n/* ========================================================= \nBOD VERWERKEN \n========================================================= */ \n \nfunction processBid(player,amount){ \n \nif(!gameActive)return; \n \nif(player!==currentTurn)return; \n \nconst money= \nplayer===\"player1\" \n?player1Money \n:player2Money; \n \nif(amount>money)return; \n \nif(amount<=currentBid)return; \n \ncurrentBid=amount; \n \nleader=player; \n \ncurrentTurn= \nplayer===\"player1\" \n? \"player2\" \n: \"player1\"; \n \nwaitingForOnlineResponse=false; \n \ndocument.getElementById(\"bidInput\").value=\"\"; \n \nupdateGameUI(); \n \nif( \ngameMode===\"online\" && \nonlineHost \n){ \n \nsendGameState(); \n \n} \n \nif( \ngameMode===\"computer\" && \ncurrentTurn===\"player2\" \n){ \n \ncomputerTimer=setTimeout( \ncomputerBid, \n900 \n); \n \n} \n \n} \n \n \n/* ========================================================= \nCOMPUTER \n========================================================= */ \n \nfunction computerBid(){ \n \nif( \n!gameActive || \ngameMode!==\"computer\" || \ncurrentTurn!==\"player2\" \n)return; \n \nconst minimum=currentBid+1; \n \nif(player2Money<minimum){ \n \nfinishAuction( \nleader || \"player1\", \ncurrentBid \n); \n \nreturn; \n \n} \n \nconst maximum=Math.min( \nplayer2Money, \nMath.max( \nminimum, \nMath.floor(player2Money*.75) \n) \n); \n \nconst amount=Math.floor( \nminimum+ \nMath.random()* \n(maximum-minimum+1) \n); \n \nif(commentary){ \n \nconst comments=[ \n\"🤖 Deze wil ik!\", \n\"🤖 Ik bied hierop!\", \n\"🤖 Die hoort in mijn collectie!\", \n\"🤖 Ik ga hoger!\", \n\"🤖 Deze laat ik niet liggen!\", \n\"🤖 Mijn beurt! 💸\" \n]; \n \ndocument.getElementById(\"comment\").textContent= \ncomments[ \nMath.floor(Math.random()*comments.length) \n]; \n \n} \n \nprocessBid(\"player2\",amount); \n \n} \n \n \n/* ========================================================= \nGEEF HET ITEM \n========================================================= */ \n \nfunction giveItem(){ \n \nif(!gameActive)return; \n \nif( \ngameMode===\"online\" && \n!onlineHost \n){ \n \nif(currentTurn!==\"player2\")return; \n \nwaitingForOnlineResponse=true; \n \nupdateTurnUI(); \n \nsendOnline({ \n \ntype:\"PLAYER_ACTION\", \naction:\"GIVE\", \nplayer:\"player2\" \n \n}); \n \nreturn; \n \n} \n \nif( \ngameMode===\"online\" && \nonlineHost && \ncurrentTurn!==\"player1\" \n){ \n \nreturn; \n \n} \n \nprocessGive(currentTurn); \n \n} \n \n \n/* ========================================================= \nGIVE VERWERKEN \n========================================================= */ \n \nfunction processGive(player){ \n \nif(!gameActive)return; \n \nif(player!==currentTurn)return; \n \nif(currentBid===0){ \n \nconst winner= \nplayer===\"player1\" \n? \"player2\" \n: \"player1\"; \n \nfinishAuction(winner,0); \n \nreturn; \n \n} \n \nif(leader!==player){ \n \nfinishAuction( \nleader, \ncurrentBid \n); \n \nreturn; \n \n} \n \nconst other= \nplayer===\"player1\" \n? \"player2\" \n: \"player1\"; \n \nfinishAuction(other,0); \n \n} \n \n \n/* ========================================================= \nVEILING EINDE \n========================================================= */ \n \nfunction finishAuction(winner,price){ \n \nclearTimeout(computerTimer); \n \nif(!gameActive)return; \n \nconst item=items[itemIndex]; \n \nif(winner===\"player1\"){ \n \nplayer1Collection.push(item); \n \nplayer1Money-=price; \n \n}else{ \n \nplayer2Collection.push(item); \n \nplayer2Money-=price; \n \n} \n \nitemIndex++; \n \nstartingPlayer= \nstartingPlayer===\"player1\" \n? \"player2\" \n: \"player1\"; \n \ncurrentBid=0; \nleader=null; \ncurrentTurn=startingPlayer; \n \nwaitingForOnlineResponse=false; \n \nupdateGameUI(); \n \nif(gameMode===\"online\"){ \n \nif(!onlineHost)return; \n \nsendGameState(); \n \nroundTimer=setTimeout(()=>{ \n \nprepareRound(); \n \nsendGameState(); \n \n},700); \n \nreturn; \n \n} \n \nroundTimer=setTimeout(()=>{ \n \nprepareRound(); \n \n},700); \n \n} \n \n \n/* ========================================================= \nSPEL EINDE \n========================================================= */ \n \nfunction setPlatformScore(){\nconst mine=(gameMode===\"online\"&&!onlineHost)?player2Collection:player1Collection;\nconst other=(gameMode===\"online\"&&!onlineHost)?player1Collection:player2Collection;\ndocument.getElementById(\"headerScore\").textContent=mine.length*30+(mine.length>other.length?100:0);\n}\n\nfunction finishGame(){ \n \ngameActive=false; \n \nclearTimeout(computerTimer); \nclearTimeout(roundTimer); \n \nlet title; \n \nif( \nplayer1Collection.length> \nplayer2Collection.length \n){ \n \ntitle=\"🎉 Speler 1 heeft meer items!\"; \n \n}else if( \nplayer2Collection.length> \nplayer1Collection.length \n){ \n \ntitle= \ngameMode===\"computer\" \n? \"🤖 De computer heeft meer items!\" \n: \"🎉 Speler 2 heeft meer items!\"; \n \n}else{ \n \ntitle=\"🤝 Gelijke stand!\"; \n \n} \n \ndocument.getElementById(\"resultTitle\").textContent=title; \n \ndocument.getElementById(\"resultSubtitle\").textContent= \n`Speler 1: ${player1Collection.length} items • Speler 2: ${player2Collection.length} items`; \n \ndocument.getElementById(\"result1\").textContent= \nplayer1Collection.map(item=>item[0]).join(\" \"); \n \ndocument.getElementById(\"result2\").textContent= \nplayer2Collection.map(item=>item[0]).join(\" \"); \n \nsetPlatformScore();\nshowScreen(\"screen-result\"); \n \nif( \ngameMode===\"online\" && \nonlineHost \n){ \n \nsendOnline({ \n \ntype:\"GAME_OVER\", \n \ntitle:title, \n \nplayer1Collection:player1Collection, \nplayer2Collection:player2Collection, \n \nplayer1Money:player1Money, \nplayer2Money:player2Money \n \n}); \n \n} \n \n} \n \n \n/* ========================================================= \nKAMER MAKEN \n========================================================= */ \n \nfunction createRoom(){ \n \ndisconnectPeer(); \n \nonlineHost=true; \nonlineConnected=false; \n \ngameMode=\"online\"; \n \nconst createButton= \ndocument.getElementById(\"createRoomButton\"); \n \ncreateButton.disabled=true; \n \ndocument.getElementById(\"hostNextArea\") \n.classList.remove(\"show\"); \n \nonlineRoomCode= \nMath.random() \n.toString(36) \n.substring(2,8) \n.toUpperCase(); \n \ndocument.getElementById(\"roomCode\") \n.textContent=onlineRoomCode; \n \ndocument.getElementById(\"hostStatus\") \n.textContent=\"⏳ Kamer wordt aangemaakt...\"; \n \npeer=new Peer( \nPEER_PREFIX+onlineRoomCode, \n{ \nsecure:true, \ndebug:1 \n} \n); \n \npeer.on(\"open\",()=>{ \n \ndocument.getElementById(\"hostStatus\") \n.textContent= \n\"🟢 Kamer klaar! Wacht op speler 2.\"; \n \n}); \n \npeer.on(\"connection\",conn=>{ \n \nif(connection){ \n \ntry{ \nconn.close(); \n}catch(e){} \n \nreturn; \n \n} \n \nconnection=conn; \n \nsetupConnection(conn); \n \n}); \n \npeer.on(\"error\",error=>{ \n \nconsole.error(error); \n \ndocument.getElementById(\"hostStatus\") \n.textContent= \n\"❌ Er ging iets mis. Maak een nieuwe kamer.\"; \n \ncreateButton.disabled=false; \n \n}); \n \n} \n \n \n/* ========================================================= \nVERBINDEN SPELER 2 \n========================================================= */ \n \nfunction joinRoom(){ \n \nconst input=document.getElementById(\"joinCode\"); \n \nconst code= \ninput.value \n.trim() \n.toUpperCase(); \n \nif(code.length!==6){ \n \nshowToast(\"De code moet 6 tekens hebben.\"); \n \nreturn; \n \n} \n \ndisconnectPeer(); \n \nonlineHost=false; \nonlineConnected=false; \n \ngameMode=\"online\"; \n \ndocument.getElementById(\"joinButton\").disabled=true; \n \ndocument.getElementById(\"joinStatus\") \n.textContent=\"⏳ Verbinding maken...\"; \n \npeer=new Peer({ \nsecure:true, \ndebug:1 \n}); \n \npeer.on(\"open\",()=>{ \n \nconnection= \npeer.connect( \nPEER_PREFIX+code, \n{ \nreliable:true \n} \n); \n \nsetupConnection(connection); \n \n}); \n \npeer.on(\"error\",error=>{ \n \nconsole.error(error); \n \ndocument.getElementById(\"joinStatus\") \n.textContent=\"❌ Verbinden mislukt.\"; \n \ndocument.getElementById(\"joinButton\").disabled=false; \n \n}); \n \n} \n \n \n/* ========================================================= \nCONNECTION \n========================================================= */ \n \nfunction setupConnection(conn){ \n \nif(!conn)return; \n \nconn.on(\"open\",()=>{ \n \nconnection=conn; \n \nonlineConnected=true; \n \nif(onlineHost){ \n \ndocument.getElementById(\"hostStatus\") \n.textContent=\"🎉 Speler 2 is verbonden!\"; \n \ndocument.getElementById(\"hostNextArea\") \n.classList.add(\"show\"); \n \nsendOnline({ \ntype:\"HOST_CONNECTED\" \n}); \n \n}else{ \n \ndocument.getElementById(\"joinStatus\") \n.textContent=\"🎉 Verbonden met speler 1!\"; \n \nsendOnline({ \ntype:\"GUEST_CONNECTED\" \n}); \n \nsetTimeout(()=>{ \n \nshowScreen(\"screen-online-wait\"); \n \n},150); \n \n} \n \n}); \n \nconn.on(\"data\",data=>{ \n \nreceiveOnlineData(data); \n \n}); \n \nconn.on(\"close\",()=>{ \n \nonlineConnected=false; \n \nif(gameActive){ \n \nshowToast(\"De verbinding is verbroken.\"); \n \n} \n \n}); \n \nconn.on(\"error\",error=>{ \n \nconsole.error(error); \n \nonlineConnected=false; \n \n}); \n \n} \n \n \n/* ========================================================= \nONLINE VERZENDEN \n========================================================= */ \n \nfunction sendOnline(data){ \n \nif( \n!connection || \n!onlineConnected \n)return false; \n \ntry{ \n \nconnection.send(data); \n \nreturn true; \n \n}catch(error){ \n \nconsole.error(error); \n \nreturn false; \n \n} \n \n} \n \n \n/* ========================================================= \nONLINE DATA \n========================================================= */ \n \nfunction receiveOnlineData(data){ \n \nif( \n!data || \n!data.type \n)return; \n \nif(data.type===\"HOST_CONNECTED\"){ \n \nif(!onlineHost){ \n \ndocument.getElementById(\"joinStatus\") \n.textContent= \n\"🎉 Verbonden met speler 1!\"; \n \n} \n \nreturn; \n \n} \n \nif(data.type===\"GUEST_CONNECTED\"){ \n \nif(!onlineHost)return; \n \ndocument.getElementById(\"hostStatus\") \n.textContent= \n\"🎉 Speler 2 is verbonden!\"; \n \ndocument.getElementById(\"hostNextArea\") \n.classList.add(\"show\"); \n \nreturn; \n \n} \n \nif(data.type===\"PLAYER_ACTION\"){ \n \nif(!onlineHost)return; \n \nif(data.player!==\"player2\")return; \n \nif(currentTurn!==\"player2\"){ \n \nsendGameState(); \n \nreturn; \n \n} \n \nif(data.action===\"BID\"){ \n \nconst amount=Number(data.amount); \n \nif( \n!Number.isFinite(amount) || \namount<=currentBid || \namount>player2Money \n){ \n \nsendGameState(); \n \nreturn; \n \n} \n \nprocessBid(\"player2\",amount); \n \nreturn; \n \n} \n \nif(data.action===\"GIVE\"){ \n \nprocessGive(\"player2\"); \n \nreturn; \n \n} \n \nreturn; \n \n} \n \nif(data.type===\"GAME_START\"){ \n \nif(onlineHost)return; \n \napplyOnlineState(data); \n \nreturn; \n \n} \n \nif(data.type===\"GAME_STATE\"){ \n \nif(onlineHost)return; \n \napplyOnlineState(data); \n \nreturn; \n \n} \n \nif(data.type===\"GAME_OVER\"){ \n \nif(onlineHost)return; \n \nplayer1Collection= \ndata.player1Collection || []; \n \nplayer2Collection= \ndata.player2Collection || []; \n \nplayer1Money=data.player1Money; \nplayer2Money=data.player2Money; \n \ndocument.getElementById(\"resultTitle\") \n.textContent=data.title; \n \ndocument.getElementById(\"resultSubtitle\") \n.textContent= \n`Speler 1: ${player1Collection.length} items • Speler 2: ${player2Collection.length} items`; \n \ndocument.getElementById(\"result1\") \n.textContent= \nplayer1Collection.map(item=>item[0]).join(\" \"); \n \ndocument.getElementById(\"result2\") \n.textContent= \nplayer2Collection.map(item=>item[0]).join(\" \"); \n \ngameActive=false; \n \nsetPlatformScore();\nshowScreen(\"screen-result\"); \n \nreturn; \n \n} \n \n} \n \n \n/* ========================================================= \nONLINE GAME START \n========================================================= */ \n \nfunction startOnlineGame(){ \n \nif(!onlineHost)return; \n \nif(!onlineConnected){ \n \nshowToast(\"Speler 2 is nog niet verbonden.\"); \n \nreturn; \n \n} \n \nitems= \nJSON.parse( \nJSON.stringify( \nthemes[selectedTheme].items \n) \n); \n \nplayer1Money=20; \nplayer2Money=20; \n \nplayer1Collection=[]; \nplayer2Collection=[]; \n \nitemIndex=0; \n \ncurrentBid=0; \nleader=null; \n \nstartingPlayer=\"player1\"; \ncurrentTurn=\"player1\"; \n \ngameActive=true; \n \nshowScreen(\"screen-game\"); \n \nprepareRound(); \n \nsendGameState(true); \n \n} \n \n \n/* ========================================================= \nGAME STATE \n========================================================= */ \n \nfunction sendGameState(isStart=false){ \n \nif( \n!onlineHost || \n!onlineConnected \n)return; \n \nsendOnline({ \n \ntype: \nisStart \n? \"GAME_START\" \n: \"GAME_STATE\", \n \nselectedTheme:selectedTheme, \n \noutfitStyle:outfitStyle, \nfoodStyle:foodStyle, \ncommentary:commentary, \n \nitems:items, \nitemIndex:itemIndex, \n \ncurrentBid:currentBid, \nleader:leader, \n \ncurrentTurn:currentTurn, \nstartingPlayer:startingPlayer, \n \nplayer1Money:player1Money, \nplayer2Money:player2Money, \n \nplayer1Collection:player1Collection, \nplayer2Collection:player2Collection \n \n}); \n \n} \n \n \n/* ========================================================= \nSTATE GAST \n========================================================= */ \n \nfunction applyOnlineState(data){ \n \nselectedTheme=data.selectedTheme; \n \noutfitStyle=data.outfitStyle; \nfoodStyle=data.foodStyle; \ncommentary=data.commentary; \n \nitems=data.items || []; \n \nitemIndex=data.itemIndex; \n \ncurrentBid=data.currentBid; \nleader=data.leader; \n \ncurrentTurn=data.currentTurn; \nstartingPlayer=data.startingPlayer; \n \nplayer1Money=data.player1Money; \nplayer2Money=data.player2Money; \n \nplayer1Collection=data.player1Collection || []; \nplayer2Collection=data.player2Collection || []; \n \nwaitingForOnlineResponse=false; \n \nconst item=items[itemIndex]; \n \nif(item){ \n \ndocument.getElementById(\"itemIcon\") \n.textContent=item[0]; \n \ndocument.getElementById(\"itemName\") \n.textContent=item[1]; \n \ndocument.getElementById(\"category\") \n.textContent=themes[selectedTheme].name; \n \ndocument.getElementById(\"gameThemeName\") \n.textContent=themes[selectedTheme].name; \n \ndocument.getElementById(\"roundText\") \n.textContent= \n`${itemIndex+1} / ${items.length}`; \n \n} \n \ngameActive=true; \n \nupdateGameUI(); \n \nshowScreen(\"screen-game\"); \n \n} \n \n \n/* ========================================================= \nDISCONNECT \n========================================================= */ \n \nfunction disconnectPeer(){ \n \nonlineConnected=false; \nwaitingForOnlineResponse=false; \n \nif(connection){ \n \ntry{ \nconnection.close(); \n}catch(e){} \n \nconnection=null; \n \n} \n \nif(peer){ \n \ntry{ \npeer.destroy(); \n}catch(e){} \n \npeer=null; \n \n} \n \nonlineHost=false; \n \n} \n \n \n/* ========================================================= \nENTER = BIEDEN \n========================================================= */ \n \ndocument.addEventListener(\"keydown\",event=>{ \n \nif(event.key!==\"Enter\")return; \n \nconst input=document.getElementById(\"bidInput\"); \n \nif( \ndocument.activeElement===input && \n!input.disabled \n){ \n \nmakeBid(); \n \n} \n \n}); \n \n \n/* ========================================================= \nTOAST \n========================================================= */ \n \nlet toastTimer=null; \n \nfunction showToast(message){ \n \nconst toast=document.getElementById(\"toast\"); \n \ntoast.textContent=message; \n \ntoast.classList.add(\"show\"); \n \nclearTimeout(toastTimer); \n \ntoastTimer=setTimeout( \n()=>{ \ntoast.classList.remove(\"show\"); \n}, \n2200 \n); \n \n} \n \n \n/* ========================================================= \nSTART \n========================================================= */ \n \nrenderThemes(); \n \nupdateSettingsUI(); \n \n<\/script> \n \n<\/body> \n<\/html>", "city": "<!DOCTYPE html><html lang=\"nl\"><head><script>try{localStorage.getItem(\"x\")}catch(e){var _m={};Object.defineProperty(window,\"localStorage\",{value:{getItem:function(k){return k in _m?_m[k]:null},setItem:function(k,v){_m[k]=String(v)},removeItem:function(k){delete _m[k]}}})}<\/script><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no\"><title>Dream City<\/title>\n<style>\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}\nhtml,body{margin:0;height:100%;overflow:hidden;background:#11152b;color:#fff;font-family:system-ui,Arial,sans-serif}\nbody{display:flex;flex-direction:column;align-items:center;padding:6px;gap:6px;background:radial-gradient(ellipse at 20% 0,#36e0c244,transparent 50%),#11152b}\n.top{width:min(560px,100%);display:flex;justify-content:space-between;gap:6px;font-weight:900}\n.top div{background:#ffffff14;border:1px solid #ffffff25;border-radius:12px;padding:6px 12px;font-size:15px}\n#p{color:#ffd86b}#inc{color:#62e7d4}\n#g{width:min(560px,100%);flex:none;max-height:min(560px,52vh);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:2px;background:#0a3d2a;border:3px solid #2f8f5f;border-radius:12px;padding:3px}\n.c{position:relative;display:flex;align-items:center;justify-content:center;background:#3fae6d;border-radius:6px;font-size:clamp(14px,4.6vh,32px);cursor:pointer}\n.c:nth-child(odd){background:#46b874}\n.c.sel{outline:3px solid #ffd86b;z-index:1}\n.c .lv{position:absolute;right:2px;bottom:0;font-size:9px;font-weight:900;color:#fff;text-shadow:0 0 3px #000}\n#info{width:min(560px,100%);min-height:44px;background:#ffffff12;border:1px solid #ffffff25;border-radius:12px;padding:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}\n#info button{border:0;border-radius:10px;padding:8px 10px;font-weight:800;color:#fff;background:#7c5cff;font-size:12px}\n#info button.s{background:#c24a6b}\n#pal{width:min(560px,100%);display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}\n#pal button{flex:0 0 auto;min-width:78px;border:2px solid #ffffff30;border-radius:12px;background:#ffffff12;color:#fff;padding:6px 4px;font-weight:800;font-size:11px}\n#pal button b{display:block;font-size:24px}\n#pal button.on{border-color:#ffd86b;background:#ffd86b33}\n#pal button.no{opacity:.4}\n.hint{font-size:11px;color:#b9c7ff;text-align:center;width:min(560px,100%)}\n<\/style><\/head><body>\n<div class=\"top\"><div>⭐ <span id=\"p\">0<\/span><\/div><div>📈 <span id=\"inc\">0<\/span>/s<\/div><div>🏙️ <span id=\"cnt\">0<\/span>/64<\/div><\/div>\n<div id=\"g\"><\/div>\n<div id=\"info\">Kies een gebouw hieronder en tik op een vak om te bouwen.<\/div>\n<div id=\"pal\"><\/div>\n<div class=\"hint\">Parken 🌳 boosten buren (+30%) · Fabrieken 🏭 verdienen veel maar hinderen buren (−25%) · Upgrade tot niveau 5<\/div>\n<script>\nconst B={huis:{e:\"🏠\",n:\"Huis\",c:30,i:.1},park:{e:\"🌳\",n:\"Park\",c:60,i:.05},winkel:{e:\"🏪\",n:\"Winkel\",c:150,i:.6},fabriek:{e:\"🏭\",n:\"Fabriek\",c:500,i:3.5},kantoor:{e:\"🏢\",n:\"Kantoor\",c:1200,i:8},pretpark:{e:\"🎡\",n:\"Pretpark\",c:4000,i:30},kasteel:{e:\"🏰\",n:\"Kasteel\",c:15000,i:120}};\nconst $=id=>document.getElementById(id),W=8;\nlet pts=0,city={grid:Array(64).fill(null),t:Date.now()},sel=null,cell=null,ready=false;\nconst fmt=n=>n>=1e6?(n/1e6).toFixed(1)+\"M\":n>=1e4?(n/1e3).toFixed(1)+\"k\":Math.floor(n);\nfunction inc(i){const b=city.grid[i];if(!b)return 0;let m=1;const x=i%W,y=Math.floor(i/W);\n for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=W)continue;const o=city.grid[ny*W+nx];if(!o)continue;\n  if(o.k==\"park\")m+=.3;else if(o.k==\"fabriek\"&&b.k!=\"fabriek\"&&b.k!=\"park\")m-=.25}\n return B[b.k].i*Math.pow(1.8,b.l-1)*Math.max(.2,m)}\nconst total=()=>city.grid.reduce((s,_,i)=>s+inc(i),0);\nconst upCost=b=>Math.round(B[b.k].c*Math.pow(1.5,b.l));\nfunction save(){parent.postMessage({type:\"city-state\",pts:pts,city:city},\"*\")}\nfunction render(){\n $(\"p\").textContent=fmt(pts);$(\"inc\").textContent=total().toFixed(1);$(\"cnt\").textContent=city.grid.filter(Boolean).length;\n $(\"g\").innerHTML=city.grid.map((b,i)=>`<div class=\"c${cell===i?\" sel\":\"\"}\" data-i=\"${i}\">${b?B[b.k].e+(b.l>1?`<span class=\"lv\">${b.l}<\/span>`:\"\"):\"\"}<\/div>`).join(\"\");\n $(\"pal\").innerHTML=Object.entries(B).map(([k,v])=>`<button class=\"${sel==k?\"on\":\"\"} ${pts<v.c?\"no\":\"\"}\" data-k=\"${k}\"><b>${v.e}<\/b>${v.n}<br>⭐${fmt(v.c)}<\/button>`).join(\"\");\n const b=cell!==null?city.grid[cell]:null;\n if(b){const d=B[b.k];$(\"info\").innerHTML=`<span>${d.e} ${d.n} niv.${b.l} · +${inc(cell).toFixed(2)}/s<\/span><span>${b.l<5?`<button onclick=\"up()\">⬆ ${fmt(upCost(b))}<\/button> `:\"MAX \"}<button class=\"s\" onclick=\"sell()\">💰 +${fmt(d.c/2)}<\/button><\/span>`}\n else $(\"info\").textContent=sel?\"Tik op een leeg vak om \"+B[sel].n+\" te bouwen.\":\"Kies een gebouw hieronder en tik op een vak om te bouwen.\";\n}\nfunction up(){const b=city.grid[cell];if(!b||b.l>=5)return;const c=upCost(b);if(pts<c)return $(\"info\").textContent=\"Te weinig punten!\";pts-=c;b.l++;save();render()}\nfunction sell(){const b=city.grid[cell];if(!b)return;pts+=B[b.k].c/2;city.grid[cell]=null;cell=null;save();render()}\n$(\"g\").addEventListener(\"click\",e=>{const d=e.target.closest(\".c\");if(!d)return;const i=+d.dataset.i,b=city.grid[i];\n if(!b&&sel){const c=B[sel].c;if(pts<c){$(\"info\").textContent=\"Te weinig punten! Speel minispellen voor meer ⭐.\";return}\n  pts-=c;city.grid[i]={k:sel,l:1};if(sel==\"kasteel\")$(\"info\").textContent=\"🏰 Een kasteel! Je stad is legendarisch!\";cell=i;save()}\n else cell=b?i:null;render()});\n$(\"pal\").addEventListener(\"click\",e=>{const b=e.target.closest(\"button\");if(!b)return;sel=sel==b.dataset.k?null:b.dataset.k;render()});\nsetInterval(()=>{if(!ready)return;pts+=total()*.25;city.t=Date.now();$(\"p\").textContent=fmt(pts);$(\"inc\").textContent=total().toFixed(1)},250);\nsetInterval(()=>{if(ready)save()},1500);\nsetInterval(()=>{if(ready)render()},4000);\naddEventListener(\"message\",e=>{const d=e.data;if(!d||d.type!==\"city-init\")return;\n pts=d.pts;if(d.city&&d.city.grid)city=d.city;\n const secs=Math.min((Date.now()-(city.t||Date.now()))/1000,6*3600),off=total()*secs*.5;\n if(off>=1){pts+=off;$(\"info\").textContent=\"Terwijl je weg was verdiende je stad ⭐\"+fmt(off)+\"!\"}\n city.t=Date.now();ready=true;render();save()});\nrender();parent.postMessage({type:\"city-ready\"},\"*\");\n<\/script><\/body><\/html>\n"};</script>
<script>
const MINI=[
 {id:"blockdrop",icon:"🧱",title:"Block Drop",sel:"#score",w:.05},
 {id:"draft",icon:"✨",title:"Dream Draft",sel:"#headerScore",w:.5},
 {id:"reaction",icon:"🌿",title:"Reaction Rush",sel:"#score",w:.2},
 {id:"style",icon:"🧡",title:"Style Battle",sel:"#headerScore",w:.1},
 {id:"memory",icon:"💜",title:"Memory Mix",sel:"#headerScore",w:.2},
 {id:"color",icon:"💛",title:"Color Clash",sel:"#headerScore",w:.2},
 {id:"2048",icon:"🩷",title:"2048 Remix",sel:"#headerScore",w:.05},
 {id:"ice",icon:"🔴",title:"Ice Slide",sel:"#headerScore",w:.1},
 {id:"quiz",icon:"🩵",title:"Mini Quiz",sel:"#headerScore",w:.15},
 {id:"maze",icon:"🟢",title:"Neon Maze",sel:"#score",w:.5}
];
const BIG={id:"city",icon:"🏙️",title:"Dream City"};
let pts=Number(localStorage.getItem("sp_pts"))||0,city=null;try{city=JSON.parse(localStorage.getItem("sp_city"))}catch(e){}
let cur=null,last=0,poll=null,tt=0;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("sp_pts",pts);if(city)localStorage.setItem("sp_city",JSON.stringify(city))}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2800)}
function render(){
 $("pts").textContent=Math.floor(pts);
 let n=0,ci=0;if(city&&city.grid)city.grid.forEach(b=>{if(b)n++});$("bestf").textContent=n;$("cinc").textContent="";
 $("mini").innerHTML=MINI.map(g=>`<button class="card" onclick="openGame('${g.id}')"><b>${g.icon}</b>${g.title}<small>Spelen</small></button>`).join("");
}
function show(g){$("gname").textContent=g.icon+" "+g.title;$("livepts").textContent=Math.floor(pts);$("home").classList.add("hidden");$("play").classList.remove("hidden");$("frame").srcdoc=GAMES[g.id]}
function openGame(id){cur=MINI.find(g=>g.id===id);last=0;tt=0;show(cur);clearInterval(poll);poll=setInterval(tick,1000)}
function openBig(){cur=BIG;clearInterval(poll);show(BIG)}
function add(p){pts+=p;save();$("livepts").textContent=Math.floor(pts)}
function readScore(){
 try{const el=$("frame").contentDocument.querySelector(cur.sel);if(!el)return null;
  const n=parseInt(el.textContent.replace(/[^\d]/g,""),10);return isNaN(n)?null:n}catch(e){return null}
}
function tick(){
 if(!cur||cur===BIG)return;
 const s=readScore();if(s===null){if(++tt%5===0)add(1);return}
 if(s<last)last=0;if(s>last){add((s-last)*cur.w);last=s}
}
window.addEventListener("message",e=>{
 const d=e.data;if(!d||cur!==BIG)return;
 if(d.type==="city-ready")e.source.postMessage({type:"city-init",pts:pts,city:city},"*");
 if(d.type==="city-state"){pts=d.pts;city=d.city;save();$("livepts").textContent=Math.floor(pts)}
});
function closeGame(){clearInterval(poll);cur=null;$("frame").srcdoc="";$("play").classList.add("hidden");$("home").classList.remove("hidden");render()}
function resetAll(){if(confirm("Alle punten wissen?")){pts=0;city=null;localStorage.removeItem("sp_city");save();render()}}
render();
</script>
