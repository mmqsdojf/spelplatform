card{\n    width:min(760px,100%);\n\n    padding:18px;\n\n    border:2px solid #83d0cc;\n\n    border-radius:19px;\n\n    background:#eafbfa;\n\n    text-align:center;\n}\n\n.name-label{\n    display:block;\n\n    margin-bottom:6px;\n\n    color:#417977;\n\n    font-size:11px;\n\n    font-weight:1000;\n}\n\n.name-input{\n    width:min(380px,100%);\n\n    border:3px solid #82d0cc;\n\n    border-radius:13px;\n\n    padding:11px 13px;\n\n    background:white;\n\n    color:#1c6867;\n\n    font-size:17px;\n\n    font-weight:900;\n\n    text-align:center;\n\n    outline:none;\n\n    user-select:text;\n}\n\n.name-input:focus{\n    border-color:#218f8a;\n}\n\n.online-actions{\n    margin-top:12px;\n\n    display:flex;\n\n    justify-content:center;\n\n    gap:8px;\n\n    flex-wrap:wrap;\n}\n\n.online-button{\n    border:2px solid #78c9c5;\n\n    background:#dff8f7;\n\n    color:#24726f;\n\n    border-radius:12px;\n\n    padding:9px 15px;\n\n    font-size:10px;\n\n    font-weight:1000;\n}\n\n.online-button.active{\n    background:#208e89;\n\n    border-color:#17746f;\n\n    color:white;\n}\n\n.room-code-box{\n    margin:12px auto 8px;\n\n    width:min(440px,100%);\n\n    padding:10px;\n\n    border-radius:14px;\n\n    background:#218f8a;\n\n    color:white;\n}\n\n.room-code-title{\n    font-size:9px;\n\n    font-weight:900;\n\n    opacity:.9;\n}\n\n.room-code{\n    display:block;\n\n    margin-top:2px;\n\n    font-size:30px;\n\n    letter-spacing:6px;\n\n    font-weight:1000;\n}\n\n.room-input{\n    width:min(300px,100%);\n\n    border:3px solid #82d0cc;\n\n    border-radius:12px;\n\n    padding:10px;\n\n    background:white;\n\n    color:#176b68;\n\n    font-size:17px;\n\n    font-weight:1000;\n\n    text-align:center;\n\n    letter-spacing:3px;\n\n    outline:none;\n\n    user-select:text;\n\n    text-transform:uppercase;\n}\n\n.online-status{\n    min-height:20px;\n\n    margin-top:8px;\n\n    color:#648685;\n\n    font-size:10px;\n\n    font-weight:800;\n}\n\n.player-list{\n    width:min(570px,100%);\n\n    max-height:145px;\n\n    overflow:hidden auto;\n\n    margin:12px auto 0;\n\n    padding:8px;\n\n    border-radius:14px;\n\n    background:#dff7f6;\n\n    border:2px solid #8bd2ce;\n}\n\n.player-list-title{\n    margin-bottom:6px;\n\n    color:#3b7775;\n\n    font-size:9px;\n\n    font-weight:1000;\n}\n\n.player-row{\n    display:flex;\n\n    justify-content:space-between;\n\n    align-items:center;\n\n    gap:5px;\n\n    padding:6px 8px;\n\n    margin:3px 0;\n\n    border-radius:9px;\n\n    background:white;\n\n    border:1px solid #acdeda;\n\n    color:#376e6c;\n\n    font-size:10px;\n\n    font-weight:900;\n}\n\n.player-host{\n    color:#148b86;\n}\n\n.player-ready{\n    font-size:9px;\n\n    color:#25918b;\n}\n\n.setup-bottom{\n    display:flex;\n\n    justify-content:center;\n\n    gap:8px;\n\n    flex-wrap:wrap;\n}\n\n.back-btn{\n    border:2px solid #7dc9c5;\n\n    background:#e0f7f6;\n\n    color:#26726f;\n\n    border-radius:12px;\n\n    padding:10px 20px;\n\n    font-size:11px;\n\n    font-weight:1000;\n}\n\n\n/* =====================================================\n   QUIZ\n===================================================== */\n\n#quizScreen{\n    padding:8px;\n\n    gap:6px;\n}\n\n\n/* TOP */\n\n.quiz-top{\n    display:grid;\n\n    grid-template-columns:auto 1fr auto auto;\n\n    align-items:center;\n\n    gap:6px;\n\n    flex-shrink:0;\n}\n\n.question-counter{\n    color:#25807d;\n\n    font-size:10px;\n\n    font-weight:1000;\n\n    white-space:nowrap;\n}\n\n.center-score{\n    text-align:center;\n\n    color:#6c9290;\n\n    font-size:9px;\n}\n\n.center-score strong{\n    color:#138985;\n\n    font-size:18px;\n}\n\n.quiz-btn{\n    border:2px solid #7bc9c5;\n\n    background:#e3f8f7;\n\n    color:#267472;\n\n    border-radius:10px;\n\n    padding:6px 8px;\n\n    font-size:8px;\n\n    font-weight:1000;\n}\n\n\n/* TIMER */\n\n.timer-wrap{\n    width:100%;\n\n    height:9px;\n\n    overflow:hidden;\n\n    border-radius:20px;\n\n    background:#d8eeee;\n\n    border:2px solid #91d4d0;\n\n    flex-shrink:0;\n}\n\n.timer-bar{\n    width:100%;\n\n    height:100%;\n\n    background:\n        linear-gradient(\n            90deg,\n            #35c9c2,\n            #128b87\n        );\n\n    transition:width .05s linear;\n}\n\n\n/* QUESTION */\n\n.question-box{\n    width:min(900px,100%);\n\n    margin:0 auto;\n\n    padding:13px 15px;\n\n    border-radius:17px;\n\n    background:#e5fbfa;\n\n    border:3px solid #67c5c1;\n\n    text-align:center;\n\n    flex-shrink:0;\n}\n\n.question-number{\n    margin-bottom:3px;\n\n    color:#65918f;\n\n    font-size:8px;\n\n    font-weight:900;\n}\n\n.question-text{\n    color:#176f6d;\n\n    font-size:clamp(19px,3.4vw,29px);\n\n    line-height:1.2;\n\n    font-weight:1000;\n}\n\n\n/* ANSWERS */\n\n.answers{\n    flex:1;\n\n    min-height:0;\n\n    width:min(900px,100%);\n\n    margin:0 auto;\n\n    display:grid;\n\n    grid-template-columns:1fr 1fr;\n\n    grid-template-rows:1fr 1fr;\n\n    gap:8px;\n\n    padding:2px;\n}\n\n.answer{\n    position:relative;\n\n    border:3px solid #87d2ce;\n\n    border-radius:16px;\n\n    background:#f2ffff;\n\n    color:#2b7371;\n\n    font-size:clamp(13px,2.3vw,20px);\n\n    font-weight:1000;\n\n    padding:9px 30px 9px 12px;\n\n    box-shadow:\n        0 5px 12px\n        rgba(35,116,114,.07);\n}\n\n.answer-letter{\n    position:absolute;\n\n    top:6px;\n    right:7px;\n\n    width:25px;\n    height:25px;\n\n    display:flex;\n\n    align-items:center;\n    justify-content:center;\n\n    border-radius:50%;\n\n    background:#d1f5f3;\n\n    color:#26817d;\n\n    font-size:9px;\n\n    font-weight:1000;\n}\n\n.answer.correct{\n    background:#b9eeea;\n\n    border-color:#199c96;\n\n    color:#126c69;\n}\n\n.answer.wrong{\n    background:#e0f4f3;\n\n    border-color:#93bfbd;\n\n    color:#648685;\n}\n\n.answer.disabled{\n    pointer-events:none;\n}\n\n\n/* FEEDBACK */\n\n.feedback{\n    min-height:23px;\n\n   >\n            START QUIZ 🚀\n        <\/button>\n\n    <\/div>\n\n<\/section>\n\n\n<\u0021-- =====================================================\n     QUIZ\n===================================================== -->\n\n<section\n    id=\"quizScreen\"\n    class=\"screen hidden\"\n>\n\n    <div class=\"quiz-top\">\n\n        <div\n            id=\"questionCounter\"\n            class=\"question-counter\"\n        >\n            VRAAG 1/10\n        <\/div>\n\n\n        <div class=\"center-score\">\n\n            SCORE:\n            <strong id=\"gameScore\">\n                0\n            <\/strong>\n\n        <\/div>\n\n\n        <button\n            id=\"pauseBtn\"\n            class=\"quiz-btn\"\n        >\n            ⏸️\n        <\/button>\n\n\n        <button\n            id=\"quizHomeBtn\"\n            class=\"quiz-btn\"\n        >\n            🏠\n        <\/button>\n\n    <\/div>\n\n\n    <div class=\"timer-wrap\">\n\n        <div\n            id=\"timerBar\"\n            class=\"timer-bar\"\n        ><\/div>\n\n    <\/div>\n\n\n    <div class=\"question-box\">\n\n        <div\n            id=\"questionNumber\"\n            class=\"question-number\"\n        >\n            VRAAG 1\n        <\/div>\n\n        <div\n            id=\"questionText\"\n            class=\"question-text\"\n        >\n            Vraag\n        <\/div>\n\n    <\/div>\n\n\n    <div\n        id=\"answers\"\n        class=\"answers\"\n    >\n    <\/div>\n\n\n    <div\n        id=\"feedback\"\n        class=\"feedback\"\n    >\n    <\/div>\n\n\n    <div\n        id=\"subFeedback\"\n        class=\"sub-feedback\"\n    >\n        Kies zo snel mogelijk.\n    <\/div>\n\n\n    <div\n        id=\"scoreboard\"\n        class=\"scoreboard\"\n    >\n    <\/div>\n\n\n    <div class=\"bottom\">\n\n        <span>\n            🔥 STREAK:\n            <b id=\"streak\">\n                0\n            <\/b>\n        <\/span>\n\n        <span>\n            ✅ GOED:\n            <b id=\"correctCount\">\n                0\n            <\/b>\n        <\/span>\n\n        <span id=\"speedText\">\n            ⚡ SNELSTE ANTWOORD WINT\n        <\/span>\n\n    <\/div>\n\n<\/section>\n\n\n<\u0021-- =====================================================\n     RESULT\n===================================================== -->\n\n<div\n    id=\"resultOverlay\"\n    class=\"overlay hidden\"\n>\n\n    <div class=\"overlay-card\">\n\n        <div\n            id=\"resultIcon\"\n            class=\"overlay-icon\"\n        >\n            🏆\n        <\/div>\n\n\n        <div\n            id=\"resultTitle\"\n            class=\"overlay-title\"\n        >\n            KLAAR!\n        <\/div>\n\n\n        <div\n            id=\"resultScore\"\n            class=\"overlay-score\"\n        >\n            0\n        <\/div>\n\n\n        <div\n            id=\"resultText\"\n            class=\"overlay-text\"\n        >\n        <\/div>\n\n\n        <div\n            id=\"finalRanking\"\n            class=\"final-ranking\"\n        >\n        <\/div>\n\n\n        <div class=\"overlay-buttons\">\n\n            <button\n                id=\"againBtn\"\n                class=\"start-main\"\n            >\n                🔄 OPNIEUW\n            <\/button>\n\n\n            <button\n                id=\"resultHomeBtn\"\n                class=\"overlay-home\"\n            >\n                🏠 TERUG NAAR HOME\n            <\/button>\n\n        <\/div>\n\n    <\/div>\n\n<\/div>\n\n\n<\u0021-- =====================================================\n     PAUSE\n===================================================== -->\n\n<div\n    id=\"pauseOverlay\"\n    class=\"overlay hidden\"\n>\n\n    <div class=\"overlay-card\">\n\n        <div class=\"overlay-icon\">\n            ⏸️\n        <\/div>\n\n        <div class=\"overlay-title\">\n            PAUZE\n        <\/div>\n\n        <div class=\"overlay-text\">\n            De quiz staat tijdelijk stil.\n        <\/div>\n\n        <button\n            id=\"resumeBtn\"\n            class=\"start-main\"\n        >\n            ▶ VERDER\n        <\/button>\n\n    <\/div>\n\n<\/div>\n\n\n<\u0021-- =====================================================\n     TOAST\n===================================================== -->\n\n<div\n    id=\"toast\"\n    class=\"toast\"\n>\n<\/div>\n\n\n<\/div>\n<\/div>\n\n\n<script>\n\"use strict\";\n\n\n/* =====================================================\n   ELEMENTEN\n===================================================== */\n\nconst homeScreen =\n    document.getElementById(\"homeScreen\");\n\nconst setupScreen =\n    document.getElementById(\"setupScreen\");\n\nconst quizScreen =\n    document.getElementById(\"quizScreen\");\n\nconst continueBtn =\n    document.getElementById(\"continueBtn\");\n\nconst setupHomeBtn =\n    document.getElementById(\"setupHomeBtn\");\n\nconst setupStartBtn =\n    document.getElementById(\"setupStartBtn\");\n\nconst quizHomeBtn =\n    document.getElementById(\"quizHomeBtn\");\n\nconst pauseBtn =\n    document.getElementById(\"pauseBtn\");\n\nconst resumeBtn =\n    document.getElementById(\"resumeBtn\");\n\nconst againBtn =\n    document.getElementById(\"againBtn\");\n\nconst resultHomeBtn =\n    document.getElementById(\"resultHomeBtn\");\n\nconst resultOverlay =\n    document.getElementById(\"resultOverlay\");\n\nconst pauseOverlay =\n    document.getElementById(\"pauseOverlay\");\n\nconst nameInput =\n    document.getElementById(\"nameInput\");\n\nconst onlineArea =\n    document.getElementById(\"onlineArea\");\n\nconst hostButton =\n    document.getElementById(\"hostButton\");\n\nconst joinButton =\n    document.getElementById(\"joinButton\");\n\nconst hostArea =\n    document.getElementById(\"hostArea\");\n\nconst joinArea =\n    document.getElementById(\"joinArea\");\n\nconst roomCodeEl =\n    document.getElementById(\"roomCode\");\n\nconst roomInput =\n    document.getElementById(\"roomInput\");\n\nconst onlineStatus =\n    document.getElementById(\"onlineStatus\");\n\nconst playersEl =\n    document.getElementById(\"players\");\n\nconst playerList =\n    document.getElementById(\"playerList\");\n\nconst questionCounter =\n    document.getElementById(\"questionCounter\");\n\nconst questionNumber =\n    document.getElementById(\"questionNumber\");\n\nconst questionText =\n    document.getElementById(\"questionText\");\n\nconst answersEl =\n    document.getElementById(\"answers\");\n\nconst timerBar =\n    document.getElementById(\"timerBar\");\n\nconst feedback =\n    document.getElementById(\"feedback\");\n\nconst subFeedback =\n    document.getElementById(\"subFeedback\");\n\nconst scoreboardEl =\n    document.getElementById(\"scoreboard\");\n\nconst gameScoreEl =\n    document.getElementById(\"gameScore\");\n\nconst headerScore =\n    document.getElementById(\"headerScore\");\n\nconst bestScoreEl =\n    document.getElementById(\"bestScore\");\n\nconst streakEl =\n    document.getElementById(\"streak\");\n\nconst correctCountEl =\n    document.getElementById(\"correctCount\");\n\nconst resultIcon =\n    document.getElementById(\"resultIcon\");\n\nconst resultTitle =\n    document.getElementById(\"resultTitle\");\n\nconst resultScore =\n    document.getElementById(\"resultScore\");\n\nconst resultText =\n    document.getElementById(\"resultText\");\n\nconst finalRanking =\n    document.getElementById(\"finalRanking\");\n\nconst toast =\n    document.getElementById(\"toast\");\n\n\n/* =====================================================\n   VRAGEN\n===================================================== */\n\nconst questionBank = [\n\n    {\n        q:\"Welke planeet heeft de kortste omlooptijd rond de zon?\",\n        a:[\"Venus\",\"Mercurius\",\"Mars\",\"Aarde\"],\n        correct:1\n    },\n\n    {\n        q:\"Welke van deze getallen is een priemgetal?\",\n        a:[\"51\",\"57\",\"61\",\"69\"],\n        correct:2\n    },\n\n    {\n        q:\"Wat is de hoofdstad van Kazachstan?\",\n        a:[\"Almaty\",\"Astana\",\"Bisjkek\",\"Dushanbe\"],\n        correct:1\n    },\n\n    {\n        q:\"Welke laag van de aarde is grotendeels vloeibaar?\",\n        a:[\"Aardkorst\",\"Buitenste kern\",\"Binnenste kern\",\"Bovenmantel\"],\n        correct:1\n    },\n\n    {\n        q:\"Wie formuleerde de drie bewegingswetten?\",\n        a:[\"Galileo Galilei\",\"Isaac Newton\",\"Charles Darwin\",\"Niels Bohr\"],\n        correct:1\n    },\n\n    {\n        q:\"Wat is 17²?\",\n        a:[\"279\",\"289\",\"297\",\"299\"],\n        correct:1\n    },\n\n    {\n        q:\"Welke rivier stroomt door de stad Boedapest?\",\n        a:[\"Donau\",\"Rijn\",\"Elbe\",\"Seine\"],\n        correct:0\n    },\n\n    {\n        q:\"Welke chemische formule hoort bij zwavelzuur?\",\n        a:[\"HCl\",\"H₂SO₄\",\"NaOH\",\"CO₂\"],\n        correct:1\n    },\n\n    {\n        q:\"In welk jaar viel de Berlijnse Muur?\",\n        a:[\"1987\",\"1988\",\"1989\",\"1990\"],\n        correct:2\n    },\n\n    {\n        q:\"Wat is het kleinste getal dat deelbaar is door 2, 3, 4 en 5?\",\n        a:[\"30\",\"40\",\"60\",\"120\"],\n        correct:2\n    },\n\n    {\n        q:\"Welke woestijn is de grootste hete woestijn ter wereld?\",\n        a:[\"Gobi\",\"Sahara\",\"Atacama\",\"Kalahari\"],\n        correct:1\n    },\n\n    {\n        q:\"Welke wetenschapper ontwikkelde de relativiteitstheorie?\",\n        a:[\"Marie Curie\",\"Albert Einstein\",\"Max Planck\",\"James Clerk Maxwell\"],\n        correct:1\n    },\n\n    {\n        q:\"Welke taal is geen Romaanse taal?\",\n        a:[\"Spaans\",\"Portugees\",\"Roemeens\",\"Duits\"],\n        correct:3\n    },\n\n    {\n        q:\"Hoeveel diagonalen heeft een zeshoek?\",\n        a:[\"6\",\"9\",\"12\",\"15\"],\n        correct:1\n    },\n\n    {\n        q:\"Welke planeet staat bekend om zijn grote rode vlek?\",\n        a:[\"Mars\",\"Jupiter\",\"Saturnus\",\"Neptunus\"],\n        correct:1\n    },\n\n    {\n        q:\"Wat is de SI-eenheid van elektrische weerstand?\",\n        a:[\"Volt\",\"Watt\",\"Ohm\",\"Ampère\"],\n        correct:2\n    },\n\n    {\n        q:\"Welke zeestraat scheidt Europa van Afrika?\",\n        a:[\"Bosporus\",\"Straat van Gibraltar\",\"Beringstraat\",\"Straat van Malakka\"],\n        correct:1\n    },\n\n    {\n        q:\"Wat is 15% van 360?\",\n        a:[\"36\",\"45\",\"54\",\"60\"],\n        correct:2\n    },\n\n    {\n        q:\"Welke stof gebruiken planten tijdens fotosynthese uit de lucht?\",\n        a:[\"Zuurstof\",\"Stikstof\",\"Koolstofdioxide\",\"Helium\"],\n        correct:2\n    },\n\n    {\n        q:\"Welke hoofdstad ligt het dichtst bij de evenaar?\",\n        a:[\"Quito\",\"Madrid\",\"Rome\",\"Athene\"],\n        correct:0\n    },\n\n    {\n        q:\"Welke Romeinse keizer werd volgens de legende met de naam 'Nero' geassocieerd?\",\n        a:[\"Augustus\",\"Nero\",\"Trajanus\",\"Hadrianus\"],\n        correct:1\n    },\n\n    {\n        q:\"Wat is de wortel van 225?\",\n        a:[\"13\",\"14\",\"15\",\"16\"],\n        correct:2\n    },\n\n    {\n        q:\"Welke oceaan is het diepst?\",\n        a:[\"Atlantische Oceaan\",\"Indische Oceaan\",\"Stille Oceaan\",\"Arctische Oceaan\"],\n        correct:2\n    },\n\n    {\n        q:\"Welke bloedgroep wordt vaak de universele donor voor rode bloedcellen genoemd?\",\n        a:[\"AB+\",\"A+\",\"O−\",\"B−\"],\n        correct:2\n    },\n\n    {\n        q:\"Welke componist schreef de 9e symfonie?\",\n        a:[\"Mozart\",\"Beethoven\",\"Bach\",\"Vivaldi\"],\n        correct:1\n    },\n\n    {\n        q:\"Hoeveel is 3⁵?\",\n        a:[\"125\",\"243\",\"625\",\"729\"],\n        correct:1\n    },\n\n    {\n        q:\"Welke planeet heeft de grootste massa in ons zonnestelsel?\",\n        a:[\"Saturnus\",\"Jupiter\",\"Neptunus\",\"Uranus\"],\n        correct:1\n    },\n\n    {\n        q:\"Welke organische stof is de belangrijkste energiereserve in planten?\",\n        a:[\"Glycogeen\",\"Zetmeel\",\"Cellulose\",\"Glucose\"],\n        correct:1\n    },\n\n    {\n        q:\"Welke Nederlandse schilder maakte 'De Nachtwacht'?\",\n        a:[\"Vermeer\",\"Van Gogh\",\"Rembrandt\",\"Mondriaan\"],\n        correct:2\n    },\n\n    {\n        q:\"Als x + 7 = 19, wat is x?\",\n        a:[\"10\",\"11\",\"12\",\"13\"],\n        correct:2\n    },\n\n    {\n        q:\"Welke berg is de hoogste ter wereld boven zeeniveau?\",\n        a:[\"K2\",\"Mount Everest\",\"Kangchenjunga\",\"Mont Blanc\"],\n        correct:1\n    },\n\n    {\n        q:\"Welk metaal heeft het chemische symbool Fe?\",\n        a:[\"Fluor\",\"IJzer\",\"Fosfor\",\"Francium\"],\n        correct:1\n    },\n\n    {\n        q:\"Welke ontdekkingsreiziger bereikte in 1492 Amerika?\",\n        a:[\"Vasco da Gama\",\"Christoffel Columbus\",\"Magellaan\",\"James Cook\"],\n        correct:1\n    },\n\n    {\n        q:\"Wat is de gemiddelde score van 10, 20 en 30?\",\n        a:[\"15\",\"20\",\"25\",\"30\"],\n        correct:1\n    },\n\n    {\n        q:\"Welke planeet heeft de meest opvallende ringen?\",\n        a:[\"Mars\",\"Saturnus\",\"Aarde\",\"Venus\"],\n        correct:1\n    },\n\n    {\n        q:\"Welke Belgische stad staat bekend om het Atomium?\",\n        a:[\"Antwerpen\",\"Brugge\",\"Brussel\",\"Gent\"],\n        correct:2\n    },\n\n    {\n        q:\"Welke eenheid wordt gebruikt voor frequentie?\",\n        a:[\"Pascal\",\"Hertz\",\"Newton\",\"Joule\"],\n        correct:1\n    },\n\n    {\n        q:\"Welke oceaan ligt tussen Afrika en Australië?\",\n        a:[\"Atlantische Oceaan\",\"Indische Oceaan\",\"Stille Oceaan\",\"Arctische Oceaan\"],\n        correct:1\n    },\n\n    {\n        q:\"Wat is 7 × 13?\",\n        a:[\"81\",\"91\",\"97\",\"101\"],\n        correct:1\n    },\n\n    {\n        q:\"Welke planeet draait het snelst om de zon?\",\n        a:[\"Aarde\",\"Venus\",\"Mercurius\",\"Mars\"],\n        correct:2\n    }\n\n];\n\n\n/* =====================================================\n   STATE\n===================================================== */\n\nlet mode = \"solo\";\n\nlet onlineType = \"host\";\n\nlet myName = \"\";\n\nlet gameRunning = false;\n\nlet paused = false;\n\nlet currentQuestion = 0;\n\nlet score = 0;\n\nlet streak = 0;\n\nlet correctCount = 0;\n\nlet soloQuestions = [];\n\nlet onlineQuestions = [];\n\nlet activeQuestions = [];\n\nlet currentQuestionData = null;\n\nlet answeredThisQuestion = false;\n\nlet questionLocked = false;\n\nlet timerInterval = null;\n\nlet timeLeft = 0;\n\nlet maxTime = 12000;\n\nlet questionStartedAt = 0;\n\n\n/* =====================================================\n   ONLINE\n===================================================== */\n\nlet peer = null;\n\nlet connection = null;\n\nlet roomCode = \"\";\n\nlet isHost = false;\n\nlet onlineStarted = false;\n\nlet players = {};\n\nlet answeredPlayers = {};\n\nlet firstCorrectPlayer = null;\n\nlet hostQuestionTimer = null;\n\n\n/* =====================================================\n   BEST\n===================================================== */\n\nlet bestScore =\n    Number(\n        localStorage.getItem(\"miniQuizBest\")\n    ) || 0;\n\nbestScoreEl.textContent =\n    bestScore;\n\n\n/* =====================================================\n   MODE\n===================================================== */\n\ndocument\n.querySelectorAll(\".mode-card\")\n.forEach(card => {\n\n    card.addEventListener(\n        \"click\",\n        () => {\n\n            document\n            .querySelectorAll(\".mode-card\")\n            .forEach(c =>\n                c.classList.remove(\"selected\")\n            );\n\n            card.classList.add(\"selected\");\n\n            mode =\n                card.dataset.mode;\n\n        }\n    );\n\n});\n\n\n/* =====================================================\n   SETUP\n===================================================== */\n\ncontinueBtn.addEventListener(\n    \"click\",\n    showSetup\n);\n\n\nfunction showSetup(){\n\n    homeScreen.classList.add(\n        \"hidden\"\n    );\n\n    setupScreen.classList.remove(\n        \"hidden\"\n    );\n\n\n    resultOverlay.classList.add(\n        \"hidden\"\n    );\n\n    pauseOverlay.classList.add(\n        \"hidden\"\n    );\n\n\n    if(mode === \"solo\"){\n\n        setupTitle.textContent =\n            \"MINI QUIZ\";\n\n        setupText.textContent =\n            \"Vul je naam in voordat je begint.\";\n\n        onlineArea.classList.add(\n            \"hidden\"\n        );\n\n        setupStartBtn.disabled =\n            false;\n\n        setupStartBtn.textContent =\n            \"START QUIZ 🚀\";\n\n        setupStartBtn.style.display =\n            \"\";\n\n        closeOnline();\n\n    }\n    else{\n\n        setupTitle.textContent =\n            \"ONLINE QUIZ\";\n\n        setupText.textContent =\n            \"Vul eerst je naam in.\";\n\n        onlineArea.classList.remove(\n            \"hidden\"\n        );\n\n        setupStartBtn.textContent =\n            \"START QUIZ 🚀\";\n\n        setupStartBtn.disabled =\n            true;\n\n        setupStartBtn.style.display =\n            \"\";\n\n        hostMode();\n\n    }\n\n\n    setTimeout(\n        () => nameInput.focus(),\n        100\n    );\n\n}\n\n\n/* =====================================================\n   NAAM VERANDERT\n===================================================== */\n\nnameInput.addEventListener(\n    \"input\",\n    () => {\n\n        validateSetup();\n\n        if(\n            mode === \"online\" &&\n            isHost\n        ){\n\n            updateOwnPlayer();\n\n        }\n\n    }\n);\n\n\n/* =====================================================\n   HOST BUTTON\n===================================================== */\n\nhostButton.addEventListener(\n    \"click\",\n    hostMode\n);\n\n\nfunction hostMode(){\n\n    onlineType = \"host\";\n\n    isHost = true;\n\n    hostButton.classList.add(\n        \"active\"\n    );\n\n    joinButton.classList.remove(\n        \"active\"\n    );\n\n    hostArea.classList.remove(\n        \"hidden\"\n    );\n\n    joinArea.classList.add(\n        \"hidden\"\n    );\n\n\n    roomInput.value = \"\";\n\n    setupStartBtn.textContent =\n        \"START QUIZ 🚀\";\n\n    setupStartBtn.disabled = true;\n\n\n    createHostRoom();\n\n}\n\n\n/* =====================================================\n   JOIN BUTTON\n===================================================== */\n\njoinButton.addEventListener(\n    \"click\",\n    () => {\n\n        onlineType = \"join\";\n\n        isHost = false;\n\n        hostButton.classList.remove(\n            \"active\"\n        );\n\n        joinButton.classList.add(\n            \"active\"\n        );\n\n        hostArea.classList.add(\n            \"hidden\"\n        );\n\n        joinArea.classList.remove(\n            \"hidden\"\n        );\n\n\n        closeOnline();\n\n\n        onlineStatus.textContent =\n            \"Voer een kamer-code in.\";\n\n        setupStartBtn.textContent =\n            \"KLAAR ✅\";\n\n        setupStartBtn.disabled =\n            true;\n\n    }\n);\n\n\n/* =====================================================\n   SETUP VALIDATE\n===================================================== */\n\nfunction validateSetup(){\n\n    const name =\n        nameInput.value.trim();\n\n\n    if(mode === \"solo\"){\n\n        setupStartBtn.disabled =\n            name.length < 1;\n\n        return;\n\n    }\n\n\n    if(\n        isHost &&\n        onlineType === \"host\"\n    ){\n\n        setupStartBtn.disabled =\n            !name ||\n            !peer;\n\n    }\n    else{\n\n        setupStartBtn.disabled =\n            !name ||\n            !connection;\n\n    }\n\n}\n\n\n/* =====================================================\n   SETUP START\n===================================================== */\n\nsetupStartBtn.addEventListener(\n    \"click\",\n    () => {\n\n        myName =\n            nameInput.value.trim();\n\n        if(!myName){\n\n            showToast(\n                \"Vul eerst je naam in.\"\n            );\n\n            return;\n\n        }\n\n\n        if(mode === \"solo\"){\n\n            startSoloQuiz();\n\n        }\n        else if(isHost){\n\n            startOnlineAsHost();\n\n        }\n        else{\n\n            sendGuestReady();\n\n        }\n\n    }\n);\n\n\n/* =====================================================\n   SOLO START\n===================================================== */\n\nfunction startSoloQuiz(){\n\n    stopAllTimers();\n\n    score = 0;\n\n    streak = 0;\n\n    correctCount = 0;\n\n    currentQuestion = 0;\n\n    answeredThisQuestion = false;\n\n    questionLocked = false;\n\n    gameRunning = true;\n\n    paused = false;\n\n\n    soloQuestions =\n        shuffle(\n            [...questionBank]\n        ).slice(\n            0,\n            10\n        );\n\n\n    activeQuestions =\n        soloQuestions;\n\n\n    players = {};\n\n    players[\n        myName\n    ] = {\n        name:myName,\n        score:0,\n        correct:0,\n        isMe:true\n    };\n\n\n    showQuizScreen();\n\n    updateScoreboard();\n\n    showQuestion();\n\n}\n\n\n/* =====================================================\n   ONLINE HOST ROOM\n===================================================== */\n\nfunction createHostRoom(){\n\n    closeOnline();\n\n    isHost = true;\n\n    onlineType = \"host\";\n\n    players = {};\n\n    const code =\n        generateRoomCode();\n\n    roomCode =\n        code;\n\n    roomCodeEl.textContent =\n        code;\n\n\n    if(\n        typeof Peer === \"undefined\"\n    ){\n\n        onlineStatus.textContent =\n            \"Online module kon niet laden.\";\n\n        return;\n\n    }\n\n\n    peer =\n        new Peer(\n            \"MINI_QUIZ_\" +\n            code\n        );\n\n\n    onlineStatus.textContent =\n        \"Kamer wordt gemaakt...\";\n\n\n    peer.on(\n        \"open\",\n        () => {\n\n            onlineStatus.textContent =\n                \"Kamer klaar! Deel de code.\";\n\n            setupStartBtn.disabled =\n                !nameInput.value.trim();\n\n            validateSetup();\n\n            updateOwnPlayer();\n\n        }\n    );\n\n\n    peer.on(\n        \"connection\",\n        conn => {\n\n            handleNewGuest(conn);\n\n        }\n    );\n\n\n    peer.on(\n        \"error\",\n        error => {\n\n            console.error(\n                error\n            );\n\n            onlineStatus.textContent =\n                \"Deze kamer-code is al bezet. Nieuwe kamer maken...\";\n\n            setTimeout(\n                () => {\n\n                    if(\n                        mode === \"online\" &&\n                        onlineType === \"host\"\n                    ){\n\n                        createHostRoom();\n\n                    }\n\n                },\n                700\n            );\n\n        }\n    );\n\n}\n\n\n/* =====================================================\n   GUEST CONNECTION\n===================================================== */\n\nfunction joinRoom(){\n\n    const code =\n        roomInput.value\n        .trim()\n        .toUpperCase();\n\n\n    if(\n        !/^[A-Z0-9]{6}$/.test(code)\n    ){\n\n        showToast(\n            \"Gebruik een code van 6 tekens.\"\n        );\n\n        return;\n\n    }\n\n\n    closeOnline();\n\n    isHost = false;\n\n    onlineType = \"join\";\n\n\n    peer =\n        new Peer();\n\n\n    onlineStatus.textContent =\n        \"Verbinden met kamer...\";\n\n\n    peer.on(\n        \"open\",\n        () => {\n\n            connection =\n                peer.connect(\n                    \"MINI_QUIZ_\" +\n                    code,\n                    {\n                        reliable:true\n                    }\n                );\n\n\n            connection.on(\n                \"open\",\n                () => {\n\n                    onlineStatus.textContent =\n                        \"Verbonden! Druk op KLAAR.\";\n\n                    validateSetup();\n\n                }\n            );\n\n\n            connection.on(\n                \"data\",\n                handleData\n            );\n\n\n            connection.on(\n                \"close\",\n                () => {\n\n                    connection =\n                        null;\n\n                    onlineStatus.textContent =\n                        \"Verbinding verbroken.\";\n\n                    setupStartBtn.disabled =\n                        true;\n\n                }\n            );\n\n        }\n    );\n\n\n    peer.on(\n        \"error\",\n        () => {\n\n            onlineStatus.textContent =\n                \"Kamer niet gevonden.\";\n\n            connection =\n                null;\n\n            setupStartBtn.disabled =\n                true;\n\n        }\n    );\n\n}\n\n\nroomInput.addEventListener(\n    \"input\",\n    () => {\n\n        roomInput.value =\n            roomInput.value\n            .toUpperCase()\n            .replace(\n                /[^A-Z0-9]/g,\n                \"\"\n            )\n            .slice(0,6);\n\n    }\n);\n\n\n/* JOIN EVENT */\njoinArea.addEventListener(\n    \"click\",\n    event => {\n\n        if(\n            event.target === roomInput\n        )\n            return;\n\n    }\n);\n\n\n/* separate join action via Enter */\n\nroomInput.addEventListener(\n    \"keydown\",\n    event => {\n\n        if(\n            event.key === \"Enter\"\n        ){\n\n            joinRoom();\n\n        }\n\n    }\n);\n\n\n/* JOIN BUTTON */\njoinButton.addEventListener(\n    \"dblclick\",\n    joinRoom\n);\n\n\n/*\n   Zodra de gast zijn naam invult en op\n   KLAAR drukt, wordt hieronder gestart.\n*/\n\n\n/* =====================================================\n   NEW GUEST\n===================================================== */\n\nfunction handleNewGuest(conn){\n\n    conn.on(\n        \"data\",\n        data => {\n\n            handleGuestData(\n                conn,\n                data\n            );\n\n        }\n    );\n\n\n    conn.on(\n        \"open\",\n        () => {\n\n            onlineStatus.textContent =\n                \"Nieuwe speler verbonden.\";\n\n        }\n    );\n\n\n    conn.on(\n        \"close\",\n        () => {\n\n            const id =\n                conn.peer;\n\n\n            if(\n                players[id]\n            ){\n\n                delete players[id];\n\n                sendLobbyState();\n\n                renderPlayers();\n\n            }\n\n        }\n    );\n\n}\n\n\nfunction handleGuestData(\n    conn,\n    data\n){\n\n    if(!data)\n        return;\n\n\n    if(data.type === \"hello\"){\n\n        const id =\n            conn.peer;\n\n\n        players[id] = {\n\n            id:id,\n\n            name:\n                cleanName(\n                    data.name\n                ),\n\n            score:0,\n\n            correct:0,\n\n            ready:false,\n\n            connection:conn\n\n        };\n\n\n        conn._playerId =\n            id;\n\n\n        sendLobbyState();\n\n        renderPlayers();\n\n        return;\n\n    }\n\n\n    if(data.type === \"ready\"){\n\n        const id =\n            conn.peer;\n\n\n        if(\n            players[id]\n        ){\n\n            players[id].ready =\n                true;\n\n        }\n\n\n        sendLobbyState();\n\n        renderPlayers();\n\n        return;\n\n    }\n\n\n    if(data.type === \"answer\"){\n\n        handleHostAnswer(\n            conn,\n            data\n        );\n\n        return;\n\n    }\n\n}\n\n\n/* =====================================================\n   GUEST HELLO\n===================================================== */\n\nfunction sendGuestHello(){\n\n    if(\n        !connection\n    )\n        return;\n\n\n    connection.send({\n\n        type:\"hello\",\n\n        name:\n            cleanName(\n                nameInput.value\n            )\n\n    });\n\n}\n\n\nfunction sendGuestReady(){\n\n    if(\n        !connection\n    ){\n\n        showToast(\n            \"Je bent nog niet verbonden.\"\n        );\n\n        return;\n\n    }\n\n\n    myName =\n        cleanName(\n            nameInput.value\n        );\n\n\n    connection.send({\n        type:\"hello\",\n        name:myName\n    });\n\n\n    connection.send({\n        type:\"ready\"\n    });\n\n\n    setupStartBtn.disabled =\n        true;\n\n\n    onlineStatus.textContent =\n        \"Je bent klaar! Wacht tot de host start.\";\n\n\n    showWaitingState();\n\n}\n\n\nfunction showWaitingState(){\n\n    playerList.style.display =\n        \"\";\n\n}\n\n\n/* =====================================================\n   GUEST START\n===================================================== */\n\nfunction joinRoomFromInput(){\n\n    joinRoom();\n\n}\n\n\n/* =====================================================\n   HOST START\n===================================================== */\n\nfunction startOnlineAsHost(){\n\n    myName =\n        cleanName(\n            nameInput.value\n        );\n\n\n    if(!myName){\n\n        showToast(\n            \"Vul je naam in.\"\n        );\n\n        return;\n\n    }\n\n\n    updateOwnPlayer();\n\n\n    players.myself = {\n\n        id:\"myself\",\n\n        name:myName,\n\n        score:0,\n\n        correct:0,\n\n        isMe:true\n\n    };\n\n\n    onlineQuestions =\n        shuffle(\n            [...questionBank]\n        ).slice(\n            0,\n            10\n        );\n\n\n    currentQuestion = 0;\n\n    score = 0;\n\n    streak = 0;\n\n    correctCount = 0;\n\n    gameRunning = true;\n\n    paused = false;\n\n    onlineStarted = true;\n\n    answeredPlayers = {};\n\n    firstCorrectPlayer = null;\n\n\n    activeQuestions =\n        onlineQuestions;\n\n\n    broadcast({\n\n        type:\"gameStart\",\n\n        questions:\n            activeQuestions,\n\n        players:\n            serializePlayers()\n\n    });\n\n\n    showQuizScreen();\n\n    updateScoreboard();\n\n    showQuestion();\n\n}\n\n\n/* =====================================================\n   SERIALIZE PLAYERS\n===================================================== */\n\nfunction serializePlayers(){\n\n    const list = [];\n\n\n    if(\n        nameInput.value.trim()\n    ){\n\n        list.push({\n\n            id:\"host\",\n\n            name:\n                cleanName(\n                    nameInput.value\n                ),\n\n            score:score,\n\n            correct:correctCount,\n\n            isHost:true\n\n        });\n\n    }\n\n\n    Object.values(players)\n    .forEach(player => {\n\n        if(\n            player &&\n            player.id !== \"myself\"\n        ){\n\n            list.push({\n\n                id:player.id,\n\n                name:player.name,\n\n                score:player.score || 0,\n\n                correct:player.correct || 0,\n\n                isHost:false\n\n            });\n\n        }\n\n    });\n\n\n    return list;\n\n}\n\n\n/* =====================================================\n   BROADCAST\n===================================================== */\n\nfunction broadcast(data){\n\n    Object.values(players)\n    .forEach(player => {\n\n        if(\n            player &&\n            player.connection &&\n            player.connection.open\n        ){\n\n            try{\n\n                player.connection.send(data);\n\n            }\n            catch(e){}\n\n        }\n\n    });\n\n}\n\n\n/* =====================================================\n   LOBBY STATE\n===================================================== */\n\nfunction sendLobbyState(){\n\n    broadcast({\n\n        type:\"lobby\",\n\n        players:\n            serializeLobbyPlayers()\n\n    });\n\n}\n\n\nfunction serializeLobbyPlayers(){\n\n    return Object.values(players)\n        .filter(player => player)\n        .map(player => ({\n\n            id:player.id,\n\n            name:player.name,\n\n            ready:!!player.ready\n\n        }));\n\n}\n\n\n/* =====================================================\n   RENDER PLAYERS\n===================================================== */\n\nfunction renderPlayers(){\n\n    playersEl.innerHTML =\n        \"\";\n\n\n    if(isHost && nameInput.value.trim()){\n\n        const row =\n            document.createElement(\n                \"div\"\n            );\n\n\n        row.className =\n            \"player-row\";\n\n\n        row.innerHTML = `\n            <span>\n                👑\n                <strong class=\"player-host\">\n                    ${escapeHtml(\n                        cleanName(\n                            nameInput.value\n                        )\n                    )}\n                <\/strong>\n                <small>(HOST)<\/small>\n            <\/span>\n\n            <span class=\"player-ready\">\n                KLAAR\n            <\/span>\n        `;\n\n\n        playersEl.appendChild(\n            row\n        );\n\n    }\n\n\n    Object.values(players)\n    .forEach(\n        player => {\n\n            if(!player)\n                return;\n\n\n            if(\n                player.id === \"myself\"\n            )\n                return;\n\n\n            const row =\n                document.createElement(\n                    \"div\"\n                );\n\n\n            row.className =\n                \"player-row\";\n\n\n            row.innerHTML = `\n\n                <span>\n                    👤\n                    ${escapeHtml(\n                        player.name\n                    )}\n                <\/span>\n\n                <span class=\"player-ready\">\n                    ${\n                        player.ready\n                        ? \"✅ KLAAR\"\n                        : \"⌛ WACHT\"\n                    }\n                <\/span>\n\n            `;\n\n\n            playersEl.appendChild(\n                row\n            );\n\n        }\n    );\n\n}\n\n\n/* =====================================================\n   OWN PLAYER\n===================================================== */\n\nfunction updateOwnPlayer(){\n\n    if(\n        !isHost ||\n        !nameInput.value.trim()\n    )\n        return;\n\n\n    renderPlayers();\n\n}\n\n\n/* =====================================================\n   START GUEST RECEIVED\n===================================================== */\n\nfunction handleGameStart(\n    data\n){\n\n    activeQuestions =\n        data.questions || [];\n\n    currentQuestion =\n        0;\n\n    score = 0;\n\n    streak = 0;\n\n    correctCount = 0;\n\n    gameRunning = true;\n\n    paused = false;\n\n    onlineStarted = true;\n\n    answeredThisQuestion = false;\n\n\n    if(\n        connection\n    ){\n\n        connection.send({\n\n            type:\"hello\",\n\n            name:\n                cleanName(\n                    nameInput.value\n                )\n\n        });\n\n    }\n\n\n    showQuizScreen();\n\n    updateScoreboard();\n\n    showQuestion();\n\n}\n\n\n/* =====================================================\n   DATA ROUTER\n===================================================== */\n\nfunction handleData(data){\n\n    if(!data)\n        return;\n\n\n    if(data.type === \"gameStart\"){\n\n        handleGameStart(data);\n\n        return;\n\n    }\n\n\n    if(data.type === \"question\"){\n\n        activeQuestions =\n            data.questions;\n\n        currentQuestion =\n            data.index;\n\n        firstCorrectPlayer =\n            null;\n\n        answeredThisQuestion =\n            false;\n\n        questionLocked =\n            false;\n\n        showQuestion();\n\n        return;\n\n    }\n\n\n    if(data.type === \"roundWinner\"){\n\n        handleRoundWinner(\n            data\n        );\n\n        return;\n\n    }\n\n\n    if(data.type === \"scoreboard\"){\n\n        receiveScoreboard(\n            data\n        );\n\n        return;\n\n    }\n\n\n    if(data.type === \"questionEnd\"){\n\n        revealOnlineQuestion(\n            data\n        );\n\n        return;\n\n    }\n\n\n    if(data.type === \"gameEnd\"){\n\n        finishOnlineFromHost(\n            data\n        );\n\n        return;\n\n    }\n\n\n    if(data.type === \"lobby\"){\n\n        renderGuestLobby(\n            data.players\n        );\n\n        return;\n\n    }\n\n}\n\n\n/* =====================================================\n   GUEST LOBBY\n===================================================== */\n\nfunction renderGuestLobby(list){\n\n    playersEl.innerHTML =\n        \"\";\n\n\n    if(\n        list &&\n        Array.isArray(list)\n    ){\n\n        list.forEach(\n            player => {\n\n                const row =\n                    document.createElement(\n                        \"div\"\n                    );\n\n\n                row.className =\n                    \"player-row\";\n\n\n                row.innerHTML = `\n                    <span>\n                        👤\n                        ${escapeHtml(\n                            player.name\n                        )}\n                    <\/span>\n\n                    <span class=\"player-ready\">\n                        ${\n                            player.ready\n                            ? \"✅ KLAAR\"\n                            : \"⌛ WACHT\"\n                        }\n                    <\/span>\n                `;\n\n\n                playersEl.appendChild(\n                    row\n                );\n\n            }\n        );\n\n    }\n\n}\n\n\n/* =====================================================\n   SHOW QUIZ\n===================================================== */\n\nfunction showQuizScreen(){\n\n    setupScreen.classList.add(\n        \"hidden\"\n    );\n\n    homeScreen.classList.add(\n        \"hidden\"\n    );\n\n    quizScreen.classList.remove(\n        \"hidden\"\n    );\n\n    resultOverlay.classList.add(\n        \"hidden\"\n    );\n\n    pauseOverlay.classList.add(\n        \"hidden\"\n    );\n\n}\n\n\n/* =====================================================\n   SHOW QUESTION\n===================================================== */\n\nfunction showQuestion(){\n\n    if(!gameRunning)\n        return;\n\n\n    if(\n        currentQuestion >=\n        activeQuestions.length\n    ){\n\n        if(\n            mode === \"solo\"\n        ){\n\n            finishSoloQuiz();\n\n        }\n        else if(isHost){\n\n            finishOnlineHost();\n\n        }\n\n        return;\n\n    }\n\n\n    currentQuestionData =\n        activeQuestions[\n            currentQuestion\n        ];\n\n\n    answeredThisQuestion =\n        false;\n\n    questionLocked =\n        false;\n\n    firstCorrectPlayer =\n        null;\n\n    questionCounter.textContent =\n        `VRAAG ${currentQuestion + 1}/${activeQuestions.length}`;\n\n    questionNumber.textContent =\n        `VRAAG ${currentQuestion + 1}`;\n\n    questionText.textContent =\n        currentQuestionData.q;\n\n    feedback.textContent =\n        \"\";\n\n    subFeedback.textContent =\n        \"⚡ De eerste juiste klik krijgt de meeste punten!\";\n\n\n    answersEl.innerHTML =\n        \"\";\n\n\n    const letters =\n        [\"A\",\"B\",\"C\",\"D\"];\n\n\n    currentQuestionData.a.forEach(\n        (answer,index) => {\n\n            const button =\n                document.createElement(\n                    \"button\"\n                );\n\n\n            button.type =\n                \"button\";\n\n            button.className =\n                \"answer\";\n\n\n            button.innerHTML = `\n                ${escapeHtml(answer)}\n                <span class=\"answer-letter\">\n                    ${letters[index]}\n                <\/span>\n            `;\n\n\n            button.addEventListener(\n                \"click\",\n                () => {\n\n                    chooseAnswer(\n                        index,\n                        button\n                    );\n\n                }\n            );\n\n\n            answersEl.appendChild(\n                button\n            );\n\n        }\n    );\n\n\n    startQuestionTimer();\n\n\n    updateScoreboard();\n\n}\n\n\n/* =====================================================\n   TIMER\n===================================================== */\n\nfunction startQuestionTimer(){\n\n    clearInterval(\n        timerInterval\n    );\n\n\n    maxTime =\n        12000;\n\n\n    timeLeft =\n        maxTime;\n\n\n    questionStartedAt =\n        performance.now();\n\n\n    timerBar.style.width =\n        \"100%\";\n\n\n    timerInterval =\n        setInterval(\n            () => {\n\n                if(\n                    paused ||\n                    !gameRunning ||\n                    questionLocked\n                ){\n\n                    return;\n\n                }\n\n\n                timeLeft -= 40;\n\n\n                timerBar.style.width =\n                    (\n                        Math.max(\n                            0,\n                            timeLeft /\n                            maxTime *\n                            100\n                        )\n                    ) + \"%\";\n\n\n                if(\n                    timeLeft <= 0\n                ){\n\n                    clearInterval(\n                        timerInterval\n                    );\n\n\n                    timeoutQuestion();\n\n                }\n\n            },\n            40\n        );\n\n}\n\n\n/* =====================================================\n   CHOOSE\n===================================================== */\n\nfunction chooseAnswer(\n    selected,\n    button\n){\n\n    if(\n        !gameRunning ||\n        paused ||\n        answeredThisQuestion ||\n        questionLocked\n    )\n        return;\n\n\n    if(mode === \"online\"){\n\n        if(isHost){\n\n            handleHostAnswer(\n                null,\n                {\n                    type:\"answer\",\n                    playerId:\"host\",\n                    name:myName,\n                    answer:selected\n                }\n            );\n\n        }\n        else{\n\n            answeredThisQuestion =\n                true;\n\n\n            connection.send({\n\n                type:\"answer\",\n\n                name:myName,\n\n                answer:selected\n\n            });\n\n\n            markMyAnswer(\n                selected,\n                button\n            );\n\n        }\n\n\n        return;\n\n    }\n\n\n    answeredThisQuestion =\n        true;\n\n\n    const correct =\n        selected ===\n        currentQuestionData.correct;\n\n\n    const buttons =\n        [\n            ...answersEl.querySelectorAll(\n                \".answer\"\n            )\n        ];\n\n\n    buttons.forEach(\n        b =>\n            b.classList.add(\n                \"disabled\"\n            )\n    );\n\n\n    if(correct){\n\n        button.classList.add(\n            \"correct\"\n        );\n\n\n        streak++;\n\n        correctCount++;\n\n\n        const speedBonus =\n            Math.floor(\n                timeLeft /\n                100\n            );\n\n\n        const points =\n            100 +\n            speedBonus +\n            Math.min(\n                100,\n                streak * 10\n            );\n\n\n        score += points;\n\n\n        feedback.textContent =\n            \"✅ GOED!\";\n\n        subFeedback.textContent =\n            `+${points} punten`;\n\n\n    }\n    else{\n\n        button.classList.add(\n            \"wrong\"\n        );\n\n\n        streak = 0;\n\n\n        score =\n            Math.max(\n                0,\n                score - 20\n            );\n\n\n        feedback.textContent =\n            \"❌ FOUT!\";\n\n        subFeedback.textContent =\n            \"-20 punten\";\n\n\n        buttons[\n            currentQuestionData.correct\n        ].classList.add(\n            \"correct\"\n        );\n\n    }\n\n\n    updateStats();\n\n\n    setTimeout(\n        () => {\n\n            currentQuestion++;\n\n            showQuestion();\n\n        },\n        850\n    );\n\n}\n\n\n/* =====================================================\n   MARK MY ANSWER\n===================================================== */\n\nfunction markMyAnswer(\n    selected,\n    button\n){\n\n    const buttons =\n        [\n            ...answersEl.querySelectorAll(\n                \".answer\"\n            )\n        ];\n\n\n    button.classList.add(\n        selected ===\n        currentQuestionData.correct\n        ? \"correct\"\n        : \"wrong\"\n    );\n\n\n    subFeedback.textContent =\n        \"Antwoord verstuurd...\";\n\n\n    if(\n        selected ===\n        currentQuestionData.correct\n    ){\n\n        feedback.textContent =\n            \"✅ JUIST!\";\n\n    }\n    else{\n\n        feedback.textContent =\n            \"❌ FOUT!\";\n\n        buttons[\n            currentQuestionData.correct\n        ].classList.add(\n            \"correct\"\n        );\n\n    }\n\n}\n\n\n/* =====================================================\n   HOST ANSWER\n===================================================== */\n\nfunction handleHostAnswer(\n    conn,\n    data\n){\n\n    if(\n        !isHost ||\n        !gameRunning ||\n        paused ||\n        questionLocked\n    )\n        return;\n\n\n    const playerId =\n        data.playerId ||\n        (\n            conn\n            ? conn.peer\n            : \"host\"\n        );\n\n\n    if(\n        answeredPlayers[playerId]\n    )\n        return;\n\n\n    answeredPlayers[playerId] =\n        true;\n\n\n    const selected =\n        Number(data.answer);\n\n\n    const correct =\n        selected ===\n        currentQuestionData.correct;\n\n\n    /*\n       Alleen de eerste JUISTE klik wint.\n       Verkeerde antwoorden blijven dus\n       toegestaan totdat iemand juist antwoordt\n       of de tijd voorbij is.\n    */\n\n    if(correct){\n\n        questionLocked = true;\n\n        clearInterval(\n            timerInterval\n        );\n\n\n        firstCorrectPlayer =\n            playerId;\n\n\n        let winnerName;\n\n\n        if(\n            playerId === \"host\"\n        ){\n\n            winnerName =\n                myName;\n\n        }\n        else{\n\n            winnerName =\n                players[playerId]?.name ||\n                data.name ||\n                \"Speler\";\n\n        }\n\n\n        const speedBonus =\n            Math.max(\n                0,\n                Math.floor(\n                    timeLeft /\n                    100\n                )\n            );\n\n\n        const points =\n            100 +\n            speedBonus;\n\n\n        if(\n            playerId === \"host\"\n        ){\n\n            score += points;\n\n            correctCount++;\n\n            streak++;\n\n        }\n        else{\n\n            if(\n                players[playerId]\n            ){\n\n                players[playerId].score =\n                    (\n                        players[playerId].score ||\n                        0\n                    ) +\n                    points;\n\n                players[playerId].correct =\n                    (\n                        players[playerId].correct ||\n                        0\n                    ) +\n                    1;\n\n            }\n\n        }\n\n\n        feedback.textContent =\n            `🏆 ${winnerName} WAS HET SNELST!`;\n\n        subFeedback.textContent =\n            `+${points} punten`;\n\n\n        revealCorrectAnswer();\n\n\n        broadcast({\n\n            type:\"roundWinner\",\n\n            playerId:playerId,\n\n            name:winnerName,\n\n            points:points\n\n        });\n\n\n        broadcastScoreboard();\n\n\n        hostQuestionTimer =\n            setTimeout(\n                endOnlineQuestion,\n                850\n            );\n\n    }\n\n}\n\n\n/* =====================================================\n   REVEAL CORRECT\n===================================================== */\n\nfunction revealCorrectAnswer(){\n\n    const buttons =\n        [\n            ...answersEl.querySelectorAll(\n                \".answer\"\n            )\n        ];\n\n\n    buttons.forEach(\n        button =>\n            button.classList.add(\n                \"disabled\"\n            )\n    );\n\n\n    if(\n        buttons[\n            currentQuestionData.correct\n        ]\n    ){\n\n        buttons[\n            currentQuestionData.correct\n        ].classList.add(\n            \"correct\"\n        );\n\n    }\n\n}\n\n\n/* =====================================================\n   ROUND WINNER RECEIVED\n===================================================== */\n\nfunction handleRoundWinner(\n    data\n){\n\n    questionLocked = true;\n\n    clearInterval(\n        timerInterval\n    );\n\n\n    revealCorrectAnswer();\n\n\n    feedback.textContent =\n        data.playerId === \"host\" && isHost\n        ? \"🏆 JIJ WAS HET SNELST!\"\n        : `🏆 ${data.name} WAS HET SNELST!`;\n\n\n    subFeedback.textContent =\n        `+${data.points} punten`;\n\n}\n\n\n/* =====================================================\n   HOST QUESTION END\n===================================================== */\n\nfunction endOnlineQuestion(){\n\n    clearTimeout(\n        hostQuestionTimer\n    );\n\n\n    broadcast({\n\n        type:\"questionEnd\",\n\n        correct:\n            currentQuestionData.correct\n\n    });\n\n\n    setTimeout(\n        () => {\n\n            currentQuestion++;\n\n            answeredPlayers = {};\n\n            firstCorrectPlayer = null;\n\n            questionLocked = false;\n\n            showNextOnlineQuestion();\n\n        },\n        900\n    );\n\n}\n\n\n/* =====================================================\n   NEXT ONLINE\n===================================================== */\n\nfunction showNextOnlineQuestion(){\n\n    if(\n        currentQuestion >=\n        activeQuestions.length\n    ){\n\n        finishOnlineHost();\n\n        return;\n\n    }\n\n\n    broadcast({\n\n        type:\"question\",\n\n        questions:\n            activeQuestions,\n\n        index:\n            currentQuestion\n\n    });\n\n\n    showQuestion();\n\n}\n\n\n/* =====================================================\n   TIMEOUT\n===================================================== */\n\nfunction timeoutQuestion(){\n\n    questionLocked = true;\n\n    revealCorrectAnswer();\n\n\n    feedback.textContent =\n        \"⏰ TIJD OP!\";\n\n    subFeedback.textContent =\n        \"Niemand was op tijd.\";\n\n\n    if(mode === \"solo\"){\n\n        setTimeout(\n            () => {\n\n                currentQuestion++;\n\n                showQuestion();\n\n            },\n            800\n        );\n\n        return;\n\n    }\n\n\n    if(isHost){\n\n        broadcast({\n\n            type:\"questionEnd\",\n\n            correct:\n                currentQuestionData.correct,\n\n            timeout:true\n\n        });\n\n\n        setTimeout(\n            () => {\n\n                currentQuestion++;\n\n                answeredPlayers = {};\n\n                questionLocked = false;\n\n                showNextOnlineQuestion();\n\n            },\n            900\n        );\n\n    }\n\n}\n\n\n/* =====================================================\n   GUEST QUESTION END\n===================================================== */\n\nfunction revealOnlineQuestion(data){\n\n    questionLocked = true;\n\n    revealCorrectAnswer();\n\n\n    if(data.timeout){\n\n        feedback.textContent =\n            \"⏰ TIJD OP!\";\n\n    }\n\n}\n\n\n/* =====================================================\n   SCOREBOARD\n===================================================== */\n\nfunction updateScoreboard(){\n\n    scoreboardEl.innerHTML =\n        \"\";\n\n\n    let entries = [];\n\n\n    if(mode === \"solo\"){\n\n        entries = [\n\n            {\n                id:\"me\",\n                name:myName,\n                score:score,\n                isMe:true\n            }\n\n        ];\n\n    }\n    else if(isHost){\n\n        entries = [\n            {\n                id:\"host\",\n                name:myName,\n                score:score,\n                isMe:true,\n                isHost:true\n            }\n        ];\n\n\n        Object.values(players)\n        .forEach(player => {\n\n            if(\n                !player ||\n                player.id === \"myself\"\n            )\n                return;\n\n\n            entries.push({\n\n                id:player.id,\n\n                name:player.name,\n\n                score:\n                    player.score || 0,\n\n                isMe:false\n\n            });\n\n        });\n\n    }\n    else{\n\n        entries = onlineScoreboard || [];\n\n    }\n\n\n    entries.sort(\n        (a,b) =>\n            b.score - a.score\n    );\n\n\n    entries.forEach(\n        (entry,index) => {\n\n            const row =\n                document.createElement(\n                    \"div\"\n                );\n\n\n            row.className =\n                \"score-player\" +\n                (\n                    entry.isMe\n                    ? \" me\"\n                    : \"\"\n                );\n\n\n            row.innerHTML = `\n\n                <span class=\"score-place\">\n                    ${index + 1}.\n                <\/span>\n\n                <span class=\"score-name\">\n                    ${escapeHtml(entry.name)}\n                <\/span>\n\n                <span class=\"score-points\">\n                    ${entry.score}\n                <\/span>\n\n            `;\n\n\n            scoreboardEl.appendChild(\n                row\n            );\n\n        }\n    );\n\n\n    const currentMyScore =\n        getMyScore();\n\n\n    gameScoreEl.textContent =\n        currentMyScore;\n\n    headerScore.textContent =\n        currentMyScore;\n\n}\n\n\n/* =====================================================\n   GUEST SCOREBOARD\n===================================================== */\n\nlet onlineScoreboard = [];\n\n\nfunction receiveScoreboard(data){\n\n    onlineScoreboard =\n        data.players || [];\n\n\n    updateScoreboard();\n\n}\n\n\n/* =====================================================\n   HOST BROADCAST SCORE\n===================================================== */\n\nfunction broadcastScoreboard(){\n\n    const list = [];\n\n\n    list.push({\n\n        id:\"host\",\n\n        name:myName,\n\n        score:score,\n\n        isMe:false,\n\n        isHost:true\n\n    });\n\n\n    Object.values(players)\n    .forEach(\n        player => {\n\n            if(!player)\n                return;\n\n            list.push({\n\n                id:player.id,\n\n                name:player.name,\n\n                score:\n                    player.score || 0,\n\n                isMe:false\n\n            });\n\n        }\n    );\n\n\n    list.sort(\n        (a,b) =>\n            b.score - a.score\n    );\n\n\n    /*\n       Host eigen speler markeren\n    */\n\n    const guestVisible =\n        list.map(\n            item => ({\n                ...item,\n                isMe:\n                    item.name === myName &&\n                    item.id === \"host\"\n            })\n        );\n\n\n    onlineScoreboard =\n        guestVisible;\n\n\n    updateScoreboard();\n\n\n    broadcast({\n\n        type:\"scoreboard\",\n\n        players:\n            guestVisible\n\n    });\n\n}\n\n\n/* =====================================================\n   GET MY SCORE\n===================================================== */\n\nfunction getMyScore(){\n\n    if(mode === \"solo\")\n        return score;\n\n\n    if(isHost)\n        return score;\n\n\n    const me =\n        onlineScoreboard.find(\n            player =>\n                player.isMe ||\n                player.name === myName\n        );\n\n\n    return me\n        ? me.score\n        : 0;\n\n}\n\n\n/* =====================================================\n   STATS\n===================================================== */\n\nfunction updateStats(){\n\n    gameScoreEl.textContent =\n        getMyScore();\n\n    headerScore.textContent =\n        getMyScore();\n\n    streakEl.textContent =\n        streak;\n\n    correctCountEl.textContent =\n        correctCount;\n\n}\n\n\n/* =====================================================\n   FINISH SOLO\n===================================================== */\n\nfunction finishSoloQuiz(){\n\n    clearInterval(\n        timerInterval\n    );\n\n\n    gameRunning =\n        false;\n\n\n    if(\n        score > bestScore\n    ){\n\n        bestScore =\n            score;\n\n        localStorage.setItem(\n            \"miniQuizBest\",\n            bestScore\n        );\n\n        bestScoreEl.textContent =\n            bestScore;\n\n        resultIcon.textContent =\n            \"👑\";\n\n        resultTitle.textContent =\n            \"NIEUW RECORD!\";\n\n    }\n    else if(correctCount >= 8){\n\n        resultIcon.textContent =\n            \"🏆\";\n\n        resultTitle.textContent =\n            \"SUPER GEDAAN!\";\n\n    }\n    else if(correctCount >= 5){\n\n        resultIcon.textContent =\n            \"🩵\";\n\n        resultTitle.textContent =\n            \"GOED GEDAAN!\";\n\n    }\n    else{\n\n        resultIcon.textContent =\n            \"🧠\";\n\n        resultTitle.textContent =\n            \"NOG EEN KEER!\";\n\n    }\n\n\n    resultScore.textContent =\n        score;\n\n\n    resultText.textContent =\n        `${correctCount}/10 vragen goed.`;\n\n\n    buildFinalRanking(\n        [\n            {\n                name:myName,\n                score:score\n            }\n        ]\n    );\n\n\n    resultOverlay.classList.remove(\n        \"hidden\"\n    );\n\n}\n\n\n/* =====================================================\n   FINISH ONLINE HOST\n===================================================== */\n\nfunction finishOnlineHost(){\n\n    clearInterval(\n        timerInterval\n    );\n\n    clearTimeout(\n        hostQuestionTimer\n    );\n\n\n    gameRunning =\n        false;\n\n\n    const ranking = [];\n\n\n    ranking.push({\n\n        id:\"host\",\n\n        name:myName,\n\n        score:score\n\n    });\n\n\n    Object.values(players)\n    .forEach(\n        player => {\n\n            if(\n                player\n            ){\n\n                ranking.push({\n\n                    id:player.id,\n\n                    name:player.name,\n\n                    score:\n                        player.score || 0\n\n                });\n\n            }\n\n        }\n    );\n\n\n    ranking.sort(\n        (a,b) =>\n            b.score - a.score\n    );\n\n\n    broadcast({\n\n        type:\"gameEnd\",\n\n        ranking:ranking\n\n    });\n\n\n    buildFinalRanking(\n        ranking\n    );\n\n\n    const myPlace =\n        ranking.findIndex(\n            player =>\n                player.id === \"host\"\n        ) + 1;\n\n\n    if(myPlace === 1){\n\n        resultIcon.textContent =\n            \"👑\";\n\n        resultTitle.textContent =\n            \"JIJ WINT!\";\n\n    }\n    else{\n\n        resultIcon.textContent =\n            \"🏆\";\n\n        resultTitle.textContent =\n            \"QUIZ KLAAR!\";\n\n    }\n\n\n    resultScore.textContent =\n        score;\n\n\n    resultText.textContent =\n        `${ranking.length} spelers hebben meegedaan.`;\n\n\n    resultOverlay.classList.remove(\n        \"hidden\"\n    );\n\n}\n\n\n/* =====================================================\n   FINISH ONLINE GUEST\n===================================================== */\n\nfunction finishOnlineFromHost(data){\n\n    clearInterval(\n        timerInterval\n    );\n\n\n    gameRunning =\n        false;\n\n\n    const ranking =\n        data.ranking || [];\n\n\n    buildFinalRanking(\n        ranking\n    );\n\n\n    const myEntry =\n        ranking.find(\n            player =>\n                player.name === myName\n        );\n\n\n    const myScore =\n        myEntry\n        ? myEntry.score\n        : 0;\n\n\n    const myPlace =\n        ranking.findIndex(\n            player =>\n                player.name === myName\n        ) + 1;\n\n\n    if(myPlace === 1){\n\n        resultIcon.textContent =\n            \"👑\";\n\n        resultTitle.textContent =\n            \"JIJ WINT!\";\n\n    }\n    else{\n\n        resultIcon.textContent =\n            \"🏆\";\n\n        resultTitle.textContent =\n            \"QUIZ KLAAR!\";\n\n    }\n\n\n    resultScore.textContent =\n        myScore;\n\n\n    resultText.textContent =\n        `Je werd ${myPlace}e van ${ranking.length}.`;\n\n\n    resultOverlay.classList.remove(\n        \"hidden\"\n    );\n\n}\n\n\n/* =====================================================\n   FINAL RANKING\n===================================================== */\n\nfunction buildFinalRanking(ranking){\n\n    finalRanking.innerHTML =\n        \"\";\n\n\n    ranking.sort(\n        (a,b) =>\n            b.score - a.score\n    );\n\n\n    ranking.forEach(\n        (player,index) => {\n\n            const row =\n                document.createElement(\n                    \"div\"\n                );\n\n\n            row.className =\n                \"final-row\" +\n                (\n                    index === 0\n                    ? \" winner\"\n                    : \"\"\n                );\n\n\n            row.innerHTML = `\n\n                <span>\n                    ${index === 0\n                        ? \"👑\"\n                        : index + 1 + \".\"\n                    }\n                <\/span>\n\n                <span>\n                    ${escapeHtml(\n                        player.name\n                    )}\n                <\/span>\n\n                <span>\n                    ${player.score}\n                <\/span>\n\n            `;\n\n\n            finalRanking.appendChild(\n                row\n            );\n\n        }\n    );\n\n}\n\n\n/* =====================================================\n   PAUSE\n===================================================== */\n\npauseBtn.addEventListener(\n    \"click\",\n    () => {\n\n        if(\n            !gameRunning\n        )\n            return;\n\n\n        paused = true;\n\n\n        pauseOverlay.classList.remove(\n            \"hidden\"\n        );\n\n    }\n);\n\n\nresumeBtn.addEventListener(\n    \"click\",\n    () => {\n\n        paused = false;\n\n\n        pauseOverlay.classList.add(\n            \"hidden\"\n        );\n\n    }\n);\n\n\n/* =====================================================\n   AGAIN\n===================================================== */\n\nagainBtn.addEventListener(\n    \"click\",\n    () => {\n\n        resultOverlay.classList.add(\n            \"hidden\"\n        );\n\n\n        if(mode === \"solo\"){\n\n            startSoloQuiz();\n\n        }\n        else if(isHost){\n\n            startOnlineAsHost();\n\n        }\n        else{\n\n            onlineStatus.textContent =\n                \"Wachten op de host...\";\n\n            setupScreen.classList.remove(\n                \"hidden\"\n            );\n\n            quizScreen.classList.add(\n                \"hidden\"\n            );\n\n        }\n\n    }\n);\n\n\n/* =====================================================\n   HOME\n===================================================== */\n\nsetupHomeBtn.addEventListener(\n    \"click\",\n    goHome\n);\n\nquizHomeBtn.addEventListener(\n    \"click\",\n    goHome\n);\n\nresultHomeBtn.addEventListener(\n    \"click\",\n    goHome\n);\n\n\nfunction goHome(){\n\n    stopAllTimers();\n\n    gameRunning =\n        false;\n\n    paused =\n        false;\n\n    onlineStarted =\n        false;\n\n    resultOverlay.classList.add(\n        \"hidden\"\n    );\n\n    pauseOverlay.classList.add(\n        \"hidden\"\n    );\n\n    quizScreen.classList.add(\n        \"hidden\"\n    );\n\n    setupScreen.classList.add(\n        \"hidden\"\n    );\n\n    homeScreen.classList.remove(\n        \"hidden\"\n    );\n\n\n    closeOnline();\n\n}\n\n\n/* =====================================================\n   JOIN ROOM TRIGGER\n===================================================== */\n\njoinButton.addEventListener(\n    \"click\",\n    () => {\n\n        if(\n            onlineType === \"join\"\n        ){\n\n            if(\n                joinButton.textContent !==\n                \"🔑 JOINEN\"\n            )\n                return;\n\n        }\n\n    }\n);\n\n\n/*\n   De echte join-knop zit niet als aparte knop in de\n   joinArea om ruimte te besparen. Dubbelklik/Enter is\n   hierboven beschikbaar.\n\n   Daarom maken we automatisch een knop.\n*/\n\nconst joinRoomButton =\n    document.createElement(\"button\");\n\njoinRoomButton.type =\n    \"button\";\n\njoinRoomButton.className =\n    \"online-button\";\n\njoinRoomButton.textContent =\n    \"🔑 JOIN KAMER\";\n\njoinRoomButton.style.marginTop =\n    \"7px\";\n\njoinArea.appendChild(\n    joinRoomButton\n);\n\njoinRoomButton.addEventListener(\n    \"click\",\n    joinRoom\n);\n\n\n/* =====================================================\n   GUEST READY\n===================================================== */\n\nfunction sendGuestReadyAgain(){\n\n    if(\n        connection &&\n        connection.open\n    ){\n\n        sendGuestReady();\n\n    }\n\n}\n\n\n/* =====================================================\n   SCOREBOARD INIT\n===================================================== */\n\nupdateStats();\n\n\n/* =====================================================\n   ROOM CODE\n===================================================== */\n\nfunction generateRoomCode(){\n\n    const chars =\n        \"ABCDEFGHJKLMNPQRSTUVWXYZ23456789\";\n\n    let code = \"\";\n\n\n    for(\n        let i = 0;\n        i < 6;\n        i++\n    ){\n\n        code +=\n            chars[\n                Math.floor(\n                    Math.random() *\n                    chars.length\n                )\n            ];\n\n    }\n\n\n    return code;\n\n}\n\n\n/* =====================================================\n   CLEAN NAME\n===================================================== */\n\nfunction cleanName(name){\n\n    return name\n        .replace(\n            /[<>]/g,\n            \"\"\n        )\n        .trim()\n        .slice(\n            0,\n            18\n        );\n\n}\n\n\n/* =====================================================\n   ESCAPE\n===================================================== */\n\nfunction escapeHtml(text){\n\n    return String(text)\n        .replace(\n            /&/g,\n            \"&amp;\"\n        )\n        .replace(\n            /<\/g,\n            \"&lt;\"\n        )\n        .replace(\n            />/g,\n            \"&gt;\"\n        )\n        .replace(\n            /\"/g,\n            \"&quot;\"\n        )\n        .replace(\n            /'/g,\n            \"&#039;\"\n        );\n\n}\n\n\n/* =====================================================\n   SHUFFLE\n===================================================== */\n\nfunction shuffle(array){\n\n    for(\n        let i = array.length - 1;\n        i > 0;\n        i--\n    ){\n\n        const j =\n            Math.floor(\n                Math.random() *\n                (i + 1)\n            );\n\n\n        [\n            array[i],\n            array[j]\n        ] =\n        [\n            array[j],\n            array[i]\n        ];\n\n    }\n\n\n    return array;\n\n}\n\n\n/* =====================================================\n   CONNECTION\n===================================================== */\n\nfunction closeOnline(){\n\n    try{\n\n        if(connection)\n            connection.close();\n\n        if(peer)\n            peer.destroy();\n\n    }\n    catch(e){}\n\n\n    connection =\n        null;\n\n    peer =\n        null;\n\n    players =\n        {};\n\n    onlineStarted =\n        false;\n\n    onlineScoreboard =\n        [];\n\n}\n\n\n/* =====================================================\n   TIMERS\n===================================================== */\n\nfunction stopAllTimers(){\n\n    clearInterval(\n        timerInterval\n    );\n\n    clearTimeout(\n        hostQuestionTimer\n    );\n\n}\n\n\n/* =====================================================\n   TOAST\n===================================================== */\n\nlet toastTimer = null;\n\n\nfunction showToast(message){\n\n    toast.textContent =\n        message;\n\n\n    toast.classList.add(\n        \"show\"\n    );\n\n\n    clearTimeout(\n        toastTimer\n    );\n\n\n    toastTimer =\n        setTimeout(\n            () => {\n\n                toast.classList.remove(\n                    \"show\"\n                );\n\n            },\n            1800\n        );\n\n}\n\n\n/* =====================================================\n   WAITING VISUAL\n===================================================== */\n\nfunction showWaitingOverlayText(){\n\n    subFeedback.textContent =\n        \"Wachten op de host...\";\n\n}\n\n\n/* =====================================================\n   KEYBOARD\n===================================================== */\n\ndocument.addEventListener(\n    \"keydown\",\n    event => {\n\n        if(\n            !gameRunning ||\n            paused\n        )\n            return;\n\n\n        const key =\n            event.key;\n\n\n        if(\n            ![\"1\",\"2\",\"3\",\"4\"]\n            .includes(key)\n        )\n            return;\n\n\n        const index =\n            Number(key) - 1;\n\n\n        const buttons =\n            [\n                ...answersEl.querySelectorAll(\n                    \".answer\"\n                )\n            ];\n\n\n        if(\n            buttons[index]\n        ){\n\n            buttons[index].click();\n\n        }\n\n    }\n);\n\n\n/* =====================================================\n   ENTER JOIN\n===================================================== */\n\nroomInput.addEventListener(\n    \"keyup\",\n    event => {\n\n        if(\n            event.key === \"Enter\"\n        ){\n\n            joinRoom();\n\n        }\n\n    }\n);\n\n\n/* =====================================================\n   ONLINE AUTO HELLO\n===================================================== */\n\nconst originalConnectionStatus =\n    onlineStatus;\n\n\n/*\n   Wanneer gast verbinding maakt, stuur meteen\n   zijn naam door als die al ingevuld is.\n*/\n\nsetInterval(\n    () => {\n\n        if(\n            !isHost &&\n            mode === \"online\" &&\n            connection &&\n            connection.open &&\n            nameInput.value.trim() &&\n            !onlineStarted\n        ){\n\n            /*\n               Alleen lobby-info sturen.\n            */\n\n            try{\n\n                connection.send({\n\n                    type:\"hello\",\n\n                    name:\n                        cleanName(\n                            nameInput.value\n                        )\n\n                });\n\n            }\n            catch(e){}\n\n        }\n\n    },\n    1200\n);\n\n\n/* =====================================================\n   ONLINE HOST RECEIVE SCOREBOARD\n===================================================== */\n\nfunction refreshHostScoreboard(){\n\n    if(\n        isHost &&\n        mode === \"online\"\n    ){\n\n        broadcastScoreboard();\n\n    }\n\n}\n\n\n/* =====================================================\n   START HOST QUESTION RESET\n===================================================== */\n\nfunction resetHostQuestion(){\n\n    answeredPlayers = {};\n\n    firstCorrectPlayer = null;\n\n    questionLocked = false;\n\n}\n\n\n/* =====================================================\n   ONLINE HOST QUESTION PATCH\n===================================================== */\n\nconst oldShowQuestion =\n    showQuestion;\n\n\n/* =====================================================\n   MOBILE SWIPE TO ANSWER\n===================================================== */\n\nlet touchStartX = 0;\nlet touchStartY = 0;\n\n\nanswersEl.addEventListener(\n    \"touchstart\",\n    event => {\n\n        const touch =\n            event.changedTouches[0];\n\n        touchStartX =\n            touch.clientX;\n\n        touchStartY =\n            touch.clientY;\n\n    },\n    {\n        passive:true\n    }\n);\n\n\nanswersEl.addEventListener(\n    \"touchend\",\n    event => {\n\n        const touch =\n            event.changedTouches[0];\n\n\n        const dx =\n            touch.clientX -\n            touchStartX;\n\n        const dy =\n            touch.clientY -\n            touchStartY;\n\n\n        if(\n            Math.max(\n                Math.abs(dx),\n                Math.abs(dy)\n            ) < 25\n        )\n            return;\n\n    },\n    {\n        passive:true\n    }\n);\n\n\n/* =====================================================\n   NO SCROLL\n===================================================== */\n\ndocument.addEventListener(\n    \"touchmove\",\n    event => {\n\n        if(\n            event.target.closest(\n                \".answers,.room-input,.name-input\"\n            )\n        ){\n\n            return;\n\n        }\n\n        event.preventDefault();\n\n    },\n    {\n        passive:false\n    }\n);\n\n\n/* =====================================================\n   INIT\n===================================================== */\n\nquizScreen.classList.add(\n    \"hidden\"\n);\n\nsetupScreen.classList.add(\n    \"hidden\"\n);\n\nresultOverlay.classList.add(\n    \"hidden\"\n);\n\npauseOverlay.classList.add(\n    \"hidden\"\n);\n\nrenderPlayers();\n\n<\/script>\n\n<\/body>\n<\/html>", "style": "<!DOCTYPE html>\n<html lang=\"nl\">\n<head><script>try{localStorage.getItem(\"x\")}catch(e){var _m={};Object.defineProperty(window,\"localStorage\",{value:{getItem:fun
