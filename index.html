\n \n<div id=\"startScreen\" class=\"screen\"> \n \n<div class=\"start-icon\">⚡<\/div> \n \n<h1 class=\"start-title\"> \nREACTION RUSH \n<\/h1> \n \n<p class=\"start-text\"> \nKlik zo snel mogelijk op het \n<b>donkergroene vakje<\/b>. \nVerdien combo's, stijg in levels en probeer je record te verbreken! \n<\/p> \n \n<div class=\"features\"> \n<div class=\"feature\">⚡ SNELHEID<\/div> \n<div class=\"feature\">🔥 COMBO<\/div> \n<div class=\"feature\">🏆 RECORD<\/div> \n<div class=\"feature\">❤️ LEVENS<\/div> \n<\/div> \n \n<!-- MOEILIJKHEID --> \n \n<div class=\"difficulty\"> \n \n<button class=\"diff-btn active\" data-speed=\"2200\"> \n🐢 TRAAG \n<\/button> \n \n<button class=\"diff-btn\" data-speed=\"1400\"> \n🌿 NORMAAL \n<\/button> \n \n<button class=\"diff-btn\" data-speed=\"750\"> \n⚡ SNEL \n<\/button> \n \n<\/div> \n \n<button class=\"main-btn\" id=\"startBtn\"> \nSTART GAME 🚀 \n<\/button> \n \n<\/div> \n \n \n<!-- GAME --> \n \n<div id=\"gameScreen\" class=\"screen hidden\"> \n \n<div class=\"game-top\"> \n \n<div class=\"round-box\"> \nRONDE <span id=\"round\">1<\/span>/30 \n<\/div> \n \n<div class=\"timer\"> \n<div class=\"timer-fill\" id=\"timerFill\"><\/div> \n<\/div> \n \n<div class=\"game-actions\"> \n \n<button class=\"action-btn\" id=\"pauseBtn\"> \n⏸️ PAUZE \n<\/button> \n \n<button class=\"action-btn\" id=\"gameHomeBtn\"> \n🏠 HOME \n<\/button> \n \n<\/div> \n \n<\/div> \n \n<div class=\"level-box\"> \nLEVEL <span id=\"level\">1<\/span> \n<\/div> \n \n<div class=\"instruction\" id=\"instruction\"> \nKLIK HET DONKERGROENE VAKJE! \n<\/div> \n \n<div class=\"combo\" id=\"combo\"> \nCOMBO x0 \n<\/div> \n \n<div class=\"grid\"> \n \n<button class=\"tile\"><\/button> \n<button class=\"tile\"><\/button> \n<button class=\"tile\"><\/button> \n<button class=\"tile\"><\/button> \n<button class=\"tile\"><\/button> \n<button class=\"tile\"><\/button> \n<button class=\"tile\"><\/button> \n<button class=\"tile\"><\/button> \n<button class=\"tile\"><\/button> \n \n<\/div> \n \n<\/div> \n \n \n<!-- RESULTAAT --> \n \n<div id=\"resultScreen\" class=\"screen hidden\"> \n \n<div class=\"result-icon\" id=\"resultIcon\"> \n🏆 \n<\/div> \n \n<h1 class=\"result-title\" id=\"resultTitle\"> \nKLAAR! \n<\/h1> \n \n<div class=\"result-score\" id=\"finalScore\"> \n0 \n<\/div> \n \n<div class=\"result-label\"> \npunten \n<\/div> \n \n<div class=\"result-stats\"> \n \n<div class=\"result-stat\"> \n<span>SNELSTE REACTIE<\/span> \n<strong id=\"fastest\">-<\/strong> \n<\/div> \n \n<div class=\"result-stat\"> \n<span>HOOGSTE COMBO<\/span> \n<strong id=\"bestCombo\">0<\/strong> \n<\/div> \n \n<div class=\"result-stat\"> \n<span>LEVEL<\/span> \n<strong id=\"finalLevel\">1<\/strong> \n<\/div> \n \n<\/div> \n \n<div class=\"result-buttons\"> \n \n<button class=\"main-btn\" id=\"againBtn\"> \n🔄 OPNIEUW SPELEN \n<\/button> \n \n<button class=\"home-btn\" id=\"homeBtn\"> \n🏠 TERUG NAAR HOME \n<\/button> \n \n<\/div> \n \n<\/div> \n \n \n<!-- PAUZE --> \n \n<div id=\"pauseOverlay\" class=\"pause-overlay hidden\"> \n \n<div class=\"pause-card\"> \n \n<h2>PAUZE ⏸️<\/h2> \n \n<p> \nNeem even een kleine pauze.<br> \nJe spel staat stil. \n<\/p> \n \n<button class=\"main-btn\" id=\"resumeBtn\"> \n▶ VERDER SPELEN \n<\/button> \n \n<\/div> \n \n<\/div> \n \n<div class=\"feedback\" id=\"feedback\"><\/div> \n \n<\/div> \n \n<\/div> \n \n \n<script> \n \nconst startScreen = \ndocument.getElementById(\"startScreen\"); \n \nconst gameScreen = \ndocument.getElementById(\"gameScreen\"); \n \nconst resultScreen = \ndocument.getElementById(\"resultScreen\"); \n \nconst pauseOverlay = \ndocument.getElementById(\"pauseOverlay\"); \n \nconst startBtn = \ndocument.getElementById(\"startBtn\"); \n \nconst againBtn = \ndocument.getElementById(\"againBtn\"); \n \nconst homeBtn = \ndocument.getElementById(\"homeBtn\"); \n \nconst gameHomeBtn = \ndocument.getElementById(\"gameHomeBtn\"); \n \nconst pauseBtn = \ndocument.getElementById(\"pauseBtn\"); \n \nconst resumeBtn = \ndocument.getElementById(\"resumeBtn\"); \n \nconst tiles = \ndocument.querySelectorAll(\".tile\"); \n \nconst scoreEl = \ndocument.getElementById(\"score\"); \n \nconst bestEl = \ndocument.getElementById(\"best\"); \n \nconst livesEl = \ndocument.getElementById(\"lives\"); \n \nconst roundEl = \ndocument.getElementById(\"round\"); \n \nconst levelEl = \ndocument.getElementById(\"level\"); \n \nconst comboEl = \ndocument.getElementById(\"combo\"); \n \nconst instructionEl = \ndocument.getElementById(\"instruction\"); \n \nconst timerFill = \ndocument.getElementById(\"timerFill\"); \n \nconst finalScoreEl = \ndocument.getElementById(\"finalScore\"); \n \nconst fastestEl = \ndocument.getElementById(\"fastest\"); \n \nconst bestComboEl = \ndocument.getElementById(\"bestCombo\"); \n \nconst finalLevelEl = \ndocument.getElementById(\"finalLevel\"); \n \nconst resultTitle = \ndocument.getElementById(\"resultTitle\"); \n \nconst resultIcon = \ndocument.getElementById(\"resultIcon\"); \n \nconst feedback = \ndocument.getElementById(\"feedback\"); \n \n \n/* SPELVARIABELEN */ \n \nlet score = 0; \nlet round = 1; \nlet level = 1; \n \nlet lives = 3; \n \nlet combo = 0; \nlet bestCombo = 0; \n \nlet best = \nNumber(localStorage.getItem(\"reactionRushBest\")) || 0; \n \nlet fastest = Infinity; \n \nlet target = -1; \n \nlet startTime = 0; \n \nlet timer = null; \nlet nextRoundTimeout = null; \n \nlet difficultySpeed = 2200; \nlet roundTime = 2200; \n \nlet gameRunning = false; \nlet paused = false; \n \n \nbestEl.textContent = best; \n \n \n/* MOEILIJKHEID */ \n \ndocument.querySelectorAll(\".diff-btn\") \n.forEach(button => { \n \n    button.addEventListener(\"click\",() => { \n \n        document \n        .querySelectorAll(\".diff-btn\") \n        .forEach(btn => { \n \n            btn.classList.remove(\"active\"); \n \n        }); \n \n        button.classList.add(\"active\"); \n \n        difficultySpeed = \n        Number(button.dataset.speed); \n \n    }); \n \n}); \n \n \n/* START */ \n \nstartBtn.addEventListener( \n\"click\", \nstartGame \n); \n \nagainBtn.addEventListener( \n\"click\", \nstartGame \n); \n \n \n/* START GAME */ \n \nfunction startGame(){ \n \n    clearAllTimers(); \n \n    score = 0; \n    round = 1; \n    level = 1; \n \n    lives = 3; \n \n    combo = 0; \n    bestCombo = 0; \n \n    fastest = Infinity; \n \n    /* BELANGRIJK: \n       gekozen moeilijkheid wordt gebruikt */ \n \n    roundTime = difficultySpeed; \n \n    gameRunning = true; \n    paused = false; \n \n    scoreEl.textContent = \"0\"; \n    livesEl.textContent = \"3\"; \n \n    roundEl.textContent = \"1\"; \n    levelEl.textContent = \"1\"; \n \n    comboEl.textContent = \"COMBO x0\"; \n    comboEl.classList.remove(\"hot\"); \n \n    timerFill.style.width = \"100%\"; \n \n    pauseOverlay.classList.add(\"hidden\"); \n \n    startScreen.classList.add(\"hidden\"); \n    resultScreen.classList.add(\"hidden\"); \n    gameScreen.classList.remove(\"hidden\"); \n \n    instructionEl.textContent = \n    \"KLIK HET DONKERGROENE VAKJE!\"; \n \n    nextRound(); \n \n} \n \n \n/* VOLGENDE RONDE */ \n \nfunction nextRound(){ \n \n    if(!gameRunning || paused) \n    return; \n \n    if(round > 30){ \n \n        endGame(true); \n \n        return; \n \n    } \n \n    updateLevel(); \n \n    roundEl.textContent = round; \n \n    tiles.forEach(tile => { \n \n        tile.classList.remove( \n            \"target\", \n            \"wrong\" \n        ); \n \n    }); \n \n \n    target = \n    Math.floor( \n        Math.random() * tiles.length \n    ); \n \n \n    tiles[target] \n    .classList \n    .add(\"target\"); \n \n \n    startTime = \n    performance.now(); \n \n \n    runTimer(); \n \n} \n \n \n/* TIMER */ \n \nfunction runTimer(){ \n \n    clearInterval(timer); \n \n    const timeLimit = \n    roundTime; \n \n    const timerStart = \n    performance.now(); \n \n    timerFill.style.width = \n    \"100%\"; \n \n \n    timer = \n    setInterval(() => { \n \n        if(!gameRunning || paused) \n        return; \n \n \n        const elapsed = \n        performance.now() - \n        timerStart; \n \n \n        const percentage = \n        Math.max( \n            0, \n            100 - \n            (elapsed / timeLimit) * 100 \n        ); \n \n \n        timerFill.style.width = \n        percentage + \"%\"; \n \n \n        if(elapsed >= timeLimit){ \n \n            clearInterval(timer); \n \n            loseLife(); \n \n        } \n \n    },16); \n \n} \n \n \n/* LEVEN VERLIES */ \n \nfunction loseLife(){ \n \n    if(!gameRunning) \n    return; \n \n \n    tiles.forEach(tile => { \n \n        tile.classList.remove(\"target\"); \n \n    }); \n \n \n    flash(false); \n \n    lives--; \n \n    livesEl.textContent = \n    lives; \n \n \n    combo = 0; \n \n    updateCombo(); \n \n \n    if(lives <= 0){ \n \n        endGame(false); \n \n        return; \n \n    } \n \n \n    instructionEl.textContent = \n    \"TE LAAT! ⚠️\"; \n \n \n    round++; \n \n    makeFaster(); \n \n \n    nextRoundTimeout = \n    setTimeout(() => { \n \n        instructionEl.textContent = \n        \"KLIK HET DONKERGROENE VAKJE!\"; \n \n        nextRound(); \n \n    },320); \n \n} \n \n \n/* KLIKKEN */ \n \ntiles.forEach((tile,index) => { \n \n    tile.addEventListener(\"click\",() => { \n \n        if(!gameRunning || paused) \n        return; \n \n \n        /* VERKEERD */ \n \n        if(index !== target){ \n \n            tile.classList.add(\"wrong\");\n\n            lives--;\n            livesEl.textContent = Math.max(0,lives);\n\n            combo = 0;\n            updateCombo();\n            flash(false);\n\n            if(lives <= 0){\n                endGame(false);\n                return;\n            }\n\n            setTimeout(() => {\n                tile.classList.remove(\"wrong\");\n            },220);\n\n            return; \n \n        } \n \n \n        /* GOED */ \n \n        clearInterval(timer); \n \n \n        const reaction = \n        Math.round( \n            performance.now() - \n            startTime \n        ); \n \n \n        if(reaction < fastest){ \n \n            fastest = reaction; \n \n        } \n \n \n        combo++; \n \n \n        if(combo > bestCombo){ \n \n            bestCombo = combo; \n \n        } \n \n \n        let points = \n        Math.max( \n            25, \n            Math.round( \n                120000 / \n                Math.max(reaction,150) \n            ) \n        ); \n \n \n        points = \n        Math.min(points,120); \n \n \n        points += \n        combo * 5; \n \n \n        points += \n        level * 3; \n \n \n        if(reaction <= 400){ \n \n            points += 50; \n \n            instructionEl.textContent = \n            \"PERFECT! ⚡🌿\"; \n \n        } \n        else if(reaction <= 650){ \n \n            points += 25; \n \n            instructionEl.textContent = \n            \"SUPER SNEL! 🔥\"; \n \n        } \n        else{ \n \n            instructionEl.textContent = \n            \"GOED! ✅\"; \n \n        } \n \n \n        score += points; \n \n        scoreEl.textContent = \n        score; \n \n \n        updateCombo(); \n \n        flash(true); \n \n \n        tiles[target] \n        .classList \n        .remove(\"target\"); \n \n \n        round++; \n \n        makeFaster(); \n \n \n        nextRoundTimeout = \n        setTimeout(() => { \n \n            instructionEl.textContent = \n            \"KLIK HET DONKERGROENE VAKJE!\"; \n \n            nextRound(); \n \n        },140); \n \n    }); \n \n}); \n \n \n/* MAAK HET ELKE RONDE IETS SNELLER */ \n \nfunction makeFaster(){ \n \n    /* \n    De gekozen moeilijkheid blijft het beginpunt. \n    Daarna wordt iedere ronde iets sneller. \n    */ \n \n    roundTime = \n    Math.max( \n        380, \n        roundTime * 0.96 \n    ); \n \n} \n \n \n/* COMBO */ \n \nfunction updateCombo(){ \n \n    comboEl.textContent = \n    \"COMBO x\" + combo; \n \n \n    if(combo >= 5){ \n \n        comboEl.classList.add(\"hot\"); \n \n        comboEl.textContent = \n        \"🔥 COMBO x\" + combo; \n \n    } \n    else{ \n \n        comboEl.classList.remove(\"hot\"); \n \n    } \n \n} \n \n \n/* LEVEL */ \n \nfunction updateLevel(){ \n \n    level = \n    Math.min( \n        10, \n        Math.floor( \n            (round - 1) / 3 \n        ) + 1 \n    ); \n \n    levelEl.textContent = \n    level; \n \n} \n \n \n/* PAUZE */ \n \npauseBtn.addEventListener(\"click\",() => { \n \n    if(!gameRunning) \n    return; \n \n    paused = true; \n \n    clearInterval(timer); \n \n    pauseOverlay.classList.remove( \n        \"hidden\" \n    ); \n \n}); \n \n \nresumeBtn.addEventListener(\"click\",() => { \n \n    if(!gameRunning) \n    return; \n \n    paused = false; \n \n    pauseOverlay.classList.add( \n        \"hidden\" \n    ); \n \n    startTime = \n    performance.now(); \n \n    runTimer(); \n \n}); \n \n \n/* HOME */ \n \ngameHomeBtn.addEventListener( \n\"click\", \ngoHome \n); \n \nhomeBtn.addEventListener( \n\"click\", \ngoHome \n); \n \n \nfunction goHome(){ \n \n    clearAllTimers(); \n \n    gameRunning = false; \n    paused = false; \n \n    pauseOverlay.classList.add( \n        \"hidden\" \n    ); \n \n    gameScreen.classList.add( \n        \"hidden\" \n    ); \n \n    resultScreen.classList.add( \n        \"hidden\" \n    ); \n \n    startScreen.classList.remove( \n        \"hidden\" \n    ); \n \n \n    score = 0; \n    round = 1; \n    level = 1; \n \n    lives = 3; \n    combo = 0; \n \n    scoreEl.textContent = \"0\"; \n    livesEl.textContent = \"3\"; \n \n    roundEl.textContent = \"1\"; \n    levelEl.textContent = \"1\"; \n \n    comboEl.textContent = \n    \"COMBO x0\"; \n \n    comboEl.classList.remove(\"hot\"); \n \n    timerFill.style.width = \n    \"100%\"; \n \n \n    tiles.forEach(tile => { \n \n        tile.classList.remove( \n            \"target\", \n            \"wrong\" \n        ); \n \n    }); \n \n} \n \n \n/* EINDE */ \n \nfunction endGame(completed){ \n \n    clearAllTimers(); \n \n    gameRunning = false; \n    paused = false; \n \n \n    tiles.forEach(tile => { \n \n        tile.classList.remove( \n            \"target\", \n            \"wrong\" \n        ); \n \n    }); \n \n \n    finalScoreEl.textContent = \n    score; \n \n \n    fastestEl.textContent = \n    fastest === Infinity \n    ? \"-\" \n    : fastest; \n \n \n    bestComboEl.textContent = \n    bestCombo; \n \n \n    finalLevelEl.textContent = \n    level; \n \n \n    if(score > best){ \n \n        best = score; \n \n        localStorage.setItem( \n            \"reactionRushBest\", \n            best \n        ); \n \n        bestEl.textContent = \n        best; \n \n \n        resultTitle.textContent = \n        \"NIEUW RECORD! 🎉\"; \n \n        resultIcon.textContent = \n        \"🏆\"; \n \n    } \n \n    else if(completed){ \n \n        resultTitle.textContent = \n        \"GEWELDIG! 🌿\"; \n \n        resultIcon.textContent = \n        \"🌟\"; \n \n    } \n \n    else{ \n \n        resultTitle.textContent = \n        \"GAME OVER 💚\"; \n \n        resultIcon.textContent = \n        \"💚\"; \n \n    } \n \n \n    gameScreen.classList.add( \n        \"hidden\" \n    ); \n \n    resultScreen.classList.remove( \n        \"hidden\" \n    ); \n \n} \n \n \n/* EFFECT */ \n \nfunction flash(good){ \n \n    feedback.classList.remove( \n        \"good\", \n        \"bad\" \n    ); \n \n    void feedback.offsetWidth; \n \n    feedback.classList.add( \n        good ? \"good\" : \"bad\" \n    ); \n \n} \n \n \n/* TIMERS STOPPEN */ \n \nfunction clearAllTimers(){ \n \n    clearInterval(timer); \n    clearTimeout(nextRoundTimeout); \n \n    timer = null; \n    nextRoundTimeout = null; \n \n} \n \n \n/* GEEN SCROLL */ \n \ndocument.addEventListener( \n\"touchmove\", \nevent => { \n    event.preventDefault(); \n}, \n{passive:false} \n); \n \n<\/script> \n \n<\/body> \n<\/html>",
"color": "<!DOCTYPE html>\n<html lang=\"nl\">\n<head><script>try{localStorage.getItem(\"x\")}catch(e){var _m={};Object.defineProperty(window,\"localStorage\",{value:{getItem:function(k){return k in _m?_m[k]:null},setItem:function(k,v){_m[k]=String(v)},removeItem:function(k){delete _m[k]}}})}<\/script>\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\n      content=\"width=device-width,\n      initial-scale=1.0,\n      maximum-scale=1.0,\n      user-scalable=no\">\n\n<title>COLOR CLASH 💛<\/title>\n\n<style>\n*{\n    box-sizing:border-box;\n    -webkit-tap-highlight-color:transparent;\n    user-select:none;\n}\n\nhtml,body{\n    width:100%;\n    height:100%;\n    margin:0;\n    overflow:hidden;\n    font-family:Arial,Helvetica,sans-serif;\n}\n\nbody{\n    background:\n        radial-gradient(circle at 10% 10%,#171d45 0%,transparent 32%),\n        radial-gradient(circle at 90% 90%,#370edf 0%,transparent 35%),\n        linear-gradient(135deg,#101531,#232d6a,#320bd0);\n\n    color:#8567fb;\n}\n\nbutton{\n    font-family:inherit;\n    cursor:pointer;\n    touch-action:manipulation;\n}\n\nbutton:active{\n    transform:scale(.97);\n}\n\n.hidden{\n    display:none !important;\n}\n\n/* APP */\n\n.app{\n    width:100%;\n    height:100%;\n\n    display:flex;\n    align-items:center;\n    justify-content:center;\n\n    padding:8px;\n}\n\n.game{\n    width:min(1100px,100%);\n    height:min(800px,100%);\n\n    position:relative;\n\n    display:flex;\n    flex-direction:column;\n\n    overflow:hidden;\n\n    background:#0d1026;\n\n    border:3px solid #4621db;\n    border-radius:28px;\n\n    box-shadow:\n        0 22px 65px rgba(120,88,0,.24);\n}\n\n/* HEADER */\n\n.header{\n    min-height:70px;\n\n    padding:10px 17px;\n\n    display:flex;\n    justify-content:space-between;\n    align-items:center;\n\n    gap:10px;\n\n    background:\n        linear-gradient(\n            135deg,\n            #4e25f0,\n            #3712cd\n        );\n\n    color:#ffffff;\n}\n\n.logo{\n    font-size:clamp(22px,4vw,34px);\n    font-weight:1000;\n}\n\n.logo span{\n    color:#1b2250;\n}\n\n.header-stats{\n    display:flex;\n    gap:6px;\n}\n\n.stat{\n    min-width:64px;\n\n    padding:5px 8px;\n\n    border-radius:11px;\n\n    background:rgba(15,17,26,0.18);\n\n    border:2px solid rgba(15,17,26,0.22);\n\n    text-align:center;\n}\n\n.stat small{\n    display:block;\n    font-size:8px;\n    opacity:.88;\n}\n\n.stat strong{\n    display:block;\n    font-size:17px;\n}\n\n\n/* SCREENS */\n\n.screen{\n    flex:1;\n    min-height:0;\n\n    display:flex;\n    flex-direction:column;\n}\n\n\n/* HOME */\n\n#homeScreen{\n    align-items:center;\n    justify-content:center;\n\n    text-align:center;\n\n    padding:18px;\n}\n\n.home-icon{\n    font-size:63px;\n}\n\n.home-title{\n    margin:0;\n\n    color:#6e4afa;\n\n    font-size:clamp(40px,7vw,65px);\n\n    font-weight:1000;\n}\n\n.home-text{\n    max-width:680px;\n\n    margin:8px auto 17px;\n\n    color:#755fd0;\n\n    line-height:1.45;\n\n    font-size:16px;\n}\n\n.feature-row{\n    display:flex;\n\n    justify-content:center;\n    flex-wrap:wrap;\n\n    gap:7px;\n\n    margin-bottom:18px;\n}\n\n.feature{\n    padding:7px 11px;\n\n    border-radius:11px;\n\n    background:#1b2352;\n\n    border:2px solid #4726cb;\n\n    color:#7a5afb;\n\n    font-size:11px;\n\n    font-weight:900;\n}\n\n.mode-grid{\n    width:min(820px,100%);\n\n    display:grid;\n\n    grid-template-columns:repeat(3,1fr);\n\n    gap:10px;\n\n    margin-bottom:15px;\n}\n\n.mode-card{\n    border:3px solid #401fc4;\n\n    border-radius:17px;\n\n    background:#181f49;\n\n    color:#7b5cfb;\n\n    padding:13px 8px;\n}\n\n.mode-card.selected{\n    background:#461dea;\n\n    border-color:#5e37fa;\n\n    color:#ffffff;\n\n    box-shadow:\n        0 8px 18px rgba(150,111,0,.2);\n}\n\n.mode-icon{\n    font-size:32px;\n}\n\n.mode-title{\n    font-size:15px;\n    font-weight:1000;\n\n    margin-top:4px;\n}\n\n.mode-info{\n    font-size:10px;\n    opacity:.82;\n\n    margin-top:3px;\n}\n\n.start-main{\n    border:0;\n\n    padding:13px 30px;\n\n    border-radius:15px;\n\n    background:\n        linear-gradient(\n            135deg,\n            #5b34fa,\n            #431ed5\n        );\n\n    color:#ffffff;\n\n    font-size:17px;\n\n    font-weight:1000;\n\n    box-shadow:\n        0 8px 20px\n        rgba(145,108,0,.22);\n}\n\n\n/* SETUP */\n\n#setupScreen{\n    padding:13px;\n    gap:9px;\n}\n\n.setup-title{\n    text-align:center;\n\n    color:#714efa;\n\n    font-size:clamp(24px,4vw,34px);\n\n    font-weight:1000;\n}\n\n.setup-text{\n    text-align:center;\n\n    color:#735cd0;\n\n    font-size:13px;\n}\n\n.setup-card{\n    flex:1;\n    min-height:0;\n\n    display:flex;\n    flex-direction:column;\n\n    align-items:center;\n    justify-content:center;\n\n    gap:13px;\n\n    padding:18px;\n\n    border:2px solid #4222c0;\n    border-radius:19px;\n\n    background:#151a3e;\n}\n\n.setup-icon{\n    font-size:60px;\n}\n\n.difficulty-title{\n    color:#7756fb;\n\n    font-size:13px;\n\n    font-weight:1000;\n}\n\n.difficulty{\n    display:flex;\n    gap:8px;\n}\n\n.difficulty button{\n    border:2px solid #4326b8;\n\n    background:#1b2250;\n\n    color:#7f5ffb;\n\n    border-radius:11px;\n\n    padding:9px 15px;\n\n    font-size:11px;\n\n    font-weight:1000;\n}\n\n.difficulty button.active{\n    background:#461dea;\n\n    color:#ffffff;\n\n    border-color:#5d35fa;\n}\n\n.setup-actions{\n    display:flex;\n\n    justify-content:center;\n\n    gap:8px;\n\n    flex-wrap:wrap;\n}\n\n.back-btn{\n    border:2px solid #4326b8;\n\n    background:#19204c;\n\n    color:#7e5ffb;\n\n    border-radius:12px;\n\n    padding:10px 20px;\n\n    font-size:12px;\n\n    font-weight:1000;\n}\n\n\n/* GAME */\n\n#gameScreen{\n    padding:9px;\n    gap:7px;\n}\n\n.game-top{\n    display:grid;\n\n    grid-template-columns:auto 1fr auto auto;\n\n    align-items:center;\n\n    gap:7px;\n}\n\n.round-info{\n    color:#7858fb;\n\n    font-size:11px;\n\n    font-weight:1000;\n}\n\n.center-info{\n    text-align:center;\n\n    color:#6045c9;\n\n    font-size:10px;\n}\n\n.center-info strong{\n    color:#7250fb;\n\n    font-size:19px;\n}\n\n.game-btn{\n    border:2px solid #4628be;\n\n    background:#1a214f;\n\n    color:#7e5ffb;\n\n    border-radius:10px;\n\n    padding:6px 8px;\n\n    font-size:9px;\n\n    font-weight:1000;\n}\n\n\n/* TARGET */\n\n.target-box{\n    width:100%;\n\n    text-align:center;\n\n    padding:12px 10px;\n\n    border-radius:15px;\n\n    background:#1b2352;\n\n    border:3px solid #4827cb;\n\n    color:#7b5bfb;\n\n    font-size:18px;\n\n    font-weight:1000;\n}\n\n.target-symbol{\n    display:inline-block;\n\n    margin-left:5px;\n\n    font-size:30px;\n\n    color:#7554fb;\n\n    vertical-align:middle;\n}\n\n.target-box small{\n    display:block;\n\n    margin-top:2px;\n\n    color:#5a3ec7;\n\n    font-size:9px;\n\n    font-weight:800;\n}\n\n\n/* TIMER */\n\n.timer-wrap{\n    width:100%;\n    height:11px;\n\n    overflow:hidden;\n\n    background:#19204c;\n\n    border:2px solid #3f21b7;\n\n    border-radius:20px;\n}\n\n.timer-bar{\n    width:100%;\n    height:100%;\n\n    background:\n        linear-gradient(\n            90deg,\n            #380fdd,\n            #5b33fa\n        );\n\n    transition:width .06s linear;\n}\n\n\n/* CLASH GRID */\n\n.clash-grid{\n    flex:1;\n    min-height:0;\n\n    display:grid;\n\n    grid-template-columns:repeat(3,1fr);\n    grid-template-rows:repeat(2,1fr);\n\n    gap:10px;\n\n    padding:3px;\n}\n\n.clash-btn{\n    position:relative;\n\n    border:4px solid #4627c2;\n\n    border-radius:20px;\n\n    background:\n        linear-gradient(\n            145deg,\n            #181e47,\n            #2d0bb3\n        );\n\n    color:#7a5afb;\n\n    font-size:clamp(33px,6vw,58px);\n\n    font-weight:1000;\n\n    box-shadow:\n        0 8px 15px rgba(116,87,0,.12);\n\n    transition:\n        transform .12s,\n        border-color .12s,\n        background .12s;\n}\n\n.clash-btn:hover{\n    transform:translateY(-2px);\n}\n\n.clash-btn.correct{\n    background:#cdb113;\n\n    border-color:#ffd343;\n\n    color:#352e00;\n}\n\n.clash-btn.wrong{\n    background:#93790c;\n\n    border-color:#ffd02b;\n\n    color:#ffd85f;\n}\n\n\n/* BOTTOM */\n\n.bottom{\n    display:flex;\n\n    justify-content:center;\n    align-items:center;\n\n    gap:14px;\n\n    color:#7059cf;\n\n    font-size:10px;\n\n    font-weight:900;\n}\n\n\n/* RESULT */\n\n.overlay{\n    position:absolute;\n\n    inset:0;\n\n    z-index:40;\n\n    display:flex;\n\n    justify-content:center;\n    align-items:center;\n\n    padding:20px;\n\n    background:rgba(157,165,218,0.6);\n\n    backdrop-filter:blur(5px);\n}\n\n.overlay-card{\n    width:min(440px,92%);\n\n    padding:25px;\n\n    text-align:center;\n\n    background:#0d1026;\n\n    border:3px solid #4828c8;\n\n    border-radius:22px;\n\n    box-shadow:\n        0 20px 50px rgba(0,0,0,.2);\n}\n\n.overlay-icon{\n    font-size:60px;\n}\n\n.overlay-title{\n    margin:4px 0;\n\n    color:#714efa;\n\n    font-size:36px;\n\n    font-weight:1000;\n}\n\n.overlay-score{\n    color:#6039fa;\n\n    font-size:49px;\n\n    font-weight:1000;\n}\n\n.overlay-text{\n    color:#6d55ce;\n\n    font-size:14px;\n\n    line-height:1.45;\n\n    margin:7px 0 19px;\n}\n\n.overlay-buttons{\n    display:flex;\n\n    flex-direction:column;\n\n    gap:8px;\n\n    align-items:center;\n}\n\n.overlay-home{\n    border:2px solid #4628bf;\n\n    background:#1a214f;\n\n    color:#7f5ffb;\n\n    border-radius:13px;\n\n    padding:11px 26px;\n\n    font-size:13px;\n\n    font-weight:1000;\n}\n\n\n/* PAUSE */\n\n.pause-text{\n    color:#6d55ce;\n}\n\n\n/* TOAST */\n\n.toast{\n    position:absolute;\n\n    left:50%;\n    bottom:18px;\n\n    z-index:100;\n\n    transform:translate(-50%,20px);\n\n    opacity:0;\n\n    pointer-events:none;\n\n    background:#714efa;\n\n    color:#0f111a;\n\n    padding:10px 15px;\n\n    border-radius:12px;\n\n    font-size:11px;\n\n    font-weight:900;\n\n    transition:.2s;\n}\n\n.toast.show{\n    opacity:1;\n\n    transform:translate(-50%,0);\n}\n\n\n/* MOBILE */\n\n@media(max-width:700px){\n\n    .app{\n        padding:3px;\n    }\n\n    .game{\n        border-radius:18px;\n    }\n\n    .header{\n        min-height:56px;\n\n        padding:6px 8px;\n    }\n\n    .logo{\n        font-size:18px;\n    }\n\n    .stat{\n        min-width:45px;\n\n        padding:4px;\n    }\n\n    .stat small{\n        font-size:6px;\n    }\n\n    .stat strong{\n        font-size:13px;\n    }\n\n\n    #homeScreen{\n        padding:8px;\n    }\n\n    .home-icon{\n        font-size:45px;\n    }\n\n    .home-title{\n        font-size:38px;\n    }\n\n    .home-text{\n        font-size:12px;\n\n        margin:5px auto 10px;\n    }\n\n    .feature-row{\n        gap:4px;\n\n        margin-bottom:9px;\n    }\n\n    .feature{\n        padding:5px 7px;\n\n        font-size:7px;\n    }\n\n    .mode-grid{\n        gap:4px;\n\n        margin-bottom:10px;\n    }\n\n    .mode-card{\n        padding:8px 3px;\n\n        border-radius:12px;\n    }\n\n    .mode-icon{\n        font-size:23px;\n    }\n\n    .mode-title{\n        font-size:9px;\n    }\n\n    .mode-info{\n        font-size:6px;\n    }\n\n    .start-main{\n        padding:10px 22px;\n\n        font-size:14px;\n    }\n\n\n    #setupScreen{\n        padding:7px;\n\n        gap:5px;\n    }\n\n    .setup-title{\n        font-size:21px;\n    }\n\n    .setup-text{\n        font-size:9px;\n    }\n\n    .setup-card{\n        padding:10px;\n\n        gap:8px;\n    }\n\n    .setup-icon{\n        font-size:45px;\n    }\n\n    .difficulty{\n        gap:4px;\n    }\n\n    .difficulty button{\n        padding:7px 8px;\n\n        font-size:8px;\n    }\n\n\n    #gameScreen{\n        padding:5px;\n\n        gap:4px;\n    }\n\n    .game-top{\n        grid-template-columns:auto 1fr auto auto;\n\n        gap:3px;\n    }\n\n    .round-info{\n        font-size:8px;\n    }\n\n    .center-info{\n        font-size:7px;\n    }\n\n    .center-info strong{\n        font-size:13px;\n    }\n\n    .game-btn{\n        padding:5px;\n\n        font-size:6px;\n    }\n\n\n    .target-box{\n        padding:7px;\n\n        font-size:14px;\n\n        border-radius:11px;\n    }\n\n    .target-symbol{\n        font-size:24px;\n    }\n\n    .target-box small{\n        font-size:7px;\n    }\n\n\n    .timer-wrap{\n        height:9px;\n    }\n\n\n    .clash-grid{\n        gap:5px;\n    }\n\n    .clash-btn{\n        border-width:3px;\n\n        border-radius:12px;\n\n        font-size:34px;\n    }\n\n\n    .bottom{\n        font-size:7px;\n\n        gap:10px;\n    }\n\n\n    .overlay-card{\n        padding:19px;\n    }\n\n    .overlay-icon{\n        font-size:48px;\n    }\n\n    .overlay-title{\n        font-size:30px;\n    }\n\n    .overlay-score{\n        font-size:42px;\n    }\n}\n\n<\/style>\n<style>html,body{background:radial-gradient(ellipse at 10% 0,#ff72c655,transparent 45%),radial-gradient(ellipse at 90% 100%,#36e0c255,transparent 50%),#11152b!important;color:#0d1027}<\/style><\/head>\n\n<body>\n\n<div class=\"app\">\n\n<div class=\"game\">\n\n\n<!-- HEADER -->\n\n<header class=\"header\">\n\n    <div class=\"logo\">\n        COLOR <span>CLASH 💛<\/span>\n    <\/div>\n\n    <div class=\"header-stats\">\n\n        <div class=\"stat\">\n            <small>SCORE<\/small>\n            <strong id=\"headerScore\">0<\/strong>\n        <\/div>\n\n        <div class=\"stat\">\n            <small>BEST<\/small>\n            <strong id=\"bestScore\">0<\/strong>\n        <\/div>\n\n    <\/div>\n\n<\/header>\n\n\n<!-- HOME -->\n\n<section id=\"homeScreen\" class=\"screen\">\n\n    <div class=\"home-icon\">\n        ⚡\n    <\/div>\n\n    <h1 class=\"home-title\">\n        COLOR CLASH\n    <\/h1>\n\n    <p class=\"home-text\">\n        Kijk goed naar het symbool bovenaan en klik zo snel mogelijk\n        op het juiste vak. De tijd wordt steeds sneller!\n    <\/p>\n\n\n    <div class=\"feature-row\">\n\n        <div class=\"feature\">⚡ SNELHEID<\/div>\n        <div class=\"feature\">🎯 REACTIE<\/div>\n        <div class=\"feature\">🔥 COMBO<\/div>\n        <div class=\"feature\">🏆 SCORE<\/div>\n\n    <\/div>\n\n\n    <div class=\"mode-grid\">\n\n        <button\n            class=\"mode-card selected\"\n            data-difficulty=\"easy\"\n        >\n\n            <div class=\"mode-icon\">\n                🌱\n            <\/div>\n\n            <div class=\"mode-title\">\n                MAKKELIJK\n            <\/div>\n\n            <div class=\"mode-info\">\n                Meer tijd\n            <\/div>\n\n        <\/button>\n\n\n        <button\n            class=\"mode-card\"\n            data-difficulty=\"normal\"\n        >\n\n            <div class=\"mode-icon\">\n                ⚡\n            <\/div>\n\n            <div class=\"mode-title\">\n                NORMAAL\n            <\/div>\n\n            <div class=\"mode-info\">\n                Sneller\n            <\/div>\n\n        <\/button>\n\n\n        <button\n            class=\"mode-card\"\n            data-difficulty=\"hard\"\n        >\n\n            <div class=\"mode-icon\">\n                🔥\n            <\/div>\n\n            <div class=\"mode-title\">\n                MOEILIJK\n            <\/div>\n\n            <div class=\"mode-info\">\n                Supersnel\n            <\/div>\n\n        <\/button>\n\n    <\/div>\n\n\n    <button\n        id=\"startBtn\"\n        class=\"start-main\"\n    >\n        START GAME 🚀\n    <\/button>\n\n<\/section>\n\n\n<!-- GAME -->\n\n<section\n    id=\"gameScreen\"\n    class=\"screen hidden\"\n>\n\n    <div class=\"game-top\">\n\n        <div\n            id=\"roundInfo\"\n            class=\"round-info\"\n        >\n            RONDE 1\n        <\/div>\n\n\n        <div class=\"center-info\">\n\n            SCORE:\n            <strong id=\"gameScore\">\n                0\n            <\/strong>\n\n        <\/div>\n\n\n        <button\n            id=\"pauseBtn\"\n            class=\"game-btn\"\n        >\n            ⏸️ PAUZE\n        <\/button>\n\n\n        <button\n            id=\"homeBtn\"\n            class=\"game-btn\"\n        >\n            🏠 HOME\n        <\/button>\n\n    <\/div>\n\n\n    <div class=\"target-box\">\n\n        KLIK OP:\n\n        <span\n            id=\"targetSymbol\"\n            class=\"target-symbol\"\n        >\n            ★\n        <\/span>\n\n        <small>\n            Kies zo snel mogelijk het juiste symbool\n        <\/small>\n\n    <\/div>\n\n\n    <div class=\"timer-wrap\">\n\n        <div\n            id=\"timerBar\"\n            class=\"timer-bar\"\n        ><\/div>\n\n    <\/div>\n\n\n    <div\n        id=\"clashGrid\"\n        class=\"clash-grid\"\n    >\n    <\/div>\n\n\n    <div class=\"bottom\">\n\n        <span>\n            ❤️ LEVENS:\n            <b id=\"lives\">\n                3\n            <\/b>\n        <\/span>\n\n        <span>\n            🔥 COMBO:\n            <b id=\"combo\">\n                0\n            <\/b>\n        <\/span>\n\n        <span>\n            BEST:\n            <b id=\"gameBest\">\n                0\n            <\/b>\n        <\/span>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- RESULT -->\n\n<div\n    id=\"resultOverlay\"\n    class=\"overlay hidden\"\n>\n\n    <div class=\"overlay-card\">\n\n        <div\n            id=\"resultIcon\"\n            class=\"overlay-icon\"\n        >\n            🏆\n        <\/div>\n\n\n        <div\n            id=\"resultTitle\"\n            class=\"overlay-title\"\n        >\n            GAME OVER\n        <\/div>\n\n\n        <div\n            id=\"resultScore\"\n            class=\"overlay-score\"\n        >\n            0\n        <\/div>\n\n\n        <div\n            id=\"resultText\"\n            class=\"overlay-text\"\n        >\n        <\/div>\n\n\n        <div class=\"overlay-buttons\">\n\n            <button\n                id=\"againBtn\"\n                class=\"start-main\"\n            >\n                🔄 OPNIEUW\n            <\/button>\n\n\n            <button\n                id=\"resultHomeBtn\"\n                class=\"overlay-home\"\n            >\n                🏠 TERUG NAAR HOME\n            <\/button>\n\n        <\/div>\n\n    <\/div>\n\n<\/div>\n\n\n<!-- PAUSE -->\n\n<div\n    id=\"pauseOverlay\"\n    class=\"overlay hidden\"\n>\n\n    <div class=\"overlay-card\">\n\n        <div class=\"overlay-icon\">\n            ⏸️\n        <\/div>\n\n        <div class=\"overlay-title\">\n            PAUZE\n        <\/div>\n\n        <div class=\"overlay-text\">\n            Je spel staat tijdelijk stil.\n        <\/div>\n\n        <button\n            id=\"resumeBtn\"\n            class=\"start-main\"\n        >\n            ▶ VERDER\n        <\/button>\n\n    <\/div>\n\n<\/div>\n\n\n<div\n    id=\"toast\"\n    class=\"toast\"\n>\n<\/div>\n\n\n<\/div>\n<\/div>\n\n\n<script>\n\n/* =====================================================\n   ELEMENTEN\n===================================================== */\n\nconst homeScreen =\n    document.getElementById(\"homeScreen\");\n\nconst gameScreen =\n    document.getElementById(\"gameScreen\");\n\nconst startBtn =\n    document.getElementById(\"startBtn\");\n\nconst homeBtn =\n    document.getElementById(\"homeBtn\");\n\nconst pauseBtn =\n    document.getElementById(\"pauseBtn\");\n\nconst resumeBtn =\n    document.getElementById(\"resumeBtn\");\n\nconst againBtn =\n    document.getElementById(\"againBtn\");\n\nconst resultHomeBtn =\n    document.getElementById(\"resultHomeBtn\");\n\nconst resultOverlay =\n    document.getElementById(\"resultOverlay\");\n\nconst pauseOverlay =\n    document.getElementById(\"pauseOverlay\");\n\nconst clashGrid =\n    document.getElementById(\"clashGrid\");\n\nconst targetSymbol =\n    document.getElementById(\"targetSymbol\");\n\nconst timerBar =\n    document.getElementById(\"timerBar\");\n\nconst roundInfo =\n    document.getElementById(\"roundInfo\");\n\nconst gameScore =\n    document.getElementById(\"gameScore\");\n\nconst headerScore =\n    document.getElementById(\"headerScore\");\n\nconst bestScoreEl =\n    document.getElementById(\"bestScore\");\n\nconst gameBest =\n    document.getElementById(\"gameBest\");\n\nconst livesEl =\n    document.getElementById(\"lives\");\n\nconst comboEl =\n    document.getElementById(\"combo\");\n\nconst resultIcon =\n    document.getElementById(\"resultIcon\");\n\nconst resultTitle =\n    document.getElementById(\"resultTitle\");\n\nconst resultScore =\n    document.getElementById(\"resultScore\");\n\nconst resultText =\n    document.getElementById(\"resultText\");\n\nconst toast =\n    document.getElementById(\"toast\");\n\n\n/* =====================================================\n   GAME VARIABELEN\n===================================================== */\n\nlet difficulty = \"easy\";\n\nlet score = 0;\nlet lives = 3;\nlet combo = 0;\n\nlet round = 0;\n\nlet gameRunning = false;\nlet paused = false;\n\nlet timerInterval = null;\n\nlet timeLeft = 0;\nlet maxTime = 0;\n\nlet target = \"\";\n\nlet bestScore =\n    Number(\n        localStorage.getItem(\"colorClashBest\")\n    ) || 0;\n\nbestScoreEl.textContent =\n    bestScore;\n\ngameBest.textContent =\n    bestScore;\n\n\n/* SYMBOLEN */\n\nconst symbols = [\n    \"★\",\n    \"◆\",\n    \"●\",\n    \"▲\",\n    \"■\",\n    \"♥\"\n];\n\n\n/* =====================================================\n   MOEILIJKHEID\n===================================================== */\n\ndocument\n.querySelectorAll(\".mode-card\")\n.forEach(card => {\n\n    card.addEventListener(\"click\", () => {\n\n        document\n        .querySelectorAll(\".mode-card\")\n        .forEach(c =>\n            c.classList.remove(\"selected\")\n        );\n\n        card.classList.add(\"selected\");\n\n        difficulty =\n            card.dataset.difficulty;\n\n    });\n\n});\n\n\n/* =====================================================\n   START\n===================================================== */\n\nstartBtn.addEventListener(\n    \"click\",\n    startGame\n);\n\n\nfunction startGame(){\n\n    clearInterval(timerInterval);\n\n    score = 0;\n    lives = 3;\n    combo = 0;\n    round = 0;\n\n    gameRunning = true;\n    paused = false;\n\n    resultOverlay.classList.add(\n        \"hidden\"\n    );\n\n    pauseOverlay.classList.add(\n        \"hidden\"\n    );\n\n    homeScreen.classList.add(\n        \"hidden\"\n    );\n\n    gameScreen.classList.remove(\n        \"hidden\"\n    );\n\n    updateStats();\n\n    nextRound();\n\n}\n\n\n/* =====================================================\n   NIEUWE RONDE\n===================================================== */\n\nfunction nextRound(){\n\n    if(!gameRunning)\n        return;\n\n    round++;\n\n    roundInfo.textContent =\n        \"RONDE \" + round;\n\n\n    /* Tijd wordt steeds korter */\n\n    if(difficulty === \"easy\"){\n\n        maxTime =\n            Math.max(\n                1100,\n                2200 - round * 45\n            );\n\n    }\n    else if(difficulty === \"normal\"){\n\n        maxTime =\n            Math.max(\n                800,\n                1700 - round * 50\n            );\n\n    }\n    else{\n\n        maxTime =\n            Math.max(\n                600,\n                1300 - round * 45\n            );\n\n    }\n\n\n    timeLeft = maxTime;\n\n\n    target =\n        symbols[\n            Math.floor(\n                Math.random() *\n                symbols.length\n            )\n        ];\n\n\n    targetSymbol.textContent =\n        target;\n\n\n    createClashButtons();\n\n    startTimer();\n\n}\n\n\n/* =====================================================\n   KNOPPEN MAKEN\n===================================================== */\n\nfunction createClashButtons(){\n\n    clashGrid.innerHTML = \"\";\n\n    let shuffled =\n        [...symbols];\n\n\n    shuffle(shuffled);\n\n\n    /* Soms hetzelfde doel nog maar\n       één keer in het speelveld */\n\n    shuffled.forEach(symbol => {\n\n        const button =\n            document.createElement(\"button\");\n\n        button.type = \"button\";\n\n        button.className =\n            \"clash-btn\";\n\n        button.textContent =\n            symbol;\n\n\n        button.addEventListener(\n            \"click\",\n            () => {\n\n                chooseSymbol(\n                    button,\n                    symbol\n                );\n\n            }\n        );\n\n\n        clashGrid.appendChild(\n            button\n        );\n\n    });\n\n}\n\n\n/* =====================================================\n   SYMBOOL KIEZEN\n===================================================== */\n\nfunction chooseSymbol(\n    button,\n    symbol\n){\n\n    if(\n        !gameRunning ||\n        paused\n    )\n        return;\n\n\n    clearInterval(timerInterval);\n\n\n    if(symbol === target){\n\n        button.classList.add(\n            \"correct\"\n        );\n\n\n        combo++;\n\n        score +=\n            50 +\n            combo * 5;\n\n\n        gameMessage(\n            \"GOED! 🔥\"\n        );\n\n\n        updateStats();\n\n\n        setTimeout(\n            nextRound,\n            120\n        );\n\n    }\n    else{\n\n        button.classList.add(\n            \"wrong\"\n        );\n\n\n        lives--;\n\n        combo = 0;\n\n\n        updateStats();\n\n\n        if(lives <= 0){\n\n            finishGame();\n\n            return;\n\n        }\n\n\n        gameMessage(\n            \"FOUT! ❌\"\n        );\n\n\n        /*\n           Bij een fout krijg je een\n           nieuwe ronde, maar verlies je\n           een leven.\n        */\n\n        setTimeout(\n            nextRound,\n            300\n        );\n\n    }\n\n}\n\n\n/* =====================================================\n   TIMER\n===================================================== */\n\nfunction startTimer(){\n\n    clearInterval(timerInterval);\n\n    updateTimer();\n\n\n    timerInterval =\n        setInterval(() => {\n\n            if(\n                paused ||\n                !gameRunning\n            )\n                return;\n\n\n            timeLeft -= 30;\n\n            updateTimer();\n\n\n            if(timeLeft <= 0){\n\n                clearInterval(\n                    timerInterval\n                );\n\n\n                lives--;\n\n                combo = 0;\n\n                updateStats();\n\n\n                if(lives <= 0){\n\n                    finishGame();\n\n                }\n                else{\n\n                    gameMessage(\n                        \"⏰ TE LAAT!\"\n                    );\n\n                    setTimeout(\n                        nextRound,\n                        300\n                    );\n\n                }\n\n            }\n\n        },30);\n\n}\n\n\n/* =====================================================\n   TIMER UPDATE\n===================================================== */\n\nfunction updateTimer(){\n\n    const percent =\n        Math.max(\n            0,\n            Math.min(\n                100,\n                (timeLeft / maxTime) * 100\n            )\n        );\n\n\n    timerBar.style.width =\n        percent + \"%\";\n\n}\n\n\n/* =====================================================\n   STATS\n===================================================== */\n\nfunction updateStats(){\n\n    gameScore.textContent =\n        score;\n\n    headerScore.textContent =\n        score;\n\n    livesEl.textContent =\n        lives;\n\n    comboEl.textContent =\n        combo;\n\n    gameBest.textContent =\n        bestScore;\n\n}\n\n\n/* =====================================================\n   GAME MESSAGE\n===================================================== */\n\nfunction gameMessage(text){\n\n    targetSymbol.animate(\n        [\n            {\n                transform:\"scale(1)\"\n            },\n            {\n                transform:\"scale(1.25)\"\n            },\n            {\n                transform:\"scale(1)\"\n            }\n        ],\n        {\n            duration:180\n        }\n    );\n\n}\n\n\n/* =====================================================\n   EINDE\n===================================================== */\n\nfunction finishGame(){\n\n    clearInterval(timerInterval);\n\n    gameRunning = false;\n\n    pauseOverlay.classList.add(\n        \"hidden\"\n    );\n\n\n    if(score > bestScore){\n\n        bestScore = score;\n\n        localStorage.setItem(\n            \"colorClashBest\",\n            bestScore\n        );\n\n        bestScoreEl.textContent =\n            bestScore;\n\n        gameBest.textContent =\n            bestScore;\n\n        resultIcon.textContent =\n            \"👑\";\n\n        resultTitle.textContent =\n            \"NIEUW RECORD!\";\n\n    }\n    else{\n\n        resultIcon.textContent =\n            \"💛\";\n\n        resultTitle.textContent =\n            \"GAME OVER!\";\n\n    }\n\n\n    resultScore.textContent =\n        score;\n\n\n    resultText.textContent =\n        `Je haalde ${round - 1} rondes met een combo van ${combo}.`;\n\n\n    resultOverlay.classList.remove(\n        \"hidden\"\n    );\n\n}\n\n\n/* =====================================================\n   PAUZE\n===================================================== */\n\npauseBtn.addEventListener(\n    \"click\",\n    () => {\n\n        if(!gameRunning)\n            return;\n\n        paused = true;\n\n        pauseOverlay.classList.remove(\n            \"hidden\"\n        );\n\n    }\n);\n\n\nresumeBtn.addEventListener(\n    \"click\",\n    () => {\n\n        paused = false;\n\n        pauseOverlay.classList.add(\n            \"hidden\"\n        );\n\n    }\n);\n\n\n/* =====================================================\n   OPNIEUW\n===================================================== */\n\nagainBtn.addEventListener(\n    \"click\",\n    startGame\n);\n\n\n/* =====================================================\n   HOME\n===================================================== */\n\nhomeBtn.addEventListener(\n    \"click\",\n    goHome\n);\n\nresultHomeBtn.addEventListener(\n    \"click\",\n    goHome\n);\n\n\nfunction goHome(){\n\n    clearInterval(timerInterval);\n\n    gameRunning = false;\n    paused = false;\n\n    resultOverlay.classList.add(\n        \"hidden\"\n    );\n\n    pauseOverlay.classList.add(\n        \"hidden\"\n    );\n\n    gameScreen.classList.add(\n        \"hidden\"\n    );\n\n    homeScreen.classList.remove(\n        \"hidden\"\n    );\n\n}\n\n\n/* =====================================================\n   SHUFFLE\n===================================================== */\n\nfunction shuffle(array){\n\n    for(\n        let i = array.length - 1;\n        i > 0;\n        i--\n    ){\n\n        const j =\n            Math.floor(\n                Math.random() *\n                (i + 1)\n            );\n\n        [\n            array[i],\n            array[j]\n        ] =\n        [\n            array[j],\n            array[i]\n        ];\n\n    }\n\n}\n\n\n/* =====================================================\n   TOAST\n===================================================== */\n\nlet toastTimer = null;\n\nfunction showToast(message){\n\n    toast.textContent =\n        message;\n\n    toast.classList.add(\n        \"show\"\n    );\n\n    clearTimeout(\n        toastTimer\n    );\n\n    toastTimer =\n        setTimeout(() => {\n\n            toast.classList.remove(\n                \"show\"\n            );\n\n        },1800);\n\n}\n\n\n/* =====================================================\n   GEEN SCROLL\n===================================================== */\n\ndocument.addEventListener(\n    \"touchmove\",\n    e => {\n        e.preventDefault();\n    },\n    {\n        passive:false\n    }\n);\n\n<\/script>\n\n<\/body>\n<\/html>",

ackground:linear-gradient(135deg,#674ecc,#4831a7);\n    color:#0f111a;\n    font-size:17px;\n    font-weight:1000;\n    box-shadow:0 8px 20px rgba(101,52,144,.22);\n}\n\n.start-main:disabled{\n    opacity:.5;\n    cursor:not-allowed;\n}\n\n/* SETUP */\n\n#setupScreen{\n    padding:13px;\n    gap:9px;\n}\n\n.setup-title{\n    text-align:center;\n    color:#6d55ce;\n    font-size:clamp(24px,4vw,34px);\n    font-weight:1000;\n}\n\n.setup-text{\n    text-align:center;\n    color:#5e43c9;\n    font-size:13px;\n}\n\n.setup-card{\n    flex:1;\n    min-height:0;\n    display:flex;\n    flex-direction:column;\n    align-items:center;\n    justify-content:center;\n    gap:13px;\n    padding:18px;\n    border:2px solid #3a2787;\n    border-radius:19px;\n    background:#111532;\n}\n\n.setup-icon{\n    font-size:60px;\n}\n\n.difficulty-title{\n    color:#6b53cd;\n    font-size:13px;\n    font-weight:1000;\n}\n\n.difficulty{\n    display:flex;\n    gap:8px;\n}\n\n.difficulty button{\n    border:2px solid #392785;\n    background:#131838;\n    color:#6b53cd;\n    border-radius:11px;\n    padding:9px 15px;\n    font-size:11px;\n    font-weight:1000;\n}\n\n.difficulty button.active{\n    background:#5e43c8;\n    color:#ffffff;\n    border-color:#7159cf;\n}\n\n.setup-actions{\n    display:flex;\n    justify-content:center;\n    gap:8px;\n    flex-wrap:wrap;\n}\n\n.back-btn{\n    border:2px solid #3a2786;\n    background:#131838;\n    color:#6e56ce;\n    border-radius:12px;\n    padding:10px 20px;\n    font-size:12px;\n    font-weight:1000;\n}\n\n/* ONLINE */\n\n.online-setup{\n    width:min(600px,100%);\n    padding:12px;\n    border:2px solid #3a2787;\n    border-radius:17px;\n    background:#111532;\n    margin:auto;\n}\n\n.online-tabs{\n    display:flex;\n    gap:7px;\n    margin-bottom:8px;\n}\n\n.online-tab{\n    flex:1;\n    border:2px solid #392785;\n    background:#131838;\n    color:#6e56ce;\n    border-radius:11px;\n    padding:9px;\n    font-size:11px;\n    font-weight:1000;\n}\n\n.online-tab.active{\n    background:#6045c9;\n    color:#ffffff;\n}\n\n.room-box{\n    padding:10px;\n    border-radius:12px;\n    background:#5d42c8;\n    color:#ffffff;\n    text-align:center;\n    font-weight:1000;\n}\n\n.room-code{\n    display:block;\n    font-size:27px;\n    letter-spacing:5px;\n    margin-top:2px;\n}\n\n.join-row{\n    display:flex;\n    gap:7px;\n}\n\n.join-input{\n    flex:1;\n    min-width:0;\n    border:2px solid #392785;\n    background:#0f111a;\n    color:#7d67d3;\n    border-radius:11px;\n    padding:9px;\n    font-size:15px;\n    font-weight:1000;\n    text-transform:uppercase;\n    outline:none;\n}\n\n.join-btn,\n.copy-btn{\n    border:0;\n    border-radius:11px;\n    padding:9px 15px;\n    background:#5d42c8;\n    color:#ffffff;\n    font-size:11px;\n    font-weight:1000;\n}\n\n.connection-status{\n    min-height:18px;\n    margin-top:7px;\n    text-align:center;\n    color:#5d42c8;\n    font-size:11px;\n}\n\n/* GAME */\n\n#gameScreen{\n    padding:8px;\n    gap:6px;\n}\n\n.game-top{\n    display:grid;\n    grid-template-columns:auto 1fr auto auto;\n    align-items:center;\n    gap:7px;\n}\n\n.turn-label{\n    color:#6c54cd;\n    font-size:12px;\n    font-weight:1000;\n}\n\n.center-status{\n    text-align:center;\n    color:#563ac6;\n    font-size:10px;\n}\n\n.center-status strong{\n    color:#6950cc;\n    font-size:17px;\n}\n\n.game-btn{\n    border:2px solid #3b2788;\n    background:#131838;\n    color:#6e56ce;\n    border-radius:10px;\n    padding:6px 8px;\n    font-size:9px;\n    font-weight:1000;\n}\n\n/* BEURT */\n\n.turn-banner{\n    width:100%;\n    text-align:center;\n    padding:10px 14px;\n    border-radius:14px;\n    background:#151a3e;\n    border:3px solid #4f35b8;\n    color:#6f57ce;\n    font-size:19px;\n    font-weight:1000;\n    box-shadow:0 5px 14px rgba(86,40,116,.12);\n    transition:.2s;\n}\n\n.turn-banner.player2{\n    background:#1a214d;\n    border-color:#6045c9;\n    color:#7c67d3;\n}\n\n.turn-banner.online{\n    background:#151b3f;\n    border-color:#5b40c7;\n}\n\n/* MESSAGE */\n\n.game-message{\n    min-height:20px;\n    text-align:center;\n    color:#6f57ce;\n    font-size:clamp(17px,3vw,24px);\n    font-weight:1000;\n}\n\n.game-submessage{\n    min-height:15px;\n    text-align:center;\n    color:#5539c4;\n    font-size:10px;\n}\n\n/* SCORE */\n\n.scoreboard{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:8px;\n}\n\n.score-card{\n    padding:7px 10px;\n    border-radius:12px;\n    background:#121735;\n    border:2px solid #3a2786;\n    text-align:center;\n    transition:.2s;\n}\n\n.score-card.active{\n    border:3px solid #6248ca;\n    background:#171d44;\n    transform:scale(1.04);\n    box-shadow:0 0 0 4px rgba(108,53,152,.12);\n}\n\n.score-card:not(.active){\n    opacity:.68;\n    transform:scale(.98);\n}\n\n.score-card span{\n    display:block;\n    color:#5d42c8;\n    font-size:9px;\n}\n\n.score-card strong{\n    color:#6a51cd;\n    font-size:20px;\n}\n\n/* GRID */\n\n.memory-grid{\n    flex:1;\n    min-height:0;\n    display:grid;\n    grid-template-columns:repeat(4,1fr);\n    grid-template-rows:repeat(4,1fr);\n    gap:8px;\n    padding:3px;\n}\n\n.card{\n    position:relative;\n    min-width:0;\n    min-height:0;\n    padding:0;\n    border:0;\n    background:transparent;\n    border-radius:15px;\n    perspective:900px;\n}\n\n.card-inner{\n    position:absolute;\n    inset:0;\n    width:100%;\n    height:100%;\n    transform-style:preserve-3d;\n    transition:transform .32s;\n}\n\n.card.flipped .card-inner,\n.card.matched .card-inner{\n    transform:rotateY(180deg);\n}\n\n.card-face{\n    position:absolute;\n    inset:0;\n    width:100%;\n    height:100%;\n    display:flex;\n    align-items:center;\n    justify-content:center;\n    border-radius:15px;\n    backface-visibility:hidden;\n}\n\n.card-front{\n    background:linear-gradient(135deg,#5e43c9,#4931a9);\n    border:2px solid #5338c0;\n    color:#ffffff;\n    font-size:31px;\n ing:11px 26px;\n    font-size:13px;\n    font-weight:1000;\n}\n\n/* MOBILE */\n\n@media(max-width:700px){\n\n    .app{\n        padding:3px;\n    }\n\n    .game{\n        border-radius:18px;\n    }\n\n    .header{\n        min-height:56px;\n        padding:6px 8px;\n    }\n\n    .logo{\n        font-size:18px;\n    }\n\n    .stat{\n        min-width:45px;\n        padding:4px;\n    }\n\n    .stat small{\n        font-size:6px;\n    }\n\n    .stat strong{\n        font-size:13px;\n    }\n\n    #homeScreen{\n        padding:8px;\n    }\n\n    .home-icon{\n        font-size:45px;\n    }\n\n    .home-title{\n        font-size:38px;\n    }\n\n    .home-text{\n        font-size:12px;\n        margin:5px auto 10px;\n    }\n\n    .feature-row{\n        gap:4px;\n        margin-bottom:9px;\n    }\n\n    .feature{\n        padding:5px 7px;\n        font-size:7px;\n    }\n\n    .mode-grid{\n        gap:4px;\n        margin-bottom:10px;\n    }\n\n    .mode-card{\n        padding:8px 3px;\n        border-radius:12px;\n    }\n\n    .mode-icon{\n        font-size:23px;\n    }\n\n    .mode-title{\n        font-size:9px;\n    }\n\n    .mode-info{\n        font-size:6px;\n    }\n\n    .start-main{\n        padding:10px 22px;\n        font-size:14px;\n    }\n\n    #setupScreen{\n        padding:7px;\n        gap:5px;\n    }\n\n    .setup-title{\n        font-size:21px;\n    }\n\n    .setup-text{\n        font-size:9px;\n    }\n\n    .setup-card{\n        padding:10px;\n        gap:8px;\n    }\n\n    .setup-icon{\n        font-size:45px;\n    }\n\n    .difficulty{\n        gap:4px;\n    }\n\n    .difficulty button{\n        padding:7px 8px;\n        font-size:8px;\n    }\n\n    .online-setup{\n        padding:7px;\n    }\n\n    .room-code{\n        font-size:21px;\n    }\n\n    .join-input{\n        font-size:12px;\n    }\n\n    .join-btn,\n    .copy-btn{\n        padding:8px 10px;\n        font-size:8px;\n    }\n\n    .connection-status{\n        font-size:8px;\n    }\n\n    #gameScreen{\n        padding:5px;\n        gap:4px;\n    }\n\n    .game-top{\n        grid-template-columns:auto 1fr auto auto;\n        gap:3px;\n    }\n\n    .turn-label{\n        font-size:8px;\n    }\n\n    .center-status{\n        font-size:7px;\n    }\n\n    .center-status strong{\n        font-size:13px;\n    }\n\n    .game-btn{\n        padding:5px 5px;\n        font-size:6px;\n    }\n\n    .turn-banner{\n        padding:7px 7px;\n        font-size:14px;\n        border-radius:10px;\n    }\n\n    .game-message{\n        font-size:15px;\n    }\n\n    .game-submessage{\n        font-size:7px;\n    }\n\n    .score-card{\n        padding:5px 7px;\n    }\n\n    .score-card span{\n        font-size:7px;\n    }\n\n    .score-card strong{\n        font-size:16px;\n    }\n\n    .memory-grid{\n        gap:5px;\n        padding:2px;\n    }\n\n    .card-face{\n        border-radius:10px;\n    }\n\n    .card-front{\n        font-size:22px;\n    }\n\n    .card-back{\n        font-size:29px;\n        border-width:2px;\n    }\n\n    .bottom{\n        font-size:7px;\n    }\n\n    .overlay-card{\n        padding:19px;\n    }\n\n    .overlay-icon{\n        font-size:48px;\n    }\n\n    .overlay-title{\n        font-size:30px;\n    }\n\n    .overlay-score{\n        font-size:42px;\n    }\n}\n<\/style>\n<style>html,body{background:radial-gradient(ellipse at 10% 0,#ff72c655,transparent 45%),radial-gradient(ellipse at 90% 100%,#36e0c255,transparent 50%),#11152b!important;color:#0d1027}<\/style><\/head>\n\n<body>\n\n<div class=\"app\">\n<div class=\"game\">\n\n<header class=\"header\">\n\n    <div class=\"logo\">\n        MEMORY <span>MIX 💜<\/span>\n    <\/div>\n\n    <div class=\"header-stats\">\n\n        <div class=\"stat\">\n            <small>SCORE<\/small>\n            <strong id=\"headerScore\">0<\/strong>\n        <\/div>\n\n        <div class=\"stat\">\n            <small>BEST<\/small>\n            <strong id=\"bestScore\">0<\/strong>\n        <\/div>\n\n    <\/div>\n\n<\/header>\n\n\n<!-- HOME -->\n\n<section id=\"homeScreen\" class=\"screen\">\n\n    <div class=\"home-icon\">🧠<\/div>\n\n    <h1 class=\"home-title\">\n        MEMORY MIX\n    <\/h1>\n\n    <p class=\"home-text\">\n        Vind alle gelijke paren en probeer de meeste punten te verzamelen.\n        Speel tegen de computer, met z'n tweeën op één scherm of online.\n    <\/p>\n\n    <div class=\"feature-row\">\n        <div class=\"feature\">🧠 GEHEUGEN<\/div>\n        <div class=\"feature\">🎯 PAREN<\/div>\n        <div class=\"feature\">🏆 SCORE<\/div>\n        <div class=\"feature\">👥 MULTIPLAYER<\/div>\n    <\/div>\n\n    <div class=\"mode-grid\">\n\n        <button class=\"mode-card selected\" data-mode=\"computer\">\n            <div class=\"mode-icon\">🤖<\/div>\n            <div class=\"mode-title\">TEGEN COMPUTER<\/div>\n            <div class=\"mode-info\">Speel tegen de computer<\/div>\n        <\/button>\n\n        <button class=\"mode-card\" data-mode=\"local\">\n            <div class=\"mode-icon\">👥<\/div>\n            <div class=\"mode-title\">MULTIPLAYER<\/div>\n            <div class=\"mode-info\">Op één scherm<\/div>\n        <\/button>\n\n        <button class=\"mode-card\" data-mode=\"online\">\n            <div class=\"mode-icon\">🌐<\/div>\n            <div class=\"mode-title\">ONLINE<\/div>\n            <div class=\"mode-info\">Twee schermen<\/div>\n        <\/button>\n\n    <\/div>\n\n    <button id=\"continueBtn\" class=\"start-main\">\n        DOORGAAN ➜\n    <\/button>\n\n<\/section>\n\n\n<!-- SETUP -->\n\n<section id=\"setupScreen\" class=\"screen hidden\">\n\n    <div>\n        <div class=\"setup-title\" id=\"setupTitle\">\n            TEGEN COMPUTER\n        <\/div>\n\n        <div class=\"setup-text\" id=\"setupText\">\n            Kies je moeilijkheid.\n        <\/div>\n    <\/div>\n\n\n    <div id=\"normalSetup\" class=\"setup-card\">\n\n        <div class=\"setup-icon\">🧠<\/div>\n\n        <div class=\"difficulty-title\">\n            MOEILIJKHEID\n        <\/div>\n\n        <div class=\"difficulty\">\n\n            <button class=\"active\" data-difficulty=\"easy\">\n                🌱 MAKKELIJK\n            <\/button>\n\n            <button data-difficulty=\"normal\">\n                💜 NORMAAL\n            <\/button>\n\n            <button data-difficulty=\"hard\">\n                🔥 MOEILIJK\n            <\/button>\n\n        <\/div>\n\n    <\/div>\n\n\n    <!-- ONLINE -->\n\n    <div id=\"onlineSetup\" class=\"online-setup hidden\">\n\n        <div class=\"online-tabs\">\n\n            <button id=\"createTab\" class=\"online-tab active\">\n                🏠 KAMER MAKEN\n            <\/button>\n\n            <button id=\"joinTab\" class=\"online-tab\">\n                🔑 JOINEN\n            <\/button>\n\n        <\/div>\n\n\n        <div id=\"createPanel\">\n\n            <div class=\"room-box\">\n                JOUW KAMER-CODE\n                <span id=\"roomCode\" class=\"room-code\">\n                    ------\n                <\/span>\n            <\/div>\n\n            <div style=\"text-align:center;margin-top:6px;\">\n\n                <button id=\"copyBtn\" class=\"copy-btn\">\n                    📋 KOPIËREN\n                <\/button>\n\n            <\/div>\n\n        <\/div>\n\n\n        <div id=\"joinPanel\" class=\"hidden\">\n\n            <div class=\"join-row\">\n\n                <input\n                    id=\"joinInput\"\n                    class=\"join-input\"\n                    maxlength=\"6\"\n                    placeholder=\"KAMER-CODE\"\n                    autocomplete=\"off\"\n                >\n\n                <button id=\"joinBtn\" class=\"join-btn\">\n                    JOINEN\n                <\/button>\n\n            <\/div>\n\n        <\/div>\n\n\n        <div id=\"connectionStatus\" class=\"connection-status\">\n            Kamer wordt voorbereid...\n        <\/div>\n\n    <\/div>\n\n\n    <div class=\"setup-actions\">\n\n        <button id=\"setupHomeBtn\" class=\"back-btn\">\n            🏠 HOME\n        <\/button>\n\n        <button id=\"setupStartBtn\" class=\"start-main\">\n            START GAME 🚀\n        <\/button>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- GAME -->\n\n<section id=\"gameScreen\" class=\"screen hidden\">\n\n    <div class=\"game-top\">\n\n        <div id=\"turnLabel\" class=\"turn-label\">\n            JIJ\n        <\/div>\n\n        <div class=\"center-status\">\n            SCORE:\n            <strong id=\"gameScore\">0<\/strong>\n        <\/div>\n\n        <button id=\"pauseBtn\" class=\"game-btn\">\n            ⏸️ PAUZE\n        <\/button>\n\n        <button id=\"gameHomeBtn\" class=\"game-btn\">\n            🏠 HOME\n        <\/button>\n\n    <\/div>\n\n\n    <div id=\"turnBanner\" class=\"turn-banner\">\n        🟣 JIJ BENT AAN DE BEURT!\n    <\/div>\n\n\n    <div id=\"gameMessage\" class=\"game-message\">\n        DRAAI TWEE KAARTEN OM!\n    <\/div>\n\n    <div id=\"gameSubmessage\" class=\"game-submessage\">\n        Vind zoveel mogelijk paren.\n    <\/div>\n\n\n    <div class=\"scoreboard\">\n\n        <div id=\"player1ScoreCard\" class=\"score-card active\">\n\n            <span id=\"player1Label\">\n                JIJ\n            <\/span>\n\n            <strong id=\"player1Score\">\n                0\n            <\/strong>\n\n        <\/div>\n\n\n        <div id=\"player2ScoreCard\" class=\"score-card\">\n\n            <span id=\"player2Label\">\n                COMPUTER\n            <\/span>\n\n            <strong id=\"player2Score\">\n                0\n            <\/strong>\n\n        <\/div>\n\n    <\/div>\n\n\n    <div id=\"memoryGrid\" class=\"memory-grid\"><\/div>\n\n\n    <div class=\"bottom\">\n\n        <span>\n            PAREN:\n            <b id=\"pairsFound\">0<\/b>/8\n        <\/span>\n\n        <span>\n            FOUTEN:\n            <b id=\"mistakes\">0<\/b>\n        <\/span>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- RESULT -->\n\n<div id=\"resultOverlay\" class=\"overlay hidden\">\n\n    <div class=\"overlay-card\">\n\n        <div id=\"resultIcon\" class=\"overlay-icon\">\n            🏆\n        <\/div>\n\n        <div id=\"resultTitle\" class=\"overlay-title\">\n            GEWELDIG!\n        <\/div>\n\n        <div id=\"resultScore\" class=\"overlay-score\">\n            0\n        <\/div>\n\n        <div id=\"resultText\" class=\"overlay-text\">\n        <\/div>\n\n        <div class=\"overlay-buttons\">\n\n            <button id=\"againBtn\" class=\"start-main\">\n                🔄 OPNIEUW\n            <\/button>\n\n            <button id=\"resultHomeBtn\" class=\"overlay-home\">\n                🏠 TERUG NAAR HOME\n            <\/button>\n\n        <\/div>\n\n    <\/div>\n\n<\/div>\n\n\n<!-- PAUZE -->\n\n<div id=\"pauseOverlay\" class=\"overlay hidden\">\n\n    <div class=\"overlay-card\">\n\n        <div class=\"overlay-icon\">\n            ⏸️\n        <\/div>\n\n        <div class=\"overlay-title\">\n            PAUZE\n        <\/div>\n\n        <div class=\"overlay-text\">\n            Je spel staat tijdelijk stil.\n        <\/div>\n\n        <button id=\"resumeBtn\" class=\"start-main\">\n            ▶ VERDER SPELEN\n        <\/button>\n\n    <\/div>\n\n<\/div>\n\n\n<!-- ONLINE WACHTEN -->\n\n<div id=\"waitingOverlay\" class=\"overlay hidden\">\n\n    <div class=\"overlay-card\">\n\n        <div class=\"overlay-icon\">\n            🌐\n        <\/div>\n\n        <div class=\"overlay-title\">\n            ONLINE\n        <\/div>\n\n        <div id=\"waitingText\" class=\"overlay-text\">\n            Wachten op de andere speler...\n        <\/div>\n\n        <button id=\"waitingHomeBtn\" class=\"overlay-home\">\n            🏠 HOME\n        <\/button>\n\n    <\/div>\n\n<\/div>\n\n\n<div id=\"toast\" class=\"toast\"><\/div>\n\n<\/div>\n<\/div>\n\n\n<script>\n\"use strict\";\n\n/* ELEMENTEN */\n\nconst homeScreen = document.getElementById(\"homeScreen\");\nconst setupScreen = document.getElementById(\"setupScreen\");\nconst gameScreen = document.getElementById(\"gameScreen\");\n\nconst normalSetup = document.getElementById(\"normalSetup\");\nconst onlineSetup = document.getElementById(\"onlineSetup\");\n\nconst continueBtn = document.getElementById(\"continueBtn\");\nconst setupHomeBtn = document.getElementById(\"setupHomeBtn\");\nconst setupStartBtn = document.getElementById(\"setupStartBtn\");\n\nconst gameHomeBtn = document.getElementById(\"gameHomeBtn\");\nconst pauseBtn = document.getElementById(\"pauseBtn\");\nconst resumeBtn = document.getElementById(\"resumeBtn\");\n\nconst resultHomeBtn = document.getElementById(\"resultHomeBtn\");\nconst againBtn = document.getElementById(\"againBtn\");\n\nconst memoryGrid = document.getElementById(\"memoryGrid\");\n\nconst headerScore = document.getElementById(\"headerScore\");\nconst bestScoreEl = document.getElementById(\"bestScore\");\nconst gameScore = document.getElementById(\"gameScore\");\n\nconst player1ScoreEl = document.getElementById(\"player1Score\");\nconst player2ScoreEl = document.getElementById(\"player2Score\");\n\nconst player1ScoreCard = document.getElementById(\"player1ScoreCard\");\nconst player2ScoreCard = document.getElementById(\"player2ScoreCard\");\n\nconst player1Label = document.getElementById(\"player1Label\");\nconst player2Label = document.getElementById(\"player2Label\");\n\nconst turnLabel = document.getElementById(\"turnLabel\");\nconst turnBanner = document.getElementById(\"turnBanner\");\n\nconst gameMessage = document.getElementById(\"gameMessage\");\nconst gameSubmessage = document.getElementById(\"gameSubmessage\");\n\nconst pairsFoundEl = document.getElementById(\"pairsFound\");\nconst mistakesEl = document.getElementById(\"mistakes\");\n\nconst setupTitle = document.getElementById(\"setupTitle\");\nconst setupText = document.getElementById(\"setupText\");\n\nconst resultOverlay = document.getElementById(\"resultOverlay\");\nconst resultIcon = document.getElementById(\"resultIcon\");\nconst resultTitle = document.getElementById(\"resultTitle\");\nconst resultScore = document.getElementById(\"resultScore\");\nconst resultText = document.getElementById(\"resultText\");\n\nconst pauseOverlay = document.getElementById(\"pauseOverlay\");\n\nconst waitingOverlay = document.getElementById(\"waitingOverlay\");\nconst waitingText = document.getElementById(\"waitingText\");\n\nconst createTab = document.getElementById(\"createTab\");\nconst joinTab = document.getElementById(\"joinTab\");\nconst createPanel = document.getElementById(\"createPanel\");\nconst joinPanel = document.getElementById(\"joinPanel\");\n\nconst roomCodeEl = document.getElementById(\"roomCode\");\nconst joinInput = document.getElementById(\"joinInput\");\nconst joinBtn = document.getElementById(\"joinBtn\");\nconst copyBtn = document.getElementById(\"copyBtn\");\n\nconst connectionStatus = document.getElementById(\"connectionStatus\");\nconst toast = document.getElementById(\"toast\");\n\n\n/* GAME */\n\nlet mode = \"computer\";\nlet difficulty = \"easy\";\n\nlet gameRunning = false;\nlet paused = false;\n\nlet currentTurn = 1;\n\nlet cards = [];\nlet firstCard = null;\nlet secondCard = null;\n\nlet lockBoard = false;\n\nlet matchedPairs = 0;\nlet mistakes = 0;\n\nlet score1 = 0;\nlet score2 = 0;\n\nlet computerMemory = [];\nlet computerTimer = null;\n\n\n/* ONLINE */\n\nlet peer = null;\nlet connection = null;\n\nlet onlineRole = null;\nlet onlineConnected = false;\n\nlet onlineReady = false;\nlet onlineOpponentReady = false;\n\nlet onlineDeck = [];\nlet onlineTurn = 1;\n\nlet onlineFirstIndex = null;\nlet onlineSecondIndex = null;\n\n\n/* SYMBOLEN */\n\nconst symbols = [\n    \"🍓\",\"🍉\",\"🍋\",\"🍇\",\n    \"🍒\",\"🥝\",\"🍑\",\"🍍\"\n];\n\n\n/* BESTE SCORE */\n\nlet bestScore =\n    Number(localStorage.getItem(\"memoryMixBest\")) || 0;\n\nbestScoreEl.textContent = bestScore;\n\n\n/* MODUS */\n\ndocument.querySelectorAll(\".mode-card\")\n.forEach(card => {\n\n    card.addEventListener(\"click\", () => {\n\n        document.querySelectorAll(\".mode-card\")\n        .forEach(c => c.classList.remove(\"selected\"));\n\n        card.classList.add(\"selected\");\n\n        mode = card.dataset.mode;\n\n    });\n\n});\n\n\n/* DOORGAAN */\n\ncontinueBtn.addEventListener(\"click\", showSetup);\n\n\nfunction showSetup(){\n\n    homeScreen.classList.add(\"hidden\");\n    setupScreen.classList.remove(\"hidden\");\n\n    resultOverlay.classList.add(\"hidden\");\n    pauseOverlay.classList.add(\"hidden\");\n    waitingOverlay.classList.add(\"hidden\");\n\n\n    if(mode === \"computer\"){\n\n        normalSetup.classList.remove(\"hidden\");\n        onlineSetup.classList.add(\"hidden\");\n\n        setupTitle.textContent = \"TEGEN COMPUTER\";\n        setupText.textContent = \"Kies je moeilijkheid.\";\n\n        setupStartBtn.disabled = false;\n        setupStartBtn.textContent = \"START GAME 🚀\";\n\n    }\n\n    else if(mode === \"local\"){\n\n        normalSetup.classList.remove(\"hidden\");\n        onlineSetup.classList.add(\"hidden\");\n\n        setupTitle.textContent = \"MULTIPLAYER\";\n        setupText.textContent =\n            \"Twee spelers spelen om de beurt op één scherm.\";\n\n        setupStartBtn.disabled = false;\n        setupStartBtn.textContent = \"START GAME 🚀\";\n\n    }\n\n    else{\n\n        normalSetup.classList.add(\"hidden\");\n        onlineSetup.classList.remove(\"hidden\");\n\n        setupTitle.textContent = \"ONLINE MEMORY MIX\";\n        setupText.textContent =\n            \"Maak een kamer of join een bestaande kamer.\";\n\n        setupStartBtn.disabled = true;\n        setupStartBtn.textContent = \"KLAAR ✅\";\n\n        setupOnlineCreate();\n\n    }\n\n}\n\n\n/* MOEILIJKHEID */\n\ndocument.querySelectorAll(\".difficulty button\")\n.forEach(button => {\n\n    button.addEventListener(\"click\", () => {\n\n        document.querySelectorAll(\".difficulty button\")\n        .forEach(b => b.classList.remove(\"active\"));\n\n        button.classList.add(\"active\");\n\n        difficulty = button.dataset.difficulty;\n\n    });\n\n});\n\n\n/* START */\n\nsetupStartBtn.addEventListener(\"click\", () => {\n\n    if(setupStartBtn.disabled)\n        return;\n\n    if(mode === \"computer\"){\n\n        startComputerGame();\n\n    }\n    else if(mode === \"local\"){\n\n        startLocalGame();\n\n    }\n\n});\n\n\n/* RESET */\n\nfunction resetGame(){\n\n    clearTimeout(computerTimer);\n\n    gameRunning = false;\n    paused = false;\n\n    currentTurn = 1;\n\n    cards = [];\n\n    firstCard = null;\n    secondCard = null;\n\n    lockBoard = false;\n\n    matchedPairs = 0;\n    mistakes = 0;\n\n    score1 = 0;\n    score2 = 0;\n\n    computerMemory = [];\n\n}\n\n\n/* COMPUTER START */\n\nfunction startComputerGame(){\n\n    resetGame();\n\n    player1Label.textContent = \"JIJ\";\n    player2Label.textContent = \"COMPUTER\";\n\n    setupScreen.classList.add(\"hidden\");\n    gameScreen.classList.remove(\"hidden\");\n\n    gameRunning = true;\n    currentTurn = 1;\n\n    createBoard();\n\n}\n\n\n/* LOCAL START */\n\nfunction startLocalGame(){\n\n    resetGame();\n\n    player1Label.textContent = \"SPELER 1\";\n    player2Label.textContent = \"SPELER 2\";\n\n    setupScreen.classList.add(\"hidden\");\n    gameScreen.classList.remove(\"hidden\");\n\n    gameRunning = true;\n    currentTurn = 1;\n\n    createBoard();\n\n}\n\n\n/* BOARD */\n\nfunction createBoard(){\n\n    memoryGrid.innerHTML = \"\";\n\n    cards = [...symbols, ...symbols];\n\n    shuffle(cards);\n\n\n    cards.forEach((symbol,index) => {\n\n        const card =\n            document.createElement(\"button\");\n\n        card.type = \"button\";\n        card.className = \"card\";\n\n        card.dataset.index = index;\n        card.dataset.symbol = symbol;\n\n        card.innerHTML = `\n            <div class=\"card-inner\">\n                <div class=\"card-face card-front\">?<\/div>\n                <div class=\"card-face card-back\">${symbol}<\/div>\n            <\/div>\n        `;\n\n        card.addEventListener(\"click\", () => {\n            clickCard(card);\n        });\n\n        memoryGrid.appendChild(card);\n\n    });\n\n\n    gameMessage.textContent =\n        \"DRAAI TWEE KAARTEN OM!\";\n\n    updateUI();\n\n}\n\n\n/* SHUFFLE */\n\nfunction shuffle(array){\n\n    for(let i = array.length - 1; i > 0; i--){\n\n        const j =\n            Math.floor(\n                Math.random() * (i + 1)\n            );\n\n        [array[i],array[j]] =\n        [array[j],array[i]];\n\n    }\n\n}\n\n\n/* KAART KLIKKEN */\n\nfunction clickCard(card){\n\n    if(\n        !gameRunning ||\n        paused ||\n        lockBoard\n    )\n        return;\n\n    if(\n        card.classList.contains(\"flipped\") ||\n        card.classList.contains(\"matched\")\n    )\n        return;\n\n    if(\n        mode === \"computer\" &&\n        currentTurn !== 1\n    )\n        return;\n\n\n    card.classList.add(\"flipped\");\n\n\n    if(!firstCard){\n\n        firstCard = card;\n        return;\n\n    }\n\n\n    secondCard = card;\n    lockBoard = true;\n\n    setTimeout(checkPair,500);\n\n}\n\n\n/* PAAR */\n\nfunction checkPair(){\n\n    if(!firstCard || !secondCard)\n        return;\n\n\n    const match =\n        firstCard.dataset.symbol ===\n        secondCard.dataset.symbol;\n\n\n    if(match){\n\n        firstCard.classList.add(\"matched\");\n        secondCard.classList.add(\"matched\");\n\n\n        if(currentTurn === 1){\n            score1 += 100;\n        }\n        else{\n            score2 += 100;\n        }\n\n\n        matchedPairs++;\n\n\n        rememberCard(firstCard);\n        rememberCard(secondCard);\n\n\n        firstCard = null;\n        secondCard = null;\n\n        lockBoard = false;\n\n\n        gameMessage.textContent =\n            \"🎉 PAAR GEVONDEN!\";\n\n\n        updateUI();\n\n\n        if(matchedPairs >= 8){\n\n            finishGame();\n            return;\n\n        }\n\n\n        /* dezelfde speler mag nog een keer */\n\n        if(\n            mode === \"computer\" &&\n            currentTurn === 2\n        ){\n\n            setTimeout(\n                computerTurn,\n                550\n            );\n\n        }\n\n    }\n\n    else{\n\n        mistakes++;\n\n\n        if(currentTurn === 1){\n\n            score1 =\n                Math.max(0,score1 - 10);\n\n        }\n        else{\n\n            score2 =\n                Math.max(0,score2 - 10);\n\n        }\n\n\n        rememberCard(firstCard);\n        rememberCard(secondCard);\n\n\n        setTimeout(() => {\n\n            if(firstCard){\n                firstCard.classList.remove(\"flipped\");\n            }\n\n            if(secondCard){\n                secondCard.classList.remove(\"flipped\");\n            }\n\n\n            firstCard = null;\n            secondCard = null;\n\n            lockBoard = false;\n\n\n            currentTurn =\n                currentTurn === 1 ? 2 : 1;\n\n\n            gameMessage.textContent =\n                \"DRAAI TWEE KAARTEN OM!\";\n\n\n            updateUI();\n\n\n            if(\n                mode === \"computer\" &&\n                currentTurn === 2\n            ){\n\n                setTimeout(\n                    computerTurn,\n                    500\n                );\n\n            }\n\n        },700);\n\n    }\n\n}\n\n\n/* COMPUTER GEHEUGEN */\n\nfunction rememberCard(card){\n\n    if(!card)\n        return;\n\n    const index =\n        Number(card.dataset.index);\n\n    if(\n        !computerMemory.some(\n            item => item.index === index\n        )\n    ){\n\n        computerMemory.push({\n            index:index,\n            symbol:card.dataset.symbol\n        });\n\n    }\n\n}\n\n\n/* =====================================================\n   COMPUTER\n   SLECHTER GEMAAKT\n===================================================== */\n\nfunction computerTurn(){\n\n    if(\n        !gameRunning ||\n        paused ||\n        mode !== \"computer\" ||\n        currentTurn !== 2\n    )\n        return;\n\n\n    lockBoard = true;\n\n    updateUI();\n\n    gameMessage.textContent =\n        \"🤖 COMPUTER DENKT...\";\n\n\n    let firstIndex;\n    let secondIndex;\n\n\n    /*\n       HOEVEEL HIJ ZIJN GEHEUGEN GEBRUIKT\n\n       Makkelijk: heel weinig\n       Normaal:   gemiddeld\n       Moeilijk:  nog steeds niet perfect\n    */\n\n    const memoryChance =\n        difficulty === \"easy\"\n        ? 0.20\n        : difficulty === \"normal\"\n        ? 0.45\n        : 0.70;\n\n\n    /*\n       Soms kiest de computer zelfs een\n       volledig willekeurige eerste kaart.\n    */\n\n    const available =\n        getAvailableIndices();\n\n\n    if(available.length < 2){\n\n        lockBoard = false;\n        return;\n\n    }\n\n\n    const knownPair =\n        Math.random() < memoryChance\n        ? findKnownPair()\n        : null;\n\n\n    if(knownPair){\n\n        firstIndex = knownPair.first;\n        secondIndex = knownPair.second;\n\n    }\n\n    else{\n\n        firstIndex =\n            available[\n                Math.floor(\n                    Math.random() * available.length\n                )\n            ];\n\n\n        const remaining =\n            available.filter(\n                x => x !== firstIndex\n            );\n\n\n        /*\n           De computer gebruikt zijn kennis\n           van de tweede kaart maar soms.\n        */\n\n        const secondMemoryChance =\n            difficulty === \"easy\"\n            ? 0.12\n            : difficulty === \"normal\"\n            ? 0.30\n            : 0.55;\n\n\n        if(\n            Math.random() < secondMemoryChance\n        ){\n\n            const remembered =\n                findRememberedMatch(\n                    firstIndex,\n                    remaining\n                );\n\n            if(remembered !== null){\n\n                secondIndex = remembered;\n\n            }\n\n        }\n\n\n        if(secondIndex === undefined){\n\n            /*\
