n               EXTRA FOUT:\n               soms laat hij een kaart zien\n               die hij al kent, maar niet gebruikt.\n            */\n\n            secondIndex =\n                remaining[\n                    Math.floor(\n                        Math.random() *\n                        remaining.length\n                    )\n                ];\n\n        }\n\n    }\n\n\n    const thinkingTime =\n        difficulty === \"easy\"\n        ? 850\n        : difficulty === \"normal\"\n        ? 600\n        : 400;\n\n\n    computerTimer =\n        setTimeout(() => {\n\n            const first =\n                getCardByIndex(firstIndex);\n\n            if(first){\n\n                first.classList.add(\"flipped\");\n                rememberCard(first);\n\n            }\n\n\n            setTimeout(() => {\n\n                const second =\n                    getCardByIndex(secondIndex);\n\n                if(second){\n\n                    second.classList.add(\"flipped\");\n                    rememberCard(second);\n\n                }\n\n\n                setTimeout(() => {\n\n                    firstCard =\n                        getCardByIndex(firstIndex);\n\n                    secondCard =\n                        getCardByIndex(secondIndex);\n\n                    checkPair();\n\n                },350);\n\n            },450);\n\n        },thinkingTime);\n\n}\n\n\n/* BEKENDE PAAR */\n\nfunction findKnownPair(){\n\n    const chance =\n        difficulty === \"easy\"\n        ? 0.55\n        : difficulty === \"normal\"\n        ? 0.72\n        : 0.90;\n\n\n    /*\n       Zelfs als hij een paar kent,\n       kan hij het dus missen.\n    */\n\n    if(Math.random() > chance){\n\n        return null;\n\n    }\n\n\n    for(\n        let i = 0;\n        i < computerMemory.length;\n        i++\n    ){\n\n        for(\n            let j = i + 1;\n            j < computerMemory.length;\n            j++\n        ){\n\n            const a =\n                computerMemory[i];\n\n            const b =\n                computerMemory[j];\n\n\n            if(a.symbol !== b.symbol)\n                continue;\n\n\n            const cardA =\n                getCardByIndex(a.index);\n\n            const cardB =\n                getCardByIndex(b.index);\n\n\n            if(\n                cardA &&\n                cardB &&\n                !cardA.classList.contains(\"matched\") &&\n                !cardB.classList.contains(\"matched\")\n            ){\n\n                return {\n                    first:a.index,\n                    second:b.index\n                };\n\n            }\n\n        }\n\n    }\n\n\n    return null;\n\n}\n\n\n/* GEHEUGEN MATCH */\n\nfunction findRememberedMatch(\n    firstIndex,\n    remaining\n){\n\n    const symbol =\n        cards[firstIndex];\n\n\n    const found =\n        computerMemory.find(item => {\n\n            const card =\n                getCardByIndex(item.index);\n\n            return (\n                item.symbol === symbol &&\n                remaining.includes(item.index) &&\n                card &&\n                !card.classList.contains(\"matched\")\n            );\n\n        });\n\n\n    return found\n        ? found.index\n        : null;\n\n}\n\n\n/* BESCHIKBARE KAARTEN */\n\nfunction getAvailableIndices(){\n\n    return cards\n        .map((_,i) => i)\n        .filter(i => {\n\n            const card =\n                getCardByIndex(i);\n\n            return (\n                card &&\n                !card.classList.contains(\"flipped\") &&\n                !card.classList.contains(\"matched\")\n            );\n\n        });\n\n}\n\n\n/* KAART OP INDEX */\n\nfunction getCardByIndex(index){\n\n    return document.querySelector(\n        `.card[data-index=\"${index}\"]`\n    );\n\n}\n\n\n/* BEURT WEERGAVE */\n\nfunction updateTurnMessage(){\n\n    turnBanner.classList.remove(\n        \"player2\",\n        \"online\"\n    );\n\n\n    if(mode === \"local\"){\n\n        if(currentTurn === 1){\n\n            turnLabel.textContent =\n                \"SPELER 1\";\n\n            turnBanner.textContent =\n                \"🟣 SPELER 1 IS AAN DE BEURT!\";\n\n            gameSubmessage.textContent =\n                \"SPELER 1: kies twee kaarten.\";\n\n        }\n        else{\n\n            turnLabel.textContent =\n                \"SPELER 2\";\n\n            turnBanner.textContent =\n                \"🟣 SPELER 2 IS AAN DE BEURT!\";\n\n            turnBanner.classList.add(\n                \"player2\"\n            );\n\n            gameSubmessage.textContent =\n                \"SPELER 2: kies twee kaarten.\";\n\n        }\n\n    }\n\n\n    else if(mode === \"computer\"){\n\n        if(currentTurn === 1){\n\n            turnLabel.textContent =\n                \"JIJ\";\n\n            turnBanner.textContent =\n                \"🟣 JIJ BENT AAN DE BEURT!\";\n\n            gameSubmessage.textContent =\n                \"Draai twee kaarten om.\";\n\n        }\n        else{\n\n            turnLabel.textContent =\n                \"COMPUTER\";\n\n            turnBanner.textContent =\n                \"🤖 COMPUTER IS AAN DE BEURT!\";\n\n            turnBanner.classList.add(\n                \"player2\"\n            );\n\n            gameSubmessage.textContent =\n                \"De computer kiest twee kaarten.\";\n\n        }\n\n    }\n\n\n    else if(mode === \"online\"){\n\n        const myTurn =\n            onlineRole === \"host\"\n            ? 1\n            : 2;\n\n\n        if(currentTurn === myTurn){\n\n            turnLabel.textContent =\n                \"JIJ\";\n\n            turnBanner.textContent =\n                \"🟣 JIJ BENT AAN DE BEURT!\";\n\n            turnBanner.classList.add(\n                \"online\"\n            );\n\n        }\n        else{\n\n            turnLabel.textContent =\n                \"TEGENSTANDER\";\n\n            turnBanner.textContent =\n                \"👀 TEGENSTANDER IS AAN DE BEURT!\";\n\n            turnBanner.classList.add(\n                \"player2\"\n            );\n\n        }\n\n    }\n\n\n    player1ScoreCard.classList.toggle(\n        \"active\",\n        currentTurn === 1\n    );\n\n    player2ScoreCard.classList.toggle(\n        \"active\",\n        currentTurn === 2\n    );\n\n}\n\n\n/* UI */\n\nfunction updateUI(){\n\n    player1ScoreEl.textContent =\n        score1;\n\n    player2ScoreEl.textContent =\n        score2;\n\n\n    let shownScore;\n\n\n    if(mode === \"computer\"){\n\n        shownScore = score1;\n\n    }\n\n    else if(mode === \"online\"){\n\n        shownScore =\n            onlineRole === \"host\"\n            ? score1\n            : score2;\n\n    }\n\n    else{\n\n        shownScore =\n            currentTurn === 1\n            ? score1\n            : score2;\n\n    }\n\n\n    gameScore.textContent =\n        shownScore;\n\n    headerScore.textContent =\n        shownScore;\n\n    pairsFoundEl.textContent =\n        matchedPairs;\n\n    mistakesEl.textContent =\n        mistakes;\n\n\n    updateTurnMessage();\n\n}\n\n\n/* RESULTAAT */\n\nfunction finishGame(){\n\n    gameRunning = false;\n\n    clearTimeout(computerTimer);\n\n\n    let myScore = score1;\n    let enemyScore = score2;\n\n\n    if(\n        mode === \"online\" &&\n        onlineRole === \"guest\"\n    ){\n\n        myScore = score2;\n        enemyScore = score1;\n\n    }\n\n\n    if(myScore > enemyScore){\n\n        resultIcon.textContent =\n            \"🏆\";\n\n        resultTitle.textContent =\n            \"JIJ WINT!\";\n\n    }\n\n    else if(myScore < enemyScore){\n\n        resultIcon.textContent =\n            \"🔥\";\n\n        resultTitle.textContent =\n            mode === \"computer\"\n            ? \"COMPUTER WINT!\"\n            : \"TEGENSTANDER WINT!\";\n\n    }\n\n    else{\n\n        resultIcon.textContent =\n            \"🤝\";\n\n        resultTitle.textContent =\n            \"GELIJKSPEL!\";\n\n    }\n\n\n    resultScore.textContent =\n        myScore;\n\n    resultText.textContent =\n        `Eindscore: ${score1} - ${score2}`;\n\n\n    if(myScore > bestScore){\n\n        bestScore = myScore;\n\n        localStorage.setItem(\n            \"memoryMixBest\",\n            bestScore\n        );\n\n        bestScoreEl.textContent =\n            bestScore;\n\n    }\n\n\n    resultOverlay.classList.remove(\n        \"hidden\"\n    );\n\n}\n\n\n/* PAUZE */\n\npauseBtn.addEventListener(\"click\", () => {\n\n    if(!gameRunning)\n        return;\n\n    paused = true;\n\n    clearTimeout(computerTimer);\n\n    pauseOverlay.classList.remove(\"hidden\");\n\n});\n\n\nresumeBtn.addEventListener(\"click\", () => {\n\n    paused = false;\n\n    pauseOverlay.classList.add(\"hidden\");\n\n    updateUI();\n\n\n    if(\n        mode === \"computer\" &&\n        currentTurn === 2\n    ){\n\n        setTimeout(\n            computerTurn,\n            300\n        );\n\n    }\n\n});\n\n\n/* HOME */\n\nsetupHomeBtn.addEventListener(\"click\", goHome);\ngameHomeBtn.addEventListener(\"click\", goHome);\nresultHomeBtn.addEventListener(\"click\", goHome);\nwaitingHomeBtn.addEventListener(\"click\", goHome);\n\n\nfunction goHome(){\n\n    clearTimeout(computerTimer);\n\n    gameRunning = false;\n\n    pauseOverlay.classList.add(\"hidden\");\n    resultOverlay.classList.add(\"hidden\");\n    waitingOverlay.classList.add(\"hidden\");\n\n    setupScreen.classList.add(\"hidden\");\n    gameScreen.classList.add(\"hidden\");\n\n    homeScreen.classList.remove(\"hidden\");\n\n    closeConnection();\n\n}\n\n\n/* OPNIEUW */\n\nagainBtn.addEventListener(\"click\", () => {\n\n    resultOverlay.classList.add(\"hidden\");\n\n    if(mode === \"computer\"){\n\n        startComputerGame();\n\n    }\n\n    else if(mode === \"local\"){\n\n        startLocalGame();\n\n    }\n\n});\n\n\n/* ONLINE CREATE */\n\ncreateTab.addEventListener(\"click\", () => {\n\n    createTab.classList.add(\"active\");\n    joinTab.classList.remove(\"active\");\n\n    createPanel.classList.remove(\"hidden\");\n    joinPanel.classList.add(\"hidden\");\n\n    setupOnlineCreate();\n\n});\n\n\n/* ONLINE JOIN */\n\njoinTab.addEventListener(\"click\", () => {\n\n    joinTab.classList.add(\"active\");\n    createTab.classList.remove(\"active\");\n\n    createPanel.classList.add(\"hidden\");\n    joinPanel.classList.remove(\"hidden\");\n\n    closeConnection();\n\n    setupStartBtn.disabled = true;\n\n    connectionStatus.textContent =\n        \"Voer een kamer-code in.\";\n\n});\n\n\n/* KAMER MAKEN */\n\nfunction setupOnlineCreate(){\n\n    closeConnection();\n\n    onlineRole = \"host\";\n\n    onlineReady = false;\n    onlineOpponentReady = false;\n\n    setupStartBtn.disabled = true;\n\n    const code = randomCode();\n\n    roomCodeEl.textContent = code;\n\n\n    if(typeof Peer === \"undefined\"){\n\n        connectionStatus.textContent =\n            \"Online kan niet worden geladen.\";\n\n        return;\n\n    }\n\n\n    peer =\n        new Peer(\n            \"MEMORY_MIX_\" + code\n        );\n\n\n    connectionStatus.textContent =\n        \"Kamer wordt aangemaakt...\";\n\n\n    peer.on(\"open\", () => {\n\n        connectionStatus.textContent =\n            \"Kamer klaar! Geef de code aan speler 2.\";\n\n    });\n\n\n    peer.on(\"connection\", conn => {\n\n        if(connection)\n            return;\n\n        connection = conn;\n\n\n        connection.on(\"open\", () => {\n\n            onlineConnected = true;\n\n            setupStartBtn.disabled = false;\n\n            connectionStatus.textContent =\n                \"Speler 2 verbonden! Druk op KLAAR.\";\n\n        });\n\n\n        connection.on(\n            \"data\",\n            handleOnlineData\n        );\n\n\n        connection.on(\"close\", () => {\n\n            onlineConnected = false;\n            gameRunning = false;\n\n            showWaiting(\n                \"De andere speler heeft de verbinding verbroken.\"\n            );\n\n        });\n\n    });\n\n\n    peer.on(\"error\", () => {\n\n        connectionStatus.textContent =\n            \"Er ging iets mis met de kamer.\";\n\n    });\n\n}\n\n\n/* ONLINE JOIN */\n\njoinBtn.addEventListener(\n    \"click\",\n    joinRoom\n);\n\n\nfunction joinRoom(){\n\n    const code =\n        joinInput.value.trim().toUpperCase();\n\n\n    if(!/^[A-Z0-9]{6}$/.test(code)){\n\n        showToast(\n            \"Gebruik een code van 6 tekens.\"\n        );\n\n        return;\n\n    }\n\n\n    closeConnection();\n\n    onlineRole = \"guest\";\n\n    peer = new Peer();\n\n\n    connectionStatus.textContent =\n        \"Verbinden...\";\n\n\n    peer.on(\"open\", () => {\n\n        connection =\n            peer.connect(\n                \"MEMORY_MIX_\" + code,\n                {reliable:true}\n            );\n\n\n        connection.on(\"open\", () => {\n\n            onlineConnected = true;\n\n            setupStartBtn.disabled = false;\n\n            connectionStatus.textContent =\n                \"Verbonden! Druk op KLAAR.\";\n\n        });\n\n\n        connection.on(\n            \"data\",\n            handleOnlineData\n        );\n\n\n        connection.on(\"close\", () => {\n\n            onlineConnected = false;\n\n            showWaiting(\n                \"De verbinding is verbroken.\"\n            );\n\n        });\n\n    });\n\n\n    peer.on(\"error\", () => {\n\n        connectionStatus.textContent =\n            \"Kamer niet gevonden.\";\n\n    });\n\n}\n\n\n/* ONLINE START */\n\nfunction startOnlineGame(){\n\n    if(!onlineConnected){\n\n        showToast(\n            \"Je bent nog niet verbonden.\"\n        );\n\n        return;\n\n    }\n\n\n    onlineReady = true;\n\n\n    connection.send({\n        type:\"ready\"\n    });\n\n\n    setupStartBtn.disabled = true;\n\n\n    if(onlineRole === \"host\"){\n\n        connectionStatus.textContent =\n            \"Jij bent klaar. Wachten op speler 2...\";\n\n        checkOnlineStart();\n\n    }\n\n    else{\n\n        showWaiting(\n            \"Jij bent klaar. Wachten op speler 1...\"\n        );\n\n    }\n\n}\n\n\n/* ONLINE START CHECK */\n\nfunction checkOnlineStart(){\n\n    if(\n        onlineRole !== \"host\" ||\n        !onlineReady ||\n        !onlineOpponentReady\n    )\n        return;\n\n\n    onlineDeck =\n        [...symbols,...symbols];\n\n    shuffle(onlineDeck);\n\n\n    onlineTurn = 1;\n\n    score1 = 0;\n    score2 = 0;\n\n    mistakes = 0;\n    matchedPairs = 0;\n\n    onlineFirstIndex = null;\n    onlineSecondIndex = null;\n\n\n    connection.send({\n        type:\"start\",\n        deck:onlineDeck\n    });\n\n\n    startOnlineBoard();\n\n}\n\n\n/* ONLINE BOARD */\n\nfunction startOnlineBoard(){\n\n    setupScreen.classList.add(\"hidden\");\n\n    waitingOverlay.classList.add(\"hidden\");\n\n    gameScreen.classList.remove(\"hidden\");\n\n\n    player1Label.textContent =\n        onlineRole === \"host\"\n        ? \"JIJ\"\n        : \"TEGENSTANDER\";\n\n\n    player2Label.textContent =\n        onlineRole === \"host\"\n        ? \"TEGENSTANDER\"\n        : \"JIJ\";\n\n\n    gameRunning = true;\n\n    currentTurn = onlineTurn;\n\n\n    createOnlineBoard();\n\n    updateUI();\n\n}\n\n\n/* ONLINE BOARD MAKEN */\n\nfunction createOnlineBoard(){\n\n    memoryGrid.innerHTML = \"\";\n\n\n    onlineDeck.forEach((symbol,index) => {\n\n        const card =\n            document.createElement(\"button\");\n\n\n        card.type = \"button\";\n        card.className = \"card\";\n\n        card.dataset.index = index;\n        card.dataset.symbol = symbol;\n\n\n        card.innerHTML = `\n            <div class=\"card-inner\">\n                <div class=\"card-face card-front\">?<\/div>\n                <div class=\"card-face card-back\">${symbol}<\/div>\n            <\/div>\n        `;\n\n\n        card.addEventListener(\"click\", () => {\n\n            clickOnlineCard(card);\n\n        });\n\n\n        memoryGrid.appendChild(card);\n\n    });\n\n}\n\n\n/* ONLINE CLICK */\n\nfunction clickOnlineCard(card){\n\n    if(\n        !gameRunning ||\n        paused ||\n        lockBoard\n    )\n        return;\n\n\n    const myTurn =\n        onlineRole === \"host\"\n        ? 1\n        : 2;\n\n\n    if(onlineTurn !== myTurn)\n        return;\n\n\n    if(\n        card.classList.contains(\"flipped\") ||\n        card.classList.contains(\"matched\")\n    )\n        return;\n\n\n    card.classList.add(\"flipped\");\n\n\n    const index =\n        Number(card.dataset.index);\n\n\n    if(onlineFirstIndex === null){\n\n        onlineFirstIndex = index;\n\n\n        connection.send({\n            type:\"firstCard\",\n            index:index\n        });\n\n\n        gameMessage.textContent =\n            \"KIES JE TWEEDE KAART!\";\n\n        return;\n\n    }\n\n\n    onlineSecondIndex = index;\n\n    lockBoard = true;\n\n\n    connection.send({\n        type:\"secondCard\",\n        index:index\n    });\n\n\n    if(onlineRole === \"host\"){\n\n        setTimeout(\n            checkOnlinePair,\n            450\n        );\n\n    }\n\n}\n\n\n/* ONLINE PAAR */\n\nfunction checkOnlinePair(){\n\n    if(\n        onlineFirstIndex === null ||\n        onlineSecondIndex === null\n    )\n        return;\n\n\n    const match =\n        onlineDeck[onlineFirstIndex] ===\n        onlineDeck[onlineSecondIndex];\n\n\n    if(match){\n\n        matchedPairs++;\n\n        if(onlineTurn === 1){\n            score1 += 100;\n        }\n        else{\n            score2 += 100;\n        }\n\n    }\n    else{\n\n        mistakes++;\n\n    }\n\n\n    connection.send({\n\n        type:\"pairResult\",\n\n        match:match,\n\n        first:onlineFirstIndex,\n\n        second:onlineSecondIndex,\n\n        score1:score1,\n\n        score2:score2,\n\n        matchedPairs:matchedPairs,\n\n        mistakes:mistakes,\n\n        nextTurn:\n            match\n            ? onlineTurn\n            : (\n                onlineTurn === 1\n                ? 2\n                : 1\n            )\n\n    });\n\n\n    finishOnlinePair(\n        match,\n        onlineFirstIndex,\n        onlineSecondIndex,\n        match\n        ? onlineTurn\n        : (\n            onlineTurn === 1\n            ? 2\n            : 1\n        )\n    );\n\n}\n\n\n/* ONLINE AFHANDELEN */\n\nfunction finishOnlinePair(\n    match,\n    first,\n    second,\n    nextTurn\n){\n\n    const firstEl =\n        getCardByIndex(first);\n\n    const secondEl =\n        getCardByIndex(second);\n\n\n    if(match){\n\n        if(firstEl)\n            firstEl.classList.add(\"matched\");\n\n        if(secondEl)\n            secondEl.classList.add(\"matched\");\n\n        gameMessage.textContent =\n            \"🎉 PAAR GEVONDEN!\";\n\n    }\n\n\n    setTimeout(() => {\n\n        if(!match){\n\n            if(firstEl)\n                firstEl.classList.remove(\"flipped\");\n\n            if(secondEl)\n                secondEl.classList.remove(\"flipped\");\n\n        }\n\n\n        onlineFirstIndex = null;\n        onlineSecondIndex = null;\n\n        lockBoard = false;\n\n        onlineTurn = nextTurn;\n        currentTurn = nextTurn;\n\n\n        updateUI();\n\n\n        if(matchedPairs >= 8){\n\n            finishGame();\n            return;\n\n        }\n\n\n        gameMessage.textContent =\n            \"DRAAI TWEE KAARTEN OM!\";\n\n\n    },match ? 450 : 900);\n\n}\n\n\n/* ONLINE DATA */\n\nfunction handleOnlineData(data){\n\n    if(!data)\n        return;\n\n\n    if(data.type === \"ready\"){\n\n        onlineOpponentReady = true;\n\n        if(onlineRole === \"host\"){\n            checkOnlineStart();\n        }\n\n        return;\n    }\n\n\n    if(data.type === \"start\"){\n\n        onlineDeck = data.deck;\n\n        onlineTurn = 1;\n\n        score1 = 0;\n        score2 = 0;\n\n        mistakes = 0;\n        matchedPairs = 0;\n\n        onlineFirstIndex = null;\n        onlineSecondIndex = null;\n\n        startOnlineBoard();\n\n        return;\n    }\n\n\n    if(data.type === \"firstCard\"){\n\n        const card =\n            getCardByIndex(data.index);\n\n        if(card)\n            card.classList.add(\"flipped\");\n\n        onlineFirstIndex =\n            data.index;\n\n        return;\n    }\n\n\n    if(data.type === \"secondCard\"){\n\n        const card =\n            getCardByIndex(data.index);\n\n        if(card)\n            card.classList.add(\"flipped\");\n\n        onlineSecondIndex =\n            data.index;\n\n        return;\n    }\n\n\n    if(data.type === \"pairResult\"){\n\n        score1 = data.score1;\n        score2 = data.score2;\n\n        matchedPairs = data.matchedPairs;\n        mistakes = data.mistakes;\n\n\n        finishOnlinePair(\n            data.match,\n            data.first,\n            data.second,\n            data.nextTurn\n        );\n\n    }\n\n}\n\n\n/* WAITING */\n\nfunction showWaiting(message){\n\n    waitingText.textContent =\n        message;\n\n    waitingOverlay.classList.remove(\n        \"hidden\"\n    );\n\n}\n\n\n/* CODE */\n\nfunction randomCode(){\n\n    const chars =\n        \"ABCDEFGHJKLMNPQRSTUVWXYZ23456789\";\n\n    let code = \"\";\n\n    for(let i = 0; i < 6; i++){\n\n        code +=\n            chars[\n                Math.floor(\n                    Math.random() *\n                    chars.length\n                )\n            ];\n\n    }\n\n    return code;\n\n}\n\n\n/* KOPIËREN */\n\ncopyBtn.addEventListener(\"click\",async() => {\n\n    const code =\n        roomCodeEl.textContent;\n\n    try{\n\n        await navigator.clipboard.writeText(code);\n\n        showToast(\n            \"Kamer-code gekopieerd 📋\"\n        );\n\n    }\n    catch{\n\n        showToast(\n            \"Code: \" + code\n        );\n\n    }\n\n});\n\n\n/* CONNECTION */\n\nfunction closeConnection(){\n\n    try{\n\n        if(connection)\n            connection.close();\n\n        if(peer)\n            peer.destroy();\n\n    }\n    catch(e){}\n\n    connection = null;\n    peer = null;\n\n    onlineConnected = false;\n    onlineRole = null;\n\n    onlineReady = false;\n    onlineOpponentReady = false;\n\n}\n\n\n/* TOAST */\n\nlet toastTimer = null;\n\nfunction showToast(message){\n\n    toast.textContent =\n        message;\n\n    toast.classList.add(\"show\");\n\n    clearTimeout(toastTimer);\n\n\n    toastTimer =\n        setTimeout(() => {\n\n            toast.classList.remove(\"show\");\n\n        },2000);\n\n}\n\n\n/* GEEN SCROLL */\n\ndocument.addEventListener(\n    \"touchmove\",\n    e => e.preventDefault(),\n    {passive:false}\n);\n\n\n/* START */\n\nupdateUI();\n\n<\/script>\n\n<\/body>\n<\/html>",
"maze": "<!DOCTYPE html>\n<html lang=\"nl\">\n<head><script>try{localStorage.getItem(\"x\")}catch(e){var _m={};Object.defineProperty(window,\"localStorage\",{value:{getItem:function(k){return k in _m?_m[k]:null},setItem:function(k,v){_m[k]=String(v)},removeItem:function(k){delete _m[k]}}})}<\/script>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1.0\">\n\n<title>NEON MAZE 🟢<\/title>\n\n<style>\n*{box-sizing:border-box}\n\nhtml,body{\nmargin:0;\nwidth:100%;\nheight:100%;\noverflow:hidden;\nfont-family:Arial;\n}\n\nbody{\nbackground:linear-gradient(135deg,#acb3e0,#603afa,#121736);\ndisplay:flex;\nalign-items:center;\njustify-content:center;\n}\n\n.game{\nwidth:95%;\nheight:95vh;\nmax-width:900px;\nbackground:#0f111a;\nborder-radius:30px;\npadding:20px;\ntext-align:center;\nbox-shadow:0 10px 30px #175b2c;\n}\n\nh1{\ncolor:#7e64e4;\nfont-size:45px;\n}\n\n.screen{\nheight:85%;\ndisplay:flex;\nflex-direction:column;\njustify-content:center;\nalign-items:center;\ngap:20px;\n}\n\n.hidden{\ndisplay:none;\n}\n\nbutton{\npadding:16px 35px;\nborder:0;\nborder-radius:20px;\nbackground:#603afa;\ncolor:#0f111a;\nfont-size:20px;\ncursor:pointer;\n}\n\n.info{\nwidth:100%;\ndisplay:flex;\njustify-content:space-around;\nfont-size:22px;\ncolor:#8c77e2;\n}\n\n#maze{\nwidth:360px;\nheight:360px;\ndisplay:grid;\ngrid-template-columns:repeat(10,1fr);\nborder:5px solid #7e64e4;\nborder-radius:15px;\noverflow:hidden;\n}\n\n.cell{\nbackground:#121736;\nborder:1px solid #1e2559;\n}\n\n.wall{\nbackground:#8c77e2;\n}\n\n.player{\nbackground:#603afa;\n}\n\n.goal{\nbackground:#1e265a;\n}\n\n<\/style>\n<style>html,body{background:radial-gradient(ellipse at 10% 0,#ff72c655,transparent 45%),radial-gradient(ellipse at 90% 100%,#36e0c255,transparent 50%),#11152b!important;color:#0d1027}<\/style><\/head>\n\n\n<body>\n\n\n<div class=\"game\">\n\n<h1>🟢 NEON MAZE<\/h1>\n\n\n<div id=\"home\" class=\"screen\">\n\n<h2>Vind de uitgang!<\/h2>\n\n<p>\n⬆️⬇️⬅️➡️ Beweeg<br>\n🚪 Bereik de groene uitgang\n<\/p>\n\n\n<button onclick=\"startGame()\">\nSTART GAME 🚀\n<\/button>\n\n\n<\/div>\n\n\n\n<div id=\"play\" class=\"screen hidden\">\n\n\n<div class=\"info\">\n\n<div>\n🏆 <span id=\"score\">0<\/span>\n<\/div>\n\n<div>\nLEVEL <span id=\"level\">1<\/span>\n<\/div>\n\n<\/div>\n\n\n<div id=\"maze\"><\/div>\n\n\n<button onclick=\"goHome()\">\n⬅ Home\n<\/button>\n\n\n<\/div>\n\n\n\n<div id=\"end\" class=\"screen hidden\">\n\n<h2>🎉 Level gehaald!<\/h2>\n\n<h1 id=\"endScore\"><\/h1>\n\n\n<button onclick=\"nextLevel()\">\nVOLGEND LEVEL 🚀\n<\/button>\n\n\n<button onclick=\"goHome()\">\n🏠 Home\n<\/button>\n\n\n<\/div>\n\n\n<\/div>\n\n\n\n<script>\n\n\nlet score=0;\nlet level=1;\n\n\nlet player;\nlet goal;\n\n\nlet map=[];\n\n\n\nfunction startGame(){\n\nscore=0;\nlevel=1;\n\ndocument.getElementById(\"home\")\n.classList.add(\"hidden\");\n\ndocument.getElementById(\"end\")\n.classList.add(\"hidden\");\n\ndocument.getElementById(\"play\")\n.classList.remove(\"hidden\");\n\n\nnewLevel();\n\n}\n\n\n\nfunction nextLevel(){\n\ndocument.getElementById(\"end\")\n.classList.add(\"hidden\");\n\ndocument.getElementById(\"play\")\n.classList.remove(\"hidden\");\n\n\nnewLevel();\n\n}\n\n\n\nfunction newLevel(){\n\nmakeMaze();\n\ndraw();\n\n}\n\n\n\nfunction makeMaze(){\n\nmap=[];\n\n\nlet difficulty =\nMath.min(\n0.12 + level*0.045,\n0.45\n);\n\n\n\nfor(let y=0;y<10;y++){\n\nlet row=[];\n\n\nfor(let x=0;x<10;x++){\n\nlet wall=\nMath.random()<difficulty;\n\n\nif(\n(x==0&&y==0)||\n(x==9&&y==9)\n){\n\nwall=false;\n\n}\n\n\nrow.push(wall);\n\n}\n\n\nmap.push(row);\n\n}\n\n\n\n// gegarandeerde route\n\nlet x=0;\nlet y=0;\n\n\nwhile(\nx<9 ||\ny<9\n){\n\nmap[y][x]=false;\n\n\nif(\nMath.random()<0.5 &&\nx<9\n){\n\nx++;\n\n}\nelse if(y<9){\n\ny++;\n\n}\n\n}\n\n\nmap[9][9]=false;\n\n\n\nplayer={\nx:0,\ny:0\n};\n\n\ngoal={\nx:9,\ny:9\n};\n\n\n}\n\n\n\nfunction draw(){\n\nlet maze=\ndocument.getElementById(\"maze\");\n\n\nmaze.innerHTML=\"\";\n\n\nfor(let y=0;y<10;y++){\n\nfor(let x=0;x<10;x++){\n\n\nlet cell=\ndocument.createElement(\"div\");\n\n\ncell.className=\"cell\";\n\n\nif(map[y][x])\ncell.classList.add(\"wall\");\n\n\nif(\nx==player.x &&\ny==player.y\n)\ncell.classList.add(\"player\");\n\n\nif(\nx==goal.x &&\ny==goal.y\n)\ncell.classList.add(\"goal\");\n\n\nmaze.appendChild(cell);\n\n\n}\n\n}\n\n\ndocument.getElementById(\"score\")\n.innerHTML=score;\n\n\ndocument.getElementById(\"level\")\n.innerHTML=level;\n\n\n}\n\n\n\ndocument.addEventListener(\n\"keydown\",\nfunction(e){\n\n\nlet nx=player.x;\nlet ny=player.y;\n\n\nif(e.key==\"ArrowUp\")\nny--;\n\nif(e.key==\"ArrowDown\")\nny++;\n\nif(e.key==\"ArrowLeft\")\nnx--;\n\nif(e.key==\"ArrowRight\")\nnx++;\n\n\n\nif(\nnx>=0 &&\nny>=0 &&\nnx<10 &&\nny<10 &&\n!map[ny][nx]\n){\n\nplayer.x=nx;\nplayer.y=ny;\n\n\nscore+=5;\n\n\nif(\nplayer.x==goal.x &&\nplayer.y==goal.y\n){\n\nscore+=level*20;\n\n\ndocument.getElementById(\"play\")\n.classList.add(\"hidden\");\n\n\ndocument.getElementById(\"end\")\n.classList.remove(\"hidden\");\n\n\ndocument.getElementById(\"endScore\")\n.innerHTML=\n\"Score: \"+score;\n\n\nlevel++;\n\n\n}\n\n\ndraw();\n\n}\n\n\n});\n\n\n\nfunction goHome(){\n\ndocument.getElementById(\"play\")\n.classList.add(\"hidden\");\n\ndocument.getElementById(\"end\")\n.classList.add(\"hidden\");\n\n\ndocument.getElementById(\"home\")\n.classList.remove(\"hidden\");\n\n\n}\n\n\n<\/script>\n\n<\/body>\n<\/html>",
"ice": "<!DOCTYPE html>\n<html lang=\"nl\">\n<head><script>try{localStorage.getItem(\"x\")}catch(e){var _m={};Object.defineProperty(window,\"localStorage\",{value:{getItem:function(k){return k in _m?_m[k]:null},setItem:function(k,v){_m[k]=String(v)},removeItem:function(k){delete _m[k]}}})}<\/script>\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\n      content=\"width=device-width,\n      initial-scale=1.0,\n      maximum-scale=1.0,\n      user-scalable=no\">\n\n<title>ICE SLIDE 🔴<\/title>\n\n<style>\n\n*{\n    box-sizing:border-box;\n    -webkit-tap-highlight-color:transparent;\n    user-select:none;\n}\n\nhtml,\nbody{\n    width:100%;\n    height:100%;\n    margin:0;\n    overflow:hidden;\n    font-family:Arial,Helvetica,sans-serif;\n}\n\nbody{\n    background:\n        radial-gradient(\n            circle at 10% 10%,\n            #121737 0%,\n            transparent 30%\n        ),\n        radial-gradient(\n            circle at 90% 90%,\n            #5a3ecd 0%,\n            transparent 35%\n        ),\n        linear-gradient(\n            135deg,\n            #0c1025,\n            #1b2250,\n            #3c249c\n        );\n\n    color:#8470d6;\n}\n\nbutton{\n    font-family:inherit;\n    cursor:pointer;\n    touch-action:manipulation;\n}\n\nbutton:active{\n    transform:scale(.97);\n}\n\n.hidden{\n    display:none !important;\n}\n\n\n/* =====================================================\n   APP\n===================================================== */\n\n.app{\n    width:100%;\n    height:100%;\n\n    display:flex;\n    align-items:center;\n    justify-content:center;\n\n    padding:8px;\n}\n\n.game{\n    width:min(1100px,100%);\n    height:min(800px,100%);\n\n    position:relative;\n\n    display:flex;\n    flex-direction:column;\n\n    overflow:hidden;\n\n    background:#0b0e22;\n\n    border:3px solid #3b288a;\n    border-radius:28px;\n\n    box-shadow:\n        0 22px 65px rgba(105,35,32,.24);\n}\n\n\n/* =====================================================\n   HEADER\n===================================================== */\n\n.header{\n    min-height:70px;\n\n    padding:10px 17px;\n\n    display:flex;\n    justify-content:space-between;\n    align-items:center;\n\n    gap:10px;\n\n    background:\n        linear-gradient(\n            135deg,\n            #6248cd,\n            #432aa9\n        );\n\n    color:#ffffff;\n\n    flex-shrink:0;\n}\n\n.logo{\n    font-size:clamp(22px,4vw,34px);\n    font-weight:1000;\n}\n\n.logo span{\n    color:#111633;\n}\n\n.header-stats{\n    display:flex;\n    gap:6px;\n}\n\n.stat{\n    min-width:64px;\n\n    padding:5px 8px;\n\n    border-radius:11px;\n\n    background:rgba(15,17,26,0.15);\n\n    border:2px solid rgba(15,17,26,0.18);\n\n    text-align:center;\n}\n\n.stat small{\n    display:block;\n    font-size:8px;\n    opacity:.85;\n}\n\n.stat strong{\n    display:block;\n    font-size:17px;\n}\n\n\n/* =====================================================\n   SCREENS\n===================================================== */\n\n.screen{\n    flex:1;\n    min-height:0;\n\n    display:flex;\n    flex-direction:column;\n\n    overflow:hidden;\n}\n\n\n/* =====================================================\n   HOME\n===================================================== */\n\n#homeScreen{\n    align-items:center;\n    justify-content:center;\n\n    text-align:center;\n\n    padding:18px;\n\n    overflow:hidden;\n}\n\n.home-icon{\n    font-size:63px;\n}\n\n.home-title{\n    margin:0;\n\n    color:#6349cd;\n\n    font-size:clamp(42px,7vw,65px);\n\n    font-weight:1000;\n}\n\n.home-text{\n    max-width:680px;\n\n    margin:8px auto 17px;\n\n    color:#6349ca;\n\n    line-height:1.45;\n\n    font-size:16px;\n}\n\n.feature-row{\n    display:flex;\n\n    justify-content:center;\n    flex-wrap:wrap;\n\n    gap:7px;\n\n    margin-bottom:18px;\n}\n\n.feature{\n    padding:7px 11px;\n\n    border-radius:11px;\n\n    background:#111532;\n\n    border:2px solid #37257e;\n\n    color:#6950cc;\n\n    font-size:11px;\n\n    font-weight:900;\n}\n\n.setup-info{\n    width:min(720px,100%);\n\n    padding:13px 16px;\n\n    margin-bottom:16px;\n\n    border-radius:16px;\n\n    background:#0e1129;\n\n    border:2px solid #35237a;\n\n    color:#664dcb;\n\n    font-size:13px;\n\n    line-height:1.45;\n\n    text-align:center;\n}\n\n.start-main{\n    border:0;\n\n    padding:13px 32px;\n\n    border-radius:15px;\n\n    background:\n        linear-gradient(\n            135deg,\n            #5f44cb,\n            #442ca4\n        );\n\n    color:#ffffff;\n\n    font-size:17px;\n\n    font-weight:1000;\n\n    box-shadow:\n        0 8px 20px\n        rgba(150,43,48,.23);\n}\n\n\n/* =====================================================\n   GAME\n===================================================== */\n\n#gameScreen{\n    padding:8px;\n\n    gap:6px;\n\n    overflow:hidden;\n}\n\n.game-top{\n    display:grid;\n\n    grid-template-columns:auto 1fr auto auto auto;\n\n    align-items:center;\n\n    gap:6px;\n\n    flex-shrink:0;\n}\n\n.level-info{\n    color:#6248ca;\n\n    font-size:11px;\n\n    font-weight:1000;\n\n    white-space:nowrap;\n}\n\n.center-info{\n    text-align:center;\n\n    color:#5237be;\n\n    font-size:10px;\n}\n\n.center-info strong{\n    color:#6248ca;\n\n    font-size:18px;\n}\n\n.game-btn{\n    border:2px solid #35237a;\n\n    background:#0f132d;\n\n    color:#6d55ce;\n\n    border-radius:10px;\n\n    padding:6px 8px;\n\n    font-size:9px;\n\n    font-weight:1000;\n\n    white-space:nowrap;\n}\n\n\n/* =====================================================\n   INFO\n===================================================== */\n\n.info-bar{\n    width:100%;\n\n    display:grid;\n\n    grid-template-columns:\n        repeat(4,1fr);\n\n    gap:5px;\n\n    flex-shrink:0;\n}\n\n.info-item{\n    min-width:0;\n\n    padding:6px 4px;\n\n    border-radius:11px;\n\n    background:#0e1129;\n\n    border:2px solid #252e6e;\n\n    text-align:center;\n\n    color:#ffffff;\n\n    font-size:8px;\n\n    font-weight:900;\n}\n\n.info-item strong{\n    display:block;\n\n    margin-top:2px;\n\n    color:#644bcb;\n\n    font-size:15px;\n}\n\n\n/* =====================================================\n   BOARD CONTAINER\n===================================================== */\n\n.board-wrap{\n    flex:1;\n\n    min-height:0;\n    min-width:0;\n\n    display:flex;\n\n    align-items:center;\n    justify-content:center;\n\n    overflow:hidden;\n\n    padding:2px;\n}\n\n\n/* =====================================================\n   BOARD\n===================================================== */\n\n.board{\n    height:100%;\n\n    width:auto;\n\n    aspect-ratio:1 / 1;\n\n    max-width:100%;\n    max-height:100%;\n\n    display:grid;\n\n    grid-template-columns:\n        repeat(6,1fr);\n\n    grid-template-rows:\n        repeat(6,1fr);\n\n    gap:5px;\n\n    padding:6px;\n\n    border-radius:18px;\n\n    background:#4c33af;\n\n    border:3px solid #5e43c9;\n\n    box-shadow:\n        0 10px 25px\n        rgba(100,35,35,.18);\n\n    flex-shrink:1;\n}\n\n\n/* =====================================================\n   CELL\n===================================================== */\n\n.cell{\n    position:relative;\n\n    min-width:0;\n    min-height:0;\n\n    display:flex;\n\n    align-items:center;\n    justify-content:center;\n\n    border-radius:9px;\n\n    background:#212a64;\n\n    overflow:hidden;\n}\n\n.cell.wall{\n    background:#725bd0;\n\n    box-shadow:\n        inset 0 0 0 2px #ab3b40;\n}\n\n.cell.goal{\n    background:#181e47;\n\n    box-shadow:\n        inset 0 0 0 3px #bb5a57;\n}\n\n.cell.crystal{\n    background:#13193a;\n}\n\n\n/* =====================================================\n   PLAYER\n===================================================== */\n\n.player{\n    width:72%;\n    height:72%;\n\n    display:flex;\n\n    align-items:center;\n    justify-content:center;\n\n    border-radius:16px;\n\n    background:#0b0d20;\n\n    border:3px solid #212649;\n\n    font-size:clamp(18px,3.5vw,37px);\n\n    box-shadow:\n        0 5px 9px\n        rgba(90,50,48,.18);\n\n    animation:playerPop .15s ease;\n}\n\n@keyframes playerPop{\n\n    from{\n        transform:scale(.8);\n    }\n\n    to{\n        transform:scale(1);\n    }\n\n}\n\n\n/* =====================================================\n   GOAL\n===================================================== */\n\n.goal-icon{\n    font-size:clamp(18px,3.5vw,36px);\n\n    animation:pulse 1s\n        infinite alternate;\n}\n\n@keyframes pulse{\n\n    from{\n        transform:scale(.92);\n    }\n\n    to{\n        transform:scale(1.08);\n    }\n\n}\n\n\n/* =====================================================\n   CRYSTAL\n===================================================== */\n\n.crystal-icon{\n    font-size:clamp(16px,3vw,30px);\n\n    animation:float .9s\n        infinite alternate;\n}\n\n@keyframes float{\n\n    from{\n        transform:translateY(2px);\n    }\n\n    to{\n        transform:translateY(-3px);\n    }\n\n}\n\n\n/* =====================================================\n   BOTTOM\n===================================================== */\n\n.bottom{\n    display:flex;\n\n    justify-content:center;\n    align-items:center;\n\n    gap:14px;\n\n    min-height:18px;\n\n    flex-shrink:0;\n\n    color:#583dc7;\n\n    font-size:10px;\n\n    font-weight:900;\n}\n\n\n/* =====================================================\n   OVERLAY\n===================================================== */\n\n.overlay{\n    position:absolute;\n\n    inset:0;\n\n    z-index:50;\n\n    display:flex;\n\n    align-items:center;\n    justify-content:center;\n\n    padding:20px;\n\n    background:\n        rgba(149,131,219,0.63);\n\n    backdrop-filter:blur(5px);\n}\n\n.overlay-card{\n    width:min(440px,92%);\n\n    padding:25px;\n\n    background:#0b0e22;\n\n    border:3px solid #3a2787;\n\n    border-radius:22px;\n\n    text-align:center;\n\n    box-shadow:\n        0 20px 50px\n        rgba(0,0,0,.2);\n}\n\n.overlay-icon{\n    font-size:60px;\n}\n\n.overlay-title{\n    margin:4px 0;\n\n    color:#654ccb;\n\n    font-size:36px;\n\n    font-weight:1000;\n}\n\n.overlay-score{\n    color:#573bc6;\n\n    font-size:48px;\n\n    font-weight:1000;\n}\n\n.overlay-text{\n    color:#644acb;\n\n    font-size:14px;\n\n    line-height:1.45;\n\n    margin:8px 0 19px;\n}\n\n.overlay-buttons{\n    display:flex;\n\n    flex-direction:column;\n\n    align-items:center;\n\n    gap:8px;\n}\n\n.overlay-home{\n    border:2px solid #35237a;\n\n    background:#0f132e;\n\n    color:#6d55ce;\n\n    border-radius:13px;\n\n    padding:11px 26px;\n\n    font-size:13px;\n\n    font-weight:1000;\n}\n\n\n/* =====================================================\n   TOAST\n===================================================== */\n\n.toast{\n    position:absolute;\n\n    left:50%;\n    bottom:18px;\n\n    z-index:100;\n\n    padding:10px 15px;\n\n    border-radius:12px;\n\n    background:#6950cc;\n\n    color:#0f111a;\n\n    font-size:11px;\n\n    font-weight:900;\n\n    opacity:0;\n\n    transform:\n        translate(-50%,20px);\n\n    pointer-events:none;\n\n    transition:.2s;\n}\n\n.toast.show{\n    opacity:1;\n\n    transform:\n        translate(-50%,0);\n}\n\n\n/* =====================================================\n   MOBILE\n===================================================== */\n\n@media(max-width:700px){\n\n    .app{\n        padding:3px;\n    }\n\n    .game{\n        border-radius:18px;\n    }\n\n\n    .header{\n        min-height:56px;\n\n        padding:6px 8px;\n    }\n\n    .logo{\n        font-size:18px;\n    }\n\n    .stat{\n        min-width:45px;\n\n        padding:4px;\n    }\n\n    .stat small{\n        font-size:6px;\n    }\n\n    .stat strong{\n        font-size:13px;\n    }\n\n\n    #homeScreen{\n        padding:8px;\n    }\n\n    .home-icon{\n        font-size:45px;\n    }\n\n    .home-title{\n        font-size:38px;\n    }\n\n    .home-text{\n        font-size:12px;\n\n        margin:5px auto 10px;\n    }\n\n    .feature-row{\n        gap:4px;\n\n        margin-bottom:10px;\n    }\n\n    .feature{\n        padding:5px 7px;\n\n        font-size:7px;\n    }\n\n    .setup-info{\n        padding:8px;\n\n        margin-bottom:10px;\n\n        font-size:9px;\n    }\n\n    .start-main{\n        padding:10px 23px;\n\n        font-size:14px;\n    }\n\n\n    #gameScreen{\n        padding:5px;\n\n        gap:4px;\n    }\n\n    .game-top{\n        grid-template-columns:\n            auto 1fr auto auto auto;\n\n        gap:3px;\n    }\n\n    .level-info{\n        font-size:7px;\n    }\n\n    .center-info{\n        font-size:7px;\n    }\n\n    .center-info strong{\n        font-size:13px;\n    }\n\n    .game-btn{\n        padding:5px;\n\n        font-size:5px;\n    }\n\n\n    .info-bar{\n        gap:3px;\n    }\n\n    .info-item{\n        padding:5px 2px;\n\n        font-size:6px;\n    }\n\n    .info-item strong{\n        font-size:11px;\n    }\n\n\n    .board-wrap{\n        padding:1px;\n    }\n\n    .board{\n        height:100%;\n\n        width:auto;\n\n        max-width:100%;\n        max-height:100%;\n\n        gap:3px;\n\n        padding:4px;\n\n        border-radius:14px;\n    }\n\n    .cell{\n        border-radius:6px;\n    }\n\n    .cell.wall{\n        box-shadow:\n            inset 0 0 0 1px #ab3b40;\n    }\n\n    .player{\n        width:70%;\n        height:70%;\n\n        border-width:2px;\n\n        border-radius:8px;\n    }\n\n\n    .bottom{\n        min-height:14px;\n\n        font-size:6px;\n\n        gap:8px;\n    }\n\n\n    .overlay{\n        padding:12px;\n    }\n\n    .overlay-card{\n        padding:18px;\n    }\n\n    .overlay-icon{\n        font-size:46px;\n    }\n\n    .overlay-title{\n        font-size:28px;\n    }\n\n    .overlay-score{\n        font-size:40px;\n    }\n\n}\n\n\n/* =====================================================\n   EXTRA KLEINE SCHERMEN\n===================================================== */\n\n@media(\n    max-height:650px\n){\n\n    .header{\n        min-height:48px;\n    }\n\n    #gameScreen{\n        gap:3px;\n    }\n\n    .game-top{\n        gap:3px;\n    }\n\n    .info-item{\n        padding:4px 2px;\n    }\n\n    .board{\n        gap:3px;\n        padding:4px;\n    }\n\n    .bottom{\n        min-height:12px;\n    }\n\n}\n<\/style>\n<style>html,body{background:radial-gradient(ellipse at 10% 0,#ff72c655,transparent 45%),radial-gradient(ellipse at 90% 100%,#36e0c255,transparent 50%),#11152b!important;color:#0d1027}<\/style><\/head>\n\n\n<body>\n\n<div class=\"app\">\n\n<div class=\"game\">\n\n\n<!-- =====================================================\n     HEADER\n===================================================== -->\n\n<header class=\"header\">\n\n    <div class=\"logo\">\n        ICE <span>SLIDE 🔴<\/span>\n    <\/div>\n\n    <div class=\"header-stats\">\n\n        <div class=\"stat\">\n            <small>SCORE<\/small>\n            <strong id=\"headerScore\">0<\/strong>\n        <\/div>\n\n        <div class=\"stat\">\n            <small>BEST<\/small>\n            <strong id=\"bestScore\">0<\/strong>\n        <\/div>\n\n    <\/div>\n\n<\/header>\n\n\n<!-- =====================================================\n     HOME\n===================================================== -->\n\n<section\n    id=\"homeScreen\"\n    class=\"screen\"\n>\n\n    <div class=\"home-icon\">\n        🧊\n    <\/div>\n\n    <h1 class=\"home-title\">\n        ICE SLIDE\n    <\/h1>\n\n    <p class=\"home-text\">\n        Glijd over het ijs, verzamel alle 💎 en bereik\n        de 🔥 uitgang. Denk goed na, want je stopt pas\n        wanneer je tegen een muur botst!\n    <\/p>\n\n\n    <div class=\"feature-row\">\n\n        <div class=\"feature\">\n            🧊 GLIJDEN\n        <\/div>\n\n        <div class=\"feature\">\n            💎 KRISTALLEN\n        <\/div>\n\n        <div class=\"feature\">\n            🧱 OBSTAKELS\n        <\/div>\n\n        <div class=\"feature\">\n            🔥 UITGANG\n        <\/div>\n\n    <\/div>\n\n\n    <div class=\"setup-info\">\n\n        <b>Zo speel je:<\/b><br>\n\n        Gebruik de pijltjestoetsen op de computer.\n        Op je gsm swipe je in de richting waarin je wilt glijden.\n        Verzamel alle 💎 en ga daarna naar de 🔥.\n\n        <br><br>\n\n        <b>✨ Elk level wordt gecontroleerd,\n        dus ieder level is oplosbaar.<\/b>\n\n    <\/div>\n\n\n    <button\n        id=\"startBtn\"\n        class=\"start-main\"\n    >\n        START GAME 🚀\n    <\/button>\n\n<\/section>\n\n\n<!-- =====================================================\n     GAME\n===================================================== -->\n\n<section\n    id=\"gameScreen\"\n    class=\"screen hidden\"\n>\n\n    <div class=\"game-top\">\n\n        <div\n            id=\"levelInfo\"\n            class=\"level-info\"\n        >\n            LEVEL 1\n        <\/div>\n\n\n        <div class=\"center-info\">\n\n            SCORE:\n\n            <strong id=\"gameScore\">\n                0\n            <\/strong>\n\n        <\/div>\n\n\n        <button\n            id=\"pauseBtn\"\n            class=\"game-btn\"\n        >\n            ⏸️ PAUZE\n        <\/button>\n\n\n        <button\n            id=\"resetBtn\"\n            class=\"game-btn\"\n        >\n            🔄 RESET\n        <\/button>\n\n\n        <button\n            id=\"homeBtn\"\n            class=\"game-btn\"\n        >\n            🏠 HOME\n        <\/button>\n\n    <\/div>\n\n\n    <div class=\"info-bar\">\n\n        <div class=\"info-item\">\n\n            ZETTEN\n\n            <strong id=\"moves\">\n                0\n            <\/strong>\n\n        <\/div>\n\n\n        <div class=\"info-item\">\n\n            KRISTALLEN\n\n            <strong id=\"crystals\">\n                0\n            <\/strong>\n\n        <\/div>\n\n\n        <div class=\"info-item\">\n\n            NODIG\n\n            <strong id=\"needed\">\n                3\n            <\/strong>\n\n        <\/div>\n\n\n        <div class=\"info-item\">\n\n            LEVEL\n\n            <strong id=\"levelNumber\">\n                1\n            <\/strong>\n\n        <\/div>\n\n    <\/div>\n\n\n    <div class=\"board-wrap\">\n\n        <div\n            id=\"board\"\n            class=\"board\"\n        >\n        <\/div>\n\n    <\/div>\n\n\n    <div class=\"bottom\">\n\n        <span>\n            🧊 GLIJD\n        <\/span>\n\n        <span>\n            💎 VERZAMEL ALLES\n        <\/span>\n\n        <span>\n            🔥 BEREIK DE UITGANG\n        <\/span>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =====================================================\n     RESULT\n===================================================== -->\n\n<div\n    id=\"resultOverlay\"\n    class=\"overlay hidden\"\n>\n\n    <div class=\"overlay-card\">\n\n        <div\n            id=\"resultIcon\"\n            class=\"overlay-icon\"\n        >\n            🔥\n        <\/div>\n\n\n        <div\n            id=\"resultTitle\"\n            class=\"overlay-title\"\n        >\n            LEVEL VOLTOOID!\n        <\/div>\n\n\n        <div\n            id=\"resultScore\"\n            class=\"overlay-score\"\n        >\n            0\n        <\/div>\n\n\n        <div\n            id=\"resultText\"\n            class=\"overlay-text\"\n        >\n        <\/div>\n\n\n        <div class=\"overlay-buttons\">\n\n            <button\n                id=\"nextBtn\"\n                class=\"start-main\"\n            >\n                ➡️ VOLGENDE LEVEL\n            <\/button>\n\n\n            <button\n                id=\"againBtn\"\n                class=\"overlay-home\"\n            >\n                🔄 OPNIEUW\n            <\/button>\n\n\n            <button\n                id=\"resultHomeBtn\"\n                class=\"overlay-home\"\n            >\n                🏠 HOME\n            <\/button>\n\n        <\/div>\n\n    <\/div>\n\n<\/div>\n\n\n<!-- =====================================================\n     PAUZE\n===================================================== -->\n\n<div\n    id=\"pauseOverlay\"\n    class=\"overlay hidden\"\n>\n\n    <div class=\"overlay-card\">\n\n        <div class=\"overlay-icon\">\n            ⏸️\n        <\/div>\n\n        <div class=\"overlay-title\">\n            PAUZE\n        <\/div>\n\n        <div class=\"overlay-text\">\n            Je spel staat tijdelijk stil.\n        <\/div>\n\n        <button\n            id=\"resumeBtn\"\n            class=\"start-main\"\n        >\n            ▶ VERDER\n        <\/button>\n\n    <\/div>\n\n<\/div>\n\n\n<div\n    id=\"toast\"\n    class=\"toast\"\n>\n<\/div>\n\n\n<\/div>\n<\/div>\n\n\n<script>\n\"use strict\";\n\n\n/* =====================================================\n   ELEMENTEN\n===================================================== */\n\nconst homeScreen =\n    document.getElementById(\"homeScreen\");\n\nconst gameScreen =\n    document.getElementById(\"gameScreen\");\n\nconst startBtn =\n    document.getElementById(\"startBtn\");\n\nconst pauseBtn =\n    document.getElementById(\"pauseBtn\");\n\nconst resetBtn =\n    document.getElementById(\"resetBtn\");\n\nconst homeBtn =\n    document.getElementById(\"homeBtn\");\n\nconst nextBtn =\n    document.getElementById(\"nextBtn\");\n\nconst againBtn =\n    document.getElementById(\"againBtn\");\n\nconst resultHomeBtn =\n    document.getElementById(\"resultHomeBtn\");\n\nconst resumeBtn =\n    document.getElementById(\"resumeBtn\");\n\nconst resultOverlay =\n    document.getElementById(\"resultOverlay\");\n\nconst pauseOverlay =\n    document.getElementById(\"pauseOverlay\");\n\nconst boardEl =\n    document.getElementById(\"board\");\n\nconst headerScoreEl =\n    document.getElementById(\"headerScore\");\n\nconst bestScoreEl =\n    document.getElementById(\"bestScore\");\n\nconst gameScoreEl =\n    document.getElementById(\"gameScore\");\n\nconst levelInfoEl =\n    document.getElementById(\"levelInfo\");\n\nconst levelNumberEl =\n    document.getElementById(\"levelNumber\");\n\nconst movesEl =\n    document.getElementById(\"moves\");\n\nconst crystalsEl =\n    document.getElementById(\"crystals\");\n\nconst neededEl =\n    document.getElementById(\"needed\");\n\nconst resultIcon =\n    document.getElementById(\"resultIcon\");\n\nconst resultTitle =\n    document.getElementById(\"resultTitle\");\n\nconst resultScore =\n    document.getElementById(\"resultScore\");\n\nconst resultText =\n    document.getElementById(\"resultText\");\n\nconst toast =\n    document.getElementById(\"toast\");\n\n\n/* =====================================================\n   CONSTANTEN\n===================================================== */\n\nconst SIZE = 6;\n\nconst START = {\n    r:0,\n    c:0\n};\n\nconst GOAL = {\n    r:5,\n    c:5\n};\n\n\n/* =====================================================\n   GAME STATE\n===================================================== */\n\nlet player = {\n    r:0,\n    c:0\n};\n\nlet walls = [];\nlet crystals = [];\n\nlet score = 0;\nlet moves = 0;\nlet collected = 0;\n\nlet level = 1;\n\nlet gameRunning = false;\nlet paused = false;\n\nlet requiredCrystals = 3;\n\nlet bestScore =\n    Number(\n        localStorage.getItem(\n            \"iceSlideBest\"\n        )\n    ) || 0;\n\nbestScoreEl.textContent =\n    bestScore;\n\n\n/* =====================================================\n   START\n===================================================== */\n\nstartBtn.addEventListener(\n    \"click\",\n    () => {\n\n        level = 1;\n\n        homeScreen.classList.add(\n            \"hidden\"\n        );\n\n        gameScreen.classList.remove(\n            \"hidden\"\n        );\n\n        startLevel();\n\n    }\n);\n\n\n/* =====================================================\n   START LEVEL\n===================================================== */\n\nfunction startLevel(){\n\n    gameRunning = false;\n    paused = false;\n\n    score = 0;\n    moves = 0;\n    collected = 0;\n\n    player = {\n        r:START.r,\n        c:START.c\n    };\n\n\n    generateSolvableLevel();\n\n\n    gameRunning = true;\n\n\n    resultOverlay.classList.add(\n        \"hidden\"\n    );\n\n    pauseOverlay.classList.add(\n        \"hidden\"\n    );\n\n\n    updateUI();\n    render();\n\n}\n\n\n/* =====================================================\n   SOLVABLE LEVEL GENERATOR\n===================================================== */\n\nfunction generateSolvableLevel(){\n\n    requiredCrystals =\n        Math.min(\n            5,\n            3 +\n            Math.floor(\n                (level - 1) / 2\n            )\n        );\n\n\n    const wallCount =\n        Math.min(\n            16,\n            4 + level * 2\n        );\n\n\n    let attempts = 0;\n\n\n    while(\n        attempts < 5000\n    ){\n\n        attempts++;\n\n\n        const candidateWalls = [];\n        const used = new Set();\n\n\n        used.add(\n            `${START.r},${START.c}`\n        );\n\n        used.add(\n            `${GOAL.r},${GOAL.c}`\n        );\n\n\n        let wallAttempts = 0;\n\n\n        while(\n            candidateWalls.length < wallCount &&\n            wallAttempts < 500\n        ){\n\n            wallAttempts++;\n\n\n            const r =\n                Math.floor(\n                    Math.random() * SIZE\n                );\n\n            const c =\n                Math.floor(\n                    Math.random() * SIZE\n                );\n\n\n            const key =\n                `${r},${c}`;\n\n\n            if(used.has(key))\n                continue;\n\n\n            if(\n                (r <= 1 && c <= 1) ||\n                (r >= SIZE-2 && c >= SIZE-2)\n            ){\n\n                continue;\n\n            }\n\n\n            candidateWalls.push({\n                r:r,\n                c:c\n            });\n\n            used.add(key);\n\n        }\n\n\n        const candidateCrystals = [];\n\n\n        let crystalAttempts = 0;\n\n\n        while(\n            candidateCrystals.length <\n                requiredCrystals &&\n            crystalAttempts < 500\n        ){\n\n            crystalAttempts++;\n\n\n            const r =\n                Math.floor(\n                    Math.random() * SIZE\n                );\n\n            const c =\n                Math.floor(\n                    Math.random() * SIZE\n                );\n\n\n            const key =\n                `${r},${c}`;\n\n\n            if(used.has(key))\n                continue;\n\n\n            candidateCrystals.push({\n                r:r,\n                c:c\n            });\n\n            used.add(key);\n\n        }\n\n\n        if(\n            candidateCrystals.length !==\n            requiredCrystals\n        ){\n\n            continue;\n\n        }\n\n\n        if(\n            isLevelSolvable(\n                candidateWalls,\n                candidateCrystals\n            )\n        ){\n\n            walls =\n                candidateWalls;\n\n            crystals =\n                candidateCrystals;\n\n            return;\n\n        }\n\n    }\n\n\n    createFallbackLevel();\n\n}\n\n\n/* =====================================================\n   FALLBACK\n===================================================== */\n\nfunction createFallbackLevel(){\n\n    walls = [];\n\n    const freeCells = [];\n\n\n    for(\n        let r = 0;\n        r < SIZE;\n        r++\n    ){\n\n        for(\n            let c = 0;\n            c < SIZE;\n            c++\n        ){\n\n            if(\n                !(r === START.r &&\n                  c === START.c) &&\n                !(r === GOAL.r &&\n                  c === GOAL.c)\n            ){\n\n                freeCells.push({\n                    r:r,\n                    c:c\n                });\n\n            }\n\n        }\n\n    }\n\n\n    shuffle(freeCells);\n\n\n    crystals =\n        freeCells.slice(\n            0,\n            requiredCrystals\n        );\n\n}\n\n\n/* =====================================================\n   SOLVABILITY TEST\n===================================================== */\n\nfunction isLevelSolvable(\n    testWalls,\n    testCrystals\n){\n\n    const count =\n        testCrystals.length;\n\n\n    const allMask =\n        (1 << count) - 1;\n\n\n    const queue = [];\n\n\n    const visited =\n        new Set();\n\n\n    queue.push({\n        r:START.r,\n        c:START.c,\n        mask:0\n    });\n\n\n    visited.add(\n        `${START.r},${START.c},0`\n    );\n\n\n    let head = 0;\n\n\n    while(\n        head < queue.length\n    ){\n\n        const state =\n            queue[head++];\n\n\n        if(\n            state.r === GOAL.r &&\n            state.c === GOAL.c &&\n            state.mask === allMask\n        ){\n\n            return true;\n\n        }\n\n\n        const directions = [\n\n            [-1,0],\n            [1,0],\n            [0,-1],\n            [0,1]\n\n        ];\n\n\n        for(\n            const [dr,dc]\n            of directions\n        ){\n\n            const result =\n                simulateSlide(\n                    state.r,\n                    state.c,\n                    state.mask,\n                    dr,\n                    dc,\n                    testWalls,\n                    testCrystals\n                );\n\n\n            if(\n                result.r === state.r &&\n                result.c === state.c &&\n                result.mask === state.mask\n            ){\n\n                continue;\n\n            }\n\n\n            const key =\n                `${result.r},${result.c},${result.mask}`;\n\n\n            if(\n                visited.has(key)\n            ){\n\n                continue;\n\n            }\n\n\n            visited.add(key);\n\n\n            queue.push({\n                r:result.r,\n                c:result.c,\n                mask:result.mask\n            });\n\n        }\n\n    }\n\n\n    return false;\n\n}\n\n\n/* =====================================================\n   SIMULATE\n===================================================== */\n\nfunction simulateSlide(\n    startR,\n    startC,\n    startMask,\n    dr,\n    dc,\n    testWalls,\n    testCrystals\n){\n\n    let r = startR;\n    let c = startC;\n    let mask = startMask;\n\n\n    while(true){\n\n        const nr =\n            r + dr;\n\n        const nc =\n            c + dc;\n\n\n        if(\n            nr < 0 ||\n            nr >= SIZE ||\n            nc < 0 ||\n            nc >= SIZE\n        ){\n\n            break;\n\n        }\n\n\n        const blocked =\n            testWalls.some(\n                wall =>\n                    wall.r === nr &&\n                    wall.c === nc\n            );\n\n\n        if(blocked){\n\n            break;\n\n        }\n\n\n        r = nr;\n        c = nc;\n\n\n        for(\n            let i = 0;\n            i < testCrystals.length;\n            i++\n        ){\n\n            if(\n                testCrystals[i].r === r &&\n                testCrystals[i].c === c\n            ){\n\n                mask |=\n                    (1 << i);\n\n            }\n\n        }\n\n    }\n\n\n    return {\n        r:r,\n        c:c,\n        mask:mask\n    };\n\n}\n\n\n/* =====================================================\n   RENDER\n===================================================== */\n\nfunction render(){\n\n    boardEl.innerHTML = \"\";\n\n\n    for(\n        let r = 0;\n        r < SIZE;\n        r++\n    ){\n\n        for(\n            let c = 0;\n            c < SIZE;\n            c++\n        ){\n\n            const cell =\n                document.createElement(\n                    \"div\"\n                );\n\n\n            cell.className =\n                \"cell\";\n\n\n            const wall =\n                isWall(r,c);\n\n\n            const goal =\n                r === GOAL.r &&\n                c === GOAL.c;\n\n\n            const crystal =\n                crystals.some(\n                    item =>\n                        item.r === r &&\n                        item.c === c\n                );\n\n\n            const playerHere =\n                player.r === r &&\n                player.c === c;\n\n\n            if(wall){\n\n                cell.classList.add(\n                    \"wall\"\n                );\n\n                cell.textContent =\n                    \"🧱\";\n\n            }\n            else{\n\n                if(goal){\n\n                    cell.classList.add(\n                        \"goal\"\n                    );\n\n\n                    const goalIcon =\n                        document.createElement(\n                            \"div\"\n                        );\n\n\n                    goalIcon.className =\n                        \"goal-icon\";\n\n\n                    goalIcon.textContent =\n                        \"🔥\";\n\n\n                    cell.appendChild(\n                        goalIcon\n                    );\n\n                }\n\n\n                if(crystal){\n\n                    cell.classList.add(\n                        \"crystal\"\n                    );\n\n\n                    const crystalIcon =\n                        document.createElement(\n                            \"div\"\n                        );\n\n\n                    crystalIcon.className =\n                        \"crystal-icon\";\n\n\n                    crystalIcon.textContent =\n                        \"💎\";\n\n\n                    cell.appendChild(\n                        crystalIcon\n                    );\n\n                }\n\n\n                if(playerHere){\n\n                    const playerEl =\n                        document.createElement(\n                            \"div\"\n                        );\n\n\n                    playerEl.className =\n                        \"player\";\n\n\n                    playerEl.textContent =\n                        \"🧊\";\n\n\n                    cell.appendChild(\n                        playerEl\n                    );\n\n                }\n\n            }\n\n\n            boardEl.appendChild(\n                cell\n            );\n\n        }\n\n    }\n\n}\n\n\n/* =====================================================\n   WALL\n===================================================== */\n\nfunction isWall(r,c){\n\n    return walls.some(\n        wall =>\n            wall.r === r &&\n            wall.c === c\n    );\n\n}\n\n\n/* =====================================================\n   SLIDE\n===================================================== */\n\nfunction slide(dr,dc){\n\n    if(\n        !gameRunning ||\n        paused\n    ){\n\n        return;\n\n    }\n\n\n    let r =\n        player.r;\n\n    let c =\n        player.c;\n\n\n    let moved =\n        false;\n\n\n    while(true){\n\n        const nr =\n            r + dr;\n\n        const nc =\n            c + dc;\n\n\n        if(\n            nr < 0 ||\n            nr >= SIZE ||\n            nc < 0 ||\n            nc >= SIZE\n        ){\n\n            break;\n\n        }\n\n\n        if(\n            isWall(nr,nc)\n        ){\n\n            break;\n\n        }\n\n\n        r = nr;\n        c = nc;\n\n        moved = true;\n\n\n        collectCrystalAt(\n            r,c\n        );\n\n    }\n\n\n    if(!moved){\n\n        showToast(\n            \"Daar kun je niet heen 🧊\"\n        );\n\n        return;\n\n    }\n\n\n    player.r = r;\n    player.c = c;\n\n    moves++;\n\n    score += 10;\n\n\n    render();\n    updateUI();\n\n\n    if(\n        player.r === GOAL.r &&\n        player.c === GOAL.c\n    ){\n\n        if(\n            collected >=\n            requiredCrystals\n        ){\n\n            levelComplete();\n\n        }\n        else{\n\n            showToast(\n                `Nog ${\n                    requiredCrystals - collected\n                } 💎 nodig!`\n            );\n\n        }\n\n    }\n\n}\n\n\n/* =====================================================\n   COLLECT\n===================================================== */\n\nfunction collectCrystalAt(r,c){\n\n    const index =\n        crystals.findIndex(\n            item =>\n                item.r === r &&\n                item.c === c\n        );\n\n\n    if(index === -1)\n        return;\n\n\n    crystals.splice(\n        index,\n        1\n    );\n\n\n    collected++;\n\n    score += 50;\n\n}\n\n\n/* =====================================================\n   COMPLETE\n===================================================== */\n\nfunction levelComplete(){\n\n    gameRunning = false;\n\n\n    const bonus =\n        Math.max(\n            100,\n            600 - moves * 10\n        );\n\n\n    score += bonus;\n\n\n    if(score > bestScore){\n\n        bestScore =\n            score;\n\n        localStorage.setItem(\n            \"iceSlideBest\",\n            bestScore\n        );\n\n        bestScoreEl.textContent =\n            bestScore;\n\n    }\n\n\n    resultIcon.textContent =\n        \"🔥\";\n\n\n    resultTitle.textContent =\n        \"LEVEL VOLTOOID!\";\n\n\n    resultScore.textContent =\n        score;\n\n\n    resultText.textContent =\n        `Alle ${requiredCrystals} 💎 verzameld in ${moves} zetten. Bonus: +${bonus}.`;\n\n\n    resultOverlay.classList.remove(\n        \"hidden\"\n    );\n\n}\n\n\n/* =====================================================\n   NEXT LEVEL\n===================================================== */\n\nnextBtn.addEventListener(\n    \"click\",\n    () => {\n\n        level++;\n\n        startLevel();\n\n    }\n);\n\n\n/* =====================================================\n   AGAIN\n===================================================== */\n\nagainBtn.addEventListener(\n    \"click\",\n    () => {\n\n        startLevel();\n\n    }\n);\n\n\n/* =====================================================\n   RESET\n===================================================== */\n\nresetBtn.addEventListener(\n    \"click\",\n    () => {\n\n        startLevel();\n\n    }\n);\n\n\n/* =====================================================\n   HOME\n===================================================== */\n\nhomeBtn.addEventListener(\n    \"click\",\n    goHome\n);\n\n\nresultHomeBtn.addEventListener(\n    \"click\",\n    goHome\n);\n\n\nfunction goHome(){\n\n    gameRunning = false;\n    paused = false;\n\n\n    resultOverlay.classList.add(\n        \"hidden\"\n    );\n\n    pauseOverlay.classList.add(\n        \"hidden\"\n    );\n\n    gameScreen.classList.add(\n        \"hidden\"\n    );\n\n    homeScreen.classList.remove(\n        \"hidden\"\n    );\n\n}\n\n\n/* =====================================================\n   PAUSE\n===================================================== */\n\npauseBtn.addEventListener(\n    \"click\",\n    () => {\n\n        if(!gameRunning)\n            return;\n\n\n        paused = true;\n\n\n        pauseOverlay.classList.remove(\n            \"hidden\"\n        );\n\n    }\n);\n\n\nresumeBtn.addEventListener(\n    \"click\",\n    () => {\n\n        paused = false;\n\n\n        pauseOverlay.classList.add(\n            \"hidden\"\n        );\n\n    }\n);\n\n\n/* =====================================================\n   KEYBOARD\n===================================================== */\n\ndocument.addEventListener(\n    \"keydown\",\n    event => {\n\n        if(\n            !gameRunning ||\n            paused\n        ){\n\n            return;\n\n        }\n\n\n        let direction = null;\n\n\n        if(\n            event.key === \"ArrowUp\"\n        ){\n\n            direction = \"up\";\n\n        }\n\n        else if(\n            event.key === \"ArrowDown\"\n        ){\n\n            direction = \"down\";\n\n        }\n\n        else if(\n            event.key === \"ArrowLeft\"\n        ){\n\n            direction = \"left\";\n\n        }\n\n        else if(\n            event.key === \"ArrowRight\"\n        ){\n\n            direction = \"right\";\n\n        }\n\n\n        if(!direction)\n            return;\n\n\n        event.preventDefault();\n\n\n        if(direction === \"up\")\n            slide(-1,0);\n\n        else if(direction === \"down\")\n            slide(1,0);\n\n        else if(direction === \"left\")\n            slide(0,-1);\n\n        else if(direction === \"right\")\n            slide(0,1);\n\n    }\n);\n\n\n/* =====================================================\n   SWIPE\n===================================================== */\n\nlet touchStartX = 0;\nlet touchStartY = 0;\n\n\nboardEl.addEventListener(\n    \"touchstart\",\n    event => {\n\n        const touch =\n            event.changedTouches[0];\n\n\n        touchStartX =\n            touch.clientX;\n\n        touchStartY =\n            touch.clientY;\n\n    },\n    {\n        passive:true\n    }\n);\n\n\nboardEl.addEventListener(\n    \"touchend\",\n    event => {\n\n        if(\n            !gameRunning ||\n            paused\n        ){\n\n            return;\n\n        }\n\n\n        const touch =\n            event.changedTouches[0];\n\n\n        const dx =\n            touch.clientX -\n            touchStartX;\n\n        const dy =\n            touch.clientY -\n            touchStartY;\n\n\n        const absX =\n            Math.abs(dx);\n\n        const absY =\n            Math.abs(dy);\n\n\n        if(\n            Math.max(\n                absX,\n                absY\n            ) < 25\n        ){\n\n            return;\n\n        }\n\n\n        if(absX > absY){\n\n            if(dx > 0)\n                slide(0,1);\n            else\n                slide(0,-1);\n\n        }\n        else{\n\n            if(dy > 0)\n                slide(1,0);\n            else\n                slide(-1,0);\n\n        }\n\n    },\n    {\n        passive:true\n    }\n);\n\n\n/* =====================================================\n   TOAST\n===================================================== */\n\nlet toastTimer = null;\n\n\nfunction showToast(message){\n\n    toast.textContent =\n        message;\n\n\n    toast.classList.add(\n        \"show\"\n    );\n\n\n    clearTimeout(\n        toastTimer\n    );\n\n\n    toastTimer =\n        setTimeout(\n            () => {\n\n                toast.classList.remove(\n                    \"show\"\n                );\n\n            },\n            1400\n        );\n\n}\n\n\n/* =====================================================\n   UI\n===================================================== */\n\nfunction updateUI(){\n\n    headerScoreEl.textContent =\n        score;\n\n    gameScoreEl.textContent =\n        score;\n\n    levelInfoEl.textContent =\n        \"LEVEL \" + level;\n\n    levelNumberEl.textContent =\n        level;\n\n    movesEl.textContent =\n        moves;\n\n    crystalsEl.textContent =\n        collected;\n\n    neededEl.textContent =\n        requiredCrystals;\n\n    bestScoreEl.textContent =\n        bestScore;\n\n}\n\n\n/* =====================================================\n   GEEN SCROLL\n===================================================== */\n\ndocument.addEventListener(\n    \"touchmove\",\n    event => {\n\n        if(\n            event.target.closest(\".board\")\n        ){\n\n            return;\n\n        }\n\n        event.preventDefault();\n\n    },\n    {\n        passive:false\n    }\n);\n\n\n/* =====================================================\n   INIT\n===================================================== */\n\ngameScreen.classList.add(\n    \"hidden\"\n);\n\nresultOverlay.classList.add(\n    \"hidden\"\n);\n\npauseOverlay.classList.add(\n    \"hidden\"\n);\n\nupdateUI();\n\n<\/script>\n\n<\/body>\n<\/html>",
"quiz": "<!DOCTYPE html>\n<html lang=\"nl\">\n<head><script>try{localStorage.getItem(\"x\")}catch(e){var _m={};Object.defineProperty(window,\"localStorage\",{value:{getItem:function(k){return k in _m?_m[k]:null},setItem:function(k,v){_m[k]=String(v)},removeItem:function(k){delete _m[k]}}})}<\/script>\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\n      content=\"width=device-width,\n      initial-scale=1.0,\n      maximum-scale=1.0,\n      user-scalable=no\">\n\n<title>MINI QUIZ 🩵<\/title>\n\n<script src=\"https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js\"><\/script>\n\n<style>\n\n*{\n    box-sizing:border-box;\n    -webkit-tap-highlight-color:transparent;\n    user-select:none;\n}\n\nhtml,\nbody{\n    width:100%;\n    height:100%;\n    margin:0;\n    overflow:hidden;\n    font-family:Arial,Helvetica,sans-serif;\n}\n\nbody{\n    background:\n        radial-gradient(\n            circle at 10% 10%,\n            #121737 0%,\n            transparent 30%\n        ),\n        radial-gradient(\n            circle at 90% 90%,\n            #5034be 0%,\n            transparent 35%\n        ),\n        linear-gradient(\n            135deg,\n            #0d1128,\n            #1b2250,\n            #402b96\n        );\n\n    color:#9480e2;\n}\n\nbutton,\ninput{\n    font-family:inherit;\n}\n\nbutton{\n    cursor:pointer;\n    touch-action:manipulation;\n}\n\nbutton:active{\n    transform:scale(.97);\n}\n\n.hidden{\n    display:none !important;\n}\n\n\n/* =====================================================\n   APP\n===================================================== */\n\n.app{\n    width:100%;\n    height:100%;\n\n    display:flex;\n    align-items:center;\n    justify-content:center;\n\n    padding:7px;\n}\n\n.game{\n    width:min(1120px,100%);\n    height:min(820px,100%);\n\n    position:relative;\n\n    display:flex;\n    flex-direction:column;\n\n    overflow:hidden;\n\n    background:#0b0e22;\n\n    border:3px solid #462fa2;\n    border-radius:27px;\n\n    box-shadow:\n        0 22px 65px\n        rgba(21,92,94,.22);\n}\n\n\n/* =====================================================\n   HEADER\n===================================================== */\n\n.header{\n    min-height:68px;\n\n    flex-shrink:0;\n\n    padding:9px 16px;\n\n    display:flex;\n    justify-content:space-between;\n    align-items:center;\n\n    gap:10px;\n\n    background:\n        linear-gradient(\n            135deg,\n            #6d4fe7,\n            #5133cc\n        );\n\n    color:#0f111a;\n}\n\n.logo{\n    font-size:clamp(22px,4vw,34px);\n    font-weight:1000;\n}\n\n.logo span{\n    color:#121735;\n}\n\n.header-stats{\n    display:flex;\n    gap:6px;\n}\n\n.stat{\n    min-width:64px;\n\n    padding:5px 8px;\n\n    border-radius:11px;\n\n    background:rgba(15,17,26,0.15);\n\n    border:2px solid rgba(15,17,26,0.2);\n\n    text-align:center;\n}\n\n.stat small{\n    display:block;\n\n    font-size:8px;\n\n    opacity:.85;\n}\n\n.stat strong{\n    display:block;\n\n    font-size:17px;\n}\n\n\n/* =====================================================\n   SCREENS\n===================================================== */\n\n.screen{\n    flex:1;\n    min-height:0;\n\n    display:flex;\n    flex-direction:column;\n\n    overflow:hidden;\n}\n\n\n/* =====================================================\n   HOME\n===================================================== */\n\n#homeScreen{\n    align-items:center;\n    justify-content:center;\n\n    text-align:center;\n\n    padding:18px;\n}\n\n.home-icon{\n    font-size:60px;\n}\n\n.home-title{\n    margin:0;\n\n    color:#785ce8;\n\n    font-size:clamp(42px,7vw,65px);\n\n    font-weight:1000;\n}\n\n.home-text{\n    max-width:690px;\n\n    margin:8px auto 16px;\n\n    color:#6045c9;\n\n    font-size:15px;\n\n    line-height:1.45;\n}\n\n.feature-row{\n    display:flex;\n\n    justify-content:center;\n    flex-wrap:wrap;\n\n    gap:7px;\n\n    margin-bottom:17px;\n}\n\n.feature{\n    padding:7px 11px;\n\n    border-radius:11px;\n\n    background:#121735;\n\n    border:2px solid #3d298e;\n\n    color:#836ed5;\n\n    font-size:10px;\n\n    font-weight:900;\n}\n\n.mode-grid{\n    width:min(700px,100%);\n\n    display:grid;\n\n    grid-template-columns:1fr 1fr;\n\n    gap:10px;\n\n    margin-bottom:15px;\n}\n\n.mode-card{\n    border:3px solid #3d298d;\n\n    border-radius:17px;\n\n    background:#101531;\n\n    color:#8571d6;\n\n    padding:14px 9px;\n}\n\n.mode-card.selected{\n    background:#745bd9;\n\n    border-color:#846ce4;\n\n    color:#0f111a;\n\n    box-shadow:\n        0 8px 18px\n        rgba(22,111,108,.2);\n}\n\n.mode-icon{\n    font-size:33px;\n}\n\n.mode-title{\n    font-size:15px;\n    font-weight:1000;\n\n    margin-top:4px;\n}\n\n.mode-info{\n    margin-top:3px;\n\n    font-size:9px;\n\n    opacity:.82;\n}\n\n.start-main{\n    border:0;\n\n    padding:13px 31px;\n\n    border-radius:15px;\n\n    background:\n        linear-gradient(\n            135deg,\n            #7457e7,\n            #5537cd\n        );\n\n    color:#0f111a;\n\n    font-size:17px;\n\n    font-weight:1000;\n\n    box-shadow:\n        0 8px 20px\n        rgba(19,126,121,.22);\n}\n\n.start-main:disabled{\n    opacity:.5;\n\n    cursor:not-allowed;\n}\n\n\n/* =====================================================\n   SETUP\n===================================================== */\n\n#setupScreen{\n    padding:12px;\n\n    gap:8px;\n}\n\n.setup-title{\n    text-align:center;\n\n    color:#795ee6;\n\n    font-size:clamp(24px,4vw,33px);\n\n    font-weight:1000;\n}\n\n.setup-text{\n    text-align:center;\n\n    color:#5e43c9;\n\n    font-size:12px;\n}\n\n.setup-content{\n    flex:1;\n    min-height:0;\n\n    display:flex;\n\n    align-items:center;\n    justify-content:center;\n}\n\n.setup-card{\n    width:min(760px,100%);\n\n    padding:18px;\n\n    border:2px solid #3b288a;\n\n    border-radius:19px;\n\n    background:#0f132e;\n\n    text-align:center;\n}\n\n.name-label{\n    display:block;\n\n    margin-bottom:6px;\n\n    color:#735cd0;\n\n    font-size:11px;\n\n    font-weight:1000;\n}\n\n.name-input{\n    width:min(380px,100%);\n\n    border:3px solid #3c288a;\n\n    border-radius:13px;\n\n    padding:11px 13px;\n\n    background:#0f111a;\n\n    color:#8f7cdc;\n\n    font-size:17px;\n\n    font-weight:900;\n\n    text-align:center;\n\n    outline:none;\n\n    user-select:text;\n}\n\n.name-input:focus{\n    border-color:#745bd9;\n}\n\n.online-actions{\n    margin-top:12px;\n\n    display:flex;\n\n    justify-content:center;\n\n    gap:8px;\n\n    flex-wrap:wrap;\n}\n\n.online-button{\n    border:2px solid #402b95;\n\n    background:#121736;\n\n    color:#8773d6;\n\n    border-radius:12px;\n\n    padding:9px 15px;\n\n    font-size:10px;\n\n    font-weight:1000;\n}\n\n.online-button.active{\n    background:#755bda;\n\n    border-color:#866fe2;\n\n    color:#0f111a;\n}\n\n.room-code-box{\n    margin:12px auto 8px;\n\n    width:min(440px,100%);\n\n    padding:10px;\n\n    border-radius:14px;\n\n    background:#745bd9;\n\n    color:#0f111a;\n}\n\n.room-code-title{\n    font-size:9px;\n\n    font-weight:900;\n\n    opacity:.9;\n}\n\n.room-code{\n    display:block;\n\n    margin-top:2px;\n\n    font-size:30px;\n\n    letter-spacing:6px;\n\n    font-weight:1000;\n}\n\n.room-input{\n    width:min(300px,100%);\n\n    border:3px solid #3c288a;\n\n    border-radius:12px;\n\n    padding:10px;\n\n    background:#0f111a;\n\n    color:#8c77e2;\n\n    font-size:17px;\n\n    font-weight:1000;\n\n    text-align:center;\n\n    letter-spacing:3px;\n\n    outline:none;\n\n    user-select:text;\n\n    text-transform:uppercase;\n}\n\n.online-status{\n    min-height:20px;\n\n    margin-top:8px;\n\n    color:#5a3ec7;\n\n    font-size:10px;\n\n    font-weight:800;\n}\n\n.player-list{\n    width:min(570px,100%);\n\n    max-height:145px;\n\n    overflow:hidden auto;\n\n    margin:12px auto 0;\n\n    padding:8px;\n\n    border-radius:14px;\n\n    background:#121737;\n\n    border:2px
