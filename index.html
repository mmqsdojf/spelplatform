ll; \n \n \n/* ========================================================= \nSCHERM \n========================================================= */ \n \nfunction showScreen(id){ \n \ndocument \n.querySelectorAll(\".screen\") \n.forEach(screen=>{ \nscreen.classList.remove(\"active\"); \n}); \n \nconst screen=document.getElementById(id); \n \nif(screen){ \nscreen.classList.add(\"active\"); \n} \n \n} \n \n \n/* ========================================================= \nHOME \n========================================================= */ \n \nfunction returnHome(){ \n \ndisconnectPeer(); \n \ngameActive=false; \n \nshowScreen(\"screen-start\"); \n \n} \n \n \nfunction restartGame(){ \n \ndisconnectPeer(); \n \nlocation.reload(); \n \n} \n \n \n/* ========================================================= \nMODES \n========================================================= */ \n \nfunction selectMode(mode){ \n \ngameMode=mode; \n \nrenderThemes(); \n \nshowScreen(\"screen-theme\"); \n \n} \n \n \nfunction openOnline(){ \n \ngameMode=\"online\"; \n \ndocument.getElementById(\"hostNextArea\") \n.classList.remove(\"show\"); \n \ndocument.getElementById(\"hostStatus\") \n.textContent=\"Maak een kamer om te beginnen.\"; \n \ndocument.getElementById(\"roomCode\") \n.textContent=\"------\"; \n \ndocument.getElementById(\"joinStatus\") \n.textContent=\"Vul de code van speler 1 in.\"; \n \ndocument.getElementById(\"joinButton\").disabled=false; \n \nshowScreen(\"screen-online\"); \n \n} \n \n \nfunction openExplanation(){ \n \nshowScreen(\"screen-explanation\"); \n \n} \n \n \n/* ========================================================= \nTHEMA \n========================================================= */ \n \nfunction renderThemes(){ \n \nconst grid=document.getElementById(\"themeGrid\"); \n \ngrid.innerHTML=\"\"; \n \nObject.entries(themes).forEach(([key,theme])=>{ \n \nconst button=document.createElement(\"button\"); \n \nbutton.className= \n\"choice\"+ \n(key===selectedTheme ? \" selected\" : \"\"); \n \nbutton.innerHTML=` \n<span class=\"choice-icon\">${theme.icon}<\/span> \n${theme.name} \n`; \n \nbutton.onclick=()=>{ \n \nselectedTheme=key; \n \nrenderThemes(); \n \n}; \n \ngrid.appendChild(button); \n \n}); \n \n} \n \n \nfunction previousFromTheme(){ \n \nif(gameMode===\"online\"){ \nshowScreen(\"screen-online\"); \n}else{ \nshowScreen(\"screen-start\"); \n} \n \n} \n \n \nfunction previousFromSettings(){ \n \nshowScreen(\"screen-theme\"); \n \n} \n \n \n/* ========================================================= \nTHEMA VERDER \n========================================================= */ \n \nfunction continueTheme(){ \n \nif(gameMode===\"online\" && !onlineHost){ \n \nshowToast(\"Wacht tot speler 1 het spel start.\"); \n \nreturn; \n \n} \n \nupdateSettingsUI(); \n \nshowScreen(\"screen-settings\"); \n \n} \n \n \n/* ========================================================= \nSETTINGS \n========================================================= */ \n \nfunction setOutfit(value){ \n \noutfitStyle=value; \n \nupdateSettingsUI(); \n \n} \n \n \nfunction setFood(value){ \n \nfoodStyle=value; \n \nupdateSettingsUI(); \n \n} \n \n \nfunction setCommentary(value){ \n \ncommentary=value; \n \nupdateSettingsUI(); \n \n} \n \n \nfunction updateSettingsUI(){ \n \ndocument \n.querySelectorAll(\".option\") \n.forEach(button=>{ \nbutton.classList.remove(\"selected\"); \n}); \n \ndocument \n.getElementById(\"outfit-\"+outfitStyle) \n?.classList.add(\"selected\"); \n \ndocument \n.getElementById(\"food-\"+foodStyle) \n?.classList.add(\"selected\"); \n \ndocument \n.getElementById( \ncommentary ? \"comment-on\" : \"comment-off\" \n) \n?.classList.add(\"selected\"); \n \n} \n \n \n/* ========================================================= \nONLINE THEMA \n========================================================= */ \n \nfunction hostGoToTheme(){ \n \nif(!onlineHost)return; \n \nif(!onlineConnected){ \n \nshowToast(\"Speler 2 is nog niet verbonden.\"); \n \nreturn; \n \n} \n \nrenderThemes(); \n \nshowScreen(\"screen-theme\"); \n \n} \n \n \n/* ========================================================= \nGAME START \n========================================================= */ \n \nfunction startGameFromSettings(){ \n \nif(gameMode===\"online\"){ \n \nif(!onlineHost){ \n \nshowToast(\"Alleen speler 1 kan het spel starten.\"); \n \nreturn; \n \n} \n \nif(!onlineConnected){ \n \nshowToast(\"Speler 2 is nog niet verbonden.\"); \n \nreturn; \n \n} \n \nstartOnlineGame(); \n \nreturn; \n \n} \n \nstartNormalGame(); \n \n} \n \n \n/* ========================================================= \nNORMAAL SPEL \n========================================================= */ \n \nfunction startNormalGame(){ \n \nplayer1Money=20; \nplayer2Money=20; \n \nplayer1Collection=[]; \nplayer2Collection=[]; \n \nitems=JSON.parse( \nJSON.stringify( \nthemes[selectedTheme].items \n) \n); \n \nitemIndex=0; \n \ncurrentBid=0; \nleader=null; \n \nstartingPlayer=\"player1\"; \ncurrentTurn=\"player1\"; \n \ngameActive=true; \n \nshowScreen(\"screen-game\"); \n \nprepareRound(); \n \n} \n \n \n/* ========================================================= \nRONDE \n========================================================= */ \n \nfunction prepareRound(){ \n \nclearTimeout(computerTimer); \nclearTimeout(roundTimer); \n \nif(itemIndex>=items.length){ \n \nfinishGame(); \n \nreturn; \n \n} \n \ncurrentBid=0; \nleader=null; \n \ncurrentTurn=startingPlayer; \n \nconst item=items[itemIndex]; \n \ndocument.getElementById(\"itemIcon\").textContent=item[0]; \n \ndocument.getElementById(\"itemName\").textContent=item[1]; \n \ndocument.getElementById(\"category\").textContent= \nthemes[selectedTheme].name; \n \ndocument.getElementById(\"gameThemeName\").textContent= \nthemes[selectedTheme].name; \n \ndocument.getElementById(\"roundText\").textContent= \n`${itemIndex+1} / ${items.length}`; \n \ndocument.getElementById(\"bidInput\").value=\"\"; \n \ndocument.getElementById(\"comment\").textContent=\"\"; \n \nwaitingForOnlineResponse=false; \n \nupdateGameUI(); \n \nif( \ngameMode===\"computer\" && \ncurrentTurn===\"player2\" \n){ \n \ncomputerTimer=setTimeout( \ncomputerBid, \n900 \n); \n \n} \n \n} \n \n \n/* ========================================================= \nUI \n========================================================= */ \n \nfunction updateGameUI(){ \n \ndocument.getElementById(\"p1Money\").textContent= \n\"€\"+player1Money; \n \ndocument.getElementById(\"p2Money\").textContent= \n\"€\"+player2Money; \n \nrenderCollection( \n\"collection1\", \nplayer1Collection \n); \n \nrenderCollection( \n\"collection2\", \nplayer2Collection \n); \n \nif(currentBid===0){ \n \ndocument.getElementById(\"bidInfo\").textContent= \n\"Nog geen bod\"; \n \ndocument.getElementById(\"leader\").textContent= \ncurrentTurn===\"player1\" \n? \"👤 Speler 1 begint\" \n: \"👤 Speler 2 begint\"; \n \n}else{ \n \ndocument.getElementById(\"bidInfo\").textContent= \n\"Bod: €\"+currentBid; \n \ndocument.getElementById(\"leader\").textContent= \nleader===\"player1\" \n? `👤 Speler 1 heeft €${currentBid} geboden` \n: `👤 Speler 2 heeft €${currentBid} geboden`; \n \n} \n \nupdateTurnUI(); \n \n} \n \n \n/* ========================================================= \nCOLLECTIE \n========================================================= */ \n \nfunction renderCollection(id,collection){ \n \nconst element=document.getElementById(id); \n \nelement.innerHTML=\"\"; \n \ncollection.forEach(item=>{ \n \nconst div=document.createElement(\"div\"); \n \ndiv.className=\"collection-item\"; \n \ndiv.textContent=item[0]; \n \ndiv.title=item[1]; \n \nelement.appendChild(div); \n \n}); \n \n} \n \n \n/* ========================================================= \nBEURT \n========================================================= */ \n \nfunction updateTurnUI(){ \n \nconst input=document.getElementById(\"bidInput\"); \nconst bid=document.getElementById(\"bidButton\"); \nconst give=document.getElementById(\"giveButton\"); \nconst turn=document.getElementById(\"turn\"); \n \nif(!gameActive){ \n \ninput.disabled=true; \nbid.disabled=true; \ngive.disabled=true; \n \nreturn; \n \n} \n \nif(gameMode===\"computer\"){ \n \nconst myTurn=currentTurn===\"player1\"; \n \ninput.disabled=!myTurn; \nbid.disabled=!myTurn; \ngive.disabled=!myTurn; \n \nturn.textContent= \nmyTurn \n? \"🟢 Jij bent aan de beurt!\" \n: \"🤖 De computer is aan de beurt...\"; \n \nreturn; \n \n} \n \nif(gameMode===\"local\"){ \n \ninput.disabled=false; \nbid.disabled=false; \ngive.disabled=false; \n \nturn.textContent= \ncurrentTurn===\"player1\" \n? \"🟢 Speler 1 is aan de beurt\" \n: \"🟢 Speler 2 is aan de beurt\"; \n \nreturn; \n \n} \n \nif(gameMode===\"online\"){ \n \nconst myTurn= \nonlineHost \n? currentTurn===\"player1\" \n: currentTurn===\"player2\"; \n \nconst locked=waitingForOnlineResponse; \n \ninput.disabled=!myTurn || locked; \nbid.disabled=!myTurn || locked; \ngive.disabled=!myTurn || locked; \n \nif(locked){ \n \nturn.textContent=\"📡 Even wachten...\"; \n \n}else if(myTurn){ \n \nturn.textContent=\"🟢 JIJ BENT AAN DE BEURT!\"; \n \n}else{ \n \nturn.textContent=\"⏳ Wachten op de andere speler...\"; \n \n} \n \n} \n \n} \n \n \n/* ========================================================= \nBIEDEN \n========================================================= */ \n \nfunction makeBid(){ \n \nif(!gameActive)return; \n \nconst input=document.getElementById(\"bidInput\"); \n \nconst amount=Number(input.value); \n \nif(!Number.isFinite(amount)||amount<=0){ \n \nshowToast(\"Vul een geldig bod in.\"); \n \nreturn; \n \n} \n \nif( \ngameMode===\"online\" && \n!onlineHost \n){ \n \nif(currentTurn!==\"player2\"){ \n \nshowToast(\"Je bent nu niet aan de beurt.\"); \n \nreturn; \n \n} \n \nif(amount>player2Money){ \n \nshowToast(\"Je hebt niet genoeg geld.\"); \n \nreturn; \n \n} \n \nif(amount<=currentBid){ \n \nshowToast( \n`Je moet hoger bieden dan €${currentBid}.` \n); \n \nreturn; \n \n} \n \nwaitingForOnlineResponse=true; \n \nupdateTurnUI(); \n \nsendOnline({ \n \ntype:\"PLAYER_ACTION\", \naction:\"BID\", \nplayer:\"player2\", \namount:amount \n \n}); \n \ninput.value=\"\"; \n \nreturn; \n \n} \n \nif( \ngameMode===\"online\" && \nonlineHost && \ncurrentTurn!==\"player1\" \n){ \n \nshowToast(\"Speler 2 is aan de beurt.\"); \n \nreturn; \n \n} \n \nconst money= \ncurrentTurn===\"player1\" \n?player1Money \n:player2Money; \n \nif(amount>money){ \n \nshowToast(\"Je hebt niet genoeg geld.\"); \n \nreturn; \n \n} \n \nif(amount<=currentBid){ \n \nshowToast( \n`Je moet hoger bieden dan €${currentBid}.` \n); \n \nreturn; \n \n} \n \nprocessBid(currentTurn,amount); \n \n} \n \n \n/* ========================================================= \nBOD VERWERKEN \n========================================================= */ \n \nfunction processBid(player,amount){ \n \nif(!gameActive)return; \n \nif(player!==currentTurn)return; \n \nconst money= \nplayer===\"player1\" \n?player1Money \n:player2Money; \n \nif(amount>money)return; \n \nif(amount<=currentBid)return; \n \ncurrentBid=amount; \n \nleader=player; \n \ncurrentTurn= \nplayer===\"player1\" \n? \"player2\" \n: \"player1\"; \n \nwaitingForOnlineResponse=false; \n \ndocument.getElementById(\"bidInput\").value=\"\"; \n \nupdateGameUI(); \n \nif( \ngameMode===\"online\" && \nonlineHost \n){ \n \nsendGameState(); \n \n} \n \nif( \ngameMode===\"computer\" && \ncurrentTurn===\"player2\" \n){ \n \ncomputerTimer=setTimeout( \ncomputerBid, \n900 \n); \n \n} \n \n} \n \n \n/* ========================================================= \nCOMPUTER \n========================================================= */ \n \nfunction computerBid(){ \n \nif( \n!gameActive || \ngameMode!==\"computer\" || \ncurrentTurn!==\"player2\" \n)return; \n \nconst minimum=currentBid+1; \n \nif(player2Money<minimum){ \n \nfinishAuction( \nleader || \"player1\", \ncurrentBid \n); \n \nreturn; \n \n} \n \nconst maximum=Math.min( \nplayer2Money, \nMath.max( \nminimum, \nMath.floor(player2Money*.75) \n) \n); \n \nconst amount=Math.floor( \nminimum+ \nMath.random()* \n(maximum-minimum+1) \n); \n \nif(commentary){ \n \nconst comments=[ \n\"🤖 Deze wil ik!\", \n\"🤖 Ik bied hierop!\", \n\"🤖 Die hoort in mijn collectie!\", \n\"🤖 Ik ga hoger!\", \n\"🤖 Deze laat ik niet liggen!\", \n\"🤖 Mijn beurt! 💸\" \n]; \n \ndocument.getElementById(\"comment\").textContent= \ncomments[ \nMath.floor(Math.random()*comments.length) \n]; \n \n} \n \nprocessBid(\"player2\",amount); \n \n} \n \n \n/* ========================================================= \nGEEF HET ITEM \n========================================================= */ \n \nfunction giveItem(){ \n \nif(!gameActive)return; \n \nif( \ngameMode===\"online\" && \n!onlineHost \n){ \n \nif(currentTurn!==\"player2\")return; \n \nwaitingForOnlineResponse=true; \n \nupdateTurnUI(); \n \nsendOnline({ \n \ntype:\"PLAYER_ACTION\", \naction:\"GIVE\", \nplayer:\"player2\" \n \n}); \n \nreturn; \n \n} \n \nif( \ngameMode===\"online\" && \nonlineHost && \ncurrentTurn!==\"player1\" \n){ \n \nreturn; \n \n} \n \nprocessGive(currentTurn); \n \n} \n \n \n/* ========================================================= \nGIVE VERWERKEN \n========================================================= */ \n \nfunction processGive(player){ \n \nif(!gameActive)return; \n \nif(player!==currentTurn)return; \n \nif(currentBid===0){ \n \nconst winner= \nplayer===\"player1\" \n? \"player2\" \n: \"player1\"; \n \nfinishAuction(winner,0); \n \nreturn; \n \n} \n \nif(leader!==player){ \n \nfinishAuction( \nleader, \ncurrentBid \n); \n \nreturn; \n \n} \n \nconst other= \nplayer===\"player1\" \n? \"player2\" \n: \"player1\"; \n \nfinishAuction(other,0); \n \n} \n \n \n/* ========================================================= \nVEILING EINDE \n========================================================= */ \n \nfunction finishAuction(winner,price){ \n \nclearTimeout(computerTimer); \n \nif(!gameActive)return; \n \nconst item=items[itemIndex]; \n \nif(winner===\"player1\"){ \n \nplayer1Collection.push(item); \n \nplayer1Money-=price; \n \n}else{ \n \nplayer2Collection.push(item); \n \nplayer2Money-=price; \n \n} \n \nitemIndex++; \n \nstartingPlayer= \nstartingPlayer===\"player1\" \n? \"player2\" \n: \"player1\"; \n \ncurrentBid=0; \nleader=null; \ncurrentTurn=startingPlayer; \n \nwaitingForOnlineResponse=false; \n \nupdateGameUI(); \n \nif(gameMode===\"online\"){ \n \nif(!onlineHost)return; \n \nsendGameState(); \n \nroundTimer=setTimeout(()=>{ \n \nprepareRound(); \n \nsendGameState(); \n \n},700); \n \nreturn; \n \n} \n \nroundTimer=setTimeout(()=>{ \n \nprepareRound(); \n \n},700); \n \n} \n \n \n/* ========================================================= \nSPEL EINDE \n========================================================= */ \n \nfunction setPlatformScore(){\nconst mine=(gameMode===\"online\"&&!onlineHost)?player2Collection:player1Collection;\nconst other=(gameMode===\"online\"&&!onlineHost)?player1Collection:player2Collection;\ndocument.getElementById(\"headerScore\").textContent=mine.length*30+(mine.length>other.length?100:0);\n}\n\nfunction finishGame(){ \n \ngameActive=false; \n \nclearTimeout(computerTimer); \nclearTimeout(roundTimer); \n \nlet title; \n \nif( \nplayer1Collection.length> \nplayer2Collection.length \n){ \n \ntitle=\"🎉 Speler 1 heeft meer items!\"; \n \n}else if( \nplayer2Collection.length> \nplayer1Collection.length \n){ \n \ntitle= \ngameMode===\"computer\" \n? \"🤖 De computer heeft meer items!\" \n: \"🎉 Speler 2 heeft meer items!\"; \n \n}else{ \n \ntitle=\"🤝 Gelijke stand!\"; \n \n} \n \ndocument.getElementById(\"resultTitle\").textContent=title; \n \ndocument.getElementById(\"resultSubtitle\").textContent= \n`Speler 1: ${player1Collection.length} items • Speler 2: ${player2Collection.length} items`; \n \ndocument.getElementById(\"result1\").textContent= \nplayer1Collection.map(item=>item[0]).join(\" \"); \n \ndocument.getElementById(\"result2\").textContent= \nplayer2Collection.map(item=>item[0]).join(\" \"); \n \nsetPlatformScore();\nshowScreen(\"screen-result\"); \n \nif( \ngameMode===\"online\" && \nonlineHost \n){ \n \nsendOnline({ \n \ntype:\"GAME_OVER\", \n \ntitle:title, \n \nplayer1Collection:player1Collection, \nplayer2Collection:player2Collection, \n \nplayer1Money:player1Money, \nplayer2Money:player2Money \n \n}); \n \n} \n \n} \n \n \n/* ========================================================= \nKAMER MAKEN \n========================================================= */ \n \nfunction createRoom(){ \n \ndisconnectPeer(); \n \nonlineHost=true; \nonlineConnected=false; \n \ngameMode=\"online\"; \n \nconst createButton= \ndocument.getElementById(\"createRoomButton\"); \n \ncreateButton.disabled=true; \n \ndocument.getElementById(\"hostNextArea\") \n.classList.remove(\"show\"); \n \nonlineRoomCode= \nMath.random() \n.toString(36) \n.substring(2,8) \n.toUpperCase(); \n \ndocument.getElementById(\"roomCode\") \n.textContent=onlineRoomCode; \n \ndocument.getElementById(\"hostStatus\") \n.textContent=\"⏳ Kamer wordt aangemaakt...\"; \n \npeer=new Peer( \nPEER_PREFIX+onlineRoomCode, \n{ \nsecure:true, \ndebug:1 \n} \n); \n \npeer.on(\"open\",()=>{ \n \ndocument.getElementById(\"hostStatus\") \n.textContent= \n\"🟢 Kamer klaar! Wacht op speler 2.\"; \n \n}); \n \npeer.on(\"connection\",conn=>{ \n \nif(connection){ \n \ntry{ \nconn.close(); \n}catch(e){} \n \nreturn; \n \n} \n \nconnection=conn; \n \nsetupConnection(conn); \n \n}); \n \npeer.on(\"error\",error=>{ \n \nconsole.error(error); \n \ndocument.getElementById(\"hostStatus\") \n.textContent= \n\"❌ Er ging iets mis. Maak een nieuwe kamer.\"; \n \ncreateButton.disabled=false; \n \n}); \n \n} \n \n \n/* ========================================================= \nVERBINDEN SPELER 2 \n========================================================= */ \n \nfunction joinRoom(){ \n \nconst input=document.getElementById(\"joinCode\"); \n \nconst code= \ninput.value \n.trim() \n.toUpperCase(); \n \nif(code.length!==6){ \n \nshowToast(\"De code moet 6 tekens hebben.\"); \n \nreturn; \n \n} \n \ndisconnectPeer(); \n \nonlineHost=false; \nonlineConnected=false; \n \ngameMode=\"online\"; \n \ndocument.getElementById(\"joinButton\").disabled=true; \n \ndocument.getElementById(\"joinStatus\") \n.textContent=\"⏳ Verbinding maken...\"; \n \npeer=new Peer({ \nsecure:true, \ndebug:1 \n}); \n \npeer.on(\"open\",()=>{ \n \nconnection= \npeer.connect( \nPEER_PREFIX+code, \n{ \nreliable:true \n} \n); \n \nsetupConnection(connection); \n \n}); \n \npeer.on(\"error\",error=>{ \n \nconsole.error(error); \n \ndocument.getElementById(\"joinStatus\") \n.textContent=\"❌ Verbinden mislukt.\"; \n \ndocument.getElementById(\"joinButton\").disabled=false; \n \n}); \n \n} \n \n \n/* ========================================================= \nCONNECTION \n========================================================= */ \n \nfunction setupConnection(conn){ \n \nif(!conn)return; \n \nconn.on(\"open\",()=>{ \n \nconnection=conn; \n \nonlineConnected=true; \n \nif(onlineHost){ \n \ndocument.getElementById(\"hostStatus\") \n.textContent=\"🎉 Speler 2 is verbonden!\"; \n \ndocument.getElementById(\"hostNextArea\") \n.classList.add(\"show\"); \n \nsendOnline({ \ntype:\"HOST_CONNECTED\" \n}); \n \n}else{ \n \ndocument.getElementById(\"joinStatus\") \n.textContent=\"🎉 Verbonden met speler 1!\"; \n \nsendOnline({ \ntype:\"GUEST_CONNECTED\" \n}); \n \nsetTimeout(()=>{ \n \nshowScreen(\"screen-online-wait\"); \n \n},150); \n \n} \n \n}); \n \nconn.on(\"data\",data=>{ \n \nreceiveOnlineData(data); \n \n}); \n \nconn.on(\"close\",()=>{ \n \nonlineConnected=false; \n \nif(gameActive){ \n \nshowToast(\"De verbinding is verbroken.\"); \n \n} \n \n}); \n \nconn.on(\"error\",error=>{ \n \nconsole.error(error); \n \nonlineConnected=false; \n \n}); \n \n} \n \n \n/* ========================================================= \nONLINE VERZENDEN \n===== ementById(\"resultTitle\") \n.textContent=data.title; \n \ndocument.getElementById(\"resultSubtitle\") \n.textContent= \n`Speler 1: ${player1Collection.length} items • Speler 2: ${player2Collection.length} items`; \n \ndocument.getElementById(\"result1\") \n.textContent= \nplayer1Collection.map(item=>item[0]).join(\" \"); \n \ndocument.getElementById(\"result2\") \n.textContent= \nplayer2Collection.map(item=>item[0]).join(\" \"); \n \ngameActive=false; \n \nsetPlatformScore();\nshowScreen(\"screen-result\"); \n \nreturn; \n \n} \n \n} \n \n \n/* ========================================================= \nONLINE GAME START \n========================================================= */ \n \nfunction startOnlineGame(){ \n \nif(!onlineHost)return; \n \nif(!onlineConnected){ \n \nshowToast(\"Speler 2 is nog niet verbonden.\"); \n \nreturn; \n \n} \n \nitems= \nJSON.parse( \nJSON.stringify( \nthemes[selectedTheme].items \n) \n); \n \nplayer1Money=20; \nplayer2Money=20; \n \nplayer1Collection=[]; \nplayer2Collection=[]; \n \nitemIndex=0; \n \ncurrentBid=0; \nleader=null; \n \nstartingPlayer=\"player1\"; \ncurrentTurn=\"player1\"; \n \ngameActive=true; \n \nshowScreen(\"screen-game\"); \n \nprepareRound(); \n \nsendGameState(true); \n \n} \n \n \n/* ========================================================= \nGAME STATE \n========================================================= */ \n \nfunction sendGameState(isStart=false){ \n \nif( \n!onlineHost || \n!onlineConnected \n)return; \n \nsendOnline({ \n \ntype: \nisStart \n? \"GAME_START\" \n: \"GAME_STATE\", \n \nselectedTheme:selectedTheme, \n \noutfitStyle:outfitStyle, \nfoodStyle:foodStyle, \ncommentary:commentary, \n \nitems:items, \nitemIndex:itemIndex, \n \ncurrentBid:currentBid, \nleader:leader, \n \ncurrentTurn:currentTurn, \nstartingPlayer:startingPlayer, \n \nplayer1Money:player1Money, \nplayer2Money:player2Money, \n \nplayer1Collection:player1Collection, \nplayer2Collection:player2Collection \n \n}); \n \n} \n \n \n/* ========================================================= \nSTATE GAST \n========================================================= */ \n \nfunction applyOnlineState(data){ \n \nselectedTheme=data.selectedTheme; \n \noutfitStyle=data.outfitStyle; \nfoodStyle=data.foodStyle; \ncommentary=data.commentary; \n \nitems=data.items || []; \n \nitemIndex=data.itemIndex; \n \ncurrentBid=data.currentBid; \nleader=data.leader; \n \ncurrentTurn=data.currentTurn; \nstartingPlayer=data.startingPlayer; \n \nplayer1Money=data.player1Money; \nplayer2Money=data.player2Money; \n \nplayer1Collection=data.player1Collection || []; \nplayer2Collection=data.player2Collection || []; \n \nwaitingForOnlineResponse=false; \n \nconst item=items[itemIndex]; \n \nif(item){ \n \ndocument.getElementById(\"itemIcon\") \n.textContent=item[0]; \n \ndocument.getElementById(\"itemName\") \n.textContent=item[1]; \n \ndocument.getElementById(\"category\") \n.textContent=themes[selectedTheme].name; \n \ndocument.getElementById(\"gameThemeName\") \n.textContent=themes[selectedTheme].name; \n \ndocument.getElementById(\"roundText\") \n.textContent= \n`${itemIndex+1} / ${items.length}`; \n \n} \n \ngameActive=true; \n \nupdateGameUI(); \n \nshowScreen(\"screen-game\"); \n \n} \n \n \n/* ========================================================= \nDISCONNECT \n========================================================= */ \n \nfunction disconnectPeer(){ \n \nonlineConnected=false; \nwaitingForOnlineResponse=false; \n \nif(connection){ \n \ntry{ \nconnection.close(); \n}catch(e){} \n \nconnection=null; \n \n} \n \nif(peer){ \n \ntry{ \npeer.destroy(); \n}catch(e){} \n \npeer=null; \n \n} \n \nonlineHost=false; \n \n} \n \n \n/* ========================================================= \nENTER = BIEDEN \n========================================================= */ \n \ndocument.addEventListener(\"keydown\",event=>{ \n \nif(event.key!==\"Enter\")return; \n \nconst input=document.getElementById(\"bidInput\"); \n \nif( \ndocument.activeElement===input && \n!input.disabled \n){ \n \nmakeBid(); \n \n} \n \n}); \n \n \n/* ========================================================= \nTOAST \n========================================================= */ \n \nlet toastTimer=null; \n \nfunction showToast(message){ \n \nconst toast=document.getElementById(\"toast\"); \n \ntoast.textContent=message; \n \ntoast.classList.add(\"show\"); \n \nclearTimeout(toastTimer); \n \ntoastTimer=setTimeout( \n()=>{ \ntoast.classList.remove(\"show\"); \n}, \n2200 \n); \n \n} \n \n \n/* ========================================================= \nSTART \n========================================================= */ \n \nrenderThemes(); \n \nupdateSettingsUI(); \n \n<\/script> \n \n<\/body> \n<\/html>",

und-image:linear-gradient(135deg,#ffffff10,transparent 45%)}\n.cell.selected{transform:scale(.9);filter:brightness(1.45);outline:3px solid #ffd93d;z-index:2}\n.gem{width:72%;height:72%;position:relative;filter:drop-shadow(0 4px 2px #0007);clip-path:polygon(50% 0,90% 22%,100% 55%,72% 100%,28% 100%,0 55%,10% 22%)}\n.gem:before{content:\"\";position:absolute;left:13%;top:10%;width:32%;height:30%;background:#fff8;border-radius:50%;transform:rotate(-25deg)}\n.gem:after{content:\"\";position:absolute;inset:8% 15% 46% 15%;background:#fff5;clip-path:polygon(0 0,100% 0,72% 100%,28% 100%)}\n.pink{background:linear-gradient(135deg,#ff9bf4,#c415b7 45%,#6f087f)}\n.red{background:linear-gradient(135deg,#ff7892,#e51c4e 48%,#87082b)}\n.blue{background:linear-gradient(135deg,#65d8ff,#1977ed 48%,#093b9e)}\n.green{background:linear-gradient(135deg,#8cff89,#16ca4b 48%,#087d34)}\n.yellow{background:linear-gradient(135deg,#fff27b,#ffc400 48%,#d47800)}\n.orange{background:linear-gradient(135deg,#ffc06b,#ff7a00 48%,#9e3600)}\n.white{background:linear-gradient(135deg,#fff,#d8dcff 48%,#8e8dd6)}\n.side{width:190px;display:flex;flex-direction:column;gap:8px}\n.panel{padding:12px;border:2px solid #b77b16;border-radius:16px;background:#21102fe8;box-shadow:0 5px 15px #0005}\n.panel h2{font-size:12px;margin:0 0 5px;color:#ffd83d}.panel p{font-size:12px;line-height:1.35;margin:0;color:#f7e8fa}\nbutton.action{border:2px solid #e8b522;border-radius:13px;padding:12px;background:linear-gradient(180deg,#8b35b1,#55206f);color:#fff;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 4px 0 #36103f}\nbutton.action:active{transform:translateY(2px);box-shadow:0 2px 0 #36103f}\n.overlay{position:absolute;inset:10px;border-radius:15px;background:#160b25ee;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:5}.overlay h2{margin:0 0 8px;font-size:clamp(25px,5vw,42px);color:#ffd83d}.overlay p{margin:0 0 15px;max-width:390px;line-height:1.45;col · 4 = bonus · 5 = grote bonus · tik of klik om te wisselen<\/p>\n<\/main>\n<script>\n(()=>{\nconst W=8, TYPES=['pink','red','blue','green','yellow','orange','white'];\nconst boardEl=document.getElementById('board'),scoreEl=document.getElementById('score'),movesEl=document.getElementById('moves'),comboEl=document.getElementById('combo'),overlay=document.getElementById('overlay'),ovTitle=document.getElementById('ovTitle'),ovText=document.getElementById('ovText');\nlet grid=[],selected=-1,score=0,moves=30,combo=1,running=false,busy=false;\nconst idx=(r,c)=>r*W+c;\nfunction randomType(){return TYPES[Math.floor(Math.random()*TYPES.length)]}\nfunction hasMatchAt(r,c,g=grid){const t=g[idx(r,c)];if(!t)return false;let n=1;for(let x=c-1;x>=0&&g[idx(r,x)]===t;x--)n++;for(let x=c+1;x<W&&g[idx(r,x)]===t;x++)n++;if(n>=3)return true;n=1;for(let y=r-1;y>=0&&g[idx(y,c)]===t;y--)n++;for(let y=r+1;y<W&&g[idx(y,c)]===t;y++)n++;return n>=3}\nfunction fill(){grid=Array(W*W);for(let r=0;r<W;r++)for(let c=0;c<W;c++){let t;do{t=randomType();grid[idx(r,c)]=t}while(hasMatchAt(r,c));}}\nfunction render(){boardEl.innerHTML='';grid.forEach((t,i)=>{const b=document.createElement('button');b.className='cell'+(i===selected?' selected':'');b.type='button';b.setAttribute('aria-label','Edelsteen '+t);const g=document.createElement('span');g.className='gem '+t;b.appendChild(g);b.addEventListener('click',()=>pick(i));boardEl.appendChild(b)});scoreEl.textContent=score.toLocaleString('nl-BE');movesEl.textContent=moves;comboEl.textContent='x'+combo}\nfunction adjacent(a,b){const ar=Math.floor(a/W),ac=a%W,br=Math.floor(b/W),bc=b%W;return Math.abs(ar-br)+Math.abs(ac-bc)===1}\nfunction findMatches(){const set=new Set();for(let r=0;r<W;r++){let c=0;while(c<W){const t=grid[idx(r,c)];let e=c+1;while(e<W&&grid[idx(r,e)]===t)e++;if(t&&e-c>=3)for(let x=c;x<e;x++)set.add(idx(r,x));c=e}}for(let c=0;c<W;c++){let r=0;while(r<W){const t=grid[idx(r,c)];let e=r+1;while(e<W&&grid[idx(e,c)]===t)e++;if(t&&e-r>=3)for(let y=r;y<e;y++)set.add(idx(y,c));r=e}}return set}\nfunction swap(a,b){[grid[a],grid[b]]=[grid[b],grid[a]]}\nfunction drop(){for(let r=0;r<W;r++){for(let c=0;c<W;c++){const i=idx(r,c);if(!grid[i]) grid[i]=randomType()}}}\nfunction clearMatches(){let chain=0,total=0;while(true){const m=findMatches();if(!m.size)break;chain++;total+=m.size;score+=m.size*10*chain;combo=Math.min(9,chain);m.forEach(i=>grid[i]=null);drop()}return {chain,total}}\nfunction pick(i){if(!running||busy)return;if(selected<0){selected=i;render();return}if(i===selected){selected=-1;render();return}if(!adjacent(i,selected)){selected=i;render();return}busy=true;swap(i,selected);const m=findMatches();if(!m.size){swap(i,selected);selected=-1;busy=false;render();return}moves--;selected=-1;clearMatches();render();setTimeout(()=>{busy=false;if(moves<=0)endGame();},130)}\nfunction startGame(){fill();score=0;moves=30;combo=1;selected=-1;running=true;busy=false;overlay.classList.add('hidden');render()}\nfunction endGame(){running=false;ovTitle.textContent='🏆 EINDE';ovText.textContent='Je score is '+score.toLocaleString('nl-BE')+' punten. Klaar voor nog een ronde?';document.getElementById('start').textContent='▶ OPNIEUW SPELEN';overlay.classList.remove('hidden')}\ndocument.getElementById('start').addEventListener('click',startGame);document.getElementById('restart').addEventListener('click',startGame);render();\n})();\n<\/script>\n<\/body><\/html>"
