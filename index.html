ansition:transform .32s;\n}\n\n.card.flipped .card-inner,\n.card.matched .card-inner{\n    transform:rotateY(180deg);\n}\n\n.card-face{\n    position:absolute;\n    inset:0;\n    width:100%;\n    height:100%;\n    display:flex;\n    align-items:center;\n    justify-content:center;\n    border-radius:15px;\n    backface-visibility:hidden;\n}\n\n.card-front{\n    background:linear-gradient(135deg,#7140a2,#9859c7);\n    border:2px solid #8250ab;\n    color:#eadcff;\n    font-size:31px;\n    font-weight:1000;\n    box-shadow:0 5px 12px rgba(65,31,89,.13);\n}\n\n.card-back{\n    transform:rotateY(180deg);\n    background:#f4ebfc;\n    border:3px solid #b487d1;\n    font-size:40px;\n    box-shadow:0 5px 12px rgba(65,31,89,.11);\n}\n\n.card.matched .card-back{\n    background:#dec9eb;\n    border-color:#8d55b4;\n    box-shadow:0 0 0 4px rgba(111,54,154,.17);\n}\n\n.bottom{\n    display:flex;\n    justify-content:center;\n    align-items:center;\n    gap:14px;\n    color:#76598c;\n    font-size:10px;\n    font-weight:900;\n}\n\n/* TOAST */\n\n.toast{\n    position:absolute;\n    left:50%;\n    bottom:18px;\n    z-index:100;\n    transform:translate(-50%,20px);\n    opacity:0;\n    pointer-events:none;\n    background:#61318d;\n    color:white;\n    padding:10px 15px;\n    border-radius:12px;\n    font-size:11px;\n    font-weight:900;\n    transition:.2s;\n}\n\n.toast.show{\n    opacity:1;\n    transform:translate(-50%,0);\n}\n\n/* OVERLAY */\n\n.overlay{\n    position:absolute;\n    inset:0;\n    z-index:40;\n    display:flex;\n    justify-content:center;\n    align-items:center;\n    padding:20px;\n    background:rgba(62,27,86,.66);\n    backdrop-filter:blur(5px);\n}\n\n.overlay-card{\n    width:min(440px,92%);\n    padding:25px;\n    text-align:center;\n    background:#fcf8ff;\n    border:3px solid #b384d0;\n    border-radius:22px;\n    box-shadow:0 20px 50px rgba(0,0,0,.2);\n}\n\n.overlay-icon{\n    font-size:60px;\n}\n\n.overlay-title{\n    margin:4px 0;\n    color:#643092;\n    font-size:36px;\n    font-weight:1000;\n}\n\n.overlay-score{\n    color:#793ea8;\n    font-size:49px;\n    font-weight:1000;\n}\n\n.overlay-text{\n    color:#775d8c;\n    font-size:14px;\n    line-height:1.45;\n    margin:7px 0 19px;\n}\n\n.overlay-buttons{\n    display:flex;\n    flex-direction:column;\n    gap:8px;\n    align-items:center;\n}\n\n.overlay-home{\n    border:2px solid #b58acd;\n    background:#eadcf7;\n    color:#66358e;\n    border-radius:13px;\n    padding:11px 26px;\n    font-size:13px;\n    font-weight:1000;\n}\n\n/* MOBILE */\n\n@media(max-width:700px){\n\n    .app{\n        padding:3px;\n    }\n\n    .game{\n        border-radius:18px;\n    }\n\n    .header{\n        min-height:56px;\n        padding:6px 8px;\n    }\n\n    .logo{\n        font-size:18px;\n    }\n\n    .stat{\n        min-width:45px;\n        padding:4px;\n    }\n\n    .stat small{\n        font-size:6px;\n    }\n\n    .stat strong{\n        font-size:13px;\n    }\n\n    #homeScreen{\n        padding:8px;\n    }\n\n    .home-icon{\n        font-size:45px;\n    }\n\n    .home-title{\n        font-size:38px;\n    }\n\n    .home-text{\n        font-size:12px;\n        margin:5px auto 10px;\n    }\n\n    .feature-row{\n        gap:4px;\n        margin-bottom:9px;\n    }\n\n    .feature{\n        padding:5px 7px;\n        font-size:7px;\n    }\n\n    .mode-grid{\n        gap:4px;\n        margin-bottom:10px;\n    }\n\n    .mode-card{\n        padding:8px 3px;\n        border-radius:12px;\n    }\n\n    .mode-icon{\n        font-size:23px;\n    }\n\n    .mode-title{\n        font-size:9px;\n    }\n\n    .mode-info{\n        font-size:6px;\n    }\n\n    .start-main{\n        padding:10px 22px;\n        font-size:14px;\n    }\n\n    #setupScreen{\n        padding:7px;\n        gap:5px;\n    }\n\n    .setup-title{\n        font-size:21px;\n    }\n\n    .setup-text{\n        font-size:9px;\n    }\n\n    .setup-card{\n        padding:10px;\n        gap:8px;\n    }\n\n    .setup-icon{\n        font-size:45px;\n    }\n\n    .difficulty{\n        gap:4px;\n    }\n\n    .difficulty button{\n        padding:7px 8px;\n        font-size:8px;\n    }\n\n    .online-setup{\n        padding:7px;\n    }\n\n    .room-code{\n        font-size:21px;\n    }\n\n    .join-input{\n        font-size:12px;\n    }\n\n    .join-btn,\n    .copy-btn{\n        padding:8px 10px;\n        font-size:8px;\n    }\n\n    .connection-status{\n        font-size:8px;\n    }\n\n    #gameScreen{\n        padding:5px;\n        gap:4px;\n    }\n\n    .game-top{\n        grid-template-columns:auto 1fr auto auto;\n        gap:3px;\n    }\n\n    .turn-label{\n        font-size:8px;\n    }\n\n    .center-status{\n        font-size:7px;\n    }\n\n    .center-status strong{\n        font-size:13px;\n    }\n\n    .game-btn{\n        padding:5px 5px;\n        font-size:6px;\n    }\n\n    .turn-banner{\n        padding:7px 7px;\n        font-size:14px;\n        border-radius:10px;\n    }\n\n    .game-message{\n        font-size:15px;\n    }\n\n    .game-submessage{\n        font-size:7px;\n    }\n\n    .score-card{\n        padding:5px 7px;\n    }\n\n    .score-card span{\n        font-size:7px;\n    }\n\n    .score-card strong{\n        font-size:16px;\n    }\n\n    .memory-grid{\n        gap:5px;\n        padding:2px;\n    }\n\n    .card-face{\n        border-radius:10px;\n    }\n\n    .card-front{\n        font-size:22px;\n    }\n\n    .card-back{\n        font-size:29px;\n        border-width:2px;\n    }\n\n    .bottom{\n        font-size:7px;\n    }\n\n    .overlay-card{\n        padding:19px;\n    }\n\n    .overlay-icon{\n        font-size:48px;\n    }\n\n    .overlay-title{\n        font-size:30px;\n    }\n\n    .overlay-score{\n        font-size:42px;\n    }\n}\n<\/style>\n<\/head>\n\n<body>\n\n<div class=\"app\">\n<div class=\"game\">\n\n<header class=\"header\">\n\n    <div class=\"logo\">\n        MEMORY <span>MIX 💜<\/span>\n    <\/div>\n\n    <div class=\"header-stats\">\n\n        <div class=\"stat\">\n            <small>SCORE<\/small>\n            <strong id=\"headerScore\">0<\/strong>\n        <\/div>\n\n        <div class=\"stat\">\n            <small>BEST<\/small>\n            <strong id=\"bestScore\">0<\/strong>\n        <\/div>\n\n    <\/div>\n\n<\/header>\n\n\n<\u0021-- HOME -->\n\n<section id=\"homeScreen\" class=\"screen\">\n\n    <div class=\"home-icon\">🧠<\/div>\n\n    <h1 class=\"home-title\">\n        MEMORY MIX\n    <\/h1>\n\n    <p class=\"home-text\">\n        Vind alle gelijke paren en probeer de meeste punten te verzamelen.\n        Speel tegen de computer, met z'n tweeën op één scherm of online.\n    <\/p>\n\n    <div class=\"feature-row\">\n        <div class=\"feature\">🧠 GEHEUGEN<\/div>\n        <div class=\"feature\">🎯 PAREN<\/div>\n        <div class=\"feature\">🏆 SCORE<\/div>\n        <div class=\"feature\">👥 MULTIPLAYER<\/div>\n    <\/div>\n\n    <div class=\"mode-grid\">\n\n        <button class=\"mode-card selected\" data-mode=\"computer\">\n            <div class=\"mode-icon\">🤖<\/div>\n            <div class=\"mode-title\">TEGEN COMPUTER<\/div>\n            <div class=\"mode-info\">Speel tegen de computer<\/div>\n        <\/button>\n\n        <button class=\"mode-card\" data-mode=\"local\">\n            <div class=\"mode-icon\">👥<\/div>\n            <div class=\"mode-title\">MULTIPLAYER<\/div>\n            <div class=\"mode-info\">Op één scherm<\/div>\n        <\/button>\n\n        <button class=\"mode-card\" data-mode=\"online\">\n            <div class=\"mode-icon\">🌐<\/div>\n            <div class=\"mode-title\">ONLINE<\/div>\n            <div class=\"mode-info\">Twee schermen<\/div>\n        <\/button>\n\n    <\/div>\n\n    <button id=\"continueBtn\" class=\"start-main\">\n        DOORGAAN ➜\n    <\/button>\n\n<\/section>\n\n\n<\u0021-- SETUP -->\n\n<section id=\"setupScreen\" class=\"screen hidden\">\n\n    <div>\n        <div class=\"setup-title\" id=\"setupTitle\">\n            TEGEN COMPUTER\n        <\/div>\n\n        <div class=\"setup-text\" id=\"setupText\">\n            Kies je moeilijkheid.\n        <\/div>\n    <\/div>\n\n\n    <div id=\"normalSetup\" class=\"setup-card\">\n\n        <div class=\"setup-icon\">🧠<\/div>\n\n        <div class=\"difficulty-title\">\n            MOEILIJKHEID\n        <\/div>\n\n        <div class=\"difficulty\">\n\n            <button class=\"active\" data-difficulty=\"easy\">\n                🌱 MAKKELIJK\n            <\/button>\n\n            <button data-difficulty=\"normal\">\n                💜 NORMAAL\n            <\/button>\n\n            <button data-difficulty=\"hard\">\n                🔥 MOEILIJK\n            <\/button>\n\n        <\/div>\n\n    <\/div>\n\n\n    <\u0021-- ONLINE -->\n\n    <div id=\"onlineSetup\" class=\"online-setup hidden\">\n\n        <div class=\"online-tabs\">\n\n            <button id=\"createTab\" class=\"online-tab active\">\n                🏠 KAMER MAKEN\n            <\/button>\n\n            <button id=\"joinTab\" class=\"online-tab\">\n                🔑 JOINEN\n            <\/button>\n\n        <\/div>\n\n\n        <div id=\"createPanel\">\n\n            <div class=\"room-box\">\n                JOUW KAMER-CODE\n                <span id=\"roomCode\" class=\"room-code\">\n                    ------\n                <\/span>\n            <\/div>\n\n            <div style=\"text-align:center;margin-top:6px;\">\n\n                <button id=\"copyBtn\" class=\"copy-btn\">\n                    📋 KOPIËREN\n                <\/button>\n\n            <\/div>\n\n        <\/div>\n\n\n        <div id=\"joinPanel\" class=\"hidden\">\n\n            <div class=\"join-row\">\n\n                <input\n                    id=\"joinInput\"\n                    class=\"join-input\"\n                    maxlength=\"6\"\n                    placeholder=\"KAMER-CODE\"\n                    autocomplete=\"off\"\n                >\n\n                <button id=\"joinBtn\" class=\"join-btn\">\n                    JOINEN\n                <\/button>\n\n            <\/div>\n\n        <\/div>\n\n\n        <div id=\"connectionStatus\" class=\"connection-status\">\n            Kamer wordt voorbereid...\n        <\/div>\n\n    <\/div>\n\n\n    <div class=\"setup-actions\">\n\n        <button id=\"setupHomeBtn\" class=\"back-btn\">\n            🏠 HOME\n        <\/button>\n\n        <button id=\"setupStartBtn\" class=\"start-main\">\n            START GAME 🚀\n        <\/button>\n\n    <\/div>\n\n<\/section>\n\n\n<\u0021-- GAME -->\n\n<section id=\"gameScreen\" class=\"screen hidden\">\n\n    <div class=\"game-top\">\n\n        <div id=\"turnLabel\" class=\"turn-label\">\n            JIJ\n        <\/div>\n\n        <div class=\"center-status\">\n            SCORE:\n            <strong id=\"gameScore\">0<\/strong>\n        <\/div>\n\n        <button id=\"pauseBtn\" class=\"game-btn\">\n            ⏸️ PAUZE\n        <\/button>\n\n        <button id=\"gameHomeBtn\" class=\"game-btn\">\n            🏠 HOME\n        <\/button>\n\n    <\/div>\n\n\n    <div id=\"turnBanner\" class=\"turn-banner\">\n        🟣 JIJ BENT AAN DE BEURT!\n    <\/div>\n\n\n    <div id=\"gameMessage\" class=\"game-message\">\n        DRAAI TWEE KAARTEN OM!\n    <\/div>\n\n    <div id=\"gameSubmessage\" class=\"game-submessage\">\n        Vind zoveel mogelijk paren.\n    <\/div>\n\n\n    <div class=\"scoreboard\">\n\n        <div id=\"player1ScoreCard\" class=\"score-card active\">\n\n            <span id=\"player1Label\">\n                JIJ\n            <\/span>\n\n            <strong id=\"player1Score\">\n                0\n            <\/strong>\n\n        <\/div>\n\n\n        <div id=\"player2ScoreCard\" class=\"score-card\">\n\n            <span id=\"player2Label\">\n                COMPUTER\n            <\/span>\n\n            <strong id=\"player2Score\">\n                0\n            <\/strong>\n\n        <\/div>\n\n    <\/div>\n\n\n    <div id=\"memoryGrid\" class=\"memory-grid\"><\/div>\n\n\n    <div class=\"bottom\">\n\n        <span>\n            PAREN:\n            <b id=\"pairsFound\">0<\/b>/8\n        <\/span>\n\n        <span>\n            FOUTEN:\n            <b id=\"mistakes\">0<\/b>\n        <\/span>\n\n    <\/div>\n\n<\/section>\n\n\n<\u0021-- RESULT -->\n\n<div id=\"resultOverlay\" class=\"overlay hidden\">\n\n    <div class=\"overlay-card\">\n\n        <div id=\"resultIcon\" class=\"overlay-icon\">\n            🏆\n        <\/div>\n\n        <div id=\"resultTitle\" class=\"overlay-title\">\n            GEWELDIG!\n        <\/div>\n\n        <div id=\"resultScore\" class=\"overlay-score\">\n            0\n        <\/div>\n\n        <div id=\"resultText\" class=\"overlay-text\">\n        <\/div>\n\n        <div class=\"overlay-buttons\">\n\n            <button id=\"againBtn\" class=\"start-main\">\n                🔄 OPNIEUW\n            <\/button>\n\n            <button id=\"resultHomeBtn\" class=\"overlay-home\">\n                🏠 TERUG NAAR HOME\n            <\/button>\n\n        <\/div>\n\n    <\/div>\n\n<\/div>\n\n\n<\u0021-- PAUZE -->\n\n<div id=\"pauseOverlay\" class=\"overlay hidden\">\n\n    <div class=\"overlay-card\">\n\n        <div class=\"overlay-icon\">\n            ⏸️\n        <\/div>\n\n        <div class=\"overlay-title\">\n            PAUZE\n        <\/div>\n\n        <div class=\"overlay-text\">\n            Je spel staat tijdelijk stil.\n        <\/div>\n\n        <button id=\"resumeBtn\" class=\"start-main\">\n            ▶ VERDER SPELEN\n        <\/button>\n\n    <\/div>\n\n<\/div>\n\n\n<\u0021-- ONLINE WACHTEN -->\n\n<div id=\"waitingOverlay\" class=\"overlay hidden\">\n\n    <div class=\"overlay-card\">\n\n        <div class=\"overlay-icon\">\n            🌐\n        <\/div>\n\n        <div class=\"overlay-title\">\n            ONLINE\n        <\/div>\n\n        <div id=\"waitingText\" class=\"overlay-text\">\n            Wachten op de andere speler...\n        <\/div>\n\n        <button id=\"waitingHomeBtn\" class=\"overlay-home\">\n            🏠 HOME\n        <\/button>\n\n    <\/div>\n\n<\/div>\n\n\n<div id=\"toast\" class=\"toast\"><\/div>\n\n<\/div>\n<\/div>\n\n\n<script>\n\"use strict\";\n\n/* ELEMENTEN */\n\nconst homeScreen = document.getElementById(\"homeScreen\");\nconst setupScreen = document.getElementById(\"setupScreen\");\nconst gameScreen = document.getElementById(\"gameScreen\");\n\nconst normalSetup = document.getElementById(\"normalSetup\");\nconst onlineSetup = document.getElementById(\"onlineSetup\");\n\nconst continueBtn = document.getElementById(\"continueBtn\");\nconst setupHomeBtn = document.getElementById(\"setupHomeBtn\");\nconst setupStartBtn = document.getElementById(\"setupStartBtn\");\n\nconst gameHomeBtn = document.getElementById(\"gameHomeBtn\");\nconst pauseBtn = document.getElementById(\"pauseBtn\");\nconst resumeBtn = document.getElementById(\"resumeBtn\");\n\nconst resultHomeBtn = document.getElementById(\"resultHomeBtn\");\nconst againBtn = document.getElementById(\"againBtn\");\n\nconst memoryGrid = document.getElementById(\"memoryGrid\");\n\nconst headerScore = document.getElementById(\"headerScore\");\nconst bestScoreEl = document.getElementById(\"bestScore\");\nconst gameScore = document.getElementById(\"gameScore\");\n\nconst player1ScoreEl = document.getElementById(\"player1Score\");\nconst player2ScoreEl = document.getElementById(\"player2Score\");\n\nconst player1ScoreCard = document.getElementById(\"player1ScoreCard\");\nconst player2ScoreCard = document.getElementById(\"player2ScoreCard\");\n\nconst player1Label = document.getElementById(\"player1Label\");\nconst player2Label = document.getElementById(\"player2Label\");\n\nconst turnLabel = document.getElementById(\"turnLabel\");\nconst turnBanner = document.getElementById(\"turnBanner\");\n\nconst gameMessage = document.getElementById(\"gameMessage\");\nconst gameSubmessage = document.getElementById(\"gameSubmessage\");\n\nconst pairsFoundEl = document.getElementById(\"pairsFound\");\nconst mistakesEl = document.getElementById(\"mistakes\");\n\nconst setupTitle = document.getElementById(\"setupTitle\");\nconst setupText = document.getElementById(\"setupText\");\n\nconst resultOverlay = document.getElementById(\"resultOverlay\");\nconst resultIcon = document.getElementById(\"resultIcon\");\nconst resultTitle = document.getElementById(\"resultTitle\");\nconst resultScore = document.getElementById(\"resultScore\");\nconst resultText = document.getElementById(\"resultText\");\n\nconst pauseOverlay = document.getElementById(\"pauseOverlay\");\n\nconst waitingOverlay = document.getElementById(\"waitingOverlay\");\nconst waitingText = document.getElementById(\"waitingText\");\n\nconst createTab = document.getElementById(\"createTab\");\nconst joinTab = document.getElementById(\"joinTab\");\nconst createPanel = document.getElementById(\"createPanel\");\nconst joinPanel = document.getElementById(\"joinPanel\");\n\nconst roomCodeEl = document.getElementById(\"roomCode\");\nconst joinInput = document.getElementById(\"joinInput\");\nconst joinBtn = document.getElementById(\"joinBtn\");\nconst copyBtn = document.getElementById(\"copyBtn\");\n\nconst connectionStatus = document.getElementById(\"connectionStatus\");\nconst toast = document.getElementById(\"toast\");\n\n\n/* GAME */\n\nlet mode = \"computer\";\nlet difficulty = \"easy\";\n\nlet gameRunning = false;\nlet paused = false;\n\nlet currentTurn = 1;\n\nlet cards = [];\nlet firstCard = null;\nlet secondCard = null;\n\nlet lockBoard = false;\n\nlet matchedPairs = 0;\nlet mistakes = 0;\n\nlet score1 = 0;\nlet score2 = 0;\n\nlet computerMemory = [];\nlet computerTimer = null;\n\n\n/* ONLINE */\n\nlet peer = null;\nlet connection = null;\n\nlet onlineRole = null;\nlet onlineConnected = false;\n\nlet onlineReady = false;\nlet onlineOpponentReady = false;\n\nlet onlineDeck = [];\nlet onlineTurn = 1;\n\nlet onlineFirstIndex = null;\nlet onlineSecondIndex = null;\n\n\n/* SYMBOLEN */\n\nconst symbols = [\n    \"🍓\",\"🍉\",\"🍋\",\"🍇\",\n    \"🍒\",\"🥝\",\"🍑\",\"🍍\"\n];\n\n\n/* BESTE SCORE */\n\nlet bestScore =\n    Number(localStorage.getItem(\"memoryMixBest\")) || 0;\n\nbestScoreEl.textContent = bestScore;\n\n\n/* MODUS */\n\ndocument.querySelectorAll(\".mode-card\")\n.forEach(card => {\n\n    card.addEventListener(\"click\", () => {\n\n        document.querySelectorAll(\".mode-card\")\n        .forEach(c => c.classList.remove(\"selected\"));\n\n        card.classList.add(\"selected\");\n\n        mode = card.dataset.mode;\n\n    });\n\n});\n\n\n/* DOORGAAN */\n\ncontinueBtn.addEventListener(\"click\", showSetup);\n\n\nfunction showSetup(){\n\n    homeScreen.classList.add(\"hidden\");\n    setupScreen.classList.remove(\"hidden\");\n\n    resultOverlay.classList.add(\"hidden\");\n    pauseOverlay.classList.add(\"hidden\");\n    waitingOverlay.classList.add(\"hidden\");\n\n\n    if(mode === \"computer\"){\n\n        normalSetup.classList.remove(\"hidden\");\n        onlineSetup.classList.add(\"hidden\");\n\n        setupTitle.textContent = \"TEGEN COMPUTER\";\n        setupText.textContent = \"Kies je moeilijkheid.\";\n\n        setupStartBtn.disabled = false;\n        setupStartBtn.textContent = \"START GAME 🚀\";\n\n    }\n\n    else if(mode === \"local\"){\n\n        normalSetup.classList.remove(\"hidden\");\n        onlineSetup.classList.add(\"hidden\");\n\n        setupTitle.textContent = \"MULTIPLAYER\";\n        setupText.textContent =\n            \"Twee spelers spelen om de beurt op één scherm.\";\n\n        setupStartBtn.disabled = false;\n        setupStartBtn.textContent = \"START GAME 🚀\";\n\n    }\n\n    else{\n\n        normalSetup.classList.add(\"hidden\");\n        onlineSetup.classList.remove(\"hidden\");\n\n        setupTitle.textContent = \"ONLINE MEMORY MIX\";\n        setupText.textContent =\n            \"Maak een kamer of join een bestaande kamer.\";\n\n        setupStartBtn.disabled = true;\n        setupStartBtn.textContent = \"KLAAR ✅\";\n\n        setupOnlineCreate();\n\n    }\n\n}\n\n\n/* MOEILIJKHEID */\n\ndocument.querySelectorAll(\".difficulty button\")\n.forEach(button => {\n\n    button.addEventListener(\"click\", () => {\n\n        document.querySelectorAll(\".difficulty button\")\n        .forEach(b => b.classList.remove(\"active\"));\n\n        button.classList.add(\"active\");\n\n        difficulty = button.dataset.difficulty;\n\n    });\n\n});\n\n\n/* START */\n\nsetupStartBtn.addEventListener(\"click\", () => {\n\n    if(setupStartBtn.disabled)\n        return;\n\n    if(mode === \"computer\"){\n\n        startComputerGame();\n\n    }\n    else if(mode === \"local\"){\n\n        startLocalGame();\n\n    }\n\n});\n\n\n/* RESET */\n\nfunction resetGame(){\n\n    clearTimeout(computerTimer);\n\n    gameRunning = false;\n    paused = false;\n\n    currentTurn = 1;\n\n    cards = [];\n\n    firstCard = null;\n    secondCard = null;\n\n    lockBoard = false;\n\n    matchedPairs = 0;\n    mistakes = 0;\n\n    score1 = 0;\n    score2 = 0;\n\n    computerMemory = [];\n\n}\n\n\n/* COMPUTER START */\n\nfunction startComputerGame(){\n\n    resetGame();\n\n    player1Label.textContent = \"JIJ\";\n    player2Label.textContent = \"COMPUTER\";\n\n    setupScreen.classList.add(\"hidden\");\n    gameScreen.classList.remove(\"hidden\");\n\n    gameRunning = true;\n    currentTurn = 1;\n\n    createBoard();\n\n}\n\n\n/* LOCAL START */\n\nfunction startLocalGame(){\n\n    resetGame();\n\n    player1Label.textContent = \"SPELER 1\";\n    player2Label.textContent = \"SPELER 2\";\n\n    setupScreen.classList.add(\"hidden\");\n    gameScreen.classList.remove(\"hidden\");\n\n    gameRunning = true;\n    currentTurn = 1;\n\n    createBoard();\n\n}\n\n\n/* BOARD */\n\nfunction createBoard(){\n\n    memoryGrid.innerHTML = \"\";\n\n    cards = [...symbols, ...symbols];\n\n    shuffle(cards);\n\n\n    cards.forEach((symbol,index) => {\n\n        const card =\n            document.createElement(\"button\");\n\n        card.type = \"button\";\n        card.className = \"card\";\n\n        card.dataset.index = index;\n        card.dataset.symbol = symbol;\n\n        card.innerHTML = `\n            <div class=\"card-inner\">\n                <div class=\"card-face card-front\">?<\/div>\n                <div class=\"card-face card-back\">${symbol}<\/div>\n            <\/div>\n        `;\n\n        card.addEventListener(\"click\", () => {\n            clickCard(card);\n        });\n\n        memoryGrid.appendChild(card);\n\n    });\n\n\n    gameMessage.textContent =\n        \"DRAAI TWEE KAARTEN OM!\";\n\n    updateUI();\n\n}\n\n\n/* SHUFFLE */\n\nfunction shuffle(array){\n\n    for(let i = array.length - 1; i > 0; i--){\n\n        const j =\n            Math.floor(\n                Math.random() * (i + 1)\n            );\n\n        [array[i],array[j]] =\n        [array[j],array[i]];\n\n    }\n\n}\n\n\n/* KAART KLIKKEN */\n\nfunction clickCard(card){\n\n    if(\n        !gameRunning ||\n        paused ||\n        lockBoard\n    )\n        return;\n\n    if(\n        card.classList.contains(\"flipped\") ||\n        card.classList.contains(\"matched\")\n    )\n        return;\n\n    if(\n        mode === \"computer\" &&\n        currentTurn !== 1\n    )\n        return;\n\n\n    card.classList.add(\"flipped\");\n\n\n    if(!firstCard){\n\n        firstCard = card;\n        return;\n\n    }\n\n\n    secondCard = card;\n    lockBoard = true;\n\n    setTimeout(checkPair,500);\n\n}\n\n\n/* PAAR */\n\nfunction checkPair(){\n\n    if(!firstCard || !secondCard)\n        return;\n\n\n    const match =\n        firstCard.dataset.symbol ===\n        secondCard.dataset.symbol;\n\n\n    if(match){\n\n        firstCard.classList.add(\"matched\");\n        secondCard.classList.add(\"matched\");\n\n\n        if(currentTurn === 1){\n            score1 += 100;\n        }\n        else{\n            score2 += 100;\n        }\n\n\n        matchedPairs++;\n\n\n        rememberCard(firstCard);\n        rememberCard(secondCard);\n\n\n        firstCard = null;\n        secondCard = null;\n\n        lockBoard = false;\n\n\n        gameMessage.textContent =\n            \"🎉 PAAR GEVONDEN!\";\n\n\n        updateUI();\n\n\n        if(matchedPairs >= 8){\n\n            finishGame();\n            return;\n\n        }\n\n\n        /* dezelfde speler mag nog een keer */\n\n        if(\n            mode === \"computer\" &&\n            currentTurn === 2\n        ){\n\n            setTimeout(\n                computerTurn,\n                550\n            );\n\n        }\n\n    }\n\n    else{\n\n        mistakes++;\n\n\n        if(currentTurn === 1){\n\n            score1 =\n                Math.max(0,score1 - 10);\n\n        }\n        else{\n\n            score2 =\n                Math.max(0,score2 - 10);\n\n        }\n\n\n        rememberCard(firstCard);\n        rememberCard(secondCard);\n\n\n        setTimeout(() => {\n\n            if(firstCard){\n                firstCard.classList.remove(\"flipped\");\n            }\n\n            if(secondCard){\n                secondCard.classList.remove(\"flipped\");\n            }\n\n\n            firstCard = null;\n            secondCard = null;\n\n            lockBoard = false;\n\n\n            currentTurn =\n                currentTurn === 1 ? 2 : 1;\n\n\n            gameMessage.textContent =\n                \"DRAAI TWEE KAARTEN OM!\";\n\n\n            updateUI();\n\n\n            if(\n                mode === \"computer\" &&\n                currentTurn === 2\n            ){\n\n                setTimeout(\n                    computerTurn,\n                    500\n                );\n\n            }\n\n        },700);\n\n    }\n\n}\n\n\n/* COMPUTER GEHEUGEN */\n\nfunction rememberCard(card){\n\n    if(!card)\n        return;\n\n    const index =\n        Number(card.dataset.index);\n\n    if(\n        !computerMemory.some(\n            item => item.index === index\n        )\n    ){\n\n        computerMemory.push({\n            index:index,\n            symbol:card.dataset.symbol\n        });\n\n    }\n\n}\n\n\n/* =====================================================\n   COMPUTER\n   SLECHTER GEMAAKT\n===================================================== */\n\nfunction computerTurn(){\n\n    if(\n        !gameRunning ||\n        paused ||\n        mode !== \"computer\" ||\n        currentTurn !== 2\n    )\n        return;\n\n\n    lockBoard = true;\n\n    updateUI();\n\n    gameMessage.textContent =\n        \"🤖 COMPUTER DENKT...\";\n\n\n    let firstIndex;\n    let secondIndex;\n\n\n    /*\n       HOEVEEL HIJ ZIJN GEHEUGEN GEBRUIKT\n\n       Makkelijk: heel weinig\n       Normaal:   gemiddeld\n       Moeilijk:  nog steeds niet perfect\n    */\n\n    const memoryChance =\n        difficulty === \"easy\"\n        ? 0.20\n        : difficulty === \"normal\"\n        ? 0.45\n        : 0.70;\n\n\n    /*\n       Soms kiest de computer zelfs een\n       volledig willekeurige eerste kaart.\n    */\n\n    const available =\n        getAvailableIndices();\n\n\n    if(available.length < 2){\n\n        lockBoard = false;\n        return;\n\n    }\n\n\n    const knownPair =\n        Math.random() < memoryChance\n        ? findKnownPair()\n        : null;\n\n\n    if(knownPair){\n\n        firstIndex = knownPair.first;\n        secondIndex = knownPair.second;\n\n    }\n\n    else{\n\n        firstIndex =\n            available[\n                Math.floor(\n                    Math.random() * available.length\n                )\n            ];\n\n\n        const remaining =\n            available.filter(\n                x => x !== firstIndex\n            );\n\n\n        /*\n           De computer gebruikt zijn kennis\n           van de tweede kaart maar soms.\n        */\n\n        const secondMemoryChance =\n            difficulty === \"easy\"\n            ? 0.12\n            : difficulty === \"normal\"\n            ? 0.30\n            : 0.55;\n\n\n        if(\n            Math.random() < secondMemoryChance\n        ){\n\n            const remembered =\n                findRememberedMatch(\n                    firstIndex,\n                    remaining\n                );\n\n            if(remembered !== null){\n\n                secondIndex = remembered;\n\n            }\n\n        }\n\n\n        if(secondIndex === undefined){\n\n            /*\n               EXTRA FOUT:\n               soms laat hij een kaart zien\n               die hij al kent, maar niet gebruikt.\n            */\n\n            secondIndex =\n                remaining[\n                    Math.floor(\n                        Math.random() *\n                        remaining.length\n                    )\n                ];\n\n        }\n\n    }\n\n\n    const thinkingTime =\n        difficulty === \"easy\"\n        ? 850\n        : difficulty === \"normal\"\n        ? 600\n        : 400;\n\n\n    computerTimer =\n        setTimeout(() => {\n\n            const first =\n                getCardByIndex(firstIndex);\n\n            if(first){\n\n                first.classList.add(\"flipped\");\n                rememberCard(first);\n\n            }\n\n\n            setTimeout(() => {\n\n                const second =\n                    getCardByIndex(secondIndex);\n\n                if(second){\n\n                    second.classList.add(\"flipped\");\n                    rememberCard(second);\n\n                }\n\n\n                setTimeout(() => {\n\n                    firstCard =\n                        getCardByIndex(firstIndex);\n\n                    secondCard =\n                        getCardByIndex(secondIndex);\n\n                    checkPair();\n\n                },350);\n\n            },450);\n\n        },thinkingTime);\n\n}\n\n\n/* BEKENDE PAAR */\n\nfunction findKnownPair(){\n\n    const chance =\n        difficulty === \"easy\"\n        ? 0.55\n        : difficulty === \"normal\"\n        ? 0.72\n        : 0.90;\n\n\n    /*\n       Zelfs als hij een paar kent,\n       kan hij het dus missen.\n    */\n\n    if(Math.random() > chance){\n\n        return null;\n\n    }\n\n\n    for(\n        let i = 0;\n        i < computerMemory.length;\n        i++\n    ){\n\n        for(\n            let j = i + 1;\n            j < computerMemory.length;\n            j++\n        ){\n\n            const a =\n                computerMemory[i];\n\n            const b =\n                computerMemory[j];\n\n\n            if(a.symbol !== b.symbol)\n                continue;\n\n\n            const cardA =\n                getCardByIndex(a.index);\n\n            const cardB =\n                getCardByIndex(b.index);\n\n\n            if(\n                cardA &&\n                cardB &&\n                !cardA.classList.contains(\"matched\") &&\n                !cardB.classList.contains(\"matched\")\n            ){\n\n                return {\n                    first:a.index,\n                    second:b.index\n                };\n\n            }\n\n        }\n\n    }\n\n\n    return null;\n\n}\n\n\n/* GEHEUGEN MATCH */\n\nfunction findRememberedMatch(\n    firstIndex,\n    remaining\n){\n\n    const symbol =\n        cards[firstIndex];\n\n\n    const found =\n        computerMemory.find(item => {\n\n            const card =\n                getCardByIndex(item.index);\n\n            return (\n                item.symbol === symbol &&\n                remaining.includes(item.index) &&\n                card &&\n                !card.classList.contains(\"matched\")\n            );\n\n        });\n\n\n    return found\n        ? found.index\n        : null;\n\n}\n\n\n/* BESCHIKBARE KAARTEN */\n\nfunction getAvailableIndices(){\n\n    return cards\n        .map((_,i) => i)\n        .filter(i => {\n\n            const card =\n                getCardByIndex(i);\n\n            return (\n                card &&\n                !card.classList.contains(\"flipped\") &&\n                !card.classList.contains(\"matched\")\n            );\n\n        });\n\n}\n\n\n/* KAART OP INDEX */\n\nfunction getCardByIndex(index){\n\n    return document.querySelector(\n        `.card[data-index=\"${index}\"]`\n    );\n\n}\n\n\n/* BEURT WEERGAVE */\n\nfunction updateTurnMessage(){\n\n    turnBanner.classList.remove(\n        \"player2\",\n        \"online\"\n    );\n\n\n    if(mode === \"local\"){\n\n        if(currentTurn === 1){\n\n            turnLabel.textContent =\n                \"SPELER 1\";\n\n            turnBanner.textContent =\n                \"🟣 SPELER 1 IS AAN DE BEURT!\";\n\n            gameSubmessage.textContent =\n                \"SPELER 1: kies twee kaarten.\";\n\n        }\n        else{\n\n            turnLabel.textContent =\n                \"SPELER 2\";\n\n            turnBanner.textContent =\n                \"🟣 SPELER 2 IS AAN DE BEURT!\";\n\n            turnBanner.classList.add(\n                \"player2\"\n            );\n\n            gameSubmessage.textContent =\n                \"SPELER 2: kies twee kaarten.\";\n\n        }\n\n    }\n\n\n    else if(mode === \"computer\"){\n\n        if(currentTurn === 1){\n\n            turnLabel.textContent =\n                \"JIJ\";\n\n            turnBanner.textContent =\n                \"🟣 JIJ BENT AAN DE BEURT!\";\n\n            gameSubmessage.textContent =\n                \"Draai twee kaarten om.\";\n\n        }\n        else{\n\n            turnLabel.textContent =\n                \"COMPUTER\";\n\n            turnBanner.textContent =\n                \"🤖 COMPUTER IS AAN DE BEURT!\";\n\n            turnBanner.classList.add(\n                \"player2\"\n            );\n\n            gameSubmessage.textContent =\n                \"De computer kiest twee kaarten.\";\n\n        }\n\n    }\n\n\n    else if(mode === \"online\"){\n\n        const myTurn =\n            onlineRole === \"host\"\n            ? 1\n            : 2;\n\n\n        if(currentTurn === myTurn){\n\n            turnLabel.textContent =\n                \"JIJ\";\n\n            turnBanner.textContent =\n                \"🟣 JIJ BENT AAN DE BEURT!\";\n\n            turnBanner.classList.add(\n                \"online\"\n            );\n\n        }\n        else{\n\n            turnLabel.textContent =\n                \"TEGENSTANDER\";\n\n            turnBanner.textContent =\n                \"👀 TEGENSTANDER IS AAN DE BEURT!\";\n\n            turnBanner.classList.add(\n                \"player2\"\n            );\n\n        }\n\n    }\n\n\n    player1ScoreCard.classList.toggle(\n        \"active\",\n        currentTurn === 1\n    );\n\n    player2ScoreCard.classList.toggle(\n        \"active\",\n        currentTurn === 2\n    );\n\n}\n\n\n/* UI */\n\nfunction updateUI(){\n\n    player1ScoreEl.textContent =\n        score1;\n\n    player2ScoreEl.textContent =\n        score2;\n\n\n    let shownScore;\n\n\n    if(mode === \"computer\"){\n\n        shownScore = score1;\n\n    }\n\n    else if(mode === \"online\"){\n\n        shownScore =\n            onlineRole === \"host\"\n            ? score1\n            : score2;\n\n    }\n\n    else{\n\n        shownScore =\n            currentTurn === 1\n            ? score1\n            : score2;\n\n    }\n\n\n    gameScore.textContent =\n        shownScore;\n\n    headerScore.textContent =\n        shownScore;\n\n    pairsFoundEl.textContent =\n        matchedPairs;\n\n    mistakesEl.textContent =\n        mistakes;\n\n\n    updateTurnMessage();\n\n}\n\n\n/* RESULTAAT */\n\nfunction finishGame(){\n\n    gameRunning = false;\n\n    clearTimeout(computerTimer);\n\n\n    let myScore = score1;\n    let enemyScore = score2;\n\n\n    if(\n        mode === \"online\" &&\n        onlineRole === \"guest\"\n    ){\n\n        myScore = score2;\n        enemyScore = score1;\n\n    }\n\n\n    if(myScore > enemyScore){\n\n        resultIcon.textContent =\n            \"🏆\";\n\n        resultTitle.textContent =\n            \"JIJ WINT!\";\n\n    }\n\n    else if(myScore < enemyScore){\n\n        resultIcon.textContent =\n            \"🔥\";\n\n        resultTitle.textContent =\n            mode === \"computer\"\n            ? \"COMPUTER WINT!\"\n            : \"TEGENSTANDER WINT!\";\n\n    }\n\n    else{\n\n        resultIcon.textContent =\n            \"🤝\";\n\n        resultTitle.textContent =\n            \"GELIJKSPEL!\";\n\n    }\n\n\n    resultScore.textContent =\n        myScore;\n\n    resultText.textContent =\n        `Eindscore: ${score1} - ${score2}`;\n\n\n    if(myScore > bestScore){\n\n        bestScore = myScore;\n\n        localStorage.setItem(\n            \"memoryMixBest\",\n            bestScore\n        );\n\n        bestScoreEl.textContent =\n            bestScore;\n\n    }\n\n\n    resultOverlay.classList.remove(\n        \"hidden\"\n    );\n\n}\n\n\n/* PAUZE */\n\npauseBtn.addEventListener(\"click\", () => {\n\n    if(!gameRunning)\n        return;\n\n    paused = true;\n\n    clearTimeout(computerTimer);\n\n    pauseOverlay.classList.remove(\"hidden\");\n\n});\n\n\nresumeBtn.addEventListener(\"click\", () => {\n\n    paused = false;\n\n    pauseOverlay.classList.add(\"hidden\");\n\n    updateUI();\n\n\n    if(\n        mode === \"computer\" &&\n        currentTurn === 2\n    ){\n\n        setTimeout(\n            computerTurn,\n            300\n        );\n\n    }\n\n});\n\n\n/* HOME */\n\nsetupHomeBtn.addEventListener(\"click\", goHome);\ngameHomeBtn.addEventListener(\"click\", goHome);\nresultHomeBtn.addEventListener(\"click\", goHome);\nwaitingHomeBtn.addEventListener(\"click\", goHome);\n\n\nfunction goHome(){\n\n    clearTimeout(computerTimer);\n\n    gameRunning = false;\n\n    pauseOverlay.classList.add(\"hidden\");\n    resultOverlay.classList.add(\"hidden\");\n    waitingOverlay.classList.add(\"hidden\");\n\n    setupScreen.classList.add(\"hidden\");\n    gameScreen.classList.add(\"hidden\");\n\n    homeScreen.classList.remove(\"hidden\");\n\n    closeConnection();\n\n}\n\n\n/* OPNIEUW */\n\nagainBtn.addEventListener(\"click\", () => {\n\n    resultOverlay.classList.add(\"hidden\");\n\n    if(mode === \"computer\"){\n\n        startComputerGame();\n\n    }\n\n    else if(mode === \"local\"){\n\n        startLocalGame();\n\n    }\n\n});\n\n\n/* ONLINE CREATE */\n\ncreateTab.addEventListener(\"click\", () => {\n\n    createTab.classList.add(\"active\");\n    joinTab.classList.remove(\"active\");\n\n    createPanel.classList.remove(\"hidden\");\n    joinPanel.classList.add(\"hidden\");\n\n    setupOnlineCreate();\n\n});\n\n\n/* ONLINE JOIN */\n\njoinTab.addEventListener(\"click\", () => {\n\n    joinTab.classList.add(\"active\");\n    createTab.classList.remove(\"active\");\n\n    createPanel.classList.add(\"hidden\");\n    joinPanel.classList.remove(\"hidden\");\n\n    closeConnection();\n\n    setupStartBtn.disabled = true;\n\n    connectionStatus.textContent =\n        \"Voer een kamer-code in.\";\n\n});\n\n\n/* KAMER MAKEN */\n\nfunction setupOnlineCreate(){\n\n    closeConnection();\n\n    onlineRole = \"host\";\n\n    onlineReady = false;\n    onlineOpponentReady = false;\n\n    setupStartBtn.disabled = true;\n\n    const code = randomCode();\n\n    roomCodeEl.textContent = code;\n\n\n    if(typeof Peer === \"undefined\"){\n\n        connectionStatus.textContent =\n            \"Online kan niet worden geladen.\";\n\n        return;\n\n    }\n\n\n    peer =\n        new Peer(\n            \"MEMORY_MIX_\" + code\n        );\n\n\n    connectionStatus.textContent =\n        \"Kamer wordt aangemaakt...\";\n\n\n    peer.on(\"open\", () => {\n\n        connectionStatus.textContent =\n            \"Kamer klaar! Geef de code aan speler 2.\";\n\n    });\n\n\n    peer.on(\"connection\", conn => {\n\n        if(connection)\n            return;\n\n        connection = conn;\n\n\n        connection.on(\"open\", () => {\n\n            onlineConnected = true;\n\n            setupStartBtn.disabled = false;\n\n            connectionStatus.textContent =\n                \"Speler 2 verbonden! Druk op KLAAR.\";\n\n        });\n\n\n        connection.on(\n            \"data\",\n            handleOnlineData\n        );\n\n\n        connection.on(\"close\", () => {\n\n            onlineConnected = false;\n            gameRunning = false;\n\n            showWaiting(\n                \"De andere speler heeft de verbinding verbroken.\"\n            );\n\n        });\n\n    });\n\n\n    peer.on(\"error\", () => {\n\n        connectionStatus.textContent =\n            \"Er ging iets mis met de kamer.\";\n\n    });\n\n}\n\n\n/* ONLINE JOIN */\n\njoinBtn.addEventListener(\n    \"click\",\n    joinRoom\n);\n\n\nfunction joinRoom(){\n\n    const code =\n        joinInput.value.trim().toUpperCase();\n\n\n    if(!/^[A-Z0-9]{6}$/.test(code)){\n\n        showToast(\n            \"Gebruik een code van 6 tekens.\"\n        );\n\n        return;\n\n    }\n\n\n    closeConnection();\n\n    onlineRole = \"guest\";\n\n    peer = new Peer();\n\n\n    connectionStatus.textContent =\n        \"Verbinden...\";\n\n\n    peer.on(\"open\", () => {\n\n        connection =\n            peer.connect(\n                \"MEMORY_MIX_\" + code,\n                {reliable:true}\n            );\n\n\n        connection.on(\"open\", () => {\n\n            onlineConnected = true;\n\n            setupStartBtn.disabled = false;\n\n            connectionStatus.textContent =\n                \"Verbonden! Druk op KLAAR.\";\n\n        });\n\n\n        connection.on(\n            \"data\",\n            handleOnlineData\n        );\n\n\n        connection.on(\"close\", () => {\n\n            onlineConnected = false;\n\n            showWaiting(\n                \"De verbinding is verbroken.\"\n            );\n\n        });\n\n    });\n\n\n    peer.on(\"error\", () => {\n\n        connectionStatus.textContent =\n            \"Kamer niet gevonden.\";\n\n    });\n\n}\n\n\n/* ONLINE START */\n\nfunction startOnlineGame(){\n\n    if(!onlineConnected){\n\n        showToast(\n            \"Je bent nog niet verbonden.\"\n        );\n\n        return;\n\n    }\n\n\n    onlineReady = true;\n\n\n    connection.send({\n        type:\"ready\"\n    });\n\n\n    setupStartBtn.disabled = true;\n\n\n    if(onlineRole === \"host\"){\n\n        connectionStatus.textContent =\n            \"Jij bent klaar. Wachten op speler 2...\";\n\n        checkOnlineStart();\n\n    }\n\n    else{\n\n        showWaiting(\n            \"Jij bent klaar. Wachten op speler 1...\"\n        );\n\n    }\n\n}\n\n\n/* ONLINE START CHECK */\n\nfunction checkOnlineStart(){\n\n    if(\n        onlineRole !== \"host\" ||\n        !onlineReady ||\n        !onlineOpponentReady\n    )\n        return;\n\n\n    onlineDeck =\n        [...symbols,...symbols];\n\n    shuffle(onlineDeck);\n\n\n    onlineTurn = 1;\n\n    score1 = 0;\n    score2 = 0;\n\n    mistakes = 0;\n    matchedPairs = 0;\n\n    onlineFirstIndex = null;\n    onlineSecondIndex = null;\n\n\n    connection.send({\n        type:\"start\",\n        deck:onlineDeck\n    });\n\n\n    startOnlineBoard();\n\n}\n\n\n/* ONLINE BOARD */\n\nfunction startOnlineBoard(){\n\n    setupScreen.classList.add(\"hidden\");\n\n    waitingOverlay.classList.add(\"hidden\");\n\n    gameScreen.classList.remove(\"hidden\");\n\n\n    player1Label.textContent =\n        onlineRole === \"host\"\n        ? \"JIJ\"\n        : \"TEGENSTANDER\";\n\n\n    player2Label.textContent =\n        onlineRole === \"host\"\n        ? \"TEGENSTANDER\"\n        : \"JIJ\";\n\n\n    gameRunning = true;\n\n    currentTurn = onlineTurn;\n\n\n    createOnlineBoard();\n\n    updateUI();\n\n}\n\n\n/* ONLINE BOARD MAKEN */\n\nfunction createOnlineBoard(){\n\n    memoryGrid.innerHTML = \"\";\n\n\n    onlineDeck.forEach((symbol,index) => {\n\n        const card =\n            document.createElement(\"button\");\n\n\n        card.type = \"button\";\n        card.className = \"card\";\n\n        card.dataset.index = index;\n        card.dataset.symbol = symbol;\n\n\n        card.innerHTML = `\n            <div class=\"card-inner\">\n                <div class=\"card-face card-front\">?<\/div>\n                <div class=\"card-face card-back\">${symbol}<\/div>\n            <\/div>\n        `;\n\n\n        card.addEventListener(\"click\", () => {\n\n            clickOnlineCard(card);\n\n        });\n\n\n        memoryGrid.appendChild(card);\n\n    });\n\n}\n\n\n/* ONLINE CLICK */\n\nfunction clickOnlineCard(card){\n\n    if(\n        !gameRunning ||\n        paused ||\n        lockBoard\n    )\n        return;\n\n\n    const myTurn =\n        onlineRole === \"host\"\n        ? 1\n        : 2;\n\n\n    if(onlineTurn !== myTurn)\n        return;\n\n\n    if(\n        card.classList.contains(\"flipped\") ||\n        card.classList.contains(\"matched\")\n    )\n        return;\n\n\n    card.classList.add(\"flipped\");\n\n\n    const index =\n        Number(card.dataset.index);\n\n\n    if(onlineFirstIndex === null){\n\n        onlineFirstIndex = index;\n\n\n        connection.send({\n            type:\"firstCard\",\n            index:index\n        });\n\n\n        gameMessage.textContent =\n            \"KIES JE TWEEDE KAART!\";\n\n        return;\n\n    }\n\n\n    onlineSecondIndex = index;\n\n    lockBoard = true;\n\n\n    connection.send({\n        type:\"secondCard\",\n        index:index\n    });\n\n\n    if(onlineRole === \"host\"){\n\n        setTimeout(\n            checkOnlinePair,\n            450\n        );\n\n    }\n\n}\n\n\n/* ONLINE PAAR */\n\nfunction checkOnlinePair(){\n\n    if(\n        onlineFirstIndex === null ||\n        onlineSecondIndex === null\n    )\n        return;\n\n\n    const match =\n        onlineDeck[onlineFirstIndex] ===\n        onlineDeck[onlineSecondIndex];\n\n\n    if(match){\n\n        matchedPairs++;\n\n        if(onlineTurn === 1){\n            score1 += 100;\n        }\n        else{\n            score2 += 100;\n        }\n\n    }\n    else{\n\n        mistakes++;\n\n    }\n\n\n    connection.send({\n\n        type:\"pairResult\",\n\n        match:match,\n\n        first:onlineFirstIndex,\n\n        second:onlineSecondIndex,\n\n        score1:score1,\n\n        score2:score2,\n\n        matchedPairs:matchedPairs,\n\n        mistakes:mistakes,\n\n        nextTurn:\n            match\n            ? onlineTurn\n            : (\n                onlineTurn === 1\n                ? 2\n                : 1\n            )\n\n    });\n\n\n    finishOnlinePair(\n        match,\n        onlineFirstIndex,\n        onlineSecondIndex,\n        match\n        ? onlineTurn\n        : (\n            onlineTurn === 1\n            ? 2\n            : 1\n        )\n    );\n\n}\n\n\n/* ONLINE AFHANDELEN */\n\nfunction finishOnlinePair(\n    match,\n    first,\n    second,\n    nextTurn\n){\n\n    const firstEl =\n        getCardByIndex(first);\n\n    const secondEl =\n        getCardByIndex(second);\n\n\n    if(match){\n\n        if(firstEl)\n            firstEl.classList.add(\"matched\");\n\n        if(secondEl)\n            secondEl.classList.add(\"matched\");\n\n        gameMessage.textContent =\n            \"🎉 PAAR GEVONDEN!\";\n\n    }\n\n\n    setTimeout(() => {\n\n        if(!match){\n\n            if(firstEl)\n                firstEl.classList.remove(\"flipped\");\n\n            if(secondEl)\n                secondEl.classList.remove(\"flipped\");\n\n        }\n\n\n        onlineFirstIndex = null;\n        onlineSecondIndex = null;\n\n        lockBoard = false;\n\n        onlineTurn = nextTurn;\n        currentTurn = nextTurn;\n\n\n        updateUI();\n\n\n        if(matchedPairs >= 8){\n\n            finishGame();\n            return;\n\n        }\n\n\n        gameMessage.textContent =\n            \"DRAAI TWEE KAARTEN OM!\";\n\n\n    },match ? 450 : 900);\n\n}\n\n\n/* ONLINE DATA */\n\nfunction handleOnlineData(data){\n\n    if(!data)\n        return;\n\n\n    if(data.type === \"ready\"){\n\n        onlineOpponentReady = true;\n\n        if(onlineRole === \"host\"){\n            checkOnlineStart();\n        }\n\n        return;\n    }\n\n\n    if(data.type === \"start\"){\n\n        onlineDeck = data.deck;\n\n        onlineTurn = 1;\n\n        score1 = 0;\n        score2 = 0;\n\n        mistakes = 0;\n        matchedPairs = 0;\n\n        onlineFirstIndex = null;\n        onlineSecondIndex = null;\n\n        startOnlineBoard();\n\n        return;\n    }\n\n\n    if(data.type === \"firstCard\"){\n\n        const card =\n            getCardByIndex(data.index);\n\n        if(card)\n            card.classList.add(\"flipped\");\n\n        onlineFirstIndex =\n            data.index;\n\n        return;\n    }\n\n\n    if(data.type === \"secondCard\"){\n\n        const card =\n            getCardByIndex(data.index);\n\n        if(card)\n            card.classList.add(\"flipped\");\n\n        onlineSecondIndex =\n            data.index;\n\n        return;\n    }\n\n\n    if(data.type === \"pairResult\"){\n\n        score1 = data.score1;\n        score2 = data.score2;\n\n        matchedPairs = data.matchedPairs;\n        mistakes = data.mistakes;\n\n\n        finishOnlinePair(\n            data.match,\n            data.first,\n            data.second,\n            data.nextTurn\n        );\n\n    }\n\n}\n\n\n/* WAITING */\n\nfunction showWaiting(message){\n\n    waitingText.textContent =\n        message;\n\n    waitingOverlay.classList.remove(\n        \"hidden\"\n    );\n\n}\n\n\n/* CODE */\n\nfunction randomCode(){\n\n    const chars =\n        \"ABCDEFGHJKLMNPQRSTUVWXYZ23456789\";\n\n    let code = \"\";\n\n    for(let i = 0; i < 6; i++){\n\n        code +=\n            chars[\n                Math.floor(\n                    Math.random() *\n                    chars.length\n                )\n            ];\n\n    }\n\n    return code;\n\n}\n\n\n/* KOPIËREN */\n\ncopyBtn.addEventListener(\"click\",async() => {\n\n    const code =\n        roomCodeEl.textContent;\n\n    try{\n\n        await navigator.clipboard.writeText(code);\n\n        showToast(\n            \"Kamer-code gekopieerd 📋\"\n        );\n\n    }\n    catch{\n\n        showToast(\n            \"Code: \" + code\n        );\n\n    }\n\n});\n\n\n/* CONNECTION */\n\nfunction closeConnection(){\n\n    try{\n\n        if(connection)\n            connection.close();\n\n        if(peer)\n            peer.destroy();\n\n    }\n    catch(e){}\n\n    connection = null;\n    peer = null;\n\n    onlineConnected = false;\n    onlineRole = null;\n\n    onlineReady = false;\n    onlineOpponentReady = false;\n\n}\n\n\n/* TOAST */\n\nlet toastTimer = null;\n\nfunction showToast(message){\n\n    toast.textContent =\n        message;\n\n    toast.classList.add(\"show\");\n\n    clearTimeout(toastTimer);\n\n\n    toastTimer =\n        setTimeout(() => {\n\n            toast.classList.remove(\"show\");\n\n        },2000);\n\n}\n\n\n/* GEEN SCROLL */\n\ndocument.addEventListener(\n    \"touchmove\",\n    e => e.preventDefault(),\n    {passive:false}\n);\n\n\n/* START */\n\nupdateUI();\n\n<\/script>\n\n<\/body>\n<\/html>", "2048": "<!DOCTYPE html>\n<html lang=\"nl\">\n<head><script>try{localStorage.getItem(\"x\")}catch(e){var _m={};Object.defineProperty(window,\"localStorage\",{value:{getItem:function(k){return k in _m?_m[k]:null},setItem:function(k,v){_m[k]=String(v)},removeItem:function(k){delete _m[k]}}})}<\/script>\n<meta charset=\"UTF-8\">\n\n<meta name=\"viewport\"\n      content=\"width=device-width,\n      initial-scale=1.0,\n      maximum-scale=1.0,\n      user-scalable=no\">\n\n<title>2048 REMIX 🩷<\/title>\n\n<style>\n*{\n    box-sizing:border-box;\n    -webkit-tap-highlight-color:transparent;\n    user-select:none;\n}\n\nhtml,body{\n    width:100%;\n    height:100%;\n    margin:0;\n    overflow:hidden;\n    font-family:Arial,Helvetica,sans-serif;\n}\n\nbody{\n    background:\n        radial-gradient(circle at 10% 10%,#ffe2df 0%,transparent 32%),\n        radial-gradient(circle at 90% 90%,#ee8b83 0%,transparent 35%),\n        linear-gradient(135deg,#fff7f5,#ffd1cc,#f39a92);\n\n    color:#7f332f;\n}\n\nbutton{\n    font-family:inherit;\n    cursor:pointer;\n    touch-action:manipulation;\n}\n\nbutton:active{\n    transform:scale(.97);\n}\n\n.hidden{\n    display:none !important;\n}\n\n\n/* =====================================================\n   APP\n===================================================== */\n\n.app{\n    width:100%;\n    height:100%;\n\n    display:flex;\n    align-items:center;\n    justify-content:center;\n\n    padding:8px;\n}\n\n.game{\n    width:min(1080px,100%);\n    height:min(800px,100%);\n\n    position:relative;\n\n    display:flex;\n    flex-direction:column;\n\n    overflow:hidden;\n\n    background:#fffaf9;\n\n    border:3px solid #e69a92;\n    border-radius:28px;\n\n    box-shadow:\n        0 22px 65px rgba(117,48,42,.22);\n}\n\n\n/* =====================================================\n   HEADER\n===================================================== */\n\n.header{\n    min-height:70px;\n\n    padding:10px 17px;\n\n    display:flex;\n    justify-content:space-between;\n    align-items:center;\n\n    gap:10px;\n\n    background:\n        linear-gradient(\n            135deg,\n            #d9655c,\n            #ed8a81\n        );\n\n    color:white;\n}\n\n.logo{\n    font-size:clamp(22px,4vw,34px);\n    font-weight:1000;\n}\n\n.logo span{\n    color:#ffe6e1;\n}\n\n.header-stats{\n    display:flex;\n    gap:6px;\n}\n\n.stat{\n    min-width:64px;\n\n    padding:5px 8px;\n\n    border-radius:11px;\n\n    background:rgba(255,255,255,.16);\n    border:2px solid rgba(255,255,255,.2);\n\n    text-align:center;\n}\n\n.stat small{\n    display:block;\n    font-size:8px;\n    opacity:.86;\n}\n\n.stat strong{\n    display:block;\n    font-size:17px;\n}\n\n\n/* =====================================================\n   SCREENS\n===================================================== */\n\n.screen{\n    flex:1;\n    min-height:0;\n\n    display:flex;\n    flex-direction:column;\n}\n\n\n/* =====================================================\n   HOME\n=================================================== x;\n}\n\n.overlay-title{\n    margin:4px 0;\n\n    color:#ad4942;\n\n    font-size:36px;\n\n    font-weight:1000;\n}\n\n.overlay-score{\n    color:#c2554c;\n\n    font-size:49px;\n\n    font-weight:1000;\n}\n\n.overlay-text{\n    color:#885b56;\n\n    font-size:14px;\n\n    line-height:1.45;\n\n    margin:7px 0 19px;\n}\n\n.overlay-buttons{\n    display:flex;\n\n    flex-direction:column;\n\n    gap:8px;\n\n    align-items:center;\n}\n\n.overlay-home{\n    border:2px solid #e0a098;\n\n    background:#ffe8e4;\n\n    color:#8d413a;\n\n    border-radius:13px;\n\n    padding:11px 26px;\n\n    font-size:13px;\n\n    font-weight:1000;\n}\n\n\n/* =====================================================\n   PAUSE\n===================================================== */\n\n.pause-card{\n    text-align:center;\n}\n\n\n/* =====================================================\n   TOAST\n===================================================== */\n\n.toast{\n    position:absolute;\n\n    left:50%;\n    bottom:18px;\n\n    z-index:100;\n\n    transform:translate(-50%,20px);\n\n    opacity:0;\n\n    pointer-events:none;\n\n    background:#a64039;\n\n    color:white;\n\n    padding:10px 15px;\n\n    border-radius:12px;\n\n    font-size:11px;\n\n    font-weight:900;\n\n    transition:.2s;\n}\n\n.toast.show{\n    opacity:1;\n\n    transform:translate(-50%,0);\n}\n\n\n/* =====================================================\n   MOBILE\n===================================================== */\n\n@media(max-width:700px){\n\n    .app{\n        padding:3px;\n    }\n\n    .game{\n        border-radius:18px;\n    }\n\n    .header{\n        min-height:56px;\n        padding:6px 8px;\n    }\n\n    .logo{\n        font-size:18px;\n    }\n\n    .stat{\n        min-width:45px;\n        padding:4px;\n    }\n\n    .stat small{\n        font-size:6px;\n    }\n\n    .stat strong{\n        font-size:13px;\n    }\n\n\n    #homeScreen{\n        padding:8px;\n    }\n\n    .home-icon{\n        font-size:45px;
