d(\n        \"hidden\"\n    );\n\n    homeScreen.classList.remove(\n        \"hidden\"\n    );\n\n\n    closeOnline();\n\n}\n\n\n/* =====================================================\n   JOIN ROOM TRIGGER\n===================================================== */\n\njoinButton.addEventListener(\n    \"click\",\n    () => {\n\n        if(\n            onlineType === \"join\"\n        ){\n\n            if(\n                joinButton.textContent !==\n                \"🔑 JOINEN\"\n            )\n                return;\n\n        }\n\n    }\n);\n\n\n/*\n   De echte join-knop zit niet als aparte knop in de\n   joinArea om ruimte te besparen. Dubbelklik/Enter is\n   hierboven beschikbaar.\n\n   Daarom maken we automatisch een knop.\n*/\n\nconst joinRoomButton =\n    document.createElement(\"button\");\n\njoinRoomButton.type =\n    \"button\";\n\njoinRoomButton.className =\n    \"online-button\";\n\njoinRoomButton.textContent =\n    \"🔑 JOIN KAMER\";\n\njoinRoomButton.style.marginTop =\n    \"7px\";\n\njoinArea.appendChild(\n    joinRoomButton\n);\n\njoinRoomButton.addEventListener(\n    \"click\",\n    joinRoom\n);\n\n\n/* =====================================================\n   GUEST READY\n===================================================== */\n\nfunction sendGuestReadyAgain(){\n\n    if(\n        connection &&\n        connection.open\n    ){\n\n        sendGuestReady();\n\n    }\n\n}\n\n\n/* =====================================================\n   SCOREBOARD INIT\n===================================================== */\n\nupdateStats();\n\n\n/* =====================================================\n   ROOM CODE\n===================================================== */\n\nfunction generateRoomCode(){\n\n    const chars =\n        \"ABCDEFGHJKLMNPQRSTUVWXYZ23456789\";\n\n    let code = \"\";\n\n\n    for(\n        let i = 0;\n        i < 6;\n        i++\n    ){\n\n        code +=\n            chars[\n                Math.floor(\n                    Math.random() *\n                    chars.length\n                )\n            ];\n\n    }\n\n\n    return code;\n\n}\n\n\n/* =====================================================\n   CLEAN NAME\n===================================================== */\n\nfunction cleanName(name){\n\n    return name\n        .replace(\n            /[<>]/g,\n            \"\"\n        )\n        .trim()\n        .slice(\n            0,\n            18\n        );\n\n}\n\n\n/* =====================================================\n   ESCAPE\n===================================================== */\n\nfunction escapeHtml(text){\n\n    return String(text)\n        .replace(\n            /&/g,\n            \"&amp;\"\n        )\n        .replace(\n            /<\/g,\n            \"&lt;\"\n        )\n        .replace(\n            />/g,\n            \"&gt;\"\n        )\n        .replace(\n            /\"/g,\n            \"&quot;\"\n        )\n        .replace(\n            /'/g,\n            \"&#039;\"\n        );\n\n}\n\n\n/* =====================================================\n   SHUFFLE\n===================================================== */\n\nfunction shuffle(array){\n\n    for(\n        let i = array.length - 1;\n        i > 0;\n        i--\n    ){\n\n        const j =\n            Math.floor(\n                Math.random() *\n                (i + 1)\n            );\n\n\n        [\n            array[i],\n            array[j]\n        ] =\n        [\n            array[j],\n            array[i]\n        ];\n\n    }\n\n\n    return array;\n\n}\n\n\n/* =====================================================\n   CONNECTION\n===================================================== */\n\nfunction closeOnline(){\n\n    try{\n\n        if(connection)\n            connection.close();\n\n        if(peer)\n            peer.destroy();\n\n    }\n    catch(e){}\n\n\n    connection =\n        null;\n\n    peer =\n        null;\n\n    players =\n        {};\n\n    onlineStarted =\n        false;\n\n    onlineScoreboard =\n        [];\n\n}\n\n\n/* =====================================================\n   TIMERS\n===================================================== */\n\nfunction stopAllTimers(){\n\n    clearInterval(\n        timerInterval\n    );\n\n    clearTimeout(\n        hostQuestionTimer\n    );\n\n}\n\n\n/* =====================================================\n   TOAST\n===================================================== */\n\nlet toastTimer = null;\n\n\nfunction showToast(message){\n\n    toast.textContent =\n        message;\n\n\n    toast.classList.add(\n        \"show\"\n    );\n\n\n    clearTimeout(\n        toastTimer\n    );\n\n\n    toastTimer =\n        setTimeout(\n            () => {\n\n                toast.classList.remove(\n                    \"show\"\n                );\n\n            },\n            1800\n        );\n\n}\n\n\n/* =====================================================\n   WAITING VISUAL\n===================================================== */\n\nfunction showWaitingOverlayText(){\n\n    subFeedback.textContent =\n        \"Wachten op de host...\";\n\n}\n\n\n/* =====================================================\n   KEYBOARD\n===================================================== */\n\ndocument.addEventListener(\n    \"keydown\",\n    event => {\n\n        if(\n            !gameRunning ||\n            paused\n        )\n            return;\n\n\n        const key =\n            event.key;\n\n\n        if(\n            ![\"1\",\"2\",\"3\",\"4\"]\n            .includes(key)\n        )\n            return;\n\n\n        const index =\n            Number(key) - 1;\n\n\n        const buttons =\n            [\n                ...answersEl.querySelectorAll(\n                    \".answer\"\n                )\n            ];\n\n\n        if(\n            buttons[index]\n        ){\n\n            buttons[index].click();\n\n        }\n\n    }\n);\n\n\n/* =====================================================\n   ENTER JOIN\n===================================================== */\n\nroomInput.addEventListener(\n    \"keyup\",\n    event => {\n\n        if(\n            event.key === \"Enter\"\n        ){\n\n            joinRoom();\n\n        }\n\n    }\n);\n\n\n/* =====================================================\n   ONLINE AUTO HELLO\n===================================================== */\n\nconst originalConnectionStatus =\n    onlineStatus;\n\n\n/*\n   Wanneer gast verbinding maakt, stuur meteen\n   zijn naam door als die al ingevuld is.\n*/\n\nsetInterval(\n    () => {\n\n        if(\n            !isHost &&\n            mode === \"online\" &&\n            connection &&\n            connection.open &&\n            nameInput.value.trim() &&\n            !onlineStarted\n        ){\n\n            /*\n               Alleen lobby-info sturen.\n            */\n\n            try{\n\n                connection.send({\n\n                    type:\"hello\",\n\n                    name:\n                        cleanName(\n                            nameInput.value\n                        )\n\n                });\n\n            }\n            catch(e){}\n\n        }\n\n    },\n    1200\n);\n\n\n/* =====================================================\n   ONLINE HOST RECEIVE SCOREBOARD\n===================================================== */\n\nfunction refreshHostScoreboard(){\n\n    if(\n        isHost &&\n        mode === \"online\"\n    ){\n\n        broadcastScoreboard();\n\n    }\n\n}\n\n\n/* =====================================================\n   START HOST QUESTION RESET\n===================================================== */\n\nfunction resetHostQuestion(){\n\n    answeredPlayers = {};\n\n    firstCorrectPlayer = null;\n\n    questionLocked = false;\n\n}\n\n\n/* =====================================================\n   ONLINE HOST QUESTION PATCH\n===================================================== */\n\nconst oldShowQuestion =\n    showQuestion;\n\n\n/* =====================================================\n   MOBILE SWIPE TO ANSWER\n===================================================== */\n\nlet touchStartX = 0;\nlet touchStartY = 0;\n\n\nanswersEl.addEventListener(\n    \"touchstart\",\n    event => {\n\n        const touch =\n            event.changedTouches[0];\n\n        touchStartX =\n            touch.clientX;\n\n        touchStartY =\n            touch.clientY;\n\n    },\n    {\n        passive:true\n    }\n);\n\n\nanswersEl.addEventListener(\n    \"touchend\",\n    event => {\n\n        const touch =\n            event.changedTouches[0];\n\n\n        const dx =\n            touch.clientX -\n            touchStartX;\n\n        const dy =\n            touch.clientY -\n            touchStartY;\n\n\n        if(\n            Math.max(\n                Math.abs(dx),\n                Math.abs(dy)\n            ) < 25\n        )\n            return;\n\n    },\n    {\n        passive:true\n    }\n);\n\n\n/* =====================================================\n   NO SCROLL\n===================================================== */\n\ndocument.addEventListener(\n    \"touchmove\",\n    event => {\n\n        if(\n            event.target.closest(\n                \".answers,.room-input,.name-input\"\n            )\n        ){\n\n            return;\n\n        }\n\n        event.preventDefault();\n\n    },\n    {\n        passive:false\n    }\n);\n\n\n/* =====================================================\n   INIT\n===================================================== */\n\nquizScreen.classList.add(\n    \"hidden\"\n);\n\nsetupScreen.classList.add(\n    \"hidden\"\n);\n\nresultOverlay.classList.add(\n    \"hidden\"\n);\n\npauseOverlay.classList.add(\n    \"hidden\"\n);\n\nrenderPlayers();\n\n<\/script>\n\n<\/body>\n<\/html>",

n    }\n\n    #setupScreen{\n        padding:7px;\n        gap:5px;\n    }\n\n    .setup-title{\n        font-size:22px;\n    }\n\n    .setup-subtitle{\n        font-size:10px;\n    }\n\n    .players{\n        gap:5px;\n    }\n\n    .setup-card{\n        padding:7px;\n        border-radius:13px;\n    }\n\n    .setup-card h2{\n        font-size:13px;\n    }\n\n    .preview{\n        font-size:38px;\n    }\n\n    .gender-label{\n        font-size:9px;\n    }\n\n    .gender-btn{\n        padding:8px 2px;\n        font-size:9px;\n    }\n\n    .note{\n        font-size:8px;\n    }\n\n    .room-code{\n        font-size:22px;\n    }\n\n    .code-input{\n        font-size:13px;\n    }\n\n    #gameScreen{\n        padding:7px;\n        gap:5px;\n    }\n\n    .game-top{\n        gap:5px;\n    }\n\n    .theme{\n        font-size:11px;\n    }\n\n    .round{\n        font-size:9px;\n    }\n\n    .game-button{\n        padding:5px 6px;\n        font-size:8px;\n    }\n\n    .battle{\n        grid-template-columns:1fr 40px 1fr;\n        gap:4px;\n    }\n\n    .player-panel{\n        padding:6px;\n        border-radius:13px;\n    }\n\n    .player-title{\n        font-size:10px;\n    }\n\n    .player-score{\n        font-size:17px;\n    }\n\n    .avatar{\n        width:53px;\n        height:53px;\n        font-size:30px;\n    }\n\n    .outfit-top{\n        font-size:36px;\n    }\n\n    .outfit-bottom{\n        font-size:22px;\n    }\n\n    .outfit-shoes{\n        font-size:18px;\n    }\n\n    .outfit-name{\n        font-size:8px;\n    }\n\n    .vs-circle{\n        width:40px;\n        height:40px;\n        font-size:11px;\n    }\n\n    .choose-title{\n        font-size:11px;\n    }\n\n    .choices{\n        gap:3px;\n    }\n\n    .choice{\n        padding:4px 2px;\n        border-radius:9px;\n    }\n\n    .choice-icons{\n        font-size:21px;\n    }\n\n    .choice-name{\n        font-size:7px;\n    }\n\n    .confirm-btn{\n        padding:8px 18px;\n        font-size:11px;\n    }\n}\n\n.choices.duo{display:flex;gap:8px;align-items:flex-start}\n.duo-col{flex:1;min-width:0;display:grid;grid-template-columns:repeat(2,1fr);gap:5px;align-content:start;padding:6px;border:2px solid #371da2;border-radius:14px;background:#111532;max-height:40vh;overflow-y:auto}\n.duo-col.p2{border-color:#4226b2;background:#0f132e}\n.duo-h{grid-column:1/-1;text-align:center;font-weight:1000;font-size:12px;color:#6441f2}\n.duo-col.p2 .duo-h{color:#6345dd}\n.duo-col .choice{padding:4px 2px}.duo-col .choice-icons{font-size:19px}.duo-col .choice-name{font-size:7px}\n.duo-col.p2 .choice{background:#121735;border-color:#263072;color:#ffffff}\n.duo-col.p2 .choice.selected{background:#1d2558;border-color:#4929c8}\n.duo-ok{grid-column:1/-1;border:0;border-radius:10px;background:#4b23ec;color:#ffffff;padding:8px;font-weight:1000;font-size:12px}\n.duo-col.p2 .duo-ok{background:#4929c8}.duo-ok:disabled{opacity:.45}\n.duo-col.done{opacity:.6;pointer-events:none}\n<\/style>\n<style>html,body{background:radial-gradient(ellipse at 10% 0,#ff72c655,transparent 45%),radial-gradient(ellipse at 90% 100%,#36e0c255,transparent 50%),#11152b!important;color:#0d1027}<\/style><\/head>\n\n<body>\n\n<div class=\"app\">\n\n<div class=\"game\">\n\n\n<!-- HEADER -->\n\n<div class=\"header\">\n\n<div class=\"logo\">\nSTYLE <span>BATTLE 🧡<\/span>\n<\/div>\n\n<div class=\"stats\">\n\n<div class=\"stat\">\n<small>SCORE<\/small>\n<strong id=\"headerScore\">0<\/strong>\n<\/div>\n\n<div class=\"stat\">\n<small>RONDE<\/small>\n<strong id=\"headerRound\">-<\/strong>\n<\/div>\n\n<\/div>\n\n<\/div>\n\n\n<!-- =====================================================\n     HOME\n===================================================== -->\n\n<div\nid=\"homeScreen\"\nclass=\"screen\">\n\n<div class=\"home-icon\">\n👗\n<\/div>\n\n<h1 class=\"home-title\">\nSTYLE BATTLE\n<\/h1>\n\n<p class=\"home-text\">\nMaak de beste outfit en versla je tegenstander!\n<\/p>\n\n\n<div class=\"mode-grid\">\n\n<button\nclass=\"mode-card selected\"\ndata-mode=\"computer\">\n\n<div class=\"mode-icon\">\n🤖\n<\/div>\n\n<div class=\"mode-name\">\nCOMPUTER\n<\/div>\n\n<div class=\"mode-info\">\nSpeel tegen de computer\n<\/div>\n\n<\/button>\n\n\n<button\nclass=\"mode-card\"\ndata-mode=\"local\">\n\n<div class=\"mode-icon\">\n👥\n<\/div>\n\n<div class=\"mode-name\">\n2 SPELERS\n<\/div>\n\n<div class=\"mode-info\">\nTegelijk, samen op één scherm\n<\/div>\n\n<\/button>\n\n\n<button\nclass=\"mode-card\"\ndata-mode=\"online\">\n\n<div class=\"mode-icon\">\n🌐\n<\/div>\n\n<div class=\"mode-name\">\nONLINE\n<\/div>\n\n<div class=\"mode-info\">\nTwee verschillende toestellen\n<\/div>\n\n<\/button>\n\n<\/div>\n\n\n<button\nclass=\"orange-btn\"\nid=\"continueBtn\">\n\nDOORGAAN ➜\n\n<\/button>\n\n<\/div>\n\n\n<!-- =====================================================\n     SETUP\n===================================================== -->\n\n<div\nid=\"setupScreen\"\nclass=\"screen hidden\">\n\n<div class=\"setup-head\">\n\n<div\nclass=\"setup-title\"\nid=\"setupTitle\">\n\nKIES JE STIJL\n\n<\/div>\n\n<div\nclass=\"setup-subtitle\"\nid=\"setupSubtitle\">\n\nKies jouw kledingstijl.\n\n<\/div>\n\n<\/div>\n\n\n<div class=\"players\">\n\n\n<!-- SPELER 1 -->\n\n<div\nclass=\"setup-card\"\nid=\"player1Setup\">\n\n<h2>\n🧡 SPELER 1\n<\/h2>\n\n<div\nclass=\"preview\"\nid=\"preview1\">\n\n🧍‍♂️\n\n<\/div>\n\n<div class=\"gender-label\">\nKLEDINGSTIJL\n<\/div>\n\n<div class=\"gender-row\">\n\n<button\nclass=\"gender-btn active\"\nid=\"p1Boy\">\n\n👦 JONGENS\n\n<\/button>\n\n<button\nclass=\"gender-btn\"\nid=\"p1Girl\">\n\n👧 MEISJES\n\n<\/button>\n\n<\/div>\n\n<div class=\"note\">\nAlleen jij kiest jouw kledingstijl.\n<\/div>\n\n<\/div>\n\n\n<!-- SPELER 2 -->\n\n<div\nclass=\"setup-card hidden\"\nid=\"player2Setup\">\n\n<h2>\n🧡 SPELER 2\n<\/h2>\n\n<div\nclass=\"preview\"\nid=\"preview2\">\n\n🧍‍♀️\n\n<\/div>\n\n<div class=\"gender-label\">\nKLEDINGSTIJL\n<\/div>\n\n<div class=\"gender-row\">\n\n<button\nclass=\"gender-btn\"\nid=\"p2Boy\">\n\n👦 JONGENS\n\n<\/button>\n\n<button\nclass=\"gender-btn active\"\nid=\"p2Girl\">\n\n👧 MEISJES\n\n<\/button>\n\n<\/div>\n\n<div class=\"note\">\nSpeler 2 kiest alleen voor zichzelf.\n<\/div>\n\n<\/div>\n\n\n<\/div>\n\n\n<!-- ONLINE ROOM -->\n\n<div\nclass=\"online-box hidden\"\nid=\"onlineBox\">\n\n<div class=\"online-tabs\">\n\n<button\nclass=\"online-tab active\"\nid=\"createTab\">\n\n🏠 KAMER MAKEN\n\n<\/button>\n\n<button\nclass=\"online-tab\"\nid=\"joinTab\">\n\n🔑 JOINEN\n\n<\/button>\n\n<\/div>\n\n\n<!-- ROOM MAKEN -->\n\n<div id=\"createPanel\">\n\n<div class=\"room-code-box\">\n\nJOUW KAMER-CODE\n\n<span\nclass=\"room-code\"\nid=\"roomCode\">\n\n------\n\n<\/span>\n\n<\/div>\n\n<div\nstyle=\"\ndisplay:flex;\njustify-content:center;\nmargin-top:6px;\n\">\n\n<button\nclass=\"small-btn\"\nid=\"copyBtn\">\n\n📋 KOPIËREN\n\n<\/button>\n\n<\/div>\n\n<\/div>\n\n\n<!-- ROOM JOINEN -->\n\n<div\nid=\"joinPanel\"\nclass=\"hidden\">\n\n<div class=\"online-row\">\n\n<input\nid=\"joinInput\"\nclass=\"code-input\"\nmaxlength=\"6\"\nplaceholder=\"KAMER-CODE\"\nautocomplete=\"off\">\n\n<button\nclass=\"small-btn\"\nid=\"joinBtn\">\n\nJOINEN\n\n<\/button>\n\n<\/div>\n\n<\/div>\n\n\n<div\nclass=\"connection-status\"\nid=\"connectionStatus\">\n\nKlaar om een kamer te maken.\n\n<\/div>\n\n<\/div>\n\n\n<div class=\"setup-actions\">\n\n<button\nclass=\"back-btn\"\nid=\"setupHomeBtn\">\n\n🏠 HOME\n\n<\/button>\n\n<button\nclass=\"start-battle\"\nid=\"startBattleBtn\">\n\nSTART BATTLE 🔥\n\n<\/button>\n\n<\/div>\n\n<\/div>\n\n\n<!-- =====================================================\n     GAME\n===================================================== -->\n\n<div\nid=\"gameScreen\"\nclass=\"screen hidden\">\n\n<div class=\"game-top\">\n\n<div class=\"theme\">\n\nTHEMA:\n<span id=\"themeName\">\n---\n<\/span>\n\n<\/div>\n\n<div class=\"round\">\n\nRONDE\n<span id=\"gameRound\">\n1\n<\/span>/8\n\n<\/div>\n\n<button\nclass=\"game-button\"\nid=\"gameHomeBtn\">\n\n🏠 HOME\n\n<\/button>\n\n<\/div>\n\n\n<div class=\"battle\">\n\n\n<!-- PLAYER 1 PANEL -->\n\n<div class=\"player-panel\">\n\n<div\nclass=\"player-title\"\nid=\"player1Title\">\n\nJOUW LOOK\n\n<\/div>\n\n<div class=\"player-score\">\n\n<span id=\"score1\">\n0\n<\/span>\n\n<\/div>\n\n<div\nclass=\"avatar\"\nid=\"avatar1\">\n\n🧍‍♂️\n\n<\/div>\n\n<div class=\"outfit-display\">\n\n<div\nclass=\"outfit-top\"\nid=\"top1\">\n👕\n<\/div>\n\n<div\nclass=\"outfit-bottom\"\nid=\"bottom1\">\n👖\n<\/div>\n\n<div\nclass=\"outfit-shoes\"\nid=\"shoes1\">\n👟\n<\/div>\n\n<div\nclass=\"outfit-name\"\nid=\"name1\">\n\nKies een outfit\n\n<\/div>\n\n<\/div>\n\n<\/div>\n\n\n<!-- VS -->\n\n<div class=\"vs\">\n\n<div class=\"vs-circle\">\nVS\n<\/div>\n\n<\/div>\n\n\n<!-- PLAYER 2 PANEL -->\n\n<div class=\"player-panel\">\n\n<div\nclass=\"player-title\"\nid=\"player2Title\">\n\nTEGENSTANDER\n\n<\/div>\n\n<div class=\"player-score\">\n\n<span id=\"score2\">\n0\n<\/span>\n\n<\/div>\n\n<div\nclass=\"avatar\"\nid=\"avatar2\">\n\n🧍‍♀️\n\n<\/div>\n\n<div class=\"outfit-display\">\n\n<div\nclass=\"outfit-top\"\nid=\"top2\">\n👚\n<\/div>\n\n<div\nclass=\"outfit-bottom\"\nid=\"bottom2\">\n👗\n<\/div>\n\n<div\nclass=\"outfit-shoes\"\nid=\"shoes2\">\n👠\n<\/div>\n\n<div\nclass=\"outfit-name\"\nid=\"name2\">\n\nWachten...\n\n<\/div>\n\n<\/div>\n\n<\/div>\n\n<\/div>\n\n\n<div\nclass=\"choose-title\"\nid=\"chooseTitle\">\n\nKIES JE OUTFIT\n\n<\/div>\n\n\n<div\nclass=\"choices\"\nid=\"choices\">\n<\/div>\n\n\n<div class=\"confirm-row\">\n\n<button\nclass=\"confirm-btn\"\nid=\"confirmBtn\"\ndisabled>\n\n✅ BEVESTIG LOOK\n\n<\/button>\n\n<\/div>\n\n<\/div>\n\n\n<!-- =====================================================\n     RESULT\n===================================================== -->\n\n<div\nid=\"resultOverlay\"\nclass=\"overlay hidden\">\n\n<div class=\"overlay-card\">\n\n<div\nclass=\"overlay-icon\"\nid=\"resultIcon\">\n🏆\n<\/div>\n\n<div\nclass=\"overlay-title\"\nid=\"resultTitle\">\nRESULTAAT\n<\/div>\n\n<div\nclass=\"overlay-score\"\nid=\"resultScore\">\n0\n<\/div>\n\n<div\nclass=\"overlay-text\"\nid=\"resultText\">\n<\/div>\n\n<div class=\"overlay-buttons\">\n\n<button\nclass=\"start-battle\"\nid=\"againBtn\">\n\n🔄 OPNIEUW\n\n<\/button>\n\n<button\nclass=\"overlay-home\"\nid=\"resultHomeBtn\">\n\n🏠 TERUG NAAR HOME\n\n<\/button>\n\n<\/div>\n\n<\/div>\n\n<\/div>\n\n\n<!-- =====================================================\n     WAITING\n===================================================== -->\n\n<div\nid=\"waitingOverlay\"\nclass=\"overlay hidden\">\n\n<div class=\"overlay-card\">\n\n<div class=\"overlay-icon\">\n🌐\n<\/div>\n\n<div class=\"overlay-title\">\nONLINE\n<\/div>\n\n<div\nclass=\"overlay-text\"\nid=\"waitingText\">\n\nWachten op de andere speler...\n\n<\/div>\n\n<button\nclass=\"overlay-home\"\nid=\"waitingHomeBtn\">\n\n🏠 HOME\n\n<\/button>\n\n<\/div>\n\n<\/div>\n\n\n<div\nclass=\"toast\"\nid=\"toast\">\n<\/div>\n\n\n<\/div>\n\n<\/div>\n\n\n<script>\n\n/* =========================================================\n   ELEMENTEN\n========================================================= */\n\nconst homeScreen =\ndocument.getElementById(\"homeScreen\");\n\nconst setupScreen =\ndocument.getElementById(\"setupScreen\");\n\nconst gameScreen =\ndocument.getElementById(\"gameScreen\");\n\nconst continueBtn =\ndocument.getElementById(\"continueBtn\");\n\nconst setupHomeBtn =\ndocument.getElementById(\"setupHomeBtn\");\n\nconst gameHomeBtn =\ndocument.getElementById(\"gameHomeBtn\");\n\nconst resultHomeBtn =\ndocument.getElementById(\"resultHomeBtn\");\n\nconst waitingHomeBtn =\ndocument.getElementById(\"waitingHomeBtn\");\n\nconst startBattleBtn =\ndocument.getElementById(\"startBattleBtn\");\n\nconst player1Setup =\ndocument.getElementById(\"player1Setup\");\n\nconst player2Setup =\ndocument.getElementById(\"player2Setup\");\n\nconst onlineBox =\ndocument.getElementById(\"onlineBox\");\n\nconst setupTitle =\ndocument.getElementById(\"setupTitle\");\n\nconst setupSubtitle =\ndocument.getElementById(\"setupSubtitle\");\n\nconst preview1 =\ndocument.getElementById(\"preview1\");\n\nconst preview2 =\ndocument.getElementById(\"preview2\");\n\nconst p1Boy =\ndocument.getElementById(\"p1Boy\");\n\nconst p1Girl =\ndocument.getElementById(\"p1Girl\");\n\nconst p2Boy =\ndocument.getElementById(\"p2Boy\");\n\nconst p2Girl =\ndocument.getElementById(\"p2Girl\");\n\nconst createTab =\ndocument.getElementById(\"createTab\");\n\nconst joinTab =\ndocument.getElementById(\"joinTab\");\n\nconst createPanel =\ndocument.getElementById(\"createPanel\");\n\nconst joinPanel =\ndocument.getElementById(\"joinPanel\");\n\nconst roomCode =\ndocument.getElementById(\"roomCode\");\n\nconst copyBtn =\ndocument.getElementById(\"copyBtn\");\n\nconst joinInput =\ndocument.getElementById(\"joinInput\");\n\nconst joinBtn =\ndocument.getElementById(\"joinBtn\");\n\nconst connectionStatus =\ndocument.getElementById(\"connectionStatus\");\n\nconst themeName =\ndocument.getElementById(\"themeName\");\n\nconst gameRound =\ndocument.getElementById(\"gameRound\");\n\nconst choices =\ndocument.getElementById(\"choices\");\n\nconst chooseTitle =\ndocument.getElementById(\"chooseTitle\");\n\nconst confirmBtn =\ndocument.getElementById(\"confirmBtn\");\n\nconst score1 =\ndocument.getElementById(\"score1\");\n\nconst score2 =\ndocument.getElementById(\"score2\");\n\nconst headerScore =\ndocument.getElementById(\"headerScore\");\n\nconst headerRound =\ndocument.getElementById(\"headerRound\");\n\nconst player1Title =\ndocument.getElementById(\"player1Title\");\n\nconst player2Title =\ndocument.getElementById(\"player2Title\");\n\nconst avatar1 =\ndocument.getElementById(\"avatar1\");\n\nconst avatar2 =\ndocument.getElementById(\"avatar2\");\n\nconst top1 =\ndocument.getElementById(\"top1\");\n\nconst bottom1 =\ndocument.getElementById(\"bottom1\");\n\nconst shoes1 =\ndocument.getElementById(\"shoes1\");\n\nconst name1 =\ndocument.getElementById(\"name1\");\n\nconst top2 =\ndocument.getElementById(\"top2\");\n\nconst bottom2 =\ndocument.getElementById(\"bottom2\");\n\nconst shoes2 =\ndocument.getElementById(\"shoes2\");\n\nconst name2 =\ndocument.getElementById(\"name2\");\n\nconst resultOverlay =\ndocument.getElementById(\"resultOverlay\");\n\nconst resultIcon =\ndocument.getElementById(\"resultIcon\");\n\nconst resultTitle =\ndocument.getElementById(\"resultTitle\");\n\nconst resultScore =\ndocument.getElementById(\"resultScore\");\n\nconst resultText =\ndocument.getElementById(\"resultText\");\n\nconst againBtn =\ndocument.getElementById(\"againBtn\");\n\nconst waitingOverlay =\ndocument.getElementById(\"waitingOverlay\");\n\nconst waitingText =\ndocument.getElementById(\"waitingText\");\n\nconst toast =\ndocument.getElementById(\"toast\");\n\n\n/* =========================================================\n   SPELLERS\n========================================================= */\n\nlet mode = \"computer\";\n\nlet p1Gender = \"boy\";\nlet p2Gender = \"girl\";\n\nlet round = 1;\n\nlet p1Score = 0;\nlet p2Score = 0;\n\nlet selectedIndex = null;\n\nlet currentOutfits = [];\n\nlet computerChoice = 0;\n\nlet localTurn = 1;\nlet localP1Choice = null;\n\nlet gameRunning = false;\n\n\n/* =========================================================\n   ONLINE\n========================================================= */\n\n/*\n   BELANGRIJK:\n\n   p1Gender en p2Gender worden NOOIT\n   naar de andere speler gestuurd.\n\n   Alleen de uiteindelijke outfit wordt\n   na de keuze gedeeld.\n*/\n\nlet peer = null;\nlet connection = null;\n\nlet onlineRole = null;\nlet onlineConnected = false;\n\nlet onlineReady = false;\n\nlet onlineMyChoice = null;\nlet onlineEnemyChoice = null;\n\nlet onlineHostResult = null;\n\n\n/* =========================================================\n   OUTFITS\n========================================================= */\n\nconst outfits = {\n\nboy:[\n{\n    name:\"Urban\",\n    top:\"👕\",\n    bottom:\"👖\",\n    shoes:\"👟\",\n    score:88\n},\n{\n    name:\"Cool Street\",\n    top:\"🧥\",\n    bottom:\"👖\",\n    shoes:\"👟\",\n    score:95\n},\n{\n    name:\"Smart\",\n    top:\"👔\",\n    bottom:\"👖\",\n    shoes:\"👞\",\n    score:93\n},\n{\n    name:\"Sporty\",\n    top:\"👕\",\n    bottom:\"🩳\",\n    shoes:\"👟\",\n    score:96\n}\n],\n\ngirl:[\n{\n    name:\"Glam\",\n    top:\"👗\",\n    bottom:\"👜\",\n    shoes:\"👠\",\n    score:98\n},\n{\n    name:\"Street Chic\",\n    top:\"👚\",\n    bottom:\"👖\",\n    shoes:\"👟\",\n    score:94\n},\n{\n    name:\"Summer\",\n    top:\"👗\",\n    bottom:\"👜\",\n    shoes:\"🩴\",\n    score:96\n},\n{\n    name:\"Party\",\n    top:\"👗\",\n    bottom:\"👜\",\n    shoes:\"👠\",\n    score:99\n}\n]\n\n};\n\n\n/* =========================================================\n   THEMES\n========================================================= */\n\nconst themes = [\n\"STREET STYLE\",\n\"PARTY\",\n\"SUMMER\",\n\"SPORTY\",\n\"WINTER\",\n\"RED CARPET\",\n\"SCHOOL\",\n\"FESTIVAL\"\n];\n\n\n/* =========================================================\n   HOME\n========================================================= */\n\ndocument\n.querySelectorAll(\".mode-card\")\n.forEach(card => {\n\n    card.addEventListener(\n        \"click\",\n        () => {\n\n            document\n            .querySelectorAll(\".mode-card\")\n            .forEach(c =>\n                c.classList.remove(\"selected\")\n            );\n\n            card.classList.add(\"selected\");\n\n            mode =\n            card.dataset.mode;\n\n        }\n    );\n\n});\n\n\ncontinueBtn.addEventListener(\n    \"click\",\n    showSetup\n);\n\n\nfunction showSetup(){\n\n    homeScreen.classList.add(\"hidden\");\n\n    setupScreen.classList.remove(\"hidden\");\n\n\n    player2Setup.classList.toggle(\n        \"hidden\",\n        mode === \"computer\" ||\n        mode === \"online\"\n    );\n\n\n    onlineBox.classList.toggle(\n        \"hidden\",\n        mode !== \"online\"\n    );\n\n\n    if(mode === \"computer\"){\n\n        setupTitle.textContent =\n        \"KIES JOUW STIJL\";\n\n        setupSubtitle.textContent =\n        \"Alleen jij kiest jouw kledingstijl.\";\n\n        startBattleBtn.disabled = false;\n\n    }\n\n\n    if(mode === \"local\"){\n\n        setupTitle.textContent =\n        \"KIES JULLIE STIJL\";\n\n        setupSubtitle.textContent =\n        \"Iedere speler kiest zijn eigen kledingstijl.\";\n\n        startBattleBtn.disabled = false;\n\n    }\n\n\n    if(mode === \"online\"){\n\n        setupTitle.textContent =\n        \"ONLINE STYLE BATTLE\";\n\n        setupSubtitle.textContent =\n        \"Jij ziet alleen jouw eigen kledingstijl.\";\n\n        setupOnline();\n\n    }\n\n\n    updatePreview();\n\n}\n\n\n/* =========================================================\n   GENDER\n========================================================= */\n\np1Boy.addEventListener(\n    \"click\",\n    () => {\n\n        p1Gender = \"boy\";\n\n        setGender(\n            p1Boy,\n            p1Girl\n        );\n\n        updatePreview();\n\n        /*\n           NIET naar andere speler sturen.\n        */\n\n    }\n);\n\n\np1Girl.addEventListener(\n    \"click\",\n    () => {\n\n        p1Gender = \"girl\";\n\n        setGender(\n            p1Girl,\n            p1Boy\n        );\n\n        updatePreview();\n\n    }\n);\n\n\np2Boy.addEventListener(\n    \"click\",\n    () => {\n\n        p2Gender = \"boy\";\n\n        setGender(\n            p2Boy,\n            p2Girl\n        );\n\n        updatePreview();\n\n    }\n);\n\n\np2Girl.addEventListener(\n    \"click\",\n    () => {\n\n        p2Gender = \"girl\";\n\n        setGender(\n            p2Girl,\n            p2Boy\n        );\n\n        updatePreview();\n\n    }\n);\n\n\nfunction setGender(\n    active,\n    inactive\n){\n\n    active.classList.add(\"active\");\n\n    inactive.classList.remove(\"active\");\n\n}\n\n\nfunction updatePreview(){\n\n    preview1.textContent =\n    p1Gender === \"boy\"\n    ? \"🧍‍♂️\"\n    : \"🧍‍♀️\";\n\n    preview2.textContent =\n    p2Gender === \"boy\"\n    ? \"🧍‍♂️\"\n    : \"🧍‍♀️\";\n\n    avatar1.textContent =\n    p1Gender === \"boy\"\n    ? \"🧍‍♂️\"\n    : \"🧍‍♀️\";\n\n    avatar2.textContent =\n    p2Gender === \"boy\"\n    ? \"🧍‍♂️\"\n    : \"🧍‍♀️\";\n\n}\n\n\n/* =========================================================\n   START\n========================================================= */\n\nstartBattleBtn.addEventListener(\n    \"click\",\n    startSelectedMode\n);\n\n\nfunction startSelectedMode(){\n\n    if(mode === \"computer\"){\n\n        startComputer();\n\n        return;\n\n    }\n\n\n    if(mode === \"local\"){\n\n        startLocal();\n\n        return;\n\n    }\n\n\n    if(mode === \"online\"){\n\n        if(!onlineConnected){\n\n            showToast(\n                \"Verbind eerst met een speler.\"\n            );\n\n            return;\n\n        }\n\n\n        /*\n           Alleen READY sturen.\n           NOOIT gender.\n        */\n\n        onlineReady = true;\n\n        connection.send({\n            type:\"ready\"\n        });\n\n\n        if(\n            onlineRole === \"guest\"\n        ){\n\n            showWaiting(\n                \"Je bent klaar! Wachten op speler 1...\"\n            );\n\n        }\n\n\n        if(\n            onlineRole === \"host\"\n        ){\n\n            connectionStatus.textContent =\n            \"Jij bent klaar. Wachten op speler 2...\";\n\n            checkOnlineStart();\n\n        }\n\n    }\n\n}\n\n\n/* =========================================================\n   COMPUTER\n========================================================= */\n\nfunction startComputer(){\n\n    round = 1;\n\n    p1Score = 0;\n    p2Score = 0;\n\n    gameRunning = true;\n\n    player1Title.textContent =\n    \"JOUW LOOK\";\n\n    player2Title.textContent =\n    \"COMPUTER\";\n\n    setupScreen.classList.add(\n        \"hidden\"\n    );\n\n    gameScreen.classList.remove(\n        \"hidden\"\n    );\n\n    updateScores();\n\n    startNormalRound();\n\n}\n\n\n/* =========================================================\n   LOCAL\n========================================================= */\n\nfunction startLocal(){\n\n    round = 1;\n\n    p1Score = 0;\n    p2Score = 0;\n\n    localTurn = 1;\n    localP1Choice = null;\n\n    gameRunning = true;\n\n    player1Title.textContent =\n    \"SPELER 1\";\n\n    player2Title.textContent =\n    \"SPELER 2\";\n\n    setupScreen.classList.add(\n        \"hidden\"\n    );\n\n    gameScreen.classList.remove(\n        \"hidden\"\n    );\n\n    updateScores();\n\n    startLocalRound();\n\n}\n\n\n/* =========================================================\n   NORMALE RONDE\n========================================================= */\n\nfunction startNormalRound(){\n\n    if(round > 8){\n\n        finishGame();\n\n        return;\n\n    }\n\n\n    selectedIndex = null;\n\n    currentOutfits =\n    outfits[p1Gender];\n\n    chooseTitle.textContent =\n    \"KIES JOUW OUTFIT\";\n\n    createChoices(\n        currentOutfits\n    );\n\n    resetDisplay();\n\n    themeName.textContent =\n    themes[round - 1];\n\n    gameRound.textContent =\n    round;\n\n    headerRound.textContent =\n    round;\n\n\n    createComputerLook();\n\n}\n\n\n/* =========================================================\n   LOCAL RONDE\n========================================================= */\n\nlet lsel=[null,null],ldone=[false,false];\nfunction startLocalRound(){\n    if(round > 8){ finishGame(); return; }\n    selectedIndex = null; localTurn = 1; lsel = [null,null]; ldone = [false,false];\n    resetDisplay();\n    themeName.textContent = themes[round - 1];\n    gameRound.textContent = round; headerRound.textContent = round;\n    chooseTitle.textContent = \"BEIDE SPELERS KIEZEN TEGELIJK 👥\";\n    choices.classList.add(\"duo\");\n    document.querySelector(\".confirm-row\").style.display = \"none\";\n    choices.innerHTML = \"\";\n    [1,2].forEach(p=>{\n        const list = outfits[p === 1 ? p1Gender : p2Gender];\n        const col = document.createElement(\"div\");\n        col.className = \"duo-col p\" + p;\n        col.innerHTML = `<div class=\"duo-h\">${p === 1 ? \"🧡\" : \"💙\"} SPELER ${p}<\/div>`;\n        list.forEach((item,index)=>{\n            const b = document.createElement(\"button\");\n            b.className = \"choice\";\n            b.innerHTML = `<div class=\"choice-icons\">${item.top}${item.bottom}<\/div><div class=\"choice-name\">${item.name}<\/div>`;\n            b.addEventListener(\"click\",()=>{\n                if(ldone[p-1]) return;\n                col.querySelectorAll(\".choice\").forEach(x=>x.classList.remove(\"selected\"));\n                b.classList.add(\"selected\"); lsel[p-1] = index; ok.disabled = false;\n            });\n            col.appendChild(b);\n        });\n        const ok = document.createElement(\"button\");\n        ok.className = \"duo-ok\"; ok.textContent = \"✅ KLAAR\"; ok.disabled = true;\n        ok.addEventListener(\"click\",()=>{\n            if(lsel[p-1] === null || ldone[p-1]) return;\n            ldone[p-1] = true; col.classList.add(\"done\"); ok.textContent = \"✅ KLAAR!\";\n            if(ldone[0] && ldone[1]){\n                localP1Choice = lsel[0]; selectedIndex = lsel[1]; localTurn = 2;\n                setTimeout(resolveLocal,350);\n            }\n            else showToast(\"Speler \" + p + \" is klaar! Wachten op speler \" + (p === 1 ? 2 : 1) + \"…\");\n        });\n        col.appendChild(ok); choices.appendChild(col);\n    });\n}\n/* =========================================================\n   COMPUTER LOOK\n========================================================= */\n\nfunction createComputerLook(){\n\n    const list =\n    outfits[p2Gender];\n\n    computerChoice =\n    Math.floor(\n        Math.random() * list.length\n    );\n\n    showOutfit(\n        2,\n        list[computerChoice]\n    );\n\n}\n\n\n/* =========================================================\n   CHOICES\n========================================================= */\n\nfunction createChoices(list){\n    choices.classList.remove(\"duo\");document.querySelector(\".confirm-row\").style.display=\"\";\n\n    choices.innerHTML =\n    \"\";\n\n    confirmBtn.disabled =\n    true;\n\n    list.forEach(\n        (item,index) => {\n\n            const button =\n            document.createElement(\n                \"button\"\n            );\n\n            button.className =\n            \"choice\";\n\n            button.innerHTML = `\n\n                <div class=\"choice-icons\">\n                    ${item.top}\n                    ${item.bottom}\n                <\/div>\n\n                <div class=\"choice-name\">\n                    ${item.name}\n                <\/div>\n\n            `;\n\n\n            button.addEventListener(\n                \"click\",\n                () => {\n\n                    document\n                    .querySelectorAll(\".choice\")\n                    .forEach(c =>\n                        c.classList.remove(\"selected\")\n                    );\n\n\n                    button.classList.add(\n                        \"selected\"\n                    );\n\n\n                    selectedIndex =\n                    index;\n\n\n                    if(\n                        mode === \"local\"\n                    ){\n\n                        showOutfit(\n                            localTurn === 1\n                            ? 1\n                            : 2,\n                            item\n                        );\n\n                    }\n\n                    else if(\n                        mode === \"online\"\n                    ){\n\n                        showOutfit(\n                            onlineRole === \"host\"\n                            ? 1\n                            : 2,\n                            item\n                        );\n\n                    }\n\n                    else{\n\n                        showOutfit(\n                            1,\n                            item\n                        );\n\n                    }\n\n\n                    confirmBtn.disabled =\n                    false;\n\n                }\n            );\n\n\n            choices.appendChild(\n                button\n            );\n\n        }\n    );\n\n}\n\n\n/* =========================================================\n   BEVESTIG\n========================================================= */\n\nconfirmBtn.addEventListener(\n    \"click\",\n    () => {\n\n        if(\n            selectedIndex === null ||\n            !gameRunning\n        ){\n\n            return;\n\n        }\n\n\n        if(mode === \"computer\"){\n\n            resolveComputer();\n\n        }\n        else if(mode === \"local\"){\n\n            resolveLocal();\n\n        }\n        else if(mode === \"online\"){\n\n            resolveOnlineChoice();\n\n        }\n\n    }\n);\n\n\n/* =========================================================\n   COMPUTER RESULT\n========================================================= */\n\nfunction resolveComputer(){\n\n    const player =\n    outfits[p1Gender][\n        selectedIndex\n    ];\n\n    const computer =\n    outfits[p2Gender][\n        computerChoice\n    ];\n\n\n    p1Score +=\n    player.score;\n\n    p2Score +=\n    computer.score;\n\n\n    updateScores();\n\n\n    showRoundResult(\n        player.score,\n        computer.score\n    );\n\n}\n\n\n/* =========================================================\n   LOCAL RESULT\n========================================================= */\n\nfunction resolveLocal(){\n\n    if(localTurn === 1){\n\n        localP1Choice =\n        selectedIndex;\n\n        localTurn = 2;\n\n        selectedIndex = null;\n\n        confirmBtn.disabled =\n        true;\n\n\n        showToast(\n            \"Speler 1 klaar! Geef het scherm door 👥\"\n        );\n\n\n        setTimeout(\n            startLocalRound,\n            600\n        );\n\n\n        return;\n\n    }\n\n\n    const player1 =\n    outfits[p1Gender][\n        localP1Choice\n    ];\n\n    const player2 =\n    outfits[p2Gender][\n        selectedIndex\n    ];\n\n\n    p1Score +=\n    player1.score;\n\n    p2Score +=\n    player2.score;\n\n\n    updateScores();\n\n\n    showOutfit(\n        1,\n        player1\n    );\n\n    showOutfit(\n        2,\n        player2\n    );\n\n\n    showRoundResult(\n        player1.score,\n        player2.score\n    );\n\n}\n\n\n/* =========================================================\n   ROUND RESULT\n========================================================= */\n\nfunction showRoundResult(\n    points1,\n    points2\n){\n\n    if(points1 > points2){\n\n        resultIcon.textContent =\n        \"👑\";\n\n        resultTitle.textContent =\n        \"SPELER 1 WINT!\";\n\n    }\n    else if(points2 > points1){\n\n        resultIcon.textContent =\n        \"🔥\";\n\n        resultTitle.textContent =\n        mode === \"computer\"\n        ? \"COMPUTER WINT!\"\n        : \"SPELER 2 WINT!\";\n\n    }\n    else{\n\n        resultIcon.textContent =\n        \"🤝\";\n\n        resultTitle.textContent =\n        \"GELIJKSPEL!\";\n\n    }\n\n\n    resultScore.textContent =\n    \"+\" +\n    points1;\n\n\n    resultText.textContent =\n    points1 +\n    \" - \" +\n    points2;\n\n\n    resultOverlay.classList.remove(\n        \"hidden\"\n    );\n\n\n    if(round >= 8){\n\n        setTimeout(\n            finishGame,\n            1100\n        );\n\n    }\n    else{\n\n        setTimeout(\n            () => {\n\n                resultOverlay.classList.add(\n                    \"hidden\"\n                );\n\n                round++;\n\n                localTurn = 1;\n\n                startNormalOrLocal();\n\n            },\n            1100\n        );\n\n    }\n\n}\n\n\n/* =========================================================\n   NORMALE / LOCAL VOLGENDE RONDE\n========================================================= */\n\nfunction startNormalOrLocal(){\n\n    if(mode === \"local\"){\n\n        startLocalRound();\n\n    }\n    else{\n\n        startNormalRound();\n\n    }\n\n}\n\n\n/* =========================================================\n   ONLINE SETUP\n========================================================= */\n\nfunction setupOnline(){\n\n    closeConnection();\n\n    onlineConnected =\n    false;\n\n    onlineReady =\n    false;\n\n    connectionStatus.textContent =\n    \"Kies een kamer of join een kamer.\";\n\n    startBattleBtn.disabled =\n    true;\n\n\n    createTab.classList.add(\n        \"active\"\n    );\n\n    joinTab.classList.remove(\n        \"active\"\n    );\n\n    createPanel.classList.remove(\n        \"hidden\"\n    );\n\n    joinPanel.classList.add(\n        \"hidden\"\n    );\n\n\n    createRoom();\n\n}\n\n\n/* =========================================================\n   ONLINE TABS\n========================================================= */\n\ncreateTab.addEventListener(\n    \"click\",\n    () => {\n\n        createTab.classList.add(\n            \"active\"\n        );\n\n        joinTab.classList.remove(\n            \"active\"\n        );\n\n        createPanel.classList.remove(\n            \"hidden\"\n        );\n\n        joinPanel.classList.add(\n            \"hidden\"\n        );\n\n        createRoom();\n\n    }\n);\n\n\njoinTab.addEventListener(\n    \"click\",\n    () => {\n\n        joinTab.classList.add(\n            \"active\"\n        );\n\n        createTab.classList.remove(\n            \"active\"\n        );\n\n        joinPanel.classList.remove(\n            \"hidden\"\n        );\n\n        createPanel.classList.add(\n            \"hidden\"\n        );\n\n        closeConnection();\n\n        connectionStatus.textContent =\n        \"Vul de kamer-code in.\";\n\n        startBattleBtn.disabled =\n        true;\n\n    }\n);\n\n\n/* =========================================================\n   ROOM MAKEN\n========================================================= */\n\nfunction createRoom(){\n\n    closeConnection();\n\n    const code =\n    randomCode();\n\n\n    roomCode.textContent =\n    code;\n\n\n    onlineRole =\n    \"host\";\n\n\n    connectionStatus.textContent =\n    \"Kamer wordt aangemaakt...\";\n\n\n    peer =\n    new Peer(\n        \"STYLE_BATTLE_\" +\n        code\n    );\n\n\n    peer.on(\n        \"open\",\n        () => {\n\n            connectionStatus.textContent =\n            \"Kamer klaar! Geef de code aan speler 2.\";\n\n        }\n    );\n\n\n    peer.on(\n        \"connection\",\n        newConnection => {\n\n            if(connection)\n                return;\n\n\n            connection =\n            newConnection;\n\n\n            connection.on(\n                \"open\",\n                () => {\n\n                    onlineConnected =\n                    true;\n\n                    onlineReady =\n                    false;\n\n\n                    connectionStatus.textContent =\n                    \"Speler 2 is verbonden! Kies jouw kledingstijl.\";\n\n                    /*\n                       GEEN GENDER VERSTUREN.\n                    */\n\n                }\n            );\n\n\n            connection.on(\n                \"data\",\n                handleOnlineData\n            );\n\n\n            connection.on(\n                \"close\",\n                () => {\n\n                    onlineConnected =\n                    false;\n\n                    gameRunning =\n                    false;\n\n                    showWaiting(\n                        \"De andere speler heeft de verbinding verbroken.\"\n                    );\n\n                }\n            );\n\n        }\n    );\n\n\n    peer.on(\n        \"error\",\n        () => {\n\n            connectionStatus.textContent =\n            \"Kamer kon niet worden aangemaakt.\";\n\n        }\n    );\n\n}\n\n\n/* =========================================================\n   JOIN ROOM\n========================================================= */\n\njoinBtn.addEventListener(\n    \"click\",\n    joinRoom\n);\n\n\nfunction joinRoom(){\n\n    const code =\n    joinInput.value\n    .trim()\n    .toUpperCase();\n\n\n    if(code.length !== 6){\n\n        showToast(\n            \"De code moet 6 tekens zijn.\"\n        );\n\n        return;\n\n    }\n\n\n    closeConnection();\n\n    onlineRole =\n    \"guest\";\n\n\n    connectionStatus.textContent =\n    \"Verbinden...\";\n\n\n    peer =\n    new Peer();\n\n\n    peer.on(\n        \"open\",\n        () => {\n\n            connection =\n            peer.connect(\n                \"STYLE_BATTLE_\" +\n                code,\n                {\n                    reliable:true\n                }\n            );\n\n\n            connection.on(\n                \"open\",\n                () => {\n\n                    onlineConnected =\n                    true;\n\n                    onlineReady =\n                    false;\n\n\n                    connectionStatus.textContent =\n                    \"Verbonden! Kies alleen jouw eigen kledingstijl.\";\n\n                    /*\n                       GEEN GENDER VERSTUREN.\n                    */\n\n                }\n            );\n\n\n            connection.on(\n                \"data\",\n                handleOnlineData\n            );\n\n\n            connection.on(\n                \"close\",\n                () => {\n\n                    onlineConnected =\n                    false;\n\n                    gameRunning =\n                    false;\n\n                    connectionStatus.textContent =\n                    \"Verbinding verbroken.\";\n\n                }\n            );\n\n        }\n    );\n\n\n    peer.on(\n        \"error\",\n        () => {\n\n            connectionStatus.textContent =\n            \"Kamer niet gevonden.\";\n\n        }\n    );\n\n}\n\n\n/* =========================================================\n   ONLINE DATA\n========================================================= */\n\nfunction handleOnlineData(data){\n\n    if(!data ||\n       !data.type){\n\n        return;\n\n    }\n\n\n    /* ANDERE SPELER IS KLAAR */\n\n    if(\n        data.type === \"ready\"\n    ){\n\n        onlineEnemyReady =\n        true;\n\n\n        if(\n            onlineRole === \"host\"\n        ){\n\n            checkOnlineStart();\n\n        }\n\n        return;\n\n    }\n\n\n    /* START */\n\n    if(\n        data.type === \"start\"\n    ){\n\n        startOnlineAsGuest();\n\n        return;\n\n    }\n\n\n    /* THEMA */\n\n    if(\n        data.type === \"theme\"\n    ){\n\n        startOnlineRound(\n            data.round\n        );\n\n        return;\n\n    }\n\n\n    /* KEUZE VAN ANDERE SPELER */\n\n    if(\n        data.type === \"choice\"\n    ){\n\n        onlineEnemyChoice =\n        data.outfit;\n\n        if(\n            onlineRole === \"host\"\n        ){\n\n            tryResolveOnline();\n\n        }\n\n        return;\n\n    }\n\n\n    /* RESULTAAT */\n\n    if(\n        data.type === \"result\"\n    ){\n\n        showOnlineResult(\n            data\n        );\n\n        return;\n\n    }\n\n\n    /* VOLGENDE RONDE */\n\n    if(\n        data.type === \"next\"\n    ){\n\n        round =\n        data.round;\n\n        resultOverlay.classList.add(\n            \"hidden\"\n        );\n\n        startOnlineRound(\n            round\n        );\n\n        return;\n\n    }\n\n}\n\n\n/* =========================================================\n   ONLINE READY\n========================================================= */\n\nlet onlineEnemyReady =\nfalse;\n\n\nfunction checkOnlineStart(){\n\n    if(\n        onlineRole !== \"host\" ||\n        !onlineConnected ||\n        !onlineReady ||\n        !onlineEnemyReady\n    ){\n\n        return;\n\n    }\n\n\n    round = 1;\n\n    p1Score = 0;\n    p2Score = 0;\n\n    gameRunning = true;\n\n\n    connection.send({\n        type:\"start\"\n    });\n\n\n    setupScreen.classList.add(\n        \"hidden\"\n    );\n\n    gameScreen.classList.remove(\n        \"hidden\"\n    );\n\n\n    player1Title.textContent =\n    \"JOUW LOOK\";\n\n    player2Title.textContent =\n    \"TEGENSTANDER\";\n\n\n    updateScores();\n\n\n    startOnlineRound(\n        1\n    );\n\n}\n\n\n/* =========================================================\n   ONLINE GUEST START\n========================================================= */\n\nfunction startOnlineAsGuest(){\n\n    round = 1;\n\n    p1Score = 0;\n    p2Score = 0;\n\n    gameRunning = true;\n\n\n    setupScreen.classList.add(\n        \"hidden\"\n    );\n\n    gameScreen.classList.remove(\n        \"hidden\"\n    );\n\n\n    player1Title.textContent =\n    \"TEGENSTANDER\";\n\n    player2Title.textContent =\n    \"JOUW LOOK\";\n\n\n    updateScores();\n\n\n    showWaiting(\n        \"Wachten op het eerste thema...\"\n    );\n\n}\n\n\n/* =========================================================\n   ONLINE RONDE\n========================================================= */\n\nfunction startOnlineRound(r){\n\n    if(r > 8){\n\n        finishGame();\n\n        return;\n\n    }\n\n\n    round =\n    r;\n\n\n    selectedIndex =\n    null;\n\n    onlineMyChoice =\n    null;\n\n    onlineEnemyChoice =\n    null;\n\n\n    confirmBtn.disabled =\n    true;\n\n\n    resetDisplay();\n\n\n    themeName.textContent =\n    themes[round - 1];\n\n    gameRound.textContent =\n    round;\n\n    headerRound.textContent =\n    round;\n\n\n    /*\n       Iedere speler gebruikt alleen\n       zijn eigen kledingstijl.\n    */\n\n    const myGender =\n    onlineRole === \"host\"\n    ? p1Gender\n    : p1Gender;\n\n\n    currentOutfits =\n    outfits[myGender];\n\n\n    chooseTitle.textContent =\n    \"KIES JOUW OUTFIT\";\n\n\n    gameStatusSafe(\n        \"Kies jouw outfit.\"\n    );\n\n\n    createChoices(\n        currentOutfits\n    );\n\n\n    waitingOverlay.classList.add(\n        \"hidden\"\n    );\n\n}\n\n\n/* =========================================================\n   ONLINE KEUZE\n========================================================= */\n\nfunction resolveOnlineChoice(){\n\n    const chosen =\n    currentOutfits[\n        selectedIndex\n    ];\n\n\n    onlineMyChoice =\n    chosen;\n\n\n    /*\n       Alleen de outfit wordt verstuurd.\n       Er wordt NIET verstuurd:\n       boy/girl\n    */\n\n    connection.send({\n\n        type:\"choice\",\n\n        outfit:chosen\n\n    });\n\n\n    confirmBtn.disabled =\n    true;\n\n\n    gameStatusSafe(\n        \"Jouw keuze is opgeslagen. Wachten...\"\n    );\n\n\n    if(\n        onlineRole === \"host\"\n    ){\n\n        tryResolveOnline();\n\n    }\n\n}\n\n\n/* =========================================================\n   ONLINE RESULTAAT BEREKENEN\n========================================================= */\n\nfunction tryResolveOnline(){\n\n    if(\n        onlineRole !== \"host\"\n    ){\n\n        return;\n\n    }\n\n\n    if(\n        !onlineMyChoice ||\n        !onlineEnemyChoice\n    ){\n\n        return;\n\n    }\n\n\n    const points1 =\n    onlineMyChoice.score;\n\n\n    const points2 =\n    onlineEnemyChoice.score;\n\n\n    p1Score +=\n    points1;\n\n    p2Score +=\n    points2;\n\n\n    const final =\n    round >= 8;\n\n\n    connection.send({\n\n        type:\"result\",\n\n        points1:points1,\n\n        points2:points2,\n\n        p1Score:p1Score,\n\n        p2Score:p2Score,\n\n        player1Outfit:\n        onlineMyChoice,\n\n        player2Outfit:\n        onlineEnemyChoice,\n\n        final:final\n\n    });\n\n\n    showOnlineResult({\n\n        points1:points1,\n\n        points2:points2,\n\n        p1Score:p1Score,\n\n        p2Score:p2Score,\n\n        player1Outfit:\n        onlineMyChoice,\n\n        player2Outfit:\n        onlineEnemyChoice,\n\n        final:final\n\n    });\n\n}\n\n\n/* =========================================================\n   ONLINE RESULT TONEN\n========================================================= */\n\nfunction showOnlineResult(data){\n\n    p1Score =\n    data.p1Score;\n\n    p2Score =\n    data.p2Score;\n\n\n    updateScores();\n\n\n    /*\n       Pas NU worden de outfits onthuld.\n    */\n\n    showOutfit(\n        1,\n        data.player1Outfit\n    );\n\n    showOutfit(\n        2,\n        data.player2Outfit\n    );\n\n\n    const myPoints =\n    onlineRole === \"host\"\n    ? data.points1\n    : data.points2;\n\n\n    const enemyPoints =\n    onlineRole === \"host\"\n    ? data.points2\n    : data.points1;\n\n\n    if(\n        myPoints > enemyPoints\n    ){\n\n        resultIcon.textContent =\n        \"🏆\";\n\n        resultTitle.textContent =\n        \"JIJ WINT!\";\n\n    }\n    else if(\n        myPoints < enemyPoints\n    ){\n\n        resultIcon.textContent =\n        \"🔥\";\n\n        resultTitle.textContent =\n        \"TEGENSTANDER WINT!\";\n\n    }\n    else{\n\n        resultIcon.textContent =\n        \"🤝\";\n\n        resultTitle.textContent =\n        \"GELIJKSPEL!\";\n\n    }\n\n\n    resultScore.textContent =\n    \"+\" + myPoints;\n\n\n    resultText.textContent =\n    data.points1 +\n    \" - \" +\n    data.points2;\n\n\n    waitingOverlay.classList.add(\n        \"hidden\"\n    );\n\n    resultOverlay.classList.remove(\n        \"hidden\"\n    );\n\n\n    if(data.final){\n\n        setTimeout(\n            finishGame,\n            1200\n        );\n\n    }\n    else{\n\n        setTimeout(\n            () => {\n\n                resultOverlay.classList.add(\n                    \"hidden\"\n                );\n\n\n                round++;\n\n\n                onlineMyChoice =\n                null;\n\n                onlineEnemyChoice =\n                null;\n\n\n                if(\n                    onlineRole === \"host\"\n                ){\n\n                    connection.send({\n\n                        type:\"next\",\n\n                        round:round\n\n                    });\n\n\n                    startOnlineRound(\n                        round\n                    );\n\n                }\n                else{\n\n                    showWaiting(\n                        \"Wachten op de volgende ronde...\"\n                    );\n\n                }\n\n            },\n            1200\n        );\n\n    }\n\n}\n\n\n/* =========================================================\n   OUTFIT TONEN\n========================================================= */\n\nfunction showOutfit(\n    player,\n    item\n){\n\n    if(!item)\n        return;\n\n\n    if(player === 1){\n\n        top1.textContent =\n        item.top;\n\n        bottom1.textContent =\n        item.bottom;\n\n        shoes1.textContent =\n        item.shoes;\n\n        name1.textContent =\n        item.name;\n\n    }\n    else{\n\n        top2.textContent =\n        item.top;\n\n        bottom2.textContent =\n        item.bottom;\n\n        shoes2.textContent =\n        item.shoes;\n\n        name2.textContent =\n        item.name;\n\n    }\n\n}\n\n\n/* =========================================================\n   RESET DISPLAY\n========================================================= */\n\nfunction resetDisplay(){\n\n    const one =\n    p1Gender === \"boy\"\n    ? [\"👕\",\"👖\",\"👟\"]\n    : [\"👚\",\"👗\",\"👠\"];\n\n\n    const two =\n    p2Gender === \"boy\"\n    ? [\"👕\",\"👖\",\"👟\"]\n    : [\"👚\",\"👗\",\"👠\"];\n\n\n    top1.textContent =\n    one[0];\n\n    bottom1.textContent =\n    one[1];\n\n    shoes1.textContent =\n    one[2];\n\n    name1.textContent =\n    \"Kies een outfit\";\n\n\n    top2.textContent =\n    two[0];\n\n    bottom2.textContent =\n    two[1];\n\n    shoes2.textContent =\n    two[2];\n\n    name2.textContent =\n    \"Wachten...\";\n\n}\n\n\n/* =========================================================\n   SCORE\n========================================================= */\n\nfunction updateScores(){\n\n    score1.textContent =\n    p1Score;\n\n    score2.textContent =\n    p2Score;\n\n\n    if(\n        mode === \"online\" &&\n        onlineRole === \"guest\"\n    ){\n\n        headerScore.textContent =\n        p2Score;\n\n    }\n    else{\n\n        headerScore.textContent =\n        p1Score;\n\n    }\n\n}\n\n\n/* =========================================================\n   EINDE\n========================================================= */\n\nfunction finishGame(){\n\n    gameRunning =\n    false;\n\n\n    waitingOverlay.classList.add(\n        \"hidden\"\n    );\n\n\n    let myScore =\n    p1Score;\n\n    let enemyScore =\n    p2Score;\n\n\n    if(\n        mode === \"online\" &&\n        onlineRole === \"guest\"\n    ){\n\n        myScore =\n        p2Score;\n\n        enemyScore =\n        p1Score;\n\n    }\n\n\n    resultScore.textContent =\n    myScore;\n\n\n    resultText.textContent =\n    p1Score +\n    \" - \" +\n    p2Score;\n\n\n    if(\n        myScore > enemyScore\n    ){\n\n        resultIcon.textContent =\n        \"🏆\";\n\n        resultTitle.textContent =\n        \"STYLE CHAMPION!\";\n\n    }\n    else if(\n        myScore < enemyScore\n    ){\n\n        resultIcon.textContent =\n        \"🔥\";\n\n        resultTitle.textContent =\n        \"GOEDE BATTLE!\";\n\n    }\n    else{\n\n        resultIcon.textContent =\n        \"🤝\";\n\n        resultTitle.textContent =\n        \"GELIJKSPEL!\";\n\n    }\n\n\n    resultOverlay.classList.remove(\n        \"hidden\"\n    );\n\n}\n\n\n/* =========================================================\n   OPNIEUW\n========================================================= */\n\nagainBtn.addEventListener(\n    \"click\",\n    () => {\n\n        resultOverlay.classList.add(\n            \"hidden\"\n        );\n\n\n        if(mode === \"computer\"){\n\n            startComputer();\n\n        }\n        else if(mode === \"local\"){\n\n            startLocal();\n\n        }\n        else{\n\n            if(\n                onlineRole === \"host\" &&\n                onlineConnected\n            ){\n\n                onlineReady =\n                true;\n\n                onlineEnemyReady =\n                true;\n\n                startOnlineRound(1);\n\n                connection.send({\n                    type:\"start\"\n                });\n\n            }\n            else{\n\n                showWaiting(\n                    \"Wachten tot speler 1 opnieuw start...\"\n                );\n\n            }\n\n        }\n\n    }\n);\n\n\n/* =========================================================\n   HOME\n========================================================= */\n\nsetupHomeBtn.addEventListener(\n    \"click\",\n    goHome\n);\n\ngameHomeBtn.addEventListener(\n    \"click\",\n    goHome\n);\n\nresultHomeBtn.addEventListener(\n    \"click\",\n    goHome\n);\n\nwaitingHomeBtn.addEventListener(\n    \"click\",\n    goHome\n);\n\n\nfunction goHome(){\n\n    gameRunning =\n    false;\n\n    resultOverlay.classList.add(\n        \"hidden\"\n    );\n\n    waitingOverlay.classList.add(\n        \"hidden\"\n    );\n\n    setupScreen.classList.add(\n        \"hidden\"\n    );\n\n    gameScreen.classList.add(\n        \"hidden\"\n    );\n\n    homeScreen.classList.remove(\n        \"hidden\"\n    );\n\n\n    round = 1;\n\n    p1Score = 0;\n    p2Score = 0;\n\n    selectedIndex =\n    null;\n\n    onlineReady =\n    false;\n\n    onlineEnemyReady =\n    false;\n\n    updateScores();\n\n    headerRound.textContent =\n    \"-\";\n\n    closeConnection();\n\n}\n\n\n/* =========================================================\n   WACHTEN\n========================================================= */\n\nfunction showWaiting(message){\n\n    waitingText.textContent =\n    message;\n\n    waitingOverlay.classList.remove(\n        \"hidden\"\n    );\n\n}\n\n\n/* =========================================================\n   RANDOM CODE\n========================================================= */\n\nfunction randomCode(){\n\n    const chars =\n    \"ABCDEFGHJKLMNPQRSTUVWXYZ23456789\";\n\n    let code = \"\";\n\n    for(\n        let i=0;\n        i<6;\n        i++\n    ){\n\n        code +=\n        chars[\n            Math.floor(\n                Math.random() *\n                chars.length\n            )\n        ];\n\n    }\n\n    return code;\n\n}\n\n\n/* =========================================================\n   COPY CODE\n========================================================= */\n\ncopyBtn.addEventListener(\n    \"click\",\n    async() => {\n\n        try{\n\n            await navigator.clipboard.writeText(\n                roomCode.textContent\n            );\n\n            showToast(\n                \"Kamer-code gekopieerd 📋\"\n            );\n\n        }\n        catch{\n\n            showToast(\n                \"Code: \" +\n                roomCode.textContent\n            );\n\n        }\n\n    }\n);\n\n\n/* =========================================================\n   VERBINDING SLUITEN\n========================================================= */\n\nfunction closeConnection(){\n\n    try{\n\n        if(connection){\n\n            connection.close();\n\n        }\n\n        if(peer){\n\n            peer.destroy();\n\n        }\n\n    }\n    catch(error){}\n\n\n    connection =\n    null;\n\n    peer =\n    null;\n\n    onlineConnected =\n    false;\n\n    onlineRole =\n    null;\n\n}\n\n\n/* =========================================================\n   STATUS\n========================================================= */\n\nfunction gameStatusSafe(message){\n\n    /*\n       We tonen geen genderinformatie.\n    */\n\n    const oldStatus =\n    document.getElementById(\n        \"gameStatus\"\n    );\n\n    if(oldStatus){\n\n        oldStatus.textContent =\n        message;\n\n    }\n\n}\n\n\n/* =========================================================\n   TOAST\n========================================================= */\n\nlet toastTimer =\nnull;\n\nfunction showToast(message){\n\n    toast.textContent =\n    message;\n\n    toast.classList.add(\n        \"show\"\n    );\n\n\n    clearTimeout(\n        toastTimer\n    );\n\n\n    toastTimer =\n    setTimeout(\n        () => {\n\n            toast.classList.remove(\n                \"show\"\n            );\n\n        },\n        2200\n    );\n\n}\n\n\n/* =========================================================\n   MOBIEL\n========================================================= */\n\ndocument.addEventListener(\n    \"touchmove\",\n    e => {\n\n        e.preventDefault();\n\n    },\n    {\n        passive:false\n    }\n);\n\n\n/* =========================================================\n   INIT\n========================================================= */\n\nupdatePreview();\n\nresetDisplay();\n\n<\/script>\n\n<\/body>\n<\/html>",
