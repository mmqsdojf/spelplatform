ction(k){return k in _m?_m[k]:null},setItem:function(k,v){_m[k]=String(v)},removeItem:function(k){delete _m[k]}}})}<\/script>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\">\n\n<title>STYLE BATTLE 🧡<\/title>\n\n<script src=\"https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js\"><\/script>\n\n<style>\n*{\n    box-sizing:border-box;\n    -webkit-tap-highlight-color:transparent;\n    user-select:none;\n}\n\nhtml,body{\n    margin:0;\n    width:100%;\n    height:100%;\n    overflow:hidden;\n    font-family:Arial,Helvetica,sans-serif;\n}\n\nbody{\n    background:\n        radial-gradient(circle at 12% 10%,#ffe1bd 0%,transparent 30%),\n        radial-gradient(circle at 88% 90%,#d75d12 0%,transparent 35%),\n        linear-gradient(135deg,#fff4e7,#ffd3aa,#e98032);\n    color:#5b2b0b;\n}\n\nbutton,input{\n    font-family:Arial,Helvetica,sans-serif;\n}\n\nbutton{\n    cursor:pointer;\n}\n\n.hidden{\n    display:none!important;\n}\n\n\n/* =========================\n   APP\n========================= */\n\n.app{\n    width:100%;\n    height:100%;\n    padding:8px;\n    display:flex;\n    justify-content:center;\n    align-items:center;\n}\n\n.game{\n    width:min(1150px,100%);\n    height:min(800px,100%);\n    position:relative;\n    overflow:hidden;\n    display:flex;\n    flex-direction:column;\n\n    background:#fffaf4;\n    border:3px solid #e19752;\n    border-radius:28px;\n\n    box-shadow:\n        0 20px 60px rgba(120,55,10,.24);\n}\n\n\n/* =========================\n   HEADER\n========================= */\n\n.header{\n    min-height:74px;\n    padding:10px 18px;\n\n    display:flex;\n    align-items:center;\n    justify-content:space-between;\n    gap:10px;\n\n    background:linear-gradient(\n        135deg,\n        #c4540c,\n        #ec8733\n    );\n\n    color:white;\n}\n\n.logo{\n    font-size:clamp(22px,4vw,35px);\n    font-weight:1000;\n}\n\n.logo span{\n    color:#ffe6cb;\n}\n\n.stats{\n    display:flex;\n    gap:7px;\n}\n\n.stat{\n    min-width:68px;\n    padding:6px 9px;\n    text-align:center;\n\n    border-radius:12px;\n\n    background:rgba(255,255,255,.13);\n    border:2px solid rgba(255,255,255,.2);\n}\n\n.stat small{\n    display:block;\n    font-size:8px;\n    opacity:.85;\n}\n\n.stat strong{\n    display:block;\n    font-size:18px;\n}\n\n\n/* =========================\n   SCREENS\n========================= */\n\n.screen{\n    flex:1;\n    min-height:0;\n    display:flex;\n    flex-direction:column;\n}\n\n\n/* =========================\n   HOME\n========================= */\n\n#homeScreen{\n    justify-content:center;\n    align-items:center;\n    text-align:center;\n    padding:18px;\n}\n\n.home-icon{\n    font-size:65px;\n}\n\n.home-title{\n    margin:0;\n    color:#ad4c0a;\n    font-size:clamp(40px,7vw,66px);\n    font-weight:1000;\n}\n\n.home-text{\n    max-width:700px;\n    margin:8px auto 17px;\n\n    color:#805632;\n    font-size:16px;\n    line-height:1.45;\n}\n\n.mode-grid{\n    width:min(850px,100%);\n    display:grid;\n    grid-template-columns:repeat(3,1fr);\n    gap:11px;\n    margin-bottom:15px;\n}\n\n.mode-card{\n    border:3px solid #e3a062;\n    border-radius:18px;\n    background:#ffe9d4;\n    color:#98470d;\n    padding:13px 8px;\n}\n\n.mode-card.selected{\n    background:#d56416;\n    border-color:#c0520b;\n    color:white;\n\n    box-shadow:\n        0 8px 20px rgba(194,81,10,.22);\n}\n\n.mode-icon{\n    font-size:34px;\n}\n\n.mode-name{\n    margin-top:5px;\n    font-size:15px;\n    font-weight:1000;\n}\n\n.mode-info{\n    margin-top:3px;\n    font-size:10px;\n    opacity:.8;\n}\n\n.orange-btn{\n    border:0;\n    border-radius:15px;\n    padding:14px 32px;\n\n    background:\n        linear-gradient(\n            135deg,\n            #c4540b,\n            #ef9144\n        );\n\n    color:white;\n    font-size:18px;\n    font-weight:1000;\n}\n\n\n/* =========================\n   SETUP\n========================= */\n\n#setupScreen{\n    padding:12px;\n    gap:8px;\n}\n\n.setup-head{\n    text-align:center;\n}\n\n.setup-title{\n    color:#aa4b0a;\n    font-size:clamp(24px,4vw,34px);\n    font-weight:1000;\n}\n\n.setup-subtitle{\n    margin-top:3px;\n    color:#845c3c;\n    font-size:13px;\n}\n\n.players{\n    flex:1;\n    min-height:0;\n\n    display:grid;\n    grid-template-columns:repeat(2,1fr);\n    gap:10px;\n}\n\n.setup-card{\n    min-height:0;\n    padding:11px;\n\n    background:#fff0df;\n    border:2px solid #e3a061;\n    border-radius:18px;\n\n    display:flex;\n    flex-direction:column;\n}\n\n.setup-card h2{\n    margin:0;\n    text-align:center;\n    color:#a74c0c;\n    font-size:18px;\n}\n\n.preview{\n    text-align:center;\n    font-size:50px;\n    margin:5px 0;\n}\n\n.gender-label{\n    margin-bottom:6px;\n    text-align:center;\n    color:#805a3a;\n    font-size:12px;\n    font-weight:900;\n}\n\n.gender-row{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:7px;\n}\n\n.gender-btn{\n    border:2px solid #dda064;\n    border-radius:12px;\n    background:#ffe5cb;\n    color:#93470d;\n\n    padding:10px 4px;\n    font-size:12px;\n    font-weight:1000;\n}\n\n.gender-btn.active{\n    background:#d26014;\n    border-color:#bf500b;\n    color:white;\n}\n\n.note{\n    margin-top:auto;\n    padding-top:8px;\n    text-align:center;\n    color:#8a684f;\n    font-size:10px;\n}\n\n\n/* =========================\n   ONLINE\n========================= */\n\n.online-box{\n    padding:10px;\n\n    border:2px solid #e3a061;\n    border-radius:16px;\n\n    background:#fff0df;\n}\n\n.online-tabs{\n    display:flex;\n    gap:7px;\n    margin-bottom:8px;\n}\n\n.online-tab{\n    flex:1;\n\n    border:2px solid #dc9d60;\n    border-radius:11px;\n\n    background:#ffe6cc;\n    color:#96470d;\n\n    padding:8px;\n    font-size:11px;\n    font-weight:1000;\n}\n\n.online-tab.active{\n    background:#cf5d13;\n    color:white;\n    border-color:#bd4e0a;\n}\n\n.room-code-box{\n    padding:9px;\n\n    text-align:center;\n\n    border-radius:12px;\n\n    background:#d26315;\n    color:white;\n\n    font-weight:1000;\n}\n\n.room-code{\n    display:block;\n    margin-top:2px;\n\n    font-size:27px;\n    letter-spacing:5px;\n}\n\n.online-row{\n    display:flex;\n    gap:7px;\n}\n\n.code-input{\n    flex:1;\n    min-width:0;\n\n    border:2px solid #dfa16b;\n    border-radius:11px;\n\n    background:#fffaf5;\n    color:#7b451f;\n\n    padding:9px;\n\n    font-size:15px;\n    font-weight:900;\n\n    text-transform:uppercase;\n    outline:none;\n}\n\n.small-btn{\n    border:2px solid #d79658;\n    border-radius:11px;\n\n    background:#ffe1c2;\n    color:#95470d;\n\n    padding:9px 13px;\n\n    font-size:11px;\n    font-weight:1000;\n}\n\n.connection-status{\n    min-height:17px;\n    margin-top:5px;\n\n    text-align:center;\n\n    color:#89664a;\n    font-size:11px;\n}\n\n\n/* =========================\n   SETUP BUTTONS\n========================= */\n\n.setup-actions{\n    display:flex;\n    justify-content:center;\n    gap:8px;\n}\n\n.back-btn{\n    border:2px solid #db995c;\n    border-radius:13px;\n\n    background:#ffe4ca;\n    color:#95480e;\n\n    padding:11px 22px;\n    font-size:12px;\n    font-weight:1000;\n}\n\n.start-battle{\n    border:0;\n    border-radius:13px;\n\n    background:#cc5c12;\n    color:white;\n\n    padding:12px 27px;\n\n    font-size:14px;\n    font-weight:1000;\n}\n\n.start-battle:disabled{\n    opacity:.45;\n    cursor:not-allowed;\n}\n\n\n/* =========================\n   GAME\n========================= */\n\n#gameScreen{\n    padding:9px;\n    gap:7px;\n}\n\n.game-top{\n    display:grid;\n\n    grid-template-columns:auto 1fr auto;\n\n    align-items:center;\n\n    gap:9px;\n}\n\n.theme{\n    color:#a94b0a;\n    font-size:16px;\n    font-weight:1000;\n}\n\n.round{\n    text-align:center;\n    color:#805b3c;\n    font-size:12px;\n    font-weight:900;\n}\n\n.game-button{\n    border:2px solid #da9658;\n    background:#ffe4ca;\n    color:#93460d;\n\n    padding:6px 8px;\n    border-radius:10px;\n\n    font-size:10px;\n    font-weight:1000;\n}\n\n\n/* =========================\n   BATTLE\n========================= */\n\n.battle{\n    flex:1;\n    min-height:0;\n\n    display:grid;\n    grid-template-columns:1fr 75px 1fr;\n\n    gap:7px;\n}\n\n.player-panel{\n    min-height:0;\n\n    padding:8px;\n\n    background:#fff0df;\n    border:2px solid #e3a060;\n    border-radius:17px;\n\n    display:flex;\n    flex-direction:column;\n}\n\n.player-title{\n    text-align:center;\n    color:#a64b0b;\n\n    font-size:14px;\n    font-weight:1000;\n}\n\n.player-score{\n    text-align:center;\n    color:#d26618;\n\n    font-size:23px;\n    font-weight:1000;\n\n    margin:1px 0 4px;\n}\n\n.avatar{\n    width:67px;\n    height:67px;\n\n    margin:0 auto;\n\n    border-radius:50%;\n\n    background:#ffd8b3;\n    border:3px solid #e38839;\n\n    display:flex;\n    align-items:center;\n    justify-content:center;\n\n    font-size:38px;\n}\n\n.outfit-display{\n    flex:1;\n    min-height:0;\n\n    display:flex;\n    flex-direction:column;\n\n    align-items:center;\n    justify-content:center;\n}\n\n.outfit-top{\n    font-size:48px;\n    line-height:1;\n}\n\n.outfit-bottom{\n    font-size:29px;\n    line-height:1;\n}\n\n.outfit-shoes{\n    font-size:24px;\n    line-height:1;\n}\n\n.outfit-name{\n    min-height:16px;\n\n    margin-top:4px;\n\n    text-align:center;\n\n    color:#7d593e;\n    font-size:11px;\n    font-weight:900;\n}\n\n.vs{\n    display:flex;\n    align-items:center;\n    justify-content:center;\n}\n\n.vs-circle{\n    width:58px;\n    height:58px;\n\n    border-radius:50%;\n\n    background:\n        linear-gradient(\n            135deg,\n            #c8560d,\n            #ec9143\n        );\n\n    color:white;\n\n    display:flex;\n    align-items:center;\n    justify-content:center;\n\n    font-size:18px;\n    font-weight:1000;\n}\n\n\n/* =========================\n   CHOICES\n========================= */\n\n.choose-title{\n    min-height:17px;\n\n    text-align:center;\n\n    color:#a74b0b;\n    font-size:15px;\n    font-weight:1000;\n}\n\n.choices{\n    display:grid;\n    grid-template-columns:repeat(4,1fr);\n    gap:6px;\n}\n\n.choice{\n    border:2px solid #dfa064;\n    border-radius:12px;\n\n    background:#ffe6cc;\n    color:#93460d;\n\n    padding:6px 3px;\n}\n\n.choice.selected{\n    background:#ffd09f;\n    border-color:#c6530b;\n\n    box-shadow:\n        0 0 0 3px\n        rgba(198,83,11,.12);\n}\n\n.choice-icons{\n    font-size:25px;\n    white-space:nowrap;\n}\n\n.choice-name{\n    margin-top:3px;\n    font-size:8px;\n    font-weight:1000;\n}\n\n.confirm-row{\n    display:flex;\n    justify-content:center;\n}\n\n.confirm-btn{\n    border:0;\n    border-radius:12px;\n\n    background:#cd5d12;\n    color:white;\n\n    padding:9px 22px;\n\n    font-size:13px;\n    font-weight:1000;\n}\n\n.confirm-btn:disabled{\n    opacity:.45;\n}\n\n\n/* =========================\n   OVERLAYS\n========================= */\n\n.overlay{\n    position:absolute;\n    inset:0;\n    z-index:50;\n\n    display:flex;\n    align-items:center;\n    justify-content:center;\n\n    padding:20px;\n\n    background:rgba(103,46,7,.65);\n    backdrop-filter:blur(4px);\n}\n\n.overlay-card{\n    width:min(430px,92%);\n\n    padding:24px;\n\n    border:3px solid #e29a59;\n    border-radius:22px;\n\n    background:#fff9f2;\n\n    text-align:center;\n\n    box-shadow:\n        0 20px 50px rgba(0,0,0,.2);\n}\n\n.overlay-icon{\n    font-size:55px;\n}\n\n.overlay-title{\n    margin:4px 0 8px;\n\n    color:#ac4d0b;\n\n    font-size:29px;\n    font-weight:1000;\n}\n\n.overlay-score{\n    color:#d56519;\n\n    font-size:52px;\n    font-weight:1000;\n}\n\n.overlay-text{\n    color:#7c5a40;\n\n    font-size:14px;\n    line-height:1.4;\n\n    margin-bottom:18px;\n}\n\n.overlay-buttons{\n    display:flex;\n    flex-direction:column;\n\n    align-items:center;\n\n    gap:8px;\n}\n\n.overlay-home{\n    border:2px solid #db995c;\n    border-radius:13px;\n\n    background:#ffe4ca;\n    color:#95480e;\n\n    padding:11px 26px;\n\n    font-size:13px;\n    font-weight:1000;\n}\n\n\n/* =========================\n   TOAST\n========================= */\n\n.toast{\n    position:absolute;\n\n    left:50%;\n    bottom:16px;\n\n    z-index:100;\n\n    transform:\n        translate(-50%,25px);\n\n    opacity:0;\n\n    pointer-events:none;\n\n    background:#c9570f;\n    color:white;\n\n    padding:9px 16px;\n\n    border-radius:12px;\n\n    font-size:12px;\n    font-weight:1000;\n\n    transition:.2s;\n}\n\n.toast.show{\n    opacity:1;\n\n    transform:\n        translate(-50%,0);\n}\n\n\n/* =========================\n   MOBILE\n========================= */\n\n@media(max-width:700px){\n\n    .app{\n        padding:4px;\n    }\n\n    .game{\n        border-radius:19px;\n    }\n\n    .header{\n        min-height:59px;\n        padding:7px 10px;\n    }\n\n    .logo{\n        font-size:19px;\n    }\n\n    .stats{\n        gap:4px;\n    }\n\n    .stat{\n        min-width:45px;\n        padding:4px 5px;\n    }\n\n    .stat small{\n        font-size:7px;\n    }\n\n    .stat strong{\n        font-size:14px;\n    }\n\n    #homeScreen{\n        padding:11px;\n    }\n\n    .home-icon{\n        font-size:47px;\n    }\n\n    .home-text{\n        font-size:13px;\n        margin:5px auto 11px;\n    }\n\n    .mode-grid{\n        gap:5px;\n        margin-bottom:11px;\n    }\n\n    .mode-card{\n        padding:8px 3px;\n        border-radius:14px;\n    }\n\n    .mode-icon{\n        font-size:27px;\n    }\n\n    .mode-name{\n        font-size:11px;\n    }\n\n    .mode-info{\n        font-size:8px;\n    }\n\n    .orange-btn{\n        padding:12px 25px;\n        font-size:15px;\n    }\n\n    #setupScreen{\n        padding:7px;\n        gap:5px;\n    }\n\n    .setup-title{\n        font-size:22px;\n    }\n\n    .setup-subtitle{\n        font-size:10px;\n    }\n\n    .players{\n        gap:5px;\n    }\n\n    .setup-card{\n        padding:7px;\n        border-radius:13px;\n    }\n\n    .setup-card h2{\n        font-size:13px;\n    }\n\n    .preview{\n        font-size:38px;\n    }\n\n    .gender-label{\n        font-size:9px;\n    }\n\n    .gender-btn{\n        padding:8px 2px;\n        font-size:9px;\n    }\n\n    .note{\n        font-size:8px;\n    }\n\n    .room-code{\n        font-size:22px;\n    }\n\n    .code-input{\n        font-size:13px;\n    }\n\n    #gameScreen{\n        padding:7px;\n        gap:5px;\n    }\n\n    .game-top{\n        gap:5px;\n    }\n\n    .theme{\n        font-size:11px;\n    }\n\n    .round{\n        font-size:9px;\n    }\n\n    .game-button{\n        padding:5px 6px;\n        font-size:8px;\n    }\n\n    .battle{\n        grid-template-columns:1fr 40px 1fr;\n        gap:4px;\n    }\n\n    .player-panel{\n        padding:6px;\n        border-radius:13px;\n    }\n\n    .player-title{\n        font-size:10px;\n    }\n\n    .player-score{\n        font-size:17px;\n    }\n\n    .avatar{\n        width:53px;\n        height:53px;\n        font-size:30px;\n    }\n\n    .outfit-top{\n        font-size:36px;\n    }\n\n    .outfit-bottom{\n        font-size:22px;\n    }\n\n    .outfit-shoes{\n        font-size:18px;\n    }\n\n    .outfit-name{\n        font-size:8px;\n    }\n\n    .vs-circle{\n        width:40px;\n        height:40px;\n        font-size:11px;\n    }\n\n    .choose-title{\n        font-size:11px;\n    }\n\n    .choices{\n        gap:3px;\n    }\n\n    .choice{\n        padding:4px 2px;\n        border-radius:9px;\n    }\n\n    .choice-icons{\n        font-size:21px;\n    }\n\n    .choice-name{\n        font-size:7px;\n    }\n\n    .confirm-btn{\n        padding:8px 18px;\n        font-size:11px;\n    }\n}\n\n<\/style>\n<\/head>\n\n<body>\n\n<div class=\"app\">\n\n<div class=\"game\">\n\n\n<\u0021-- HEADER -->\n\n<div class=\"header\">\n\n<div class=\"logo\">\nSTYLE <span>BATTLE 🧡<\/span>\n<\/div>\n\n<div class=\"stats\">\n\n<div class=\"stat\">\n<small>SCORE<\/small>\n<strong id=\"headerScore\">0<\/strong>\n<\/div>\n\n<div class=\"stat\">\n<small>RONDE<\/small>\n<strong id=\"headerRound\">-<\/strong>\n<\/div>\n\n<\/div>\n\n<\/div>\n\n\n<\u0021-- =====================================================\n     HOME\n===================================================== -->\n\n<div\nid=\"homeScreen\"\nclass=\"screen\">\n\n<div class=\"home-icon\">\n👗\n<\/div>\n\n<h1 class=\"home-title\">\nSTYLE BATTLE\n<\/h1>\n\n<p class=\"home-text\">\nMaak de beste outfit en versla je tegenstander!\n<\/p>\n\n\n<div class=\"mode-grid\">\n\n<button\nclass=\"mode-card selected\"\ndata-mode=\"computer\">\n\n<div class=\"mode-icon\">\n🤖\n<\/div>\n\n<div class=\"mode-name\">\nCOMPUTER\n<\/div>\n\n<div class=\"mode-info\">\nSpeel tegen de computer\n<\/div>\n\n<\/button>\n\n\n<button\nclass=\"mode-card\"\ndata-mode=\"local\">\n\n<div class=\"mode-icon\">\n👥\n<\/div>\n\n<div class=\"mode-name\">\nMULTIPLAYER\n<\/div>\n\n<div class=\"mode-info\">\nTwee spelers op één scherm\n<\/div>\n\n<\/button>\n\n\n<button\nclass=\"mode-card\"\ndata-mode=\"online\">\n\n<div class=\"mode-icon\">\n🌐\n<\/div>\n\n<div class=\"mode-name\">\nONLINE\n<\/div>\n\n<div class=\"mode-info\">\nTwee verschillende toestellen\n<\/div>\n\n<\/button>\n\n<\/div>\n\n\n<button\nclass=\"orange-btn\"\nid=\"continueBtn\">\n\nDOORGAAN ➜\n\n<\/button>\n\n<\/div>\n\n\n<\u0021-- =====================================================\n     SETUP\n===================================================== -->\n\n<div\nid=\"setupScreen\"\nclass=\"screen hidden\">\n\n<div class=\"setup-head\">\n\n<div\nclass=\"setup-title\"\nid=\"setupTitle\">\n\nKIES JE STIJL\n\n<\/div>\n\n<div\nclass=\"setup-subtitle\"\nid=\"setupSubtitle\">\n\nKies jouw kledingstijl.\n\n<\/div>\n\n<\/div>\n\n\n<div class=\"players\">\n\n\n<\u0021-- SPELER 1 -->\n\n<div\nclass=\"setup-card\"\nid=\"player1Setup\">\n\n<h2>\n🧡 SPELER 1\n<\/h2>\n\n<div\nclass=\"preview\"\nid=\"preview1\">\n\n🧍‍♂️\n\n<\/div>\n\n<div class=\"gender-label\">\nKLEDINGSTIJL\n<\/div>\n\n<div class=\"gender-row\">\n\n<button\nclass=\"gender-btn active\"\nid=\"p1Boy\">\n\n👦 JONGENS\n\n<\/button>\n\n<button\nclass=\"gender-btn\"\nid=\"p1Girl\">\n\n👧 MEISJES\n\n<\/button>\n\n<\/div>\n\n<div class=\"note\">\nAlleen jij kiest jouw kledingstijl.\n<\/div>\n\n<\/div>\n\n\n<\u0021-- SPELER 2 -->\n\n<div\nclass=\"setup-card hidden\"\nid=\"player2Setup\">\n\n<h2>\n🧡 SPELER 2\n<\/h2>\n\n<div\nclass=\"preview\"\nid=\"preview2\">\n\n🧍‍♀️\n\n<\/div>\n\n<div class=\"gender-label\">\nKLEDINGSTIJL\n<\/div>\n\n<div class=\"gender-row\">\n\n<button\nclass=\"gender-btn\"\nid=\"p2Boy\">\n\n👦 JONGENS\n\n<\/button>\n\n<button\nclass=\"gender-btn active\"\nid=\"p2Girl\">\n\n👧 MEISJES\n\n<\/button>\n\n<\/div>\n\n<div class=\"note\">\nSpeler 2 kiest alleen voor zichzelf.\n<\/div>\n\n<\/div>\n\n\n<\/div>\n\n\n<\u0021-- ONLINE ROOM -->\n\n<div\nclass=\"online-box hidden\"\nid=\"onlineBox\">\n\n<div class=\"online-tabs\">\n\n<button\nclass=\"online-tab active\"\nid=\"createTab\">\n\n🏠 KAMER MAKEN\n\n<\/button>\n\n<button\nclass=\"online-tab\"\nid=\"joinTab\">\n\n🔑 JOINEN\n\n<\/button>\n\n<\/div>\n\n\n<\u0021-- ROOM MAKEN -->\n\n<div id=\"createPanel\">\n\n<div class=\"room-code-box\">\n\nJOUW KAMER-CODE\n\n<span\nclass=\"room-code\"\nid=\"roomCode\">\n\n------\n\n<\/span>\n\n<\/div>\n\n<div\nstyle=\"\ndisplay:flex;\njustify-content:center;\nmargin-top:6px;\n\">\n\n<button\nclass=\"small-btn\"\nid=\"copyBtn\">\n\n📋 KOPIËREN\n\n<\/button>\n\n<\/div>\n\n<\/div>\n\n\n<\u0021-- ROOM JOINEN -->\n\n<div\nid=\"joinPanel\"\nclass=\"hidden\">\n\n<div class=\"online-row\">\n\n<input\nid=\"joinInput\"\nclass=\"code-input\"\nmaxlength=\"6\"\nplaceholder=\"KAMER-CODE\"\nautocomplete=\"off\">\n\n<button\nclass=\"small-btn\"\nid=\"joinBtn\">\n\nJOINEN\n\n<\/button>\n\n<\/div>\n\n<\/div>\n\n\n<div\nclass=\"connection-status\"\nid=\"connectionStatus\">\n\nKlaar om een kamer te maken.\n\n<\/div>\n\n<\/div>\n\n\n<div class=\"setup-actions\">\n\n<button\nclass=\"back-btn\"\nid=\"setupHomeBtn\">\n\n🏠 HOME\n\n<\/button>\n\n<button\nclass=\"start-battle\"\nid=\"startBattleBtn\">\n\nSTART BATTLE 🔥\n\n<\/button>\n\n<\/div>\n\n<\/div>\n\n\n<\u0021-- =====================================================\n     GAME\n===================================================== -->\n\n<div\nid=\"gameScreen\"\nclass=\"screen hidden\">\n\n<div class=\"game-top\">\n\n<div class=\"theme\">\n\nTHEMA:\n<span id=\"themeName\">\n---\n<\/span>\n\n<\/div>\n\n<div class=\"round\">\n\nRONDE\n<span id=\"gameRound\">\n1\n<\/span>/8\n\n<\/div>\n\n<button\nclass=\"game-button\"\nid=\"gameHomeBtn\">\n\n🏠 HOME\n\n<\/button>\n\n<\/div>\n\n\n<div class=\"battle\">\n\n\n<\u0021-- PLAYER 1 PANEL -->\n\n<div class=\"player-panel\">\n\n<div\nclass=\"player-title\"\nid=\"player1Title\">\n\nJOUW LOOK\n\n<\/div>\n\n<div class=\"player-score\">\n\n<span id=\"score1\">\n0\n<\/span>\n\n<\/div>\n\n<div\nclass=\"avatar\"\nid=\"avatar1\">\n\n🧍‍♂️\n\n<\/div>\n\n<div class=\"outfit-display\">\n\n<div\nclass=\"outfit-top\"\nid=\"top1\">\n👕\n<\/div>\n\n<div\nclass=\"outfit-bottom\"\nid=\"bottom1\">\n👖\n<\/div>\n\n<div\nclass=\"outfit-shoes\"\nid=\"shoes1\">\n👟\n<\/div>\n\n<div\nclass=\"outfit-name\"\nid=\"name1\">\n\nKies een outfit\n\n<\/div>\n\n<\/div>\n\n<\/div>\n\n\n<\u0021-- VS -->\n\n<div class=\"vs\">\n\n<div class=\"vs-circle\">\nVS\n<\/div>\n\n<\/div>\n\n\n<\u0021-- PLAYER 2 PANEL -->\n\n<div class=\"player-panel\">\n\n<div\nclass=\"player-title\"\nid=\"player2Title\">\n\nTEGENSTANDER\n\n<\/div>\n\n<div class=\"player-score\">\n\n<span id=\"score2\">\n0\n<\/span>\n\n<\/div>\n\n<div\nclass=\"avatar\"\nid=\"avatar2\">\n\n🧍‍♀️\n\n<\/div>\n\n<div class=\"outfit-display\">\n\n<div\nclass=\"outfit-top\"\nid=\"top2\">\n👚\n<\/div>\n\n<div\nclass=\"outfit-bottom\"\nid=\"bottom2\">\n👗\n<\/div>\n\n<div\nclass=\"outfit-shoes\"\nid=\"shoes2\">\n👠\n<\/div>\n\n<div\nclass=\"outfit-name\"\nid=\"name2\">\n\nWachten...\n\n<\/div>\n\n<\/div>\n\n<\/div>\n\n<\/div>\n\n\n<div\nclass=\"choose-title\"\nid=\"chooseTitle\">\n\nKIES JE OUTFIT\n\n<\/div>\n\n\n<div\nclass=\"choices\"\nid=\"choices\">\n<\/div>\n\n\n<div class=\"confirm-row\">\n\n<button\nclass=\"confirm-btn\"\nid=\"confirmBtn\"\ndisabled>\n\n✅ BEVESTIG LOOK\n\n<\/button>\n\n<\/div>\n\n<\/div>\n\n\n<\u0021-- =====================================================\n     RESULT\n===================================================== -->\n\n<div\nid=\"resultOverlay\"\nclass=\"overlay hidden\">\n\n<div class=\"overlay-card\">\n\n<div\nclass=\"overlay-icon\"\nid=\"resultIcon\">\n🏆\n<\/div>\n\n<div\nclass=\"overlay-title\"\nid=\"resultTitle\">\nRESULTAAT\n<\/div>\n\n<div\nclass=\"overlay-score\"\nid=\"resultScore\">\n0\n<\/div>\n\n<div\nclass=\"overlay-text\"\nid=\"resultText\">\n<\/div>\n\n<div class=\"overlay-buttons\">\n\n<button\nclass=\"start-battle\"\nid=\"againBtn\">\n\n🔄 OPNIEUW\n\n<\/button>\n\n<button\nclass=\"overlay-home\"\nid=\"resultHomeBtn\">\n\n🏠 TERUG NAAR HOME\n\n<\/button>\n\n<\/div>\n\n<\/div>\n\n<\/div>\n\n\n<\u0021-- =====================================================\n     WAITING\n===================================================== -->\n\n<div\nid=\"waitingOverlay\"\nclass=\"overlay hidden\">\n\n<div class=\"overlay-card\">\n\n<div class=\"overlay-icon\">\n🌐\n<\/div>\n\n<div class=\"overlay-title\">\nONLINE\n<\/div>\n\n<div\nclass=\"overlay-text\"\nid=\"waitingText\">\n\nWachten op de andere speler...\n\n<\/div>\n\n<button\nclass=\"overlay-home\"\nid=\"waitingHomeBtn\">\n\n🏠 HOME\n\n<\/button>\n\n<\/div>\n\n<\/div>\n\n\n<div\nclass=\"toast\"\nid=\"toast\">\n<\/div>\n\n\n<\/div>\n\n<\/div>\n\n\n<script>\n\n/* =========================================================\n   ELEMENTEN\n========================================================= */\n\nconst homeScreen =\ndocument.getElementById(\"homeScreen\");\n\nconst setupScreen =\ndocument.getElementById(\"setupScreen\");\n\nconst gameScreen =\ndocument.getElementById(\"gameScreen\");\n\nconst continueBtn =\ndocument.getElementById(\"continueBtn\");\n\nconst setupHomeBtn =\ndocument.getElementById(\"setupHomeBtn\");\n\nconst gameHomeBtn =\ndocument.getElementById(\"gameHomeBtn\");\n\nconst resultHomeBtn =\ndocument.getElementById(\"resultHomeBtn\");\n\nconst waitingHomeBtn =\ndocument.getElementById(\"waitingHomeBtn\");\n\nconst startBattleBtn =\ndocument.getElementById(\"startBattleBtn\");\n\nconst player1Setup =\ndocument.getElementById(\"player1Setup\");\n\nconst player2Setup =\ndocument.getElementById(\"player2Setup\");\n\nconst onlineBox =\ndocument.getElementById(\"onlineBox\");\n\nconst setupTitle =\ndocument.getElementById(\"setupTitle\");\n\nconst setupSubtitle =\ndocument.getElementById(\"setupSubtitle\");\n\nconst preview1 =\ndocument.getElementById(\"preview1\");\n\nconst preview2 =\ndocument.getElementById(\"preview2\");\n\nconst p1Boy =\ndocument.getElementById(\"p1Boy\");\n\nconst p1Girl =\ndocument.getElementById(\"p1Girl\");\n\nconst p2Boy =\ndocument.getElementById(\"p2Boy\");\n\nconst p2Girl =\ndocument.getElementById(\"p2Girl\");\n\nconst createTab =\ndocument.getElementById(\"createTab\");\n\nconst joinTab =\ndocument.getElementById(\"joinTab\");\n\nconst createPanel =\ndocument.getElementById(\"createPanel\");\n\nconst joinPanel =\ndocument.getElementById(\"joinPanel\");\n\nconst roomCode =\ndocument.getElementById(\"roomCode\");\n\nconst copyBtn =\ndocument.getElementById(\"copyBtn\");\n\nconst joinInput =\ndocument.getElementById(\"joinInput\");\n\nconst joinBtn =\ndocument.getElementById(\"joinBtn\");\n\nconst connectionStatus =\ndocument.getElementById(\"connectionStatus\");\n\nconst themeName =\ndocument.getElementById(\"themeName\");\n\nconst gameRound =\ndocument.getElementById(\"gameRound\");\n\nconst choices =\ndocument.getElementById(\"choices\");\n\nconst chooseTitle =\ndocument.getElementById(\"chooseTitle\");\n\nconst confirmBtn =\ndocument.getElementById(\"confirmBtn\");\n\nconst score1 =\ndocument.getElementById(\"score1\");\n\nconst score2 =\ndocument.getElementById(\"score2\");\n\nconst headerScore =\ndocument.getElementById(\"headerScore\");\n\nconst headerRound =\ndocument.getElementById(\"headerRound\");\n\nconst player1Title =\ndocument.getElementById(\"player1Title\");\n\nconst player2Title =\ndocument.getElementById(\"player2Title\");\n\nconst avatar1 =\ndocument.getElementById(\"avatar1\");\n\nconst avatar2 =\ndocument.getElementById(\"avatar2\");\n\nconst top1 =\ndocument.getElementById(\"top1\");\n\nconst bottom1 =\ndocument.getElementById(\"bottom1\");\n\nconst shoes1 =\ndocument.getElementById(\"shoes1\");\n\nconst name1 =\ndocument.getElementById(\"name1\");\n\nconst top2 =\ndocument.getElementById(\"top2\");\n\nconst bottom2 =\ndocument.getElementById(\"bottom2\");\n\nconst shoes2 =\ndocument.getElementById(\"shoes2\");\n\nconst name2 =\ndocument.getElementById(\"name2\");\n\nconst resultOverlay =\ndocument.getElementById(\"resultOverlay\");\n\nconst resultIcon =\ndocument.getElementById(\"resultIcon\");\n\nconst resultTitle =\ndocument.getElementById(\"resultTitle\");\n\nconst resultScore =\ndocument.getElementById(\"resultScore\");\n\nconst resultText =\ndocument.getElementById(\"resultText\");\n\nconst againBtn =\ndocument.getElementById(\"againBtn\");\n\nconst waitingOverlay =\ndocument.getElementById(\"waitingOverlay\");\n\nconst waitingText =\ndocument.getElementById(\"waitingText\");\n\nconst toast =\ndocument.getElementById(\"toast\");\n\n\n/* =========================================================\n   SPELLERS\n========================================================= */\n\nlet mode = \"computer\";\n\nlet p1Gender = \"boy\";\nlet p2Gender = \"girl\";\n\nlet round = 1;\n\nlet p1Score = 0;\nlet p2Score = 0;\n\nlet selectedIndex = null;\n\nlet currentOutfits = [];\n\nlet computerChoice = 0;\n\nlet localTurn = 1;\nlet localP1Choice = null;\n\nlet gameRunning = false;\n\n\n/* =========================================================\n   ONLINE\n========================================================= */\n\n/*\n   BELANGRIJK:\n\n   p1Gender en p2Gender worden NOOIT\n   naar de andere speler gestuurd.\n\n   Alleen de uiteindelijke outfit wordt\n   na de keuze gedeeld.\n*/\n\nlet peer = null;\nlet connection = null;\n\nlet onlineRole = null;\nlet onlineConnected = false;\n\nlet onlineReady = false;\n\nlet onlineMyChoice = null;\nlet onlineEnemyChoice = null;\n\nlet onlineHostResult = null;\n\n\n/* =========================================================\n   OUTFITS\n========================================================= */\n\nconst outfits = {\n\nboy:[\n{\n    name:\"Urban\",\n    top:\"👕\",\n    bottom:\"👖\",\n    shoes:\"👟\",\n    score:88\n},\n{\n    name:\"Cool Street\",\n    top:\"🧥\",\n    bottom:\"👖\",\n    shoes:\"👟\",\n    score:95\n},\n{\n    name:\"Smart\",\n    top:\"👔\",\n    bottom:\"👖\",\n    shoes:\"👞\",\n    score:93\n},\n{\n    name:\"Sporty\",\n    top:\"👕\",\n    bottom:\"🩳\",\n    shoes:\"👟\",\n    score:96\n}\n],\n\ngirl:[\n{\n    name:\"Glam\",\n    top:\"👗\",\n    bottom:\"👜\",\n    shoes:\"👠\",\n    score:98\n},\n{\n    name:\"Street Chic\",\n    top:\"👚\",\n    bottom:\"👖\",\n    shoes:\"👟\",\n    score:94\n},\n{\n    name:\"Summer\",\n    top:\"👗\",\n    bottom:\"👜\",\n    shoes:\"🩴\",\n    score:96\n},\n{\n    name:\"Party\",\n    top:\"👗\",\n    bottom:\"👜\",\n    shoes:\"👠\",\n    score:99\n}\n]\n\n};\n\n\n/* =========================================================\n   THEMES\n========================================================= */\n\nconst themes = [\n\"STREET STYLE\",\n\"PARTY\",\n\"SUMMER\",\n\"SPORTY\",\n\"WINTER\",\n\"RED CARPET\",\n\"SCHOOL\",\n\"FESTIVAL\"\n];\n\n\n/* =========================================================\n   HOME\n========================================================= */\n\ndocument\n.querySelectorAll(\".mode-card\")\n.forEach(card => {\n\n    card.addEventListener(\n        \"click\",\n        () => {\n\n            document\n            .querySelectorAll(\".mode-card\")\n            .forEach(c =>\n                c.classList.remove(\"selected\")\n            );\n\n            card.classList.add(\"selected\");\n\n            mode =\n            card.dataset.mode;\n\n        }\n    );\n\n});\n\n\ncontinueBtn.addEventListener(\n    \"click\",\n    showSetup\n);\n\n\nfunction showSetup(){\n\n    homeScreen.classList.add(\"hidden\");\n\n    setupScreen.classList.remove(\"hidden\");\n\n\n    player2Setup.classList.toggle(\n        \"hidden\",\n        mode === \"computer\" ||\n        mode === \"online\"\n    );\n\n\n    onlineBox.classList.toggle(\n        \"hidden\",\n        mode !== \"online\"\n    );\n\n\n    if(mode === \"computer\"){\n\n        setupTitle.textContent =\n        \"KIES JOUW STIJL\";\n\n        setupSubtitle.textContent =\n        \"Alleen jij kiest jouw kledingstijl.\";\n\n        startBattleBtn.disabled = false;\n\n    }\n\n\n    if(mode === \"local\"){\n\n        setupTitle.textContent =\n        \"KIES JULLIE STIJL\";\n\n        setupSubtitle.textContent =\n        \"Iedere speler kiest zijn eigen kledingstijl.\";\n\n        startBattleBtn.disabled = false;\n\n    }\n\n\n    if(mode === \"online\"){\n\n        setupTitle.textContent =\n        \"ONLINE STYLE BATTLE\";\n\n        setupSubtitle.textContent =\n        \"Jij ziet alleen jouw eigen kledingstijl.\";\n\n        setupOnline();\n\n    }\n\n\n    updatePreview();\n\n}\n\n\n/* =========================================================\n   GENDER\n========================================================= */\n\np1Boy.addEventListener(\n    \"click\",\n    () => {\n\n        p1Gender = \"boy\";\n\n        setGender(\n            p1Boy,\n            p1Girl\n        );\n\n        updatePreview();\n\n        /*\n           NIET naar andere speler sturen.\n        */\n\n    }\n);\n\n\np1Girl.addEventListener(\n    \"click\",\n    () => {\n\n        p1Gender = \"girl\";\n\n        setGender(\n            p1Girl,\n            p1Boy\n        );\n\n        updatePreview();\n\n    }\n);\n\n\np2Boy.addEventListener(\n    \"click\",\n    () => {\n\n        p2Gender = \"boy\";\n\n        setGender(\n            p2Boy,\n            p2Girl\n        );\n\n        updatePreview();\n\n    }\n);\n\n\np2Girl.addEventListener(\n    \"click\",\n    () => {\n\n        p2Gender = \"girl\";\n\n        setGender(\n            p2Girl,\n            p2Boy\n        );\n\n        updatePreview();\n\n    }\n);\n\n\nfunction setGender(\n    active,\n    inactive\n){\n\n    active.classList.add(\"active\");\n\n    inactive.classList.remove(\"active\");\n\n}\n\n\nfunction updatePreview(){\n\n    preview1.textContent =\n    p1Gender === \"boy\"\n    ? \"🧍‍♂️\"\n    : \"🧍‍♀️\";\n\n    preview2.textContent =\n    p2Gender === \"boy\"\n    ? \"🧍‍♂️\"\n    : \"🧍‍♀️\";\n\n    avatar1.textContent =\n    p1Gender === \"boy\"\n    ? \"🧍‍♂️\"\n    : \"🧍‍♀️\";\n\n    avatar2.textContent =\n    p2Gender === \"boy\"\n    ? \"🧍‍♂️\"\n    : \"🧍‍♀️\";\n\n}\n\n\n/* =========================================================\n   START\n========================================================= */\n\nstartBattleBtn.addEventListener(\n    \"click\",\n    startSelectedMode\n);\n\n\nfunction startSelectedMode(){\n\n    if(mode === \"computer\"){\n\n        startComputer();\n\n        return;\n\n    }\n\n\n    if(mode === \"local\"){\n\n        startLocal();\n\n        return;\n\n    }\n\n\n    if(mode === \"online\"){\n\n        if(!onlineConnected){\n\n            showToast(\n                \"Verbind eerst met een speler.\"\n            );\n\n            return;\n\n        }\n\n\n        /*\n           Alleen READY sturen.\n           NOOIT gender.\n        */\n\n        onlineReady = true;\n\n        connection.send({\n            type:\"ready\"\n        });\n\n\n        if(\n            onlineRole === \"guest\"\n        ){\n\n            showWaiting(\n                \"Je bent klaar! Wachten op speler 1...\"\n            );\n\n        }\n\n\n        if(\n            onlineRole === \"host\"\n        ){\n\n            connectionStatus.textContent =\n            \"Jij bent klaar. Wachten op speler 2...\";\n\n            checkOnlineStart();\n\n        }\n\n    }\n\n}\n\n\n/* =========================================================\n   COMPUTER\n========================================================= */\n\nfunction startComputer(){\n\n    round = 1;\n\n    p1Score = 0;\n    p2Score = 0;\n\n    gameRunning = true;\n\n    player1Title.textContent =\n    \"JOUW LOOK\";\n\n    player2Title.textContent =\n    \"COMPUTER\";\n\n    setupScreen.classList.add(\n        \"hidden\"\n    );\n\n    gameScreen.classList.remove(\n        \"hidden\"\n    );\n\n    updateScores();\n\n    startNormalRound();\n\n}\n\n\n/* =========================================================\n   LOCAL\n========================================================= */\n\nfunction startLocal(){\n\n    round = 1;\n\n    p1Score = 0;\n    p2Score = 0;\n\n    localTurn = 1;\n    localP1Choice = null;\n\n    gameRunning = true;\n\n    player1Title.textContent =\n    \"SPELER 1\";\n\n    player2Title.textContent =\n    \"SPELER 2\";\n\n    setupScreen.classList.add(\n        \"hidden\"\n    );\n\n    gameScreen.classList.remove(\n        \"hidden\"\n    );\n\n    updateScores();\n\n    startLocalRound();\n\n}\n\n\n/* =========================================================\n   NORMALE RONDE\n========================================================= */\n\nfunction startNormalRound(){\n\n    if(round > 8){\n\n        finishGame();\n\n        return;\n\n    }\n\n\n    selectedIndex = null;\n\n    currentOutfits =\n    outfits[p1Gender];\n\n    chooseTitle.textContent =\n    \"KIES JOUW OUTFIT\";\n\n    createChoices(\n        currentOutfits\n    );\n\n    resetDisplay();\n\n    themeName.textContent =\n    themes[round - 1];\n\n    gameRound.textContent =\n    round;\n\n    headerRound.textContent =\n    round;\n\n\n    createComputerLook();\n\n}\n\n\n/* =========================================================\n   LOCAL RONDE\n========================================================= */\n\nfunction startLocalRound(){\n\n    if(round > 8){\n\n        finishGame();\n\n        return;\n\n    }\n\n\n    selectedIndex = null;\n\n    resetDisplay();\n\n    themeName.textContent =\n    themes[round - 1];\n\n    gameRound.textContent =\n    round;\n\n    headerRound.textContent =\n    round;\n\n\n    if(localTurn === 1){\n\n        currentOutfits =\n        outfits[p1Gender];\n\n        chooseTitle.textContent =\n        \"SPELER 1: KIES JE OUTFIT\";\n\n        createChoices(\n            currentOutfits\n        );\n\n    }\n    else{\n\n        currentOutfits =\n        outfits[p2Gender];\n\n        chooseTitle.textContent =\n        \"SPELER 2: KIES JE OUTFIT\";\n\n        createChoices(\n            currentOutfits\n        );\n\n    }\n\n}\n\n\n/* =========================================================\n   COMPUTER LOOK\n========================================================= */\n\nfunction createComputerLook(){\n\n    const list =\n    outfits[p2Gender];\n\n    computerChoice =\n    Math.floor(\n        Math.random() * list.length\n    );\n\n    showOutfit(\n        2,\n        list[computerChoice]\n    );\n\n}\n\n\n/* =========================================================\n   CHOICES\n========================================================= */\n\nfunction createChoices(list){\n\n    choices.innerHTML =\n    \"\";\n\n    confirmBtn.disabled =\n    true;\n\n    list.forEach(\n        (item,index) => {\n\n            const button =\n            document.createElement(\n                \"button\"\n            );\n\n            button.className =\n            \"choice\";\n\n            button.innerHTML = `\n\n                <div class=\"choice-icons\">\n                    ${item.top}\n                    ${item.bottom}\n                <\/div>\n\n                <div class=\"choice-name\">\n                    ${item.name}\n                <\/div>\n\n            `;\n\n\n            button.addEventListener(\n                \"click\",\n                () => {\n\n                    document\n                    .querySelectorAll(\".choice\")\n                    .forEach(c =>\n                        c.classList.remove(\"selected\")\n                    );\n\n\n                    button.classList.add(\n                        \"selected\"\n                    );\n\n\n                    selectedIndex =\n                    index;\n\n\n                    if(\n                        mode === \"local\"\n                    ){\n\n                        showOutfit(\n                            localTurn === 1\n                            ? 1\n                            : 2,\n                            item\n                        );\n\n                    }\n\n                    else if(\n                        mode === \"online\"\n                    ){\n\n                        showOutfit(\n                            onlineRole === \"host\"\n                            ? 1\n                            : 2,\n                            item\n                        );\n\n                    }\n\n                    else{\n\n                        showOutfit(\n                            1,\n                            item\n                        );\n\n                    }\n\n\n                    confirmBtn.disabled =\n                    false;\n\n                }\n            );\n\n\n            choices.appendChild(\n                button\n            );\n\n        }\n    );\n\n}\n\n\n/* =========================================================\n   BEVESTIG\n========================================================= */\n\nconfirmBtn.addEventListener(\n    \"click\",\n    () => {\n\n        if(\n            selectedIndex === null ||\n            !gameRunning\n        ){\n\n            return;\n\n        }\n\n\n        if(mode === \"computer\"){\n\n            resolveComputer();\n\n        }\n        else if(mode === \"local\"){\n\n            resolveLocal();\n\n        }\n        else if(mode === \"online\"){\n\n            resolveOnlineChoice();\n\n        }\n\n    }\n);\n\n\n/* =========================================================\n   COMPUTER RESULT\n========================================================= */\n\nfunction resolveComputer(){\n\n    const player =\n    outfits[p1Gender][\n        selectedIndex\n    ];\n\n    const computer =\n    outfits[p2Gender][\n        computerChoice\n    ];\n\n\n    p1Score +=\n    player.score;\n\n    p2Score +=\n    computer.score;\n\n\n    updateScores();\n\n\n    showRoundResult(\n        player.score,\n        computer.score\n    );\n\n}\n\n\n/* =========================================================\n   LOCAL RESULT\n========================================================= */\n\nfunction resolveLocal(){\n\n    if(localTurn === 1){\n\n        localP1Choice =\n        selectedIndex;\n\n        localTurn = 2;\n\n        selectedIndex = null;\n\n        confirmBtn.disabled =\n        true;\n\n\n        showToast(\n            \"Speler 1 klaar! Geef het scherm door 👥\"\n        );\n\n\n        setTimeout(\n            startLocalRound,\n            600\n        );\n\n\n        return;\n\n    }\n\n\n    const player1 =\n    outfits[p1Gender][\n        localP1Choice\n    ];\n\n    const player2 =\n    outfits[p2Gender][\n        selectedIndex\n    ];\n\n\n    p1Score +=\n    player1.score;\n\n    p2Score +=\n    player2.score;\n\n\n    updateScores();\n\n\n    showOutfit(\n        1,\n        player1\n    );\n\n    showOutfit(\n        2,\n        player2\n    );\n\n\n    showRoundResult(\n        player1.score,\n        player2.score\n    );\n\n}\n\n\n/* =========================================================\n   ROUND RESULT\n========================================================= */\n\nfunction showRoundResult(\n    points1,\n    points2\n){\n\n    if(points1 > points2){\n\n        resultIcon.textContent =\n        \"👑\";\n\n        resultTitle.textContent =\n        \"SPELER 1 WINT!\";\n\n    }\n    else if(points2 > points1){\n\n        resultIcon.textContent =\n        \"🔥\";\n\n        resultTitle.textContent =\n        mode === \"computer\"\n        ? \"COMPUTER WINT!\"\n        : \"SPELER 2 WINT!\";\n\n    }\n    else{\n\n        resultIcon.textContent =\n        \"🤝\";\n\n        resultTitle.textContent =\n        \"GELIJKSPEL!\";\n\n    }\n\n\n    resultScore.textContent =\n    \"+\" +\n    points1;\n\n\n    resultText.textContent =\n    points1 +\n    \" - \" +\n    points2;\n\n\n    resultOverlay.classList.remove(\n        \"hidden\"\n    );\n\n\n    if(round >= 8){\n\n        setTimeout(\n            finishGame,\n            1100\n        );\n\n    }\n    else{\n\n        setTimeout(\n            () => {\n\n                resultOverlay.classList.add(\n                    \"hidden\"\n                );\n\n                round++;\n\n                localTurn = 1;\n\n                startNormalOrLocal();\n\n            },\n            1100\n        );\n\n    }\n\n}\n\n\n/* =========================================================\n   NORMALE / LOCAL VOLGENDE RONDE\n========================================================= */\n\nfunction startNormalOrLocal(){\n\n    if(mode === \"local\"){\n\n        startLocalRound();\n\n    }\n    else{\n\n        startNormalRound();\n\n    }\n\n}\n\n\n/* =========================================================\n   ONLINE SETUP\n========================================================= */\n\nfunction setupOnline(){\n\n    closeConnection();\n\n    onlineConnected =\n    false;\n\n    onlineReady =\n    false;\n\n    connectionStatus.textContent =\n    \"Kies een kamer of join een kamer.\";\n\n    startBattleBtn.disabled =\n    true;\n\n\n    createTab.classList.add(\n        \"active\"\n    );\n\n    joinTab.classList.remove(\n        \"active\"\n    );\n\n    createPanel.classList.remove(\n        \"hidden\"\n    );\n\n    joinPanel.classList.add(\n        \"hidden\"\n    );\n\n\n    createRoom();\n\n}\n\n\n/* =========================================================\n   ONLINE TABS\n========================================================= */\n\ncreateTab.addEventListener(\n    \"click\",\n    () => {\n\n        createTab.classList.add(\n            \"active\"\n        );\n\n        joinTab.classList.remove(\n            \"active\"\n        );\n\n        createPanel.classList.remove(\n            \"hidden\"\n        );\n\n        joinPanel.classList.add(\n            \"hidden\"\n        );\n\n        createRoom();\n\n    }\n);\n\n\njoinTab.addEventListener(\n    \"click\",\n    () => {\n\n        joinTab.classList.add(\n            \"active\"\n        );\n\n        createTab.classList.remove(\n            \"active\"\n        );\n\n        joinPanel.classList.remove(\n            \"hidden\"\n        );\n\n        createPanel.classList.add(\n            \"hidden\"\n        );\n\n        closeConnection();\n\n        connectionStatus.textContent =\n        \"Vul de kamer-code in.\";\n\n        startBattleBtn.disabled =\n        true;\n\n    }\n);\n\n\n/* =========================================================\n   ROOM MAKEN\n========================================================= */\n\nfunction createRoom(){\n\n    closeConnection();\n\n    const code =\n    randomCode();\n\n\n    roomCode.textContent =\n    code;\n\n\n    onlineRole =\n    \"host\";\n\n\n    connectionStatus.textContent =\n    \"Kamer wordt aangemaakt...\";\n\n\n    peer =\n    new Peer(\n        \"STYLE_BATTLE_\" +\n        code\n    );\n\n\n    peer.on(\n        \"open\",\n        () => {\n\n            connectionStatus.textContent =\n            \"Kamer klaar! Geef de code aan speler 2.\";\n\n        }\n    );\n\n\n    peer.on(\n        \"connection\",\n        newConnection => {\n\n            if(connection)\n                return;\n\n\n            connection =\n            newConnection;\n\n\n            connection.on(\n                \"open\",\n                () => {\n\n                    onlineConnected =\n                    true;\n\n                    onlineReady =\n                    false;\n\n\n                    connectionStatus.textContent =\n                    \"Speler 2 is verbonden! Kies jouw kledingstijl.\";\n\n                    /*\n                       GEEN GENDER VERSTUREN.\n                    */\n\n                }\n            );\n\n\n            connection.on(\n                \"data\",\n                handleOnlineData\n            );\n\n\n            connection.on(\n                \"close\",\n                () => {\n\n                    onlineConnected =\n                    false;\n\n                    gameRunning =\n                    false;\n\n                    showWaiting(\n                        \"De andere speler heeft de verbinding verbroken.\"\n                    );\n\n                }\n            );\n\n        }\n    );\n\n\n    peer.on(\n        \"error\",\n        () => {\n\n            connectionStatus.textContent =\n            \"Kamer kon niet worden aangemaakt.\";\n\n        }\n    );\n\n}\n\n\n/* =========================================================\n   JOIN ROOM\n========================================================= */\n\njoinBtn.addEventListener(\n    \"click\",\n    joinRoom\n);\n\n\nfunction joinRoom(){\n\n    const code =\n    joinInput.value\n    .trim()\n    .toUpperCase();\n\n\n    if(code.length !== 6){\n\n        showToast(\n            \"De code moet 6 tekens zijn.\"\n        );\n\n        return;\n\n    }\n\n\n    closeConnection();\n\n    onlineRole =\n    \"guest\";\n\n\n    connectionStatus.textContent =\n    \"Verbinden...\";\n\n\n    peer =\n    new Peer();\n\n\n    peer.on(\n        \"open\",\n        () => {\n\n            connection =\n            peer.connect(\n                \"STYLE_BATTLE_\" +\n                code,\n                {\n                    reliable:true\n                }\n            );\n\n\n            connection.on(\n                \"open\",\n                () => {\n\n                    onlineConnected =\n                    true;\n\n                    onlineReady =\n                    false;\n\n\n                    connectionStatus.textContent =\n                    \"Verbonden! Kies alleen jouw eigen kledingstijl.\";\n\n                    /*\n                       GEEN GENDER VERSTUREN.\n                    */\n\n                }\n            );\n\n\n            connection.on(\n                \"data\",\n                handleOnlineData\n            );\n\n\n            connection.on(\n                \"close\",\n                () => {\n\n                    onlineConnected =\n                    false;\n\n                    gameRunning =\n                    false;\n\n                    connectionStatus.textContent =\n                    \"Verbinding verbroken.\";\n\n                }\n            );\n\n        }\n    );\n\n\n    peer.on(\n        \"error\",\n        () => {\n\n            connectionStatus.textContent =\n            \"Kamer niet gevonden.\";\n\n        }\n    );\n\n}\n\n\n/* =========================================================\n   ONLINE DATA\n========================================================= */\n\nfunction handleOnlineData(data){\n\n    if(!data ||\n       !data.type){\n\n        return;\n\n    }\n\n\n    /* ANDERE SPELER IS KLAAR */\n\n    if(\n        data.type === \"ready\"\n    ){\n\n        onlineEnemyReady =\n        true;\n\n\n        if(\n            onlineRole === \"host\"\n        ){\n\n            checkOnlineStart();\n\n        }\n\n        return;\n\n    }\n\n\n    /* START */\n\n    if(\n        data.type === \"start\"\n    ){\n\n        startOnlineAsGuest();\n\n        return;\n\n    }\n\n\n    /* THEMA */\n\n    if(\n        data.type === \"theme\"\n    ){\n\n        startOnlineRound(\n            data.round\n        );\n\n        return;\n\n    }\n\n\n    /* KEUZE VAN ANDERE SPELER */\n\n    if(\n        data.type === \"choice\"\n    ){\n\n        onlineEnemyChoice =\n        data.outfit;\n\n        if(\n            onlineRole === \"host\"\n        ){\n\n            tryResolveOnline();\n\n        }\n\n        return;\n\n    }\n\n\n    /* RESULTAAT */\n\n    if(\n        data.type === \"result\"\n    ){\n\n        showOnlineResult(\n            data\n        );\n\n        return;\n\n    }\n\n\n    /* VOLGENDE RONDE */\n\n    if(\n        data.type === \"next\"\n    ){\n\n        round =\n        data.round;\n\n        resultOverlay.classList.add(\n            \"hidden\"\n        );\n\n        startOnlineRound(\n            round\n        );\n\n        return;\n\n    }\n\n}\n\n\n/* =========================================================\n   ONLINE READY\n========================================================= */\n\nlet onlineEnemyReady =\nfalse;\n\n\nfunction checkOnlineStart(){\n\n    if(\n        onlineRole !== \"host\" ||\n        !onlineConnected ||\n        !onlineReady ||\n        !onlineEnemyReady\n    ){\n\n        return;\n\n    }\n\n\n    round = 1;\n\n    p1Score = 0;\n    p2Score = 0;\n\n    gameRunning = true;\n\n\n    connection.send({\n        type:\"start\"\n    });\n\n\n    setupScreen.classList.add(\n        \"hidden\"\n    );\n\n    gameScreen.classList.remove(\n        \"hidden\"\n    );\n\n\n    player1Title.textContent =\n    \"JOUW LOOK\";\n\n    player2Title.textContent =\n    \"TEGENSTANDER\";\n\n\n    updateScores();\n\n\n    startOnlineRound(\n        1\n    );\n\n}\n\n\n/* =========================================================\n   ONLINE GUEST START\n========================================================= */\n\nfunction startOnlineAsGuest(){\n\n    round = 1;\n\n    p1Score = 0;\n    p2Score = 0;\n\n    gameRunning = true;\n\n\n    setupScreen.classList.add(\n        \"hidden\"\n    );\n\n    gameScreen.classList.remove(\n        \"hidden\"\n    );\n\n\n    player1Title.textContent =\n    \"TEGENSTANDER\";\n\n    player2Title.textContent =\n    \"JOUW LOOK\";\n\n\n    updateScores();\n\n\n    showWaiting(\n        \"Wachten op het eerste thema...\"\n    );\n\n}\n\n\n/* =========================================================\n   ONLINE RONDE\n========================================================= */\n\nfunction startOnlineRound(r){\n\n    if(r > 8){\n\n        finishGame();\n\n        return;\n\n    }\n\n\n    round =\n    r;\n\n\n    selectedIndex =\n    null;\n\n    onlineMyChoice =\n    null;\n\n    onlineEnemyChoice =\n    null;\n\n\n    confirmBtn.disabled =\n    true;\n\n\n    resetDisplay();\n\n\n    themeName.textContent =\n    themes[round - 1];\n\n    gameRound.textContent =\n    round;\n\n    headerRound.textContent =\n    round;\n\n\n    /*\n       Iedere speler gebruikt alleen\n       zijn eigen kledingstijl.\n    */\n\n    const myGender =\n    onlineRole === \"host\"\n    ? p1Gender\n    : p1Gender;\n\n\n    currentOutfits =\n    outfits[myGender];\n\n\n    chooseTitle.textContent =\n    \"KIES JOUW OUTFIT\";\n\n\n    gameStatusSafe(\n        \"Kies jouw outfit.\"\n    );\n\n\n    createChoices(\n        currentOutfits\n    );\n\n\n    waitingOverlay.classList.add(\n        \"hidden\"\n    );\n\n}\n\n\n/* =========================================================\n   ONLINE KEUZE\n========================================================= */\n\nfunction resolveOnlineChoice(){\n\n    const chosen =\n    currentOutfits[\n        selectedIndex\n    ];\n\n\n    onlineMyChoice =\n    chosen;\n\n\n    /*\n       Alleen de outfit wordt verstuurd.\n       Er wordt NIET verstuurd:\n       boy/girl\n    */\n\n    connection.send({\n\n        type:\"choice\",\n\n        outfit:chosen\n\n    });\n\n\n    confirmBtn.disabled =\n    true;\n\n\n    gameStatusSafe(\n        \"Jouw keuze is opgeslagen. Wachten...\"\n    );\n\n\n    if(\n        onlineRole === \"host\"\n    ){\n\n        tryResolveOnline();\n\n    }\n\n}\n\n\n/* =========================================================\n   ONLINE RESULTAAT BEREKENEN\n========================================================= */\n\nfunction tryResolveOnline(){\n\n    if(\n        onlineRole !== \"host\"\n    ){\n\n        return;\n\n    }\n\n\n    if(\n        !onlineMyChoice ||\n        !onlineEnemyChoice\n    ){\n\n        return;\n\n    }\n\n\n    const points1 =\n    onlineMyChoice.score;\n\n\n    const points2 =\n    onlineEnemyChoice.score;\n\n\n    p1Score +=\n    points1;\n\n    p2Score +=\n    points2;\n\n\n    const final =\n    round >= 8;\n\n\n    connection.send({\n\n        type:\"result\",\n\n        points1:points1,\n\n        points2:points2,\n\n        p1Score:p1Score,\n\n        p2Score:p2Score,\n\n        player1Outfit:\n        onlineMyChoice,\n\n        player2Outfit:\n        onlineEnemyChoice,\n\n        final:final\n\n    });\n\n\n    showOnlineResult({\n\n        points1:points1,\n\n        points2:points2,\n\n        p1Score:p1Score,\n\n        p2Score:p2Score,\n\n        player1Outfit:\n        onlineMyChoice,\n\n        player2Outfit:\n        onlineEnemyChoice,\n\n        final:final\n\n    });\n\n}\n\n\n/* =========================================================\n   ONLINE RESULT TONEN\n========================================================= */\n\nfunction showOnlineResult(data){\n\n    p1Score =\n    data.p1Score;\n\n    p2Score =\n    data.p2Score;\n\n\n    updateScores();\n\n\n    /*\n       Pas NU worden de outfits onthuld.\n    */\n\n    showOutfit(\n        1,\n        data.player1Outfit\n    );\n\n    showOutfit(\n        2,\n        data.player2Outfit\n    );\n\n\n    const myPoints =\n    onlineRole === \"host\"\n    ? data.points1\n    : data.points2;\n\n\n    const enemyPoints =\n    onlineRole === \"host\"\n    ? data.points2\n    : data.points1;\n\n\n    if(\n        myPoints > enemyPoints\n    ){\n\n        resultIcon.textContent =\n        \"🏆\";\n\n        resultTitle.textContent =\n        \"JIJ WINT!\";\n\n    }\n    else if(\n        myPoints < enemyPoints\n    ){\n\n        resultIcon.textContent =\n        \"🔥\";\n\n        resultTitle.textContent =\n        \"TEGENSTANDER WINT!\";\n\n    }\n    else{\n\n        resultIcon.textContent =\n        \"🤝\";\n\n        resultTitle.textContent =\n        \"GELIJKSPEL!\";\n\n    }\n\n\n    resultScore.textContent =\n    \"+\" + myPoints;\n\n\n    resultText.textContent =\n    data.points1 +\n    \" - \" +\n    data.points2;\n\n\n    waitingOverlay.classList.add(\n        \"hidden\"\n    );\n\n    resultOverlay.classList.remove(\n        \"hidden\"\n    );\n\n\n    if(data.final){\n\n        setTimeout(\n            finishGame,\n            1200\n        );\n\n    }\n    else{\n\n        setTimeout(\n            () => {\n\n                resultOverlay.classList.add(\n                    \"hidden\"\n                );\n\n\n                round++;\n\n\n                onlineMyChoice =\n                null;\n\n                onlineEnemyChoice =\n                null;\n\n\n                if(\n                    onlineRole === \"host\"\n                ){\n\n                    connection.send({\n\n                        type:\"next\",\n\n                        round:round\n\n                    });\n\n\n                    startOnlineRound(\n                        round\n                    );\n\n                }\n                else{\n\n                    showWaiting(\n                        \"Wachten op de volgende ronde...\"\n                    );\n\n                }\n\n            },\n            1200\n        );\n\n    }\n\n}\n\n\n/* =========================================================\n   OUTFIT TONEN\n========================================================= */\n\nfunction showOutfit(\n    player,\n    item\n){\n\n    if(!item)\n        return;\n\n\n    if(player === 1){\n\n        top1.textContent =\n        item.top;\n\n        bottom1.textContent =\n        item.bottom;\n\n        shoes1.textContent =\n        item.shoes;\n\n        name1.textContent =\n        item.name;\n\n    }\n    else{\n\n        top2.textContent =\n        item.top;\n\n        bottom2.textContent =\n        item.bottom;\n\n        shoes2.textContent =\n        item.shoes;\n\n        name2.textContent =\n        item.name;\n\n    }\n\n}\n\n\n/* =========================================================\n   RESET DISPLAY\n========================================================= */\n\nfunction resetDisplay(){\n\n    const one =\n    p1Gender === \"boy\"\n    ? [\"👕\",\"👖\",\"👟\"]\n    : [\"👚\",\"👗\",\"👠\"];\n\n\n    const two =\n    p2Gender === \"boy\"\n    ? [\"👕\",\"👖\",\"👟\"]\n    : [\"👚\",\"👗\",\"👠\"];\n\n\n    top1.textContent =\n    one[0];\n\n    bottom1.textContent =\n    one[1];\n\n    shoes1.textContent =\n    one[2];\n\n    name1.textContent =\n    \"Kies een outfit\";\n\n\n    top2.textContent =\n    two[0];\n\n    bottom2.textContent =\n    two[1];\n\n    shoes2.textContent =\n    two[2];\n\n    name2.textContent =\n    \"Wachten...\";\n\n}\n\n\n/* =========================================================\n   SCORE\n========================================================= */\n\nfunction updateScores(){\n\n    score1.textContent =\n    p1Score;\n\n    score2.textContent =\n    p2Score;\n\n\n    if(\n        mode === \"online\" &&\n        onlineRole === \"guest\"\n    ){\n\n        headerScore.textContent =\n        p2Score;\n\n    }\n    else{\n\n        headerScore.textContent =\n        p1Score;\n\n    }\n\n}\n\n\n/* =========================================================\n   EINDE\n========================================================= */\n\nfunction finishGame(){\n\n    gameRunning =\n    false;\n\n\n    waitingOverlay.classList.add(\n        \"hidden\"\n    );\n\n\n    let myScore =\n    p1Score;\n\n    let enemyScore =\n    p2Score;\n\n\n    if(\n        mode === \"online\" &&\n        onlineRole === \"guest\"\n    ){\n\n        myScore =\n        p2Score;\n\n        enemyScore =\n        p1Score;\n\n    }\n\n\n    resultScore.textContent =\n    myScore;\n\n\n    resultText.textContent =\n    p1Score +\n    \" - \" +\n    p2Score;\n\n\n    if(\n        myScore > enemyScore\n    ){\n\n        resultIcon.textContent =\n        \"🏆\";\n\n        resultTitle.textContent =\n        \"STYLE CHAMPION!\";\n\n    }\n    else if(\n        myScore < enemyScore\n    ){\n\n        resultIcon.textContent =\n        \"🔥\";\n\n        resultTitle.textContent =\n        \"GOEDE BATTLE!\";\n\n    }\n    else{\n\n        resultIcon.textContent =\n        \"🤝\";\n\n        resultTitle.textContent =\n        \"GELIJKSPEL!\";\n\n    }\n\n\n    resultOverlay.classList.remove(\n        \"hidden\"\n    );\n\n}\n\n\n/* =========================================================\n   OPNIEUW\n========================================================= */\n\nagainBtn.addEventListener(\n    \"click\",\n    () => {\n\n        resultOverlay.classList.add(\n            \"hidden\"\n        );\n\n\n        if(mode === \"computer\"){\n\n            startComputer();\n\n        }\n        else if(mode === \"local\"){\n\n            startLocal();\n\n        }\n        else{\n\n            if(\n                onlineRole === \"host\" &&\n                onlineConnected\n            ){\n\n                onlineReady =\n                true;\n\n                onlineEnemyReady =\n                true;\n\n                startOnlineRound(1);\n\n                connection.send({\n                    type:\"start\"\n                });\n\n            }\n            else{\n\n                showWaiting(\n                    \"Wachten tot speler 1 opnieuw start...\"\n                );\n\n            }\n\n        }\n\n    }\n);\n\n\n/* =========================================================\n   HOME\n========================================================= */\n\nsetupHomeBtn.addEventListener(\n    \"click\",\n    goHome\n);\n\ngameHomeBtn.addEventListener(\n    \"click\",\n    goHome\n);\n\nresultHomeBtn.addEventListener(\n    \"click\",\n    goHome\n);\n\nwaitingHomeBtn.addEventListener(\n    \"click\",\n    goHome\n);\n\n\nfunction goHome(){\n\n    gameRunning =\n    false;\n\n    resultOverlay.classList.add(\n        \"hidden\"\n    );\n\n    waitingOverlay.classList.add(\n        \"hidden\"\n    );\n\n    setupScreen.classList.add(\n        \"hidden\"\n    );\n\n    gameScreen.classList.add(\n        \"hidden\"\n    );\n\n    homeScreen.classList.remove(\n        \"hidden\"\n    );\n\n\n    round = 1;\n\n    p1Score = 0;\n    p2Score = 0;\n\n    selectedIndex =\n    null;\n\n    onlineReady =\n    false;\n\n    onlineEnemyReady =\n    false;\n\n    updateScores();\n\n    headerRound.textContent =\n    \"-\";\n\n    closeConnection();\n\n}\n\n\n/* =========================================================\n   WACHTEN\n========================================================= */\n\nfunction showWaiting(message){\n\n    waitingText.textContent =\n    message;\n\n    waitingOverlay.classList.remove(\n        \"hidden\"\n    );\n\n}\n\n\n/* =========================================================\n   RANDOM CODE\n========================================================= */\n\nfunction randomCode(){\n\n    const chars =\n    \"ABCDEFGHJKLMNPQRSTUVWXYZ23456789\";\n\n    let code = \"\";\n\n    for(\n        let i=0;\n        i<6;\n        i++\n    ){\n\n        code +=\n        chars[\n            Math.floor(\n                Math.random() *\n                chars.length\n            )\n        ];\n\n    }\n\n    return code;\n\n}\n\n\n/* =========================================================\n   COPY CODE\n========================================================= */\n\ncopyBtn.addEventListener(\n    \"click\",\n    async() => {\n\n        try{\n\n            await navigator.clipboard.writeText(\n                roomCode.textContent\n            );\n\n            showToast(\n                \"Kamer-code gekopieerd 📋\"\n            );\n\n        }\n        catch{\n\n            showToast(\n                \"Code: \" +\n                roomCode.textContent\n            );\n\n        }\n\n    }\n);\n\n\n/* =========================================================\n   VERBINDING SLUITEN\n========================================================= */\n\nfunction closeConnection(){\n\n    try{\n\n        if(connection){\n\n            connection.close();\n\n        }\n\n        if(peer){\n\n            peer.destroy();\n\n        }\n\n    }\n    catch(error){}\n\n\n    connection =\n    null;\n\n    peer =\n    null;\n\n    onlineConnected =\n    false;\n\n    onlineRole =\n    null;\n\n}\n\n\n/* =========================================================\n   STATUS\n========================================================= */\n\nfunction gameStatusSafe(message){\n\n    /*\n       We tonen geen genderinformatie.\n    */\n\n    const oldStatus =\n    document.getElementById(\n        \"gameStatus\"\n    );\n\n    if(oldStatus){\n\n        oldStatus.textContent =\n        message;\n\n    }\n\n}\n\n\n/* =========================================================\n   TOAST\n========================================================= */\n\nlet toastTimer =\nnull;\n\nfunction showToast(message){\n\n    toast.textContent =\n    message;\n\n    toast.classList.add(\n        \"show\"\n    );\n\n\n    clearTimeout(\n        toastTimer\n    );\n\n\n    toastTimer =\n    setTimeout(\n        () => {\n\n            toast.classList.remove(\n                \"show\"\n            );\n\n        },\n        2200\n    );\n\n}\n\n\n/* =========================================================\n   MOBIEL\n========================================================= */\n\ndocument.addEventListener(\n    \"touchmove\",\n    e => {\n\n        e.preventDefault();\n\n    },\n    {\n        passive:false\n    }\n);\n\n\n/* =========================================================\n   INIT\n========================================================= */\n\nupdatePreview();\n\nresetDisplay();\n\n<\/script>\n\n<\/body>\n<\/html>", "draft": "<!DOCTYPE html>\n<html lang=\"nl\">\n<head><script>try{localStorage.getItem(\"x\")}catch(e){var _m={};Object.defineProperty(window,\"localStorage\",{value:{getItem:function(k){return k in _m?_m[k]:null},setItem:function(k,v){_m[k]=String(v)},removeItem:function(k){delete _m[k]}}})}<\/script>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\">\n\n<title>DREAM DRAFT ✨<\/title>\n\n<script src=\"https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js\"><\/script> \n \n<style> \n*{ \n    box-sizing:border-box; \n    -webkit-tap-highlight-color:transparent; \n} \n \nhtml,body{ \n    width:100%; \n    height:100%; \n    margin:0; \n    overflow:hidden; \n    font-family:Arial,Helvetica,sans-serif; \n} \n \nbody{ \n    background: \n        radial-gradient(circle at 0% 0%,#ffd0e2,transparent 30%), \n        radial-gradient(circle at 100% 0%,#ffc2d8,transparent 30%), \n        radial-gradient(circle at 50% 100%,#f8cddd,transparent 35%), \n        linear-gradient(135deg,#fff5f9,#ffeaf2,#fff1f6); \n} \n \nbutton,input{ \n    font-family:inherit; \n} \n \nbutton{ \n    border:0; \n    cursor:pointer; \n    touch-action:manipulation; \n} \n \ninput{ \n    touch-action:manipulation; \n} \n \n#app{ \n    width:100%; \n    height:100dvh; \n    overflow:hidden; \n} \n \n.screen{ \n    display:none; \n    width:100%; \n    height:100dvh; \n    overflow:hidden; \n    padding:6px; \n} \n \n.screen.active{ \n    display:flex; \n    flex-direction:column; \n} \n \n.inner{ \n    width:min(1050px,100%); \n    height:100%; \n    min-height:0; \n    margin:auto; \n    display:flex; \n    flex-direction:column; \n} \n \n.header{ \n    flex:0 0 auto; \n    text-align:center; \n    padding:8px 0; \n} \n \n.logo{ \n    font-size:clamp(35px,8vw,62px); \n    line-height:.95; \ t-weight:600; \n} \n \n/* CARD */ \n \n.card{ \n    width:min(720px,100%); \n    padding:16px; \n    border-radius:24px; \n    background:rgba(255,255,255,.96); \n    box-shadow:0 14px 35px rgba(170,65,105,.12); \n} \n \n/* ONLINE */ \n \n.online-wrapper{ \n    width:min(900px,100%); \n} \n \n.online-columns{ \n    display:grid; \n    grid-template-columns:1fr 1fr; \n    gap:10px; \n} \n \n.online-box{ \n    padding:14px; \n    border-radius:19px; \n    background:#fff0f5; \n    text-align:center; \n} \n \n.online-box h2{ \n    margin:2px 0 9px; \n    color:#553440; \n    font-size:18px; \n} \n \n.online-status{ \n    min-height:43px; \n    margin:8px 0; \n    padding:9px; \n    display:flex; \n    justify-content:center; \n    align-items:center; \n    border-radius:12px; \n    background:white; \n    color:#805d6b; \n    font-size:12px; \n    font-weight:800; \n} \n \n.room-code{ \n    margin:5px 0; \n    color:#e83d78; \n    font-size:clamp(38px,8vw,58px); \n    line-height:1; \n    letter-spacing:6px; \n    font-weight:1000; \n} \n \n.code-input{ \n    width:100%; \n    height:50px; \n    border:3px solid #f1c7d6; \n    border-radius:13px; \n    background:white; \n    text-align:center; \n    text-transform:uppercase; \n    letter-spacing:5px; \n    font-size:22px; \n    font-weight:1000; \n    outline:none; \n} \n \n.code-input:focus{ \n    border-color:#ff4f92; \n} \n \n.online-next{ \n    display:none; \n    margin-top:8px; \n} \n \n.online-next.show{ \n    display:block; \n} \n \n/* WAITING */ \n \n.waiting-card{ \n    width:min(600px,100%); \n    padding:25px; \n    border-radius:25px; \n    background:white; \n    text-align:center; \n    box-shadow:0 15px 35px rgba(170,65,105,.12); \n} \n \n.waiting-icon{ \n    font-size:55px; \n} \n \n.waiting-title{ \n    margin-top:7px; \n    color:#553440; \n    font-size:25px; \n    font-weight:1000; \n} \n \n.waiting-text{ \n    margin-top:8px; \n    color:#805d6b; \n    font-size:14px; \n    line-height:1.45; \n y:grid; \n    grid-template-rows:auto 1fr; \n    gap:5px; \n} \n \n.game-header{ \n    display:grid; \n    grid-template-columns:1fr auto 1fr; \n    gap:5px; \n    align-items:center; \n} \n \n.money-box{ \n    padding:6px 10px; \n    border-radius:14px; \n    background:white; \n    box-shadow:0 6px 16px rgba(170,65,105,.08); \n} \n \n.money-box.right{ \n    text-align:right; \n} \n \n.name{ \n    color:#805d6b; \n    font-size:10px; \n    font-weight:1000; \n} \n \n.money{ \n    color:#d93670; \n    font-size:22px; \n    font-weight:1000; \n} \n \n.round{ \n    text-align:center; \n    color:#553440; \n    font-size:11px; \n    font-weight:1000; \n} \n \n.auction{ \n    min-height:0; \n    display:grid; \n    grid-template-columns:minmax(105px,.7fr) minmax(280px,1.6fr) minmax(105px,.7fr); \n    gap:6px; \n} \n \n.collection-panel{ \n    min-height:0; \n    overflow:hidden; \n    padding:6px; \n    border-radius:17px; \n    background:rgba(255,255,255,.88); \n    box-shadow:0 7px 20px rgba(170,65,105,.07); \n} \n \n.panel-title{ \n    margin-bottom:5px; \n    text-align:center; \n    color:#805d6b; \n    font-size:9px; \n    font-weight:1000; \n} \n \n.collection{ \n    display:flex; \n    flex-wrap:wrap; \n    justify-content:center; \n    align-content:flex-start; \n    gap:4px; \n} \n \n.collection-item{ \n    width:38px; \n    height:38px; \n    display:grid; \n    place-items:center; \n    border-radius:10px; \n    background:#fff0f5; \n    font-size:20px; \n    box-shadow:0 3px 9px rgba(170,65,105,.08); \n} \n \n.center-auction{ \n    min-height:0; \n    display:flex; \n    flex-direction:column; \n    justify-content:center; \n    align-items:center; \n} \n \n.item-card{ \n    width:min(520px,100%); \n    min-height:210px; \n    padding:15px; \n    border-radius:25px; \n    background:white; \n    text-align:center; \n    box-shadow:0 13px 35px rgba(170,65,105,.11); \n    display:flex; \n    flex-direction:column; \n    justify-content:center; \n} \n \n.item n    color:#553440; \n    font-size:clamp(27px,7vw,47px); \n    font-weight:1000; \n} \n \n.result-subtitle{ \n    margin:6px 0 15px; \n    color:#80616d; \n    font-size:12px; \n    font-weight:700; \n} \n \n.result-grid{ \n    display:grid; \n    grid-template-columns:1fr 1fr; \n    gap:8px; \n    margin-bottom:13px; \n} \n \n.result-player{ \n    padding:11px; \n    border-radius:14px; \n    background:#fff0f5; \n    color:#553440; \n} \n \n/* TOAST */ \n \n.toast{ \n    position:fixed; \n    left:50%; \n    bottom:18px; \n    z-index:99999; \n    max-width:90%; \n    padding:11px 16px; \n    border-radius:13px; \n    background:#7d304f; \n    color:white; \n    text-align:center; \n    font-size:12px; \n    font-weight:900; \n    transform:translate(-50%,150px); \n    transition:.25s; \n} \n \n.toast.show{ \n    transform:translate(-50%,0); \n} \n \n/* MOBILE */ \n \n@media(max-width:700px){ \n \n    .screen{ \n        padding:4px 5px; \n    } \n \n    .header{ \n        padding:4px 0; \n    } \n \n    .logo{ \n        font-size:36px; \n    } \n \n    .subtitle{ \n        font-size:10px; \n    } \n \n    .menu{ \n        grid-template-columns:1fr; \n        gap:6px; \n    } \n \n    .menu-button{ \n        min-height:63px; \n        padding:9px 11px; \n        border-radius:17px; \n    } \n \n    .menu-icon{ \n        display:inline; \n        font-size:25px; \n        margin-right:5px; \n    } \n \n    .menu-title{ \n        display:inline; \n        font-size:15px; \n    } \n \n    .menu-description{ \n        margin:2px 0 0 31px; \n        font-size:9px; \n    } \n \n    .topbar{ \n        grid-template-columns:70px 1fr 20px; \n    } \n \n    .back{ \n        min-height:36px; \n        padding:0 8px; \n        font-size:11px; \n    } \n \n    .page-title{ \n        font-size:20px; \n    } \n \n    .online-columns{ \n        grid-template-columns:1fr; \n        gap:7px; \n    } \n \n    .online-box{ \n        padding:9px; \n    } \n \n    .online-box h2{ \n  font-size:7px; \n    } \n \n    .item-name{ \n        font-size:18px; \n    } \n \n    .bid-info{ \n        font-size:9px; \n    } \n \n    .leader{ \n        font-size:11px; \n    } \n \n    .comment{ \n        font-size:8px; \n    } \n \n    .bid-row{ \n        grid-template-columns:minmax(0,1fr) 94px; \n    } \n \n    .bid-input{ \n        height:43px; \n        font-size:17px; \n    } \n \n    .bid-button{ \n        font-size:11px; \n    } \n \n    .give{ \n        min-height:34px; \n        font-size:9px; \n    } \n \n    .turn{ \n        font-size:8px; \n    } \n \n    .rule{ \n        padding:7px; \n        gap:8px; \n    } \n \n    .rule-icon{ \n        font-size:22px; \n        flex:0 0 28px; \n    } \n \n    .rule strong{ \n        font-size:11px; \n    } \n \n    .rule span{ \n        font-size:8px; \n    } \n} \n<\/style> \n<\/head> \n \n<body> \n \n<div id=\"app\"> \n \n<\u0021-- START --> \n<section id=\"screen-start\" class=\"screen active\"> \n<div class=\"inner\"> \n \n<header class=\"header\"> \n<div class=\"logo\">DREAM DRAFT ✨<\/div> \n<div class=\"subtitle\">Bouw jouw perfecte wereld door te bieden!<\/div> \n<\/header> \n \n<div class=\"center\"> \n<div class=\"menu\"> \n \n<button class=\"menu-button\" onclick=\"selectMode('computer')\"> \n<span class=\"menu-icon\">🤖<\/span> \n<span class=\"menu-title\">Tegen de computer<\/span> \n<span class=\"menu-description\">Speel alleen tegen de computer.<\/span> \n<\/button> \n \n<button class=\"menu-button\" onclick=\"selectMode('local')\"> \n<span class=\"menu-icon\">👥<\/span> \n<span class=\"menu-title\">Samen spelen<\/span> \n<span class=\"menu-description\">Twee spelers op hetzelfde apparaat.<\/span> \n<\/button> \n \n<button class=\"menu-button\" onclick=\"openOnline()\"> \n<span class=\"menu-icon\">🌐<\/span> \n<span class=\"menu-title\">Online spelen<\/span> \n<span class=\"menu-description\">Speel op twee verschillende apparaten.<\/span> \n<\/button> \n \n<button class=\"menu-button\" onclick=\"
